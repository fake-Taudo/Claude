    <text x="138" y="176" font-size="12.5" font-weight="600" fill="#1d1d1f">Backup erstellt</text>
    <text x="138" y="192" font-size="10.5" fill="#86868b">Heute, 03:00 · automatisch</text>
    <circle cx="116" cy="224" r="12" fill="#0071e3" fill-opacity=".1"/>
    <path d="M110.5 224 L114.5 228 L121.5 220.5" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="222" font-size="12.5" font-weight="600" fill="#1d1d1f">Sicherheits-Update</text>
    <text x="138" y="238" font-size="10.5" fill="#86868b">Gestern · 3 Komponenten</text>
    <circle cx="116" cy="270" r="12" fill="#0071e3" fill-opacity=".1"/>
    <path d="M110.5 270 L114.5 274 L121.5 266.5" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
