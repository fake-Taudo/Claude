  <rect x="104" y="128" width="432" height="1" fill="#f0f0f3"/>

  <!-- Aktivitäten -->
  <text x="104" y="152" font-size="10.5" font-weight="600" fill="#86868b">Letzte Aktivitäten</text>
  <g>
