<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Leistung „Wartung & Hosting“: Status-Übersicht mit Backups, Updates und Verfügbarkeit -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#ebebf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Fenster -->
  <rect x="80" y="48" width="480" height="400" rx="16" fill="#fff" filter="url(#shadow)"/>
  <circle cx="102" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="118" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="134" cy="70" r="5" fill="#e0e0e5"/>

  <!-- Kopfzeile -->
  <circle cx="110" cy="106" r="5" fill="#34c759"/>
  <text x="122" y="111" font-size="14" font-weight="600" fill="#1d1d1f">Alle Systeme online</text>
  <text x="536" y="111" font-size="12" fill="#86868b" text-anchor="end">Heute, 09:41</text>
  <rect x="104" y="128" width="432" height="1" fill="#f0f0f3"/>

  <!-- Erledigte Aufgaben -->
  <g>
    <circle cx="120" cy="162" r="14" fill="#0071e3" fill-opacity=".1"/>
    <path d="M113.5 162 L118 166.5 L126.5 157.5" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="160" font-size="13.5" font-weight="600" fill="#1d1d1f">Backup erstellt</text>
    <text x="144" y="177" font-size="11.5" fill="#86868b">Täglich, automatisch</text>

    <circle cx="120" cy="214" r="14" fill="#0071e3" fill-opacity=".1"/>
    <path d="M113.5 214 L118 218.5 L126.5 209.5" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="212" font-size="13.5" font-weight="600" fill="#1d1d1f">Updates installiert</text>
    <text x="144" y="229" font-size="11.5" fill="#86868b">Alle Komponenten aktuell</text>

    <circle cx="120" cy="266" r="14" fill="#0071e3" fill-opacity=".1"/>
    <path d="M113.5 266 L118 270.5 L126.5 261.5" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="264" font-size="13.5" font-weight="600" fill="#1d1d1f">SSL-Zertifikat gültig</text>
    <text x="144" y="281" font-size="11.5" fill="#86868b">Verbindung verschlüsselt</text>
  </g>

  <!-- Performance-Anzeige -->
  <circle cx="462" cy="206" r="52" fill="none" stroke="#f0f0f3" stroke-width="10"/>
  <circle cx="462" cy="206" r="52" fill="none" stroke="#0071e3" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="320 326.7" transform="rotate(-90 462 206)"/>
  <text x="462" y="218" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1">98</text>
  <text x="462" y="286" font-size="12" fill="#6e6e73" text-anchor="middle">Performance</text>

