    <text x="138" y="284" font-size="10.5" fill="#86868b">Mo · verlängert sich selbst</text>
  </g>

  <!-- Änderungswunsch als Nachricht -->
  <rect x="340" y="146" width="196" height="50" rx="14" fill="#f0f0f3"/>
  <text x="354" y="167" font-size="11.5" fill="#1d1d1f">Können Sie unsere</text>
  <text x="354" y="184" font-size="11.5" fill="#1d1d1f">Öffnungszeiten ändern?</text>
  <rect x="380" y="206" width="156" height="50" rx="14" fill="#0071e3"/>
  <text x="394" y="227" font-size="11.5" fill="#fff">Ist erledigt und</text>
  <text x="394" y="244" font-size="11.5" fill="#fff">schon online. ✓</text>
  <text x="536" y="276" font-size="10" fill="#86868b" text-anchor="end">Zugestellt · 09:52</text>

