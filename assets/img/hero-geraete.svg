<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Hero-Mockup: Laptop und Smartphone mit einer Beispiel-Website -->
  <defs>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e6ea"/>
      <stop offset="1" stop-color="#cdcdd2"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e2e6"/>
      <stop offset="1" stop-color="#a8a8ae"/>
    </linearGradient>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4e"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee6"/>
      <stop offset="1" stop-color="#e9dfd1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffefc6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff5dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="116" y="32" width="808" height="504" rx="6"/></clipPath>
    <clipPath id="hero-img"><rect x="580" y="96" width="316" height="260" rx="18"/></clipPath>
    <clipPath id="phone-screen"><rect x="890" y="246" width="190" height="420" rx="27"/></clipPath>
    <clipPath id="phone-img"><rect x="900" y="328" width="170" height="150" rx="14"/></clipPath>
    <filter id="phone-shadow" x="-40%" y="-15%" width="180%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- ===== Laptop ===== -->
  <ellipse cx="520" cy="578" rx="510" ry="12" fill="url(#shadow)"/>
  <rect x="100" y="16" width="840" height="536" rx="26" fill="url(#alu)"/>
  <rect x="104" y="20" width="832" height="528" rx="22" fill="#0b0b0c"/>

  <g clip-path="url(#screen)">
    <rect x="116" y="32" width="808" height="504" fill="#fff"/>

    <!-- Navigation der Beispiel-Website -->
    <text x="144" y="59" font-size="16" font-weight="700" fill="#1d1d1f" letter-spacing="-.3">Lumen</text>
    <g font-size="11.5" fill="#6e6e73">
      <text x="606" y="57">Kollektion</text>
      <text x="676" y="57">Projekte</text>
      <text x="736" y="57">Studio</text>
      <text x="784" y="57">Kontakt</text>
    </g>
    <rect x="840" y="41" width="60" height="23" rx="11.5" fill="#1d1d1f"/>
    <text x="870" y="56.5" font-size="10.5" font-weight="500" fill="#fff" text-anchor="middle">Termin</text>
    <rect x="116" y="72" width="808" height="1" fill="#ececf0"/>

    <!-- Hero der Beispiel-Website -->
    <g font-size="46" font-weight="700" fill="#1d1d1f" letter-spacing="-1.4">
      <text x="144" y="160">Licht, das</text>
      <text x="144" y="212">Räume verändert.</text>
    </g>
    <g font-size="14" fill="#6e6e73">
      <text x="144" y="250">Leuchten und Lichtplanung für Wohnen</text>
      <text x="144" y="270">und Arbeiten – gefertigt im Rheinland.</text>
    </g>
    <rect x="144" y="294" width="150" height="38" rx="19" fill="#0071e3"/>
    <text x="219" y="317.5" font-size="13" font-weight="500" fill="#fff" text-anchor="middle">Kollektion ansehen</text>
    <text x="312" y="317.5" font-size="13" fill="#0071e3">Beratung buchen ›</text>

    <!-- Bild: Pendelleuchte -->
    <rect x="580" y="96" width="316" height="260" rx="18" fill="url(#warm)"/>
    <g clip-path="url(#hero-img)">
      <circle cx="738" cy="230" r="140" fill="url(#glow)"/>
      <rect x="737.25" y="96" width="1.5" height="100" fill="#2c2c2e"/>
      <rect x="732" y="192" width="12" height="10" rx="2" fill="#2c2c2e"/>
      <path d="M690 229 Q738 174 786 229 Z" fill="#1d1d1f"/>
      <ellipse cx="738" cy="230" rx="13" ry="5" fill="#ffe08a"/>
      <rect x="604" y="314" width="268" height="8" rx="3" fill="#cbbba4"/>
      <rect x="610" y="322" width="256" height="40" fill="#dccfbd"/>
      <path d="M652 314 C645 298 648 284 657 277 H665 C674 284 677 298 670 314 Z" fill="#2c2c2e"/>
      <path d="M661 277 C657 262 650 250 640 240 M661 277 C664 260 672 248 684 242" fill="none" stroke="#6f7d5f" stroke-width="2" stroke-linecap="round"/>
      <rect x="802" y="298" width="42" height="16" rx="2" fill="#c7b69e"/>
      <rect x="806" y="286" width="34" height="12" rx="2" fill="#a8977f"/>
    </g>

    <!-- Karten-Reihe -->
    <g>
      <rect x="144" y="392" width="240" height="160" rx="14" fill="#f5f5f7"/>
      <rect x="156" y="404" width="216" height="76" rx="10" fill="#e8eef7"/>
      <rect x="263.25" y="404" width="1.5" height="26" fill="#2c2c2e"/>
      <path d="M244 452 Q264 420 284 452 Z" fill="#1d1d1f"/>
      <rect x="158" y="494" width="110" height="9" rx="4.5" fill="#1d1d1f" fill-opacity=".85"/>
      <rect x="158" y="510" width="160" height="7" rx="3.5" fill="#86868b" fill-opacity=".45"/>

      <rect x="400" y="392" width="240" height="160" rx="14" fill="#f5f5f7"/>
      <rect x="412" y="404" width="216" height="76" rx="10" fill="#f1ebe2"/>
      <rect x="519.25" y="438" width="1.5" height="34" fill="#2c2c2e"/>
      <rect x="506" y="470" width="28" height="4" rx="2" fill="#2c2c2e"/>
      <path d="M502 440 L510 418 H530 L538 440 Z" fill="#f7f3ec" stroke="#d8ccbb"/>
      <rect x="414" y="494" width="96" height="9" rx="4.5" fill="#1d1d1f" fill-opacity=".85"/>
      <rect x="414" y="510" width="150" height="7" rx="3.5" fill="#86868b" fill-opacity=".45"/>

      <rect x="656" y="392" width="240" height="160" rx="14" fill="#f5f5f7"/>
      <rect x="668" y="404" width="216" height="76" rx="10" fill="#e7eee8"/>
      <circle cx="776" cy="442" r="20" fill="#fff" fill-opacity=".85"/>
      <circle cx="776" cy="442" r="7" fill="#ffd66b"/>
      <rect x="670" y="494" width="120" height="9" rx="4.5" fill="#1d1d1f" fill-opacity=".85"/>
      <rect x="670" y="510" width="140" height="7" rx="3.5" fill="#86868b" fill-opacity=".45"/>
    </g>
  </g>

  <!-- Kamera-Notch -->
  <rect x="490" y="26" width="60" height="19" rx="6" fill="#0b0b0c"/>

  <!-- Unterteil -->
  <path d="M40 552 H1000 V558 C1000 566 994 572 984 572 H56 C46 572 40 566 40 558 Z" fill="url(#base)"/>
  <rect x="40" y="552" width="960" height="2" fill="#f2f2f5"/>
  <path d="M452 552 H588 V555 C588 557.5 586 559 583 559 H457 C454 559 452 557.5 452 555 Z" fill="#bdbdc3"/>

  <!-- ===== Smartphone ===== -->
  <g filter="url(#phone-shadow)">
    <rect x="880" y="236" width="210" height="440" rx="36" fill="url(#ti)"/>
  </g>
  <rect x="877" y="330" width="3" height="40" rx="1.5" fill="#2c2c2e"/>
  <rect x="1090" y="350" width="3" height="60" rx="1.5" fill="#2c2c2e"/>
  <rect x="884" y="240" width="202" height="432" rx="32" fill="#000"/>

  <g clip-path="url(#phone-screen)">
    <rect x="890" y="246" width="190" height="420" fill="#fff"/>

    <!-- Statusleiste -->
    <text x="910" y="270" font-size="11" font-weight="600" fill="#1d1d1f">9:41</text>
    <rect x="1048.5" y="262.5" width="18" height="9" rx="2.5" fill="none" stroke="#1d1d1f"/>
    <rect x="1050.5" y="264.5" width="12" height="5" rx="1" fill="#1d1d1f"/>
    <rect x="1028" y="266" width="3" height="5" rx=".8" fill="#1d1d1f"/>
    <rect x="1033" y="264" width="3" height="7" rx=".8" fill="#1d1d1f"/>
    <rect x="1038" y="262" width="3" height="9" rx=".8" fill="#1d1d1f"/>

    <!-- Navigation -->
    <text x="906" y="306" font-size="15" font-weight="700" fill="#1d1d1f" letter-spacing="-.3">Lumen</text>
    <path d="M1046 297 H1064 M1046 303 H1064" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="890" y="318" width="190" height="1" fill="#ececf0"/>

    <!-- Bild -->
    <rect x="900" y="328" width="170" height="150" rx="14" fill="url(#warm)"/>
    <g clip-path="url(#phone-img)">
      <circle cx="985" cy="394" r="86" fill="url(#glow)"/>
      <rect x="984.25" y="328" width="1.5" height="44" fill="#2c2c2e"/>
      <path d="M957 393 Q985 360 1013 393 Z" fill="#1d1d1f"/>
      <ellipse cx="985" cy="393.5" rx="8" ry="3" fill="#ffe08a"/>
      <rect x="908" y="448" width="154" height="6" rx="2" fill="#cbbba4"/>
      <rect x="912" y="454" width="146" height="30" fill="#dccfbd"/>
      <path d="M925 448 C921 439 923 431 928 427 H933 C938 431 940 439 936 448 Z" fill="#2c2c2e"/>
    </g>

    <!-- Text & Button -->
    <g font-size="25" font-weight="700" fill="#1d1d1f" letter-spacing="-.6">
      <text x="906" y="514">Licht, das</text>
      <text x="906" y="542">Räume</text>
      <text x="906" y="570">verändert.</text>
    </g>
    <text x="906" y="594" font-size="11.5" fill="#6e6e73">Leuchten und Lichtplanung</text>
    <rect x="906" y="608" width="158" height="36" rx="18" fill="#0071e3"/>
    <text x="985" y="630.5" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Kollektion ansehen</text>
    <rect x="950" y="656" width="70" height="4" rx="2" fill="#1d1d1f" fill-opacity=".85"/>
  </g>

  <!-- Dynamic Island -->
  <rect x="955" y="256" width="60" height="18" rx="9" fill="#000"/>
</svg>
