<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Hero (Desktop): Laptop und Smartphone zeigen das Projekt „Praxis Nordlicht“, dazu eine eingehende Terminbuchung -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2029"/><stop offset="1" stop-color="#15505a"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#5eead4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4e"/><stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <clipPath id="phone-screen"><rect x="890" y="246" width="190" height="420" rx="27"/></clipPath>
    <clipPath id="phone-img"><rect x="900" y="328" width="170" height="132" rx="14"/></clipPath>
    <filter id="phone-shadow" x="-40%" y="-15%" width="180%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".2"/>
    </filter>
    <filter id="card-shadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b2530" flood-opacity=".16"/>
    </filter>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e6ea"/><stop offset="1" stop-color="#cdcdd2"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e2e6"/><stop offset="1" stop-color="#a8a8ae"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="116" y="32" width="808" height="504" rx="6"/></clipPath>
    <clipPath id="site-img"><rect x="680" y="232" width="450" height="330" rx="24"/></clipPath>
  </defs>

  <!-- Laptop -->
  <ellipse cx="520" cy="578" rx="510" ry="12" fill="url(#shadow)"/>
  <rect x="100" y="16" width="840" height="536" rx="26" fill="url(#alu)"/>
  <rect x="104" y="20" width="832" height="528" rx="22" fill="#0b0b0c"/>
  <g clip-path="url(#screen)">
    <g transform="translate(116 32) scale(.74815) translate(-100 -138)">
      <rect x="100" y="138" width="1080" height="700" fill="#fff"/>
      <circle cx="166" cy="170" r="13" fill="url(#mark)"/>
      <text x="190" y="176" font-size="18" font-weight="700" fill="#10302f" letter-spacing="-.3">Praxis Nordlicht</text>
      <g font-size="14" fill="#4b5b5b"><text x="720" y="175">Leistungen</text><text x="816" y="175">Team</text><text x="876" y="175">Kontakt</text></g>
      <rect x="966" y="152" width="164" height="36" rx="18" fill="#0f766e"/>
      <text x="1048" y="175" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Termin buchen</text>
      <rect x="100" y="198" width="1080" height="1" fill="#edf2f2"/>
      <text x="150" y="272" font-size="15" font-weight="600" fill="#0f766e">Hausarztpraxis</text>
      <g font-size="54" font-weight="700" fill="#10302f" letter-spacing="-1.5"><text x="150" y="336">Ihre Gesundheit</text><text x="150" y="398">in guten Händen.</text></g>
      <g font-size="18" fill="#5b6b6b"><text x="150" y="446">Moderne Medizin, persönliche Betreuung</text><text x="150" y="472">und Termine rund um die Uhr online.</text></g>
      <rect x="150" y="504" width="214" height="52" rx="26" fill="#0f766e"/>
      <text x="257" y="535.5" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Termin online buchen</text>
      <text x="392" y="535.5" font-size="16" font-weight="500" fill="#0f766e">Sprechzeiten ›</text>
      <rect x="680" y="232" width="450" height="330" rx="24" fill="url(#night)"/>
      <g clip-path="url(#site-img)">
        <g fill="#fff" fill-opacity=".7"><circle cx="720" cy="268" r="1.6"/><circle cx="790" cy="252" r="1.2"/><circle cx="868" cy="280" r="1.6"/><circle cx="950" cy="258" r="1.2"/><circle cx="1030" cy="276" r="1.6"/><circle cx="1100" cy="252" r="1.2"/></g>
        <path d="M680 350 C800 262 920 362 1130 252 V302 C940 392 820 302 680 412 Z" fill="url(#aur2)"/>
        <path d="M680 402 C780 302 880 422 1130 302 V382 C960 472 820 382 680 472 Z" fill="url(#aur1)"/>
        <path d="M680 562 V502 C760 472 820 492 880 482 C960 468 1040 502 1130 472 V562 Z" fill="#06171c"/>
      </g>
      <g>
        <rect x="150" y="606" width="310" height="170" rx="18" fill="#f1f7f7"/>
        <circle cx="190" cy="650" r="20" fill="#d5ecea"/>
        <path d="M190 641 V650 L196 655" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="174" y="710" font-size="19" font-weight="600" fill="#10302f">Sprechzeiten</text>
        <text x="174" y="738" font-size="14.5" fill="#5b6b6b">Mo–Fr 8–18 Uhr</text>
        <rect x="485" y="606" width="310" height="170" rx="18" fill="#f1f7f7"/>
        <circle cx="525" cy="650" r="20" fill="#d5ecea"/>
        <path d="M525 643 V657 M518 650 H532" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
        <text x="509" y="710" font-size="19" font-weight="600" fill="#10302f">Leistungen</text>
        <text x="509" y="738" font-size="14.5" fill="#5b6b6b">Vorsorge, Impfungen, Check-ups</text>
        <rect x="820" y="606" width="310" height="170" rx="18" fill="#f1f7f7"/>
        <circle cx="860" cy="650" r="20" fill="#d5ecea"/>
        <rect x="851" y="643" width="18" height="16" rx="3" fill="none" stroke="#0f766e" stroke-width="2.2"/>
        <path d="M851 648.5 H869 M856 640 V645 M864 640 V645" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/>
        <text x="844" y="710" font-size="19" font-weight="600" fill="#10302f">Online-Termin</text>
        <text x="844" y="738" font-size="14.5" fill="#5b6b6b">In wenigen Klicks gebucht</text>
      </g>
    </g>
  </g>
  <rect x="490" y="26" width="60" height="19" rx="6" fill="#0b0b0c"/>
  <path d="M40 552 H1000 V558 C1000 566 994 572 984 572 H56 C46 572 40 566 40 558 Z" fill="url(#base)"/>
  <rect x="40" y="552" width="960" height="2" fill="#f2f2f5"/>
  <path d="M452 552 H588 V555 C588 557.5 586 559 583 559 H457 C454 559 452 557.5 452 555 Z" fill="#bdbdc3"/>

  <!-- Smartphone -->
  <g filter="url(#phone-shadow)">
    <rect x="880" y="236" width="210" height="440" rx="36" fill="url(#ti)"/>
  </g>
  <rect x="877" y="330" width="3" height="40" rx="1.5" fill="#2c2c2e"/>
  <rect x="1090" y="350" width="3" height="60" rx="1.5" fill="#2c2c2e"/>
  <rect x="884" y="240" width="202" height="432" rx="32" fill="#000"/>
  <g clip-path="url(#phone-screen)">
    <rect x="890" y="246" width="190" height="420" fill="#fff"/>
    <text x="910" y="270" font-size="11" font-weight="600" fill="#10302f">9:41</text>
    <rect x="1048.5" y="262.5" width="18" height="9" rx="2.5" fill="none" stroke="#10302f"/>
    <rect x="1050.5" y="264.5" width="12" height="5" rx="1" fill="#10302f"/>
    <rect x="1028" y="266" width="3" height="5" rx=".8" fill="#10302f"/>
    <rect x="1033" y="264" width="3" height="7" rx=".8" fill="#10302f"/>
    <rect x="1038" y="262" width="3" height="9" rx=".8" fill="#10302f"/>
    <circle cx="909" cy="301" r="9" fill="url(#mark)"/>
    <text x="924" y="305.5" font-size="12.5" font-weight="700" fill="#10302f" letter-spacing="-.2">Praxis Nordlicht</text>
    <path d="M1046 297 H1064 M1046 303 H1064" stroke="#10302f" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="890" y="318" width="190" height="1" fill="#edf2f2"/>
    <rect x="900" y="328" width="170" height="132" rx="14" fill="url(#night)"/>
    <g clip-path="url(#phone-img)">
      <g fill="#fff" fill-opacity=".7"><circle cx="918" cy="344" r="1.1"/><circle cx="962" cy="338" r=".9"/><circle cx="1012" cy="348" r="1.1"/><circle cx="1052" cy="340" r=".9"/></g>
      <path d="M900 384 C950 344 1000 384 1070 340 V360 C1000 400 950 364 900 408 Z" fill="url(#aur2)"/>
      <path d="M900 408 C940 366 990 416 1070 366 V398 C1010 436 950 400 900 440 Z" fill="url(#aur1)"/>
      <path d="M900 460 V442 C930 430 960 438 990 434 C1020 428 1045 442 1070 430 V460 Z" fill="#06171c"/>
    </g>
    <text x="906" y="482" font-size="10.5" font-weight="600" fill="#0f766e">Hausarztpraxis</text>
    <g font-size="19" font-weight="700" fill="#10302f" letter-spacing="-.5">
      <text x="906" y="506">Ihre Gesundheit</text>
      <text x="906" y="530">in guten Händen.</text>
    </g>
    <text x="906" y="552" font-size="11" fill="#5b6b6b">Termine rund um die Uhr online.</text>
    <rect x="906" y="566" width="158" height="36" rx="18" fill="#0f766e"/>
    <text x="985" y="588.5" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Termin online buchen</text>
    <rect x="906" y="612" width="158" height="36" rx="10" fill="#f1f7f7"/>
    <circle cx="924" cy="630" r="9" fill="#d5ecea"/>
    <path d="M924 625 V630 L927.5 632.5" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="940" y="634" font-size="11" fill="#10302f">Mo–Fr 8–18 Uhr</text>
    <rect x="950" y="656" width="70" height="4" rx="2" fill="#10302f" fill-opacity=".85"/>
  </g>
  <rect x="955" y="256" width="60" height="18" rx="9" fill="#000"/>

  <!-- Benachrichtigung -->
  <g transform="translate(0 -12)">
    <g filter="url(#card-shadow)">
      <rect x="36" y="452" width="292" height="76" rx="19.8" fill="#fff"/>
    </g>
    <circle cx="73.0" cy="490.0" r="19.0" fill="#0f766e"/>
    <path d="M65.0 490.4 L71.1 496.5 L81.7 484.3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106.0" y="487.0" font-size="16" font-weight="600" fill="#1d1d1f">Neuer Online-Termin</text>
    <text x="106.0" y="506.8" font-size="13" fill="#6e6e73">Di, 10:30 Uhr · Praxis Nordlicht</text>
  </g>
</svg>
