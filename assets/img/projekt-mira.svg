<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Portfolio-Platzhalter „Café Mira“ – durch echten Screenshot ersetzen -->
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e6d9"/>
      <stop offset="1" stop-color="#e7c6ae"/>
    </linearGradient>
    <radialGradient id="coffee">
      <stop offset="0" stop-color="#8b5a3c"/>
      <stop offset="1" stop-color="#5e3520"/>
    </radialGradient>
    <clipPath id="win"><rect x="100" y="90" width="1080" height="760" rx="20"/></clipPath>
    <clipPath id="img"><rect x="700" y="232" width="430" height="330" rx="24"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#6b3a22" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6b3a22" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#stage)"/>
  <rect x="100" y="90" width="1080" height="760" rx="20" fill="#fbf6ef" filter="url(#shadow)"/>

  <g clip-path="url(#win)">
    <!-- Browserleiste -->
    <rect x="100" y="90" width="1080" height="48" fill="#f3efea"/>
    <circle cx="128" cy="114" r="6" fill="#ddd5cc"/>
    <circle cx="148" cy="114" r="6" fill="#ddd5cc"/>
    <circle cx="168" cy="114" r="6" fill="#ddd5cc"/>
    <rect x="440" y="102" width="400" height="24" rx="12" fill="#fff"/>
    <text x="640" y="118.5" font-size="13" fill="#9a8274" text-anchor="middle">cafe-mira.de</text>

    <!-- Navigation -->
    <text x="150" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5a2e1f">Café Mira</text>
    <g font-size="14" fill="#8a6a5a">
      <text x="716" y="175">Karte</text>
      <text x="776" y="175">Frühstück</text>
      <text x="866" y="175">Über uns</text>
    </g>
    <rect x="958" y="152" width="172" height="36" rx="18" fill="#c65d3b"/>
    <text x="1044" y="175" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Tisch reservieren</text>
    <rect x="100" y="198" width="1080" height="1" fill="#efe5d8"/>

    <!-- Hero -->
    <text x="150" y="272" font-size="15" font-weight="600" fill="#c65d3b" letter-spacing=".5">Frühstück · Kuchen · Kaffee</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#3b2016" letter-spacing="-.5">
      <text x="150" y="340">Kaffee, Kuchen</text>
      <text x="150" y="404">&amp; gute Gespräche.</text>
    </g>
    <g font-size="18" fill="#8a6a5a">
      <text x="150" y="454">Hausgemachte Kuchen und Kaffee aus</text>
      <text x="150" y="480">eigener Röstung – mitten in der Stadt.</text>
    </g>
    <rect x="150" y="512" width="190" height="52" rx="26" fill="#c65d3b"/>
    <text x="245" y="543.5" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Tisch reservieren</text>
    <text x="368" y="543.5" font-size="16" font-weight="500" fill="#c65d3b">Zur Karte ›</text>

    <!-- Bild: Tasse von oben -->
    <rect x="700" y="232" width="430" height="330" rx="24" fill="#efdfcd"/>
    <g clip-path="url(#img)">
      <g fill="#6b3f26">
        <ellipse cx="752" cy="512" rx="9" ry="6" transform="rotate(-30 752 512)"/>
        <ellipse cx="776" cy="530" rx="9" ry="6" transform="rotate(20 776 530)"/>
        <ellipse cx="1078" cy="276" rx="9" ry="6" transform="rotate(40 1078 276)"/>
        <ellipse cx="1096" cy="300" rx="9" ry="6" transform="rotate(-10 1096 300)"/>
      </g>
      <circle cx="772" cy="296" r="30" fill="#d9a86c"/>
      <g fill="#8b5a3c"><circle cx="762" cy="288" r="3"/><circle cx="780" cy="300" r="3"/><circle cx="768" cy="308" r="2.5"/><circle cx="784" cy="284" r="2.5"/></g>
      <g filter="url(#soft)">
        <circle cx="915" cy="397" r="132" fill="#fff"/>
      </g>
      <circle cx="915" cy="397" r="112" fill="none" stroke="#f1e8de" stroke-width="2"/>
      <rect x="990" y="385" width="66" height="24" rx="12" fill="#fff" stroke="#eadfd2" stroke-width="2"/>
      <circle cx="915" cy="397" r="90" fill="#fff" stroke="#eadfd2" stroke-width="4"/>
      <circle cx="915" cy="397" r="74" fill="url(#coffee)"/>
      <circle cx="915" cy="397" r="71" fill="none" stroke="#b07a50" stroke-opacity=".6" stroke-width="6"/>
      <path d="M915 430 C878 404 882 368 904 368 C912 368 915 376 915 381 C915 376 918 368 926 368 C948 368 952 404 915 430 Z" fill="#f3e3cf"/>
    </g>

    <!-- Speisekarte -->
    <rect x="150" y="612" width="980" height="170" rx="20" fill="#f4ebe0"/>
    <text x="182" y="656" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#5a2e1f">Unsere Karte</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2016">
      <text x="182" y="704">Espresso</text>
      <text x="502" y="704">Cappuccino</text>
      <text x="822" y="704">Käsekuchen</text>
    </g>
    <g font-size="16" font-weight="600" fill="#c65d3b" text-anchor="end">
      <text x="452" y="704">2,40 €</text>
      <text x="772" y="704">3,60 €</text>
      <text x="1092" y="704">4,20 €</text>
    </g>
    <g font-size="13.5" fill="#8a6a5a">
      <text x="182" y="730">Aus eigener Röstung</text>
      <text x="502" y="730">Mit Hafer- oder Vollmilch</text>
      <text x="822" y="730">Nach Omas Rezept</text>
    </g>
  </g>
</svg>
