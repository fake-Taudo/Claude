<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Leistung „Landingpages“: Aktionsseite eines Fitnessstudios mit eingehender Anfrage -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#ebebf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".09"/>
    </filter>
    <filter id="shadow-strong" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <linearGradient id="gym" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="1" stop-color="#48484a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect x="80" y="48" width="480" height="400" rx="16" fill="#fff" filter="url(#shadow)"/>
  <circle cx="102" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="118" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="134" cy="70" r="5" fill="#e0e0e5"/>
  <text x="104" y="104" font-size="11" font-weight="800" letter-spacing="2" fill="#1d1d1f">KRAFTWERK</text>
  <rect x="470" y="90" width="66" height="20" rx="10" fill="#1d1d1f"/>
  <text x="503" y="103.5" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">Anmelden</text>

  <rect x="274" y="124" width="92" height="20" rx="10" fill="#0071e3" fill-opacity=".1"/>
  <text x="320" y="138" font-size="10.5" font-weight="600" fill="#0071e3" text-anchor="middle">Nur im Mai</text>
  <g font-size="30" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-.8">
    <text x="320" y="180">Probetraining</text>
    <text x="320" y="213">gratis.</text>
  </g>
  <text x="320" y="238" font-size="11" fill="#6e6e73" text-anchor="middle">Persönliche Einweisung · 60 Minuten · unverbindlich</text>

  <rect x="176.5" y="254.5" width="159" height="37" rx="10" fill="#f5f5f7" stroke="#e5e5ea"/>
  <text x="190" y="277" font-size="11" fill="#86868b">Ihre Telefonnummer</text>
  <rect x="344" y="254" width="120" height="38" rx="10" fill="#0071e3"/>
  <text x="404" y="277.5" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Termin sichern</text>
  <path d="M446 280 V302 L452 296 L457 306 L461.5 304 L456.5 294 L465 294 Z" fill="#1d1d1f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <g font-size="10.5" fill="#6e6e73">
    <path d="M144 322 L147.5 325.5 L154 318.5" fill="none" stroke="#0071e3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="326">Keine Vertragsbindung</text>
    <path d="M290 322 L293.5 325.5 L300 318.5" fill="none" stroke="#0071e3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="306" y="326">Kostenlos</text>
    <path d="M376 322 L379.5 325.5 L386 318.5" fill="none" stroke="#0071e3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="392" y="326">Parkplätze vor Ort</text>
  </g>

  <rect x="104" y="346" width="432" height="80" rx="12" fill="url(#gym)"/>
  <rect x="270" y="377" width="100" height="6" rx="2" fill="#8e8e93"/>
  <rect x="254" y="363" width="12" height="34" rx="3" fill="#aeaeb2"/>
  <rect x="240" y="368" width="12" height="24" rx="3" fill="#aeaeb2"/>
  <rect x="374" y="363" width="12" height="34" rx="3" fill="#aeaeb2"/>
  <rect x="388" y="368" width="12" height="24" rx="3" fill="#aeaeb2"/>

  <!-- Benachrichtigung: neue Anfrage -->
  <rect x="364" y="20" width="236" height="64" rx="16" fill="#fff" filter="url(#shadow-strong)"/>
  <circle cx="396" cy="52" r="16" fill="#0071e3"/>
  <path d="M389 52.5 L394 57.5 L403 47.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="422" y="48" font-size="14" font-weight="600" fill="#1d1d1f">Neue Anfrage</text>
  <text x="422" y="66" font-size="11.5" fill="#6e6e73">Probetraining · Do, 18 Uhr</text>
</svg>
