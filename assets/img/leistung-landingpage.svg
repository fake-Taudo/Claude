<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Leistung „Landingpages“: fokussierte Seite mit Handlungsaufforderung und eingehender Anfrage -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#ebebf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".09"/>
    </filter>
    <filter id="shadow-strong" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Fenster -->
  <rect x="80" y="48" width="480" height="400" rx="16" fill="#fff" filter="url(#shadow)"/>
  <circle cx="102" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="118" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="134" cy="70" r="5" fill="#e0e0e5"/>
  <rect x="104" y="96" width="48" height="8" rx="4" fill="#1d1d1f"/>
  <rect x="484" y="91" width="52" height="18" rx="9" fill="#1d1d1f" fill-opacity=".07"/>

  <!-- Hero der Landingpage -->
  <rect x="296" y="128" width="48" height="18" rx="9" fill="#0071e3" fill-opacity=".1"/>
  <text x="320" y="141" font-size="11" font-weight="600" fill="#0071e3" text-anchor="middle">Neu</text>
  <rect x="196" y="160" width="248" height="18" rx="5" fill="#1d1d1f"/>
  <rect x="228" y="186" width="184" height="18" rx="5" fill="#1d1d1f"/>
  <rect x="208" y="218" width="224" height="7" rx="3.5" fill="#aeaeb2"/>
  <rect x="240" y="231" width="160" height="7" rx="3.5" fill="#aeaeb2"/>

  <rect x="244" y="250" width="152" height="52" rx="26" fill="none" stroke="#0071e3" stroke-opacity=".18" stroke-width="6"/>
  <rect x="250" y="256" width="140" height="40" rx="20" fill="#0071e3"/>
  <text x="320" y="281" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Jetzt anfragen</text>
  <path d="M370 284 V308 L376.5 302 L381.5 313 L386 311 L381 300.5 L389.5 300 Z" fill="#1d1d1f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Vorteile -->
  <g>
    <circle cx="134" cy="340" r="12" fill="#f0f0f3"/>
    <rect x="122" y="362" width="100" height="8" rx="4" fill="#1d1d1f" fill-opacity=".8"/>
    <rect x="122" y="376" width="112" height="6" rx="3" fill="#c7c7cc"/>
    <circle cx="282" cy="340" r="12" fill="#f0f0f3"/>
    <rect x="270" y="362" width="92" height="8" rx="4" fill="#1d1d1f" fill-opacity=".8"/>
    <rect x="270" y="376" width="112" height="6" rx="3" fill="#c7c7cc"/>
    <circle cx="430" cy="340" r="12" fill="#f0f0f3"/>
    <rect x="418" y="362" width="104" height="8" rx="4" fill="#1d1d1f" fill-opacity=".8"/>
    <rect x="418" y="376" width="96" height="6" rx="3" fill="#c7c7cc"/>
  </g>

  <!-- Benachrichtigung: neue Anfrage -->
  <rect x="372" y="22" width="224" height="64" rx="16" fill="#fff" filter="url(#shadow-strong)"/>
  <circle cx="404" cy="54" r="16" fill="#0071e3"/>
  <path d="M397 54.5 L402 59.5 L411 49.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="50" font-size="14" font-weight="600" fill="#1d1d1f">Neue Anfrage</text>
  <text x="430" y="68" font-size="11.5" fill="#6e6e73">Vor 2 Minuten</text>
</svg>
