<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Leistung „Website-Design“: Gestaltungs-Werkzeug mit Entwurf und Stil-Palette -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#ebebf0"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e6fc"/>
      <stop offset="1" stop-color="#eef4fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Fenster -->
  <rect x="80" y="48" width="480" height="400" rx="16" fill="#fff" filter="url(#shadow)"/>
  <circle cx="102" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="118" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="134" cy="70" r="5" fill="#e0e0e5"/>
  <rect x="80" y="90" width="480" height="1" fill="#f0f0f3"/>
  <rect x="416" y="91" width="1" height="309" fill="#f0f0f3"/>

  <!-- Zeichenfläche mit Entwurf -->
  <rect x="100" y="110" width="300" height="300" rx="8" fill="#f5f5f7"/>
  <rect x="120" y="128" width="40" height="7" rx="3.5" fill="#1d1d1f"/>
  <rect x="292" y="129" width="22" height="5" rx="2.5" fill="#c7c7cc"/>
  <rect x="322" y="129" width="22" height="5" rx="2.5" fill="#c7c7cc"/>
  <rect x="352" y="129" width="30" height="5" rx="2.5" fill="#c7c7cc"/>
  <rect x="120" y="158" width="176" height="15" rx="4" fill="#1d1d1f"/>
  <rect x="120" y="180" width="124" height="15" rx="4" fill="#1d1d1f"/>
  <rect x="120" y="206" width="150" height="6" rx="3" fill="#aeaeb2"/>
  <rect x="120" y="224" width="64" height="20" rx="10" fill="#0071e3"/>

  <rect x="120" y="260" width="264" height="110" rx="8" fill="url(#img)"/>
  <circle cx="340" cy="290" r="12" fill="#fff" fill-opacity=".9"/>
  <path d="M120 370 L196 314 L244 346 L298 300 L384 370 Z" fill="#0071e3" fill-opacity=".22"/>

  <!-- Auswahlrahmen mit Anfassern -->
  <rect x="120" y="260" width="264" height="110" fill="none" stroke="#0071e3" stroke-width="1.5"/>
  <g fill="#fff" stroke="#0071e3" stroke-width="1.5">
    <rect x="116" y="256" width="8" height="8" rx="1.5"/>
    <rect x="380" y="256" width="8" height="8" rx="1.5"/>
    <rect x="116" y="366" width="8" height="8" rx="1.5"/>
    <rect x="380" y="366" width="8" height="8" rx="1.5"/>
  </g>
  <rect x="216" y="380" width="72" height="18" rx="4" fill="#0071e3"/>
  <text x="252" y="393" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">264 × 110</text>
  <path d="M390 376 V398 L396 392 L401 402 L405.5 400 L400.5 390 L409 390 Z" fill="#1d1d1f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Stil-Palette -->
  <g font-size="10.5" font-weight="600" fill="#86868b">
    <text x="432" y="122">Typografie</text>
    <text x="432" y="236">Farben</text>
    <text x="432" y="298">Radius</text>
    <text x="432" y="346">Abstand</text>
  </g>
  <text x="430" y="184" font-size="48" font-weight="600" fill="#1d1d1f" letter-spacing="-1">Aa</text>
  <rect x="432" y="198" width="72" height="6" rx="3" fill="#c7c7cc"/>

  <circle cx="442" cy="258" r="10" fill="#1d1d1f"/>
  <circle cx="468" cy="258" r="10" fill="#6e6e73"/>
  <circle cx="494" cy="258" r="10" fill="#d2d2d7"/>
  <circle cx="520" cy="258" r="10" fill="#0071e3"/>
  <circle cx="520" cy="258" r="14" fill="none" stroke="#0071e3" stroke-width="1.5"/>

  <rect x="432" y="310" width="104" height="4" rx="2" fill="#e5e5ea"/>
  <rect x="432" y="310" width="60" height="4" rx="2" fill="#0071e3"/>
  <circle cx="492" cy="312" r="8" fill="#fff" stroke="#d2d2d7"/>

  <rect x="432" y="358" width="104" height="4" rx="2" fill="#e5e5ea"/>
  <rect x="432" y="358" width="30" height="4" rx="2" fill="#0071e3"/>
  <circle cx="462" cy="360" r="8" fill="#fff" stroke="#d2d2d7"/>
</svg>
