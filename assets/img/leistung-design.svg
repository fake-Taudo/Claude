<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Leistung „Website-Design“: Gestaltungs-Werkzeug mit dem Entwurf für eine Bäckerei -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#ebebf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".09"/>
    </filter>
    <filter id="shadow-strong" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <clipPath id="board"><rect x="100" y="104" width="300" height="296" rx="8"/></clipPath>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect x="80" y="48" width="480" height="400" rx="16" fill="#fff" filter="url(#shadow)"/>
  <circle cx="102" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="118" cy="70" r="5" fill="#e0e0e5"/>
  <circle cx="134" cy="70" r="5" fill="#e0e0e5"/>
  <rect x="80" y="90" width="480" height="1" fill="#f0f0f3"/>
  <rect x="416" y="91" width="1" height="309" fill="#f0f0f3"/>

  <!-- Zeichenfläche: Entwurf „Sonnenkorn“ -->
  <g clip-path="url(#board)">
    <rect x="100" y="104" width="300" height="300" fill="#fbf7f2"/>
    <text x="116" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" fill="#5a3a22">Sonnenkorn</text>
    <g font-size="8.5" fill="#8a6a55"><text x="296" y="127">Brot</text><text x="322" y="127">Kuchen</text><text x="358" y="127">Café</text></g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2416" letter-spacing="-.4">
      <text x="116" y="178">Frisch aus</text>
      <text x="116" y="210">dem Ofen.</text>
    </g>
    <text x="116" y="234" font-size="9.5" fill="#8a6a55">Jeden Morgen ab 6 Uhr frisch</text>
    <rect x="116" y="246" width="86" height="24" rx="12" fill="#b5652b"/>
    <text x="159" y="261.5" font-size="9.5" font-weight="600" fill="#fff" text-anchor="middle">Vorbestellen</text>
    <rect x="116" y="284" width="268" height="112" rx="8" fill="#efdcc4"/>
    <ellipse cx="192" cy="352" rx="50" ry="27" fill="#c98a4b"/>
    <path d="M166 344 L178 356 M186 340 L198 352 M206 338 L218 350" stroke="#e8b98a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="292" cy="348" rx="42" ry="31" fill="#b87438"/>
    <path d="M272 336 Q292 330 312 336 M268 350 Q292 344 316 350" fill="none" stroke="#d9a066" stroke-width="3" stroke-linecap="round"/>
    <circle cx="354" cy="368" r="17" fill="#d9a066"/>
  </g>

  <!-- Auswahl der Überschrift -->
  <rect x="112" y="152" width="164" height="66" fill="none" stroke="#0071e3" stroke-width="1.5"/>
  <g fill="#fff" stroke="#0071e3" stroke-width="1.5">
    <rect x="108" y="148" width="8" height="8" rx="1.5"/><rect x="272" y="148" width="8" height="8" rx="1.5"/>
    <rect x="108" y="214" width="8" height="8" rx="1.5"/><rect x="272" y="214" width="8" height="8" rx="1.5"/>
  </g>
  <rect x="286" y="176" width="44" height="18" rx="4" fill="#0071e3"/>
  <text x="308" y="189" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">30 pt</text>
  <path d="M278 220 V242 L284 236 L289 246 L293.5 244 L288.5 234 L297 234 Z" fill="#1d1d1f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Stil-Palette -->
  <g font-size="10.5" font-weight="600" fill="#86868b">
    <text x="432" y="122">Schrift</text>
    <text x="432" y="228">Farben</text>
    <text x="432" y="306">Ecken</text>
    <text x="432" y="352">Abstand</text>
  </g>
  <text x="430" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#3b2416">Aa</text>
  <text x="432" y="196" font-size="10" fill="#6e6e73">Serif · Regular</text>
  <circle cx="442" cy="250" r="10" fill="#3b2416"/>
  <circle cx="468" cy="250" r="10" fill="#b5652b"/>
  <circle cx="494" cy="250" r="10" fill="#efdcc4"/>
  <circle cx="520" cy="250" r="9.5" fill="#fbf7f2" stroke="#e0e0e5"/>
  <circle cx="468" cy="250" r="14" fill="none" stroke="#0071e3" stroke-width="1.5"/>
  <text x="432" y="282" font-size="10" fill="#6e6e73">#B5652B</text>
  <rect x="432" y="316" width="104" height="4" rx="2" fill="#e5e5ea"/>
  <rect x="432" y="316" width="40" height="4" rx="2" fill="#0071e3"/>
  <circle cx="472" cy="318" r="8" fill="#fff" stroke="#d2d2d7"/>
  <rect x="432" y="362" width="104" height="4" rx="2" fill="#e5e5ea"/>
  <rect x="432" y="362" width="70" height="4" rx="2" fill="#0071e3"/>
  <circle cx="502" cy="364" r="8" fill="#fff" stroke="#d2d2d7"/>
</svg>
