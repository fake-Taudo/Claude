<script>
'use strict';
/* ==========================================================================
   ARKANUM - DER LETZTE FUNKE
   Ein 2D-Open-World-Action-Adventure in einer einzigen HTML-Datei.
   Flaches Vektordesign: geometrische Formen, klare Farbflaechen, saubere
   Konturen, Verlaeufe nur für Himmel und Lichteffekte. Alles - Grafik,
   Ton, Welt - wird zur Laufzeit auf Canvas 2D erzeugt.
   ========================================================================== */

/* --------------------------------------------------------------------------
   0. KONSTANTEN
   -------------------------------------------------------------------------- */
const VW = 480, VH = 270;        // logische Bildflaeche (Weltausschnitt)
let RS = 2;                      // Geraetepixel je logischer Einheit
const TS = 16;                   // Kachelgroesse
const WW = 512, WH = 512;        // Weltgroesse in Kacheln  (8192 x 8192 px)

const FOGS = 4;                  // Nebel-des-Krieges Rasterweite (Kacheln)

/* --------------------------------------------------------------------------
   1. PALETTE  (eine gemeinsame Farbwelt für alles)

const P = {

  cry1:'#2f7f9e', cry2:'#46a8c4', cry3:'#6fd0e0', cry4:'#b6f0f8',

  skin:'#f2c49b', skind:'#d59f74', skinl:'#fbdcbd',
  blood:'#c4344a', gold:'#f0b429', gold2:'#ffd766', copper:'#cf7f3f',
  hp:'#e54b5e', hpd:'#5a1f2c', mp:'#3d8bff', mpd:'#1b3a6e', xp:'#8fd94f', xpd:'#2f5a24',
  fire:'#ff7a3c', fire2:'#ffc255', frost:'#79d4f2', frost2:'#c4eeff',
  bolt:'#ffe45e', bolt2:'#fff6bd', poison:'#9fdc4f', shadow:'#7b4fc0',
  ui1:'#141b30', ui2:'#1d2742', ui3:'#2a3860', ui4:'#4a5c92', uitx:'#dbe4f7', uidim:'#8b9ac0',
  rare0:'#c9d4e8', rare1:'#4fa3ff', rare2:'#b46bff', rare3:'#ffa63c', rare4:'#ff5a7a'
};
/* Konturfarbe und -staerke für den gesamten Vektorstil */
const INK = '#1a2138', INK2 = 'rgba(26,33,56,.55)';
let OUT = 1.1;

/* --------------------------------------------------------------------------
   2. MATHE / HILFSFUNKTIONEN
   -------------------------------------------------------------------------- */
const PI = Math.PI, TAU = PI * 2;
const floor = Math.floor, ceil = Math.ceil, abs = Math.abs, sqrt = Math.sqrt;
const sin = Math.sin, cos = Math.cos, atan2 = Math.atan2, hypot = Math.hypot;
const min = Math.min, max = Math.max, round = Math.round, pow = Math.pow;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function inv(a, b, v) { return b === a ? 0 : clamp((v - a) / (b - a), 0, 1); }
function dist2(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; }
function dist(x1, y1, x2, y2) { return sqrt(dist2(x1, y1, x2, y2)); }
function angTo(x1, y1, x2, y2) { return atan2(y2 - y1, x2 - x1); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function approach(v, t, s) { return v < t ? min(v + s, t) : max(v - s, t); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function fmt(n) { n = floor(n); return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : '' + n; }

/* Deterministischer Zufall (mulberry32) */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RND = mulberry(1337);
function rnd() { return RND(); }
function rr(a, b) { return a + RND() * (b - a); }
function ri(a, b) { return floor(a + RND() * (b - a + 1)); }
function pick(arr) { return arr[floor(RND() * arr.length) % arr.length]; }
function chance(p) { return RND() < p; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = floor(RND() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* Stabiler Hash für Weltkoordinaten -> [0,1) */
function hash2(x, y, s) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 1442695041;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
/* Value-Noise mit glatter Interpolation */
function vnoise(x, y, s) {
  const xi = floor(x), yi = floor(y);
  const xf = smooth(x - xi), yf = smooth(y - yi);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s);
  const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, xf), lerp(c, d, xf), yf);
}
/* Fraktales Rauschen */
function fbm(x, y, oct, s, lac, gain) {
  lac = lac || 2; gain = gain || .5;
  let f = 1, amp = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += vnoise(x * f, y * f, s + i * 77) * amp;
    norm += amp; amp *= gain; f *= lac;
  }
  return sum / norm;
}
/* Ridged-Noise für Gebirge / Adern */
function ridge(x, y, oct, s) {
  let f = 1, amp = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += (1 - abs(vnoise(x * f, y * f, s + i * 31) * 2 - 1)) * amp;
    norm += amp; amp *= .5; f *= 2;
  }
  return sum / norm;
}
/* Farbwerkzeuge */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(r, g, b) {
  return '#' + ((1 << 24) + (clamp(round(r), 0, 255) << 16) + (clamp(round(g), 0, 255) << 8) + clamp(round(b), 0, 255)).toString(16).slice(1);
}
function mix(c1, c2, t) {
  const a = hex2rgb(c1), b = hex2rgb(c2);
  return rgb2hex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function shade(c, f) { const a = hex2rgb(c); return rgb2hex(a[0] * f, a[1] * f, a[2] * f); }
function rgba(c, a) { const x = hex2rgb(c); return 'rgba(' + x[0] + ',' + x[1] + ',' + x[2] + ',' + a + ')'; }
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  const c = (1 - abs(2 * l - 1)) * s, x = c * (1 - abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return rgb2hex((r + m) * 255, (g + m) * 255, (b + m) * 255);
}
/* Offscreen-Canvas */
function mkCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = max(1, round(w)); c.height = max(1, round(h));
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = true;
  x.lineJoin = 'round'; x.lineCap = 'round';
  return { c: c, x: x, w: c.width, h: c.height };
}

/* --------------------------------------------------------------------------
   3. SCHRIFT  (serifenlose Systemschrift, vektoriell auf Canvas gesetzt)
   -------------------------------------------------------------------------- */
const FONTFAM = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const FONT = { size: 8.4, h: 9, mctx: null, cache: new Map() };
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 8;
  FONT.mctx = c.getContext('2d');
  FONT.mctx.font = '100px ' + FONTFAM;
})();
function fontStr(sc, w) { return (w || 500) + ' ' + (FONT.size * (sc || 1)).toFixed(2) + 'px ' + FONTFAM; }
function textW(s, sc, w) {
  s = '' + s; sc = sc || 1;
  const key = (w || 500) + '|' + s;
  let base = FONT.cache.get(key);
  if (base === undefined) {
    FONT.mctx.font = (w || 500) + ' 100px ' + FONTFAM;
    base = FONT.mctx.measureText(s).width / 100;
    if (FONT.cache.size > 4000) FONT.cache.clear();
    FONT.cache.set(key, base);
  }
  return base * FONT.size * sc;
}
/* Text zeichnen. opt: {shadow, center, right, alpha, scale, weight} */
function text(ctx, s, x, y, color, opt) {
  opt = opt || {};
  s = '' + s;
  const sc = opt.scale || 1, wt = opt.weight || 500;
  const w = textW(s, sc, wt);
  if (opt.center) x -= w / 2;
  else if (opt.right) x -= w;
  ctx.font = fontStr(sc, wt);
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  const oa = ctx.globalAlpha;
  if (opt.alpha !== undefined) ctx.globalAlpha = oa * opt.alpha;
  if (opt.shadow !== false) {
    const so = min(1.4, .7 * sc);
    ctx.fillStyle = typeof opt.shadow === 'string' ? opt.shadow : 'rgba(18,24,38,.5)';
    ctx.fillText(s, x + so, y + so * 1.1);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.globalAlpha = oa;
  return w;
}
/* Wortumbruch */
function wrap(s, maxW, sc, wt) {
  const words = ('' + s).split(' ');
  const lines = []; let cur = '';
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (w === '\n') { lines.push(cur); cur = ''; continue; }
    const t = cur ? cur + ' ' + w : w;
    if (textW(t, sc, wt) > maxW && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* --------------------------------------------------------------------------
   4. AUDIO  (komplett synthetisiert - Effekte und adaptive Musik)
   -------------------------------------------------------------------------- */
const AU = {
  ctx: null, master: null, mus: null, sfx: null, conv: null,
  enabled: true, musicOn: true, started: false,
  vol: .55, musVol: .34, mood: 'calm', nextMood: 'calm',
  step: 0, nextT: 0, timer: null
};

function audioInit() {
  if (AU.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { AU.enabled = false; return; }
  AU.ctx = new AC();
  AU.master = AU.ctx.createGain(); AU.master.gain.value = AU.vol;
  AU.master.connect(AU.ctx.destination);
  AU.sfx = AU.ctx.createGain(); AU.sfx.gain.value = 1; AU.sfx.connect(AU.master);
  AU.mus = AU.ctx.createGain(); AU.mus.gain.value = AU.musVol; AU.mus.connect(AU.master);
  // kleiner Hall aus Rauschen
  const len = floor(AU.ctx.sampleRate * 1.6);
  const buf = AU.ctx.createBuffer(2, len, AU.ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * pow(1 - i / len, 2.6) * .5;
  }
  AU.conv = AU.ctx.createConvolver(); AU.conv.buffer = buf;
  const rv = AU.ctx.createGain(); rv.gain.value = .3;
  AU.conv.connect(rv); rv.connect(AU.master);
  AU.started = true;
  musicStart();
}
function audioResume() { if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); }

function tone(o) {
  if (!AU.enabled || !AU.ctx) return;
  const c = AU.ctx, t = c.currentTime + (o.at || 0);
  const osc = c.createOscillator();
  osc.type = o.type || 'square';
  const f0 = o.f || 440, f1 = o.f2 === undefined ? f0 : o.f2;
  osc.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) {
    if (o.exp === false) osc.frequency.linearRampToValueAtTime(max(1, f1), t + (o.d || .2));
    else osc.frequency.exponentialRampToValueAtTime(max(1, f1), t + (o.d || .2));
  }
  const g = c.createGain();
  const v = (o.v === undefined ? .3 : o.v), a = o.a === undefined ? .005 : o.a, d = o.d || .2;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  let node = osc;
  if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 1; node.connect(f); node = f; }
  node.connect(g);
  g.connect(o.bus || AU.sfx);
  if (o.rev && AU.conv) { const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(AU.conv); }
  osc.start(t); osc.stop(t + d + .05);
}
function noise(o) {
  if (!AU.enabled || !AU.ctx) return;
  const c = AU.ctx, t = c.currentTime + (o.at || 0), d = o.d || .2;
  const len = max(1, floor(c.sampleRate * d));
  const b = c.createBuffer(1, len, c.sampleRate);
  const dat = b.getChannelData(0);
  for (let i = 0; i < len; i++) dat[i] = (Math.random() * 2 - 1);
  const src = c.createBufferSource(); src.buffer = b;
  const f = c.createBiquadFilter();
  f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
  f.frequency.setValueAtTime(o.f || 900, t);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(max(30, o.f2), t + d);
  const g = c.createGain();
  const v = o.v === undefined ? .3 : o.v;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + (o.a || .004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(f); f.connect(g); g.connect(o.bus || AU.sfx);
  if (o.rev && AU.conv) { const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(AU.conv); }
  src.start(t); src.stop(t + d + .02);
}

const SFX = {
  arcane: function () { tone({ type: 'triangle', f: 760, f2: 1500, d: .16, v: .18, rev: .2 }); tone({ type: 'sine', f: 1500, f2: 2600, d: .1, v: .09, at: .01 }); },
  fire: function () { noise({ f: 700, f2: 180, d: .34, v: .3, q: .7, type: 'lowpass', rev: .25 }); tone({ type: 'sawtooth', f: 180, f2: 60, d: .3, v: .16, lp: 900 }); },
  frost: function () { tone({ type: 'sine', f: 1800, f2: 480, d: .4, v: .14, rev: .4 }); noise({ f: 4200, f2: 1400, d: .32, v: .13, q: 2 }); },
  bolt: function () { noise({ f: 2600, f2: 900, d: .18, v: .22, q: 3 }); tone({ type: 'square', f: 1400, f2: 300, d: .14, v: .1 }); },
  shield: function () { tone({ type: 'sine', f: 300, f2: 900, d: .45, v: .16, rev: .5 }); tone({ type: 'triangle', f: 600, f2: 1200, d: .4, v: .08, at: .04 }); },
  dash: function () { noise({ f: 1400, f2: 300, d: .2, v: .18, q: 1.2 }); tone({ type: 'sine', f: 900, f2: 220, d: .16, v: .1 }); },
  meteor: function () { noise({ f: 400, f2: 60, d: .9, v: .3, type: 'lowpass', q: .6, rev: .5 }); tone({ type: 'sawtooth', f: 120, f2: 34, d: .8, v: .2, lp: 500 }); },
  boom: function () { noise({ f: 900, f2: 90, d: .5, v: .36, type: 'lowpass', q: .8, rev: .4 }); tone({ type: 'sine', f: 90, f2: 30, d: .45, v: .26 }); },
  hit: function () { noise({ f: 1500, f2: 400, d: .1, v: .2, q: 1.4 }); tone({ type: 'square', f: 260, f2: 120, d: .08, v: .12 }); },
  crit: function () { noise({ f: 2400, f2: 600, d: .16, v: .26, q: 1.6 }); tone({ type: 'square', f: 520, f2: 180, d: .13, v: .16 }); },
  hurt: function () { tone({ type: 'sawtooth', f: 300, f2: 90, d: .3, v: .24, lp: 1200 }); noise({ f: 700, f2: 200, d: .2, v: .16, type: 'lowpass' }); },
  die: function () { tone({ type: 'sawtooth', f: 260, f2: 40, d: 1.1, v: .22, lp: 800, rev: .5 }); noise({ f: 500, f2: 60, d: .9, v: .18, type: 'lowpass' }); },
  ehurt: function () { noise({ f: 1100, f2: 300, d: .12, v: .14, q: 1 }); },

  if (!AU.ctx || !AU.musicOn || !AU.enabled) { if (AU.ctx) AU.nextT = max(AU.nextT, AU.ctx.currentTime + .1); return; }
  const now = AU.ctx.currentTime;
  while (AU.nextT < now + .5) {

    musicStep(AU.step, AU.nextT - now, m);

function musicStep(s, at, m) {
  const bar = floor(s / 8) % m.prog.length;
  const deg = m.prog[bar];

  const nn = function (d) { const o = floor(d / sc.length); return root + sc[((d % sc.length) + sc.length) % sc.length] + o * 12; };
  const b = s % 8;
  if (b === 0) {

    tone({ type: 'triangle', f: mtof(nn(deg + 2)), d: 2.2, v: m.pad, a: .5, at: at, rev: .6, bus: AU.mus });
    tone({ type: 'triangle', f: mtof(nn(deg + 4)), d: 2.2, v: m.pad * .8, a: .6, at: at, rev: .6, bus: AU.mus });

let g = null;                                 // aktuelles Zeichenziel

  p.lineTo(x + w, y + h - r); p.arcTo(x + w, y + h, x + w - r, y + h, r);
  p.lineTo(x + r, y + h); p.arcTo(x, y + h, x, y + h - r, r);

const GBUCK = {};
OVORDER.forEach(function (k) { GBUCK[k] = []; });
function drawGround(ctx, cx, cy, t) {
  G(ctx);

    for (let tx = t0x; tx <= t1x + 1; tx++) {

      if (c !== runC) {
        if (runC) { ctx.fillStyle = runC; ctx.fillRect(runX * TS - cx - .5, ty * TS - cy - .5, (tx - runX) * TS + 1, TS + 1); }

  }
  // 2. Auflagen einsammeln
  for (let k = 0; k < OVORDER.length; k++) GBUCK[OVORDER[k]].length = 0;
  for (let ty = t0y; ty <= t1y; ty++) {
    for (let tx = t0x; tx <= t1x; tx++) {
      const i = ty * WW + tx;
      let ov = TOV[W.tile[i]];
      if (!ov) continue;
      if (ov === 'road') {
        const bb = W.bio[i];
        if (bb === B.CAVE || bb === B.RUINS) ov = 'roadstone';
        else if (bb === B.MOUNT) ov = 'roadsnow';
        else if (bb === B.ASH) ov = 'roadash';
        else if (bb === B.VOID || bb === B.ARCANE) ov = 'roadvoid';
      }
      const o = OVER[ov];
      if (!o.obst && o.c === BIOBASE[W.bio[i]]) continue;
      // Rand oder Innenflaeche?
      let inner = 1;
      for (let dy = -1; dy <= 1 && inner; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = tx + dx, ny = ty + dy;
        const ni = (nx < 0 || ny < 0 || nx >= WW || ny >= WH) ? -1 : ny * WW + nx;
        let nov = ni < 0 ? null : TOV[W.tile[ni]];
        if (nov === 'road') {
          const nb = W.bio[ni];
          if (nb === B.CAVE || nb === B.RUINS) nov = 'roadstone';
          else if (nb === B.MOUNT) nov = 'roadsnow';
          else if (nb === B.ASH) nov = 'roadash';
          else if (nb === B.VOID || nb === B.ARCANE) nov = 'roadvoid';

/* Sparsame geometrische Akzente - keine Textur, nur klare Formen */
function groundDetail(ctx, key, o, list, cx, cy, t, path, inner) {
  if (o.tuft) {
    const p = new Path2D();
    for (let n = 0; n < list.length; n += 3) {
      const tx = list[n], ty = list[n + 1];
      if (hash2(tx, ty, 5) > .55) continue;
      const x = tx * TS - cx + 4 + hash2(tx, ty, 7) * 8, y = ty * TS - cy + 6 + hash2(tx, ty, 9) * 7;
      const sw = sin(t * 1.6 + tx * .6) * 1.2;
      p.moveTo(x, y + 4); p.quadraticCurveTo(x - 1, y, x - 2.5 + sw, y - 4);
      p.moveTo(x, y + 4); p.quadraticCurveTo(x + 1, y, x + 2.5 + sw, y - 3.4);
      p.moveTo(x, y + 4); p.lineTo(x + sw * .6, y - 5);
    }
    ctx.strokeStyle = o.tuft; ctx.lineWidth = 1; ctx.stroke(p);
  }
  if (o.dots) {
    const cols = ['#ffd766', '#ff8ab0', '#f7fafd', '#9fd0ff'];
    for (let ci = 0; ci < 4; ci++) {
      const p = new Path2D(); let any = 0;
      for (let n = 0; n < list.length; n += 3) {
        const tx = list[n], ty = list[n + 1];
        for (let d = 0; d < 2; d++) {

          if (floor(h * 8) % 4 !== ci || h > .62) continue;
          const x = tx * TS - cx + 3 + hash2(tx + d, ty, 13) * 10, y = ty * TS - cy + 3 + hash2(tx, ty + d, 17) * 10;
          p.moveTo(x + 1.5, y); p.arc(x, y, 1.5, 0, TAU); any = 1;
        }
      }
      if (any) { ctx.fillStyle = cols[ci]; ctx.fill(p); }
    }
  }
  if (o.specks) {
    const p = new Path2D();
    for (let n = 0; n < list.length; n += 3) {
      const tx = list[n], ty = list[n + 1];
      if (hash2(tx, ty, 21) > .4) continue;
      const x = tx * TS - cx + 3 + hash2(tx, ty, 23) * 10, y = ty * TS - cy + 3 + hash2(tx, ty, 29) * 10;
      const r = 1 + hash2(tx, ty, 31) * 1.6;
      p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU);
    }
    ctx.fillStyle = o.specks; ctx.fill(p);
  }
  if (o.planks) {
    const p = new Path2D();
    for (let n = 0; n < list.length; n += 3) {
      const x = list[n] * TS - cx, y = list[n + 1] * TS - cy;
      p.moveTo(x, y + 5); p.lineTo(x + TS, y + 5);
      p.moveTo(x, y + 11); p.lineTo(x + TS, y + 11);
    }
    ctx.strokeStyle = o.planks; ctx.lineWidth = .8; ctx.stroke(p);
  }
  if (o.runes) {
    const p = new Path2D();
    for (let n = 0; n < list.length; n += 3) {
      const tx = list[n], ty = list[n + 1];
      const h = hash2(tx, ty, 37);
      if (h > .30) continue;
      const x = tx * TS - cx + 8, y = ty * TS - cy + 8;
      if (h < .1) { p.moveTo(x + 5, y); p.arc(x, y, 5, 0, TAU); }
      else if (h < .2) { p.moveTo(x - 5, y); p.lineTo(x + 5, y); p.moveTo(x, y - 5); p.lineTo(x, y + 5); }
      else { p.moveTo(x - 4, y + 4); p.lineTo(x, y - 5); p.lineTo(x + 4, y + 4); }
    }
    ctx.strokeStyle = o.runes; ctx.lineWidth = 1; ctx.globalAlpha = .6; ctx.stroke(p); ctx.globalAlpha = 1;
  }
  if (o.wave) {
    const p = new Path2D();
    for (let n = 0; n < list.length; n += 3) {
      const tx = list[n], ty = list[n + 1];
      if (hash2(tx, ty, 41) > .34) continue;
      const ph = hash2(tx, ty, 43) * TAU;
      const x = tx * TS - cx + 8 + sin(t * 1.2 + ph) * 2.5, y = ty * TS - cy + 8;
      p.moveTo(x - 5, y); p.quadraticCurveTo(x - 2.5, y - 2, x, y); p.quadraticCurveTo(x + 2.5, y + 2, x + 5, y);

    for (let n = 0; n < list.length; n += 3) {

      const x = tx * TS - cx + 8, y = ty * TS - cy + 8;
      const r = 7 + sin(t * 2 + tx + ty) * 1.6;
      ctx.fillStyle = rgba(P.lava3, .5);
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

const PROPS = {}, PROPDEFS = [];

    cv: null, w: w, h: h, vars: opt.vars || 1, frames: opt.frames || 1, cw: 0,
    col: opt.col || null, light: opt.light || null, sway: opt.sway || 0,

}
/* Alle Objekte in der aktuellen Aufloesung rastern */
function buildProps() {
  for (let i = 0; i < PROPDEFS.length; i++) {

    const vars = P0.vars, frames = P0.frames;

    const cv = mkCanvas(cw * vars * frames, ch);
    cv.x.imageSmoothingEnabled = true;
    for (let v = 0; v < vars; v++) for (let f = 0; f < frames; f++) {
      const cell = v * frames + f;

      cv.x.setTransform(RS, 0, 0, RS, cell * cw + 1, 1);
      G(cv.x);

      d.fn(v, f, d.w, d.h);
      cv.x.restore();
      cv.x.setTransform(1, 0, 0, 1, 0, 0);
    }
    P0.cv = cv; P0.cw = cw; P0.ch = ch;
  }
}

  const oa = ctx.globalAlpha;

  ctx.drawImage(p.cv.c, sx, 1, p.w * RS, p.h * RS, x - p.w / 2, y - p.h, p.w, p.h);
  ctx.globalAlpha = oa;
}

function rollItem(level, rarBoost) {

  ARMORS.forEach(function (a) { if (a.lv <= level + 3) pool.push(a); });
  if (!pool.length) pool.push(STAVES[0]);
  const weighted = pool.filter(function (p) { return p.lv >= level - 8; });
  const base = pick(weighted.length ? weighted : pool);
  let r = 0, roll = rnd() + (rarBoost || 0);
  if (roll > .985) r = 4; else if (roll > .93) r = 3; else if (roll > .78) r = 2; else if (roll > .48) r = 1;
  r = max(r, base.rar || 0);

  const nAff = [0, 1, 2, 3, 4][r];
  const used = {};
  for (let i = 0; i < nAff; i++) {
    const usePre = i % 2 === 0;

    if (used[aff.n]) continue; used[aff.n] = 1;
    if (usePre) it.name = aff.n + ' ' + it.name; else it.name = it.name + ' ' + aff.n;

  const sc = 1 + level * .055;
  ['dmg', 'hp', 'mp', 'arm'].forEach(function (k) { if (it.stats[k]) it.stats[k] = max(1, round(it.stats[k] * sc)); });
  it.value = 12 + it.lv * 8 + r * 40;
  return it;
}

function idx(x, y) { return y * WW + x; }
function tileAt(x, y) { return (x < 0 || y < 0 || x >= WW || y >= WH) ? T.VOID : W.tile[y * WW + x]; }
function bioAt(x, y) { return (x < 0 || y < 0 || x >= WW || y >= WH) ? B.SEA : W.bio[y * WW + x]; }

/* Meer- und Flussverlauf */
function seaEdge(y) { return 26 + fbm(y * .02, 3.1, 3, 500) * 22; }
function southEdge(x) { return WH - 24 - fbm(x * .02, 9.7, 3, 620) * 20; }
const RIVER = [];
function buildRiver() {
  let x = 392, y = 132;
  for (let i = 0; i < 300; i++) {
    const t = i / 300;
    const tx = lerp(392, 30, smooth(t)), ty = lerp(132, 452, t);
    x = lerp(x, tx, .3) + (fbm(i * .035, 4.4, 3, 700) - .5) * 9;
    y = lerp(y, ty, .3) + (fbm(i * .035, 8.8, 3, 710) - .5) * 5;
    RIVER.push([x, y, 2.2 + t * 3.4]);
  }
}
function riverDist(x, y) {
  let best = 1e9;
  for (let i = 0; i < RIVER.length; i += 1) {
    const d = dist2(x, y, RIVER[i][0], RIVER[i][1]) - RIVER[i][2] * RIVER[i][2];
    if (d < best) best = d;
  }
  return best;
}

function zoneAt(x, y) {
  let best = 1e9, bi = B.MEADOW;
  const nx = (fbm(x * .015, y * .015, 3, 31) - .5) * 44;
  const ny = (fbm(x * .015, y * .015, 3, 57) - .5) * 44;
  for (let i = 0; i < ZONES.length; i++) {
    const z = ZONES[i];
    const d = dist(x + nx, y + ny, z.x, z.y) / z.r;
    if (d < best) { best = d; bi = z.b; }
  }
  return bi;
}
function genBiomes(prog) {
  buildRiver();
  // grobes Fluss-Raster für schnelle Abfragen
  const RG = 4, rw = ceil(WW / RG), rh = ceil(WH / RG);
  const rgrid = new Float32Array(rw * rh).fill(1e9);
  for (let i = 0; i < RIVER.length; i++) {
    const r = RIVER[i], rad = r[2] + 3;
    const x0 = max(0, floor((r[0] - rad) / RG)), x1 = min(rw - 1, ceil((r[0] + rad) / RG));
    const y0 = max(0, floor((r[1] - rad) / RG)), y1 = min(rh - 1, ceil((r[1] + rad) / RG));
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      const d = dist(gx * RG + RG / 2, gy * RG + RG / 2, r[0], r[1]) - r[2];
      const k = gy * rw + gx;
      if (d < rgrid[k]) rgrid[k] = d;
    }
  }
  for (let y = 0; y < WH; y++) {
    for (let x = 0; x < WW; x++) {
      let b = zoneAt(x, y);
      const se = seaEdge(y), so = southEdge(x);
      let water = 0, shallow = 0;
      if (x < se) { water = 1; if (x > se - 4) shallow = 1; }
      if (y > so) { water = 1; if (y < so + 4) shallow = 1; }
      if (dist(x, y, 214, 468) < 34 + fbm(x * .06, y * .06, 2, 88) * 12) { water = 1; if (dist(x, y, 214, 468) > 30) shallow = 1; }
      const rd = rgrid[floor(y / RG) * rw + floor(x / RG)];
      if (rd < 0) { water = 1; if (rd > -1.6) shallow = 1; }
      if (b === B.MOUNT && rd < 0 && y < 160) { water = 0; shallow = 0; }
      const i = idx(x, y);
      if (water) {
        W.bio[i] = shallow ? B.COAST : B.SEA;
        W.tile[i] = shallow ? T.SHALLOW : T.WATER;
        continue;
      }
      const nearSea = (x < se + 7) || (y > so - 7);
      if (nearSea && b !== B.MOUNT) b = B.COAST;
      W.bio[i] = b;
      W.tile[i] = tileFor(b, x, y);
    }
    if (prog && (y % 64) === 0) prog(y / WH);
  }
  genCaves();
  genMountains();
  genVoid();
  smoothTiles();
}
/* Einzelne Streukacheln entfernen - erzeugt ruhige, zusammenhaengende Flaechen */
function smoothTiles() {
  const src = W.tile.slice();
  const cnt = new Map();
  for (let y = 1; y < WH - 1; y++) {
    for (let x = 1; x < WW - 1; x++) {
      const i = y * WW + x, me = src[i];
      if (TSOLID[me] || TLIQUID[me] || me === T.ROAD || me === T.BRIDGE) continue;
      cnt.clear();
      let same = 0, best = me, bestN = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const n = src[i + dy * WW + dx];
        if (n === me) { same++; continue; }
        if (TSOLID[n] || TLIQUID[n] || n === T.ROAD || n === T.BRIDGE) continue;
        const c = (cnt.get(n) || 0) + 1;
        cnt.set(n, c);
        if (c > bestN) { bestN = c; best = n; }
      }
      if (same <= 1 && bestN >= 3) W.tile[i] = best;
    }
  }
}
function tileFor(b, x, y) {
  const n = fbm(x * .07, y * .07, 3, 11);
  const n2 = fbm(x * .19, y * .19, 2, 23);
  const n3 = hash2(x, y, 5);
  switch (b) {
    case B.MEADOW:
      if (n < .34) return T.GRASS;
      if (n2 > .76) return T.FLOWER;
      if (n2 < .22) return T.TALLGRASS;
      if (n > .72 && n3 > .7) return T.DIRT;
      return T.MEADOW;
    case B.FOREST:
      if (n2 > .78) return T.TALLGRASS;
      if (n < .36) return T.GRASSD;
      if (n > .74) return T.FOREST;
      return T.GRASS;
    case B.DEEPWOOD:
      if (n2 > .82) return T.TALLGRASS;
      if (n < .42) return T.FOREST;
      if (n > .8 && n3 > .6) return T.MUD;
      return T.GRASSD;
    case B.SWAMP:
      if (n < .3) return T.SWAMPW;
      if (n2 > .8) return T.MUD;
      return T.SWAMP;
    case B.RUINS:
      if (n > .60) return T.MARBLE;
      if (n < .36) return T.GRAVEL;
      return T.STONE;
    case B.CAVE: return T.CAVE;
    case B.MOUNT:
      if (n < .36) return T.SNOW;
      if (n2 > .82) return T.ICE;
      if (n > .74) return T.GRAVEL;
      return T.SNOW;
    case B.ASH:
      if (n2 > .84) return T.EMBER;
      if (n < .3) return T.SAND;
      if (n > .78) return T.GRAVEL;
      return T.ASH;
    case B.ARCANE:
      if (n2 > .8) return T.RUNEFLOOR;
      if (n < .34) return T.ARCANE;
      if (n > .76) return T.STONE;
      return T.ARCANE;
    case B.VOID:
      if (n2 > .8) return T.RUNEFLOOR;
      if (n < .36) return T.VOIDG;
      return T.VOIDG;
    case B.COAST:
      if (n2 > .82) return T.GRAVEL;
      return T.SAND;
    case B.TOWN: return T.GRASS;
    default: return T.GRASS;
  }
}
/* Hoehlen: Waende ausstanzen und Tunnel graben */
function genCaves() {
  const cz = ZONES.filter(function (z) { return z.b === B.CAVE; })[0];
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const i = idx(x, y);
    if (W.bio[i] !== B.CAVE) continue;
    const d = dist(x, y, cz.x, cz.y) / cz.r;
    const n = fbm(x * .1, y * .1, 4, 77);
    const cave = n > .47 - (1 - d) * .1 && d < 1.05;
    W.tile[i] = cave ? T.CAVE : T.WALL;
    if (hash2(x, y, 9) > .985 && cave) W.tile[i] = T.CRYST;
  }
  const rooms = [[cz.x, cz.y + 62], [cz.x - 34, cz.y + 20], [cz.x + 10, cz.y - 4], [cz.x + 40, cz.y - 34], [cz.x - 20, cz.y - 46], [cz.x, cz.y - 64]];
  for (let i = 0; i < rooms.length; i++) {
    carveRoom(rooms[i][0], rooms[i][1], 5 + (i % 3) * 3);
    if (i > 0) carveTunnel(rooms[i - 1][0], rooms[i - 1][1], rooms[i][0], rooms[i][1]);
  }
  carveTunnel(rooms[2][0], rooms[2][1], rooms[4][0], rooms[4][1]);
  W.caveRooms = rooms;
}
function carveRoom(cx, cy, r) {
  for (let y = -r - 2; y <= r + 2; y++) for (let x = -r - 2; x <= r + 2; x++) {
    const tx = floor(cx + x), ty = floor(cy + y);
    if (tx < 1 || ty < 1 || tx >= WW - 1 || ty >= WH - 1) continue;
    const rr2 = r + fbm(tx * .2, ty * .2, 2, 3) * 3 - 1.5;
    if (dist(x, y, 0, 0) < rr2) {
      const i = idx(tx, ty);
      if (W.bio[i] === B.CAVE || W.tile[i] === T.WALL) W.tile[i] = T.CAVE;
    }
  }
}
function carveTunnel(x0, y0, x1, y1) {
  let x = x0, y = y0, guard = 0;
  while ((abs(x - x1) > 1 || abs(y - y1) > 1) && guard++ < 900) {
    const w = 2.1 + fbm(x * .1, y * .1, 2, 17) * 1.6;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      if (dx * dx + dy * dy > w * w) continue;
      const tx = floor(x + dx), ty = floor(y + dy);
      if (tx < 1 || ty < 1 || tx >= WW - 1 || ty >= WH - 1) continue;
      const i = idx(tx, ty);
      if (W.tile[i] === T.WALL || W.bio[i] === B.CAVE) W.tile[i] = T.CAVE;
    }
    const a = angTo(x, y, x1, y1) + (fbm(guard * .08, 2, 2, 41) - .5) * 1.5;
    x += cos(a) * 1.2; y += sin(a) * 1.2;
  }
}
/* Gebirgsketten */
function genMountains() {
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const i = idx(x, y);
    if (W.bio[i] !== B.MOUNT) continue;
    const r = ridge(x * .045, y * .045, 4, 91);
    if (r > .68) W.tile[i] = T.SNOWROCK;
    else if (r > .62 && hash2(x, y, 4) > .5) W.tile[i] = T.GRAVEL;
  }
}
/* Die Leere */
function genVoid() {
  const vz = ZONES.filter(function (z) { return z.b === B.VOID; })[0];
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const i = idx(x, y);
    if (W.bio[i] !== B.VOID) continue;
    const r = ridge(x * .07, y * .07, 3, 13);
    const d = dist(x, y, vz.x, vz.y);
    if (d > 20 && r > .72) W.tile[i] = T.VOIDWALL;
    if (d < 26) W.tile[i] = (d < 24 && hash2(x, y, 2) > .8) ? T.RUNEFLOOR : T.VOIDG;
  }
}
/* Wege */
function stampPath(pts, wid, tile) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const steps = ceil(dist(a[0], a[1], b[0], b[1]) * 1.5);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const x = lerp(a[0], b[0], t) + (fbm(s * .05 + i, 1.7, 2, 33) - .5) * 1.8;
      const y = lerp(a[1], b[1], t) + (fbm(s * .05 + i, 7.3, 2, 44) - .5) * 1.8;
      const w = wid + fbm(s * .1, i, 2, 55) * .7;
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
        if (dx * dx + dy * dy > w * w) continue;
        const tx = floor(x + dx), ty = floor(y + dy);
        if (tx < 0 || ty < 0 || tx >= WW || ty >= WH) continue;
        const k = idx(tx, ty), cur = W.tile[k];
        if (cur === T.WATER || cur === T.SHALLOW || cur === T.SWAMPW) { W.tile[k] = T.BRIDGE; continue; }
        if (cur === T.LAVA) continue;
        if (TSOLID[cur]) { W.tile[k] = tile; continue; }
        W.tile[k] = tile;
      }
    }
  }
}

function updatePlayer(dt, t) {

  if (PL.shieldT > 0) { PL.shieldT -= dt; if (PL.shieldT <= 0) PL.shield = 0; }

  if (PL.regenT <= 0) {
    PL.regenT = .5;

    if (PL.hp < PL.maxHp && !inCombat()) healPlayer(PL.maxHp * .004);
  }
  if (hasBuff('heal') && PL.healAmt) healPlayer(PL.healAmt * dt);

    if (key('KeyD') || key('ArrowRight')) ix += 1;

function updateNPCs(dt, t) {
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    n.t += dt;
    if (DLG.on && DLG.npc === n) { n.moving = 0; n.dir = (PL.x < n.x) ? 3 : 2; continue; }
    n.wt -= dt;
    if (n.wt <= 0) {
      n.wt = rr(2, 6);
      if (rnd() < .5) { n.tx = n.hx + rr(-22, 22); n.ty = n.hy + rr(-22, 22); }
      else { n.tx = null; }
    }
    n.moving = 0;
    if (n.tx !== null && n.tx !== undefined) {
      const d = dist(n.x, n.y, n.tx, n.ty);
      if (d > 3) {
        const a = angTo(n.x, n.y, n.tx, n.ty);
        const nx = n.x + cos(a) * 16 * dt, ny = n.y + sin(a) * 16 * dt;
        if (!blockedAt(nx, ny, 5)) { n.x = nx; n.y = ny; n.moving = 1; n.dir = abs(cos(a)) > abs(sin(a)) ? (cos(a) < 0 ? 3 : 2) : (sin(a) < 0 ? 1 : 0); }
        else n.tx = null;
      } else n.tx = null;
    }
    n.mark = npcMark(n);
  }
}

function buildDialog(npc) {

  // 1. abgeschlossene Quest abgeben
  for (let i = 0; i < npc.q.length; i++) {
    const id = npc.q[i];
    if (qState(id) === 'done') {
      const d = QUESTS[id];
      DLG.pages = [['Du hast es geschafft.', d.n + ' - erledigt.'], rewardText(d)];
      DLG.onEnd = function () { turnInQuest(id); afterTurnIn(npc, id); };
      return;
    }
  }
  // 2. Lieferziel einer Quest
  for (const qid in PL.q) {
    if (PL.q[qid].st !== 'active') continue;
    const d = QUESTS[qid];
    d.obj.forEach(function (o, oi) {
      if (o.t === 'talk' && o.k === npc.id && PL.q[qid].prog[oi] < o.n) {
        DLG.pages = [['Ah - du bringst mir etwas.', 'Gib her. Und hab Dank.']];
        DLG.onEnd = function () { questEvent('talk', npc.id); buildDialog(npc); DLG.on = 1; DLG.pi = 0; DLG.tw = 0; };
      }
    });
    if (DLG.pages && DLG.onEnd) return;
  }
  // 3. neue Quest anbieten
  for (let i = 0; i < npc.q.length; i++) {
    const id = npc.q[i];
    if (qAvailable(id)) {
      const d = QUESTS[id];
      DLG.pages = [[d.n], wrapArr(d.d)];
      DLG.choices = [
        { t: 'Ich nehme es an.', a: function () { acceptQuest(id); closeDialog(); } },
        { t: 'Später vielleicht.', a: function () { closeDialog(); } }

      DLG.onEnd = null;
      return;
    }

  // 4. laufende Quest
  for (let i = 0; i < npc.q.length; i++) {
    const id = npc.q[i];
    if (qState(id) === 'active') {
      const d = QUESTS[id], q = PL.q[id];

function nearestInteract() {

  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    const d = dist2(PL.x, PL.y, n.x, n.y);
    if (d < bd) { bd = d; best = { k: 'npc', o: n, label: 'Reden', n: n.n }; }
  }
  for (let i = 0; i < W.chests.length; i++) {
    const c = W.chests[i];
    if (c.open) continue;
    const d = dist2(PL.x, PL.y, c.x, c.y + 6);
    if (d < bd) { bd = d; best = { k: 'chest', o: c, label: 'Öffnen', n: 'Truhe' }; }
  }
  for (let i = 0; i < W.special.length; i++) {
    const s = W.special[i];
    if (s.done && s.k !== 'wp' && s.k !== 'shrine' && s.k !== 'gate') continue;
    const d = dist2(PL.x, PL.y, s.x, s.y);
    const rad = s.k === 'circle' || s.k === 'gate' ? 60 * 60 : 34 * 34;

function updateBossSpots() {

      if (!exists) {
        const f = spawnFoe(b.k, p.x, p.y - 20, b.lv, { drop: b.drop, spawnFx: 1 });

/* ---- Dynamisches Spawnen ------------------------------------------------- */
let SPAWNT = 0;
function updateSpawns(dt) {
  SPAWNT -= dt;
  const cap = GAME.inCitadel ? 6 : 20;
  for (let i = foes.length - 1; i >= 0; i--) {
    const f = foes[i];
    if (f.dead || f.boss || f.quest) continue;
    if (dist2(f.x, f.y, PL.x, PL.y) > 620 * 620) foes.splice(i, 1);
  }
  if (SPAWNT > 0 || PL.dead) return;
  SPAWNT = .45;
  if (foes.length >= cap) return;
  const b = bioAtPx(PL.x, PL.y);
  const bd = BIOMES[b];
  if (!bd || bd.safe || !bd.foes.length) return;
  for (let tries = 0; tries < 14; tries++) {
    const a = rnd() * TAU, r = rr(210, 330);
    const x = PL.x + cos(a) * r, y = PL.y + sin(a) * r;
    if (x < 20 || y < 20 || x > WPX - 20 || y > HPX - 20) continue;
    const tb = bioAtPx(x, y);
    const tbd = BIOMES[tb];
    if (!tbd || tbd.safe || !tbd.foes.length) continue;
    if (blockedAt(x, y, 9)) continue;
    let safe = 0;
    for (let i = 0; i < W.safeZones.length; i++) {
      const z = W.safeZones[i];
      if (dist2(x, y, z[0], z[1]) < z[2] * z[2]) { safe = 1; break; }
    }
    if (safe) continue;
    const k = pick(tbd.foes);
    const lv = max(1, round(tbd.lvl + rr(-1, 2)));
    const elite = rnd() < .055 + min(.06, PL.lvl * .002);
    const f = spawnFoe(k, x, y, lv, { elite: elite });
    if (f && elite) f.n = 'Elite-' + f.n;
    break;
  }
}

const CAM = { x: 0, y: 0, tx: 0, ty: 0, sx: 0, sy: 0 };
let LIGHT = null;
const RENDER = [];
let VIGN = null, VIGNHP = null, VIGNRS = 0;
function ensureVignette() {

function ensureLight() {

function updateCamera(dt) {
  let lx = 0, ly = 0;
  if (MOUSE.inside) { lx = clamp((MOUSE.x - VW / 2) * .18, -34, 34); ly = clamp((MOUSE.y - VH / 2) * .18, -22, 22); }
  CAM.tx = PL.x - VW / 2 + lx;
  CAM.ty = PL.y - VH / 2 - 6 + ly;
  CAM.tx = clamp(CAM.tx, 0, WPX - VW);
  CAM.ty = clamp(CAM.ty, 0, HPX - VH);
  const k = 1 - pow(.0015, dt);
  CAM.x += (CAM.tx - CAM.x) * k;
  CAM.y += (CAM.ty - CAM.y) * k;
  if (SHAKET > 0) {
    SHAKET -= dt;
    const m = SHAKE * clamp(SHAKET * 3, 0, 1);
    CAM.sx = rr(-m, m); CAM.sy = rr(-m, m);
    if (SHAKET <= 0) { SHAKE = 0; CAM.sx = CAM.sy = 0; }
  } else { CAM.sx = CAM.sy = 0; }
}
function camX() { return CAM.x + CAM.sx; }
function camY() { return CAM.y + CAM.sy; }
function dayFactor() { return (GAME.time % GAME.dayLen) / GAME.dayLen; }
function nightAmount() {
  const t = dayFactor();
  if (t < .5) return 0;
  if (t < .58) return smooth((t - .5) / .08) * .58;
  if (t < .92) return .58;
  return .58 * (1 - smooth((t - .92) / .08));
}
function ambientTint() {
  const t = dayFactor();
  if (t < .05) return { c: '#ffc890', a: .14 };
  if (t < .12) return { c: '#ffd8a0', a: .09 };
  if (t < .42) return { c: '#ffffff', a: 0 };
  if (t < .52) return { c: '#ff9a60', a: .16 };
  return { c: '#3050a0', a: .10 };
}
function drawWorld(ctx, t) {
  const cx = camX(), cy = camY();
  drawGround(ctx, cx, cy, t);
  drawClouds(ctx, cx, cy, t);
  // Sammeln und nach y sortieren
  RENDER.length = 0;
  const pad = 80;
  propsNear(cx + VW / 2, cy + VH / 2, max(VW, VH) / 2 + 110, _pn);
  for (let i = 0; i < _pn.length; i++) {
    const p = _pn[i];
    if (p.gone) continue;
    if (p.x < cx - pad || p.x > cx + VW + pad || p.y < cy - pad - 70 || p.y > cy + VH + pad) continue;
    RENDER.push({ y: p.y, k: 0, o: p });
  }
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i];
    if (d.x < cx - 20 || d.x > cx + VW + 20 || d.y < cy - 20 || d.y > cy + VH + 20) continue;
    RENDER.push({ y: d.y, k: 1, o: d });
  }
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.x < cx - 40 || n.x > cx + VW + 40 || n.y < cy - 60 || n.y > cy + VH + 40) continue;
    RENDER.push({ y: n.y, k: 2, o: n });
  }
  for (let i = 0; i < foes.length; i++) {
    const f = foes[i];
    if (f.x < cx - 90 || f.x > cx + VW + 90 || f.y < cy - 100 || f.y > cy + VH + 70) continue;
    RENDER.push({ y: f.y, k: 3, o: f });
  }
  if (!PL.dead || PL.deadT < 1.2) RENDER.push({ y: PL.y, k: 4, o: PL });
  RENDER.sort(function (a, b) { return a.y - b.y; });
  drawAreas(ctx, cx, cy, t);
  for (let i = 0; i < RENDER.length; i++) {
    const r = RENDER[i];
    if (r.k === 0) drawPropObj(ctx, r.o, cx, cy, t);
    else if (r.k === 1) drawDrop(ctx, r.o, cx, cy, t);
    else if (r.k === 2) drawNPC(ctx, r.o, cx, cy, t);
    else if (r.k === 3) drawFoe(ctx, r.o, cx, cy, t);
    else drawPlayer(ctx, cx, cy, t);
  }
  drawProjectiles(ctx, cx, cy, t);
  drawParticles(ctx, cx, cy, t);
  drawFx(ctx, cx, cy, t);
  drawLighting(ctx, cx, cy, t);
  drawWeather(ctx, cx, cy, t);
  drawDamageNums(ctx, cx, cy);
}
/* Weiche Wolkenschatten - grosse, ruhige Flaechen */
function drawClouds(ctx, cx, cy, t) {
  const b = bioAtPx(PL.x, PL.y);
  if (b === B.CAVE || nightAmount() > .45) return;
  G(ctx);
  const a0 = .075 * (1 - nightAmount() * 1.7);
  if (a0 <= .01) return;
  for (let i = 0; i < 4; i++) {
    const sp = 5 + (i % 3) * 2;
    const wx = ((i * 337 + t * sp - cx * .5) % 900 + 900) % 900 - 200;
    const wy = ((i * 211 - cy * .5) % 520 + 520) % 520 - 120;
    const r = 90 + (i % 3) * 34;
    ctx.save();
    ctx.translate(wx, wy); ctx.scale(1, .5);
    glow(0, 0, r, '#18214a', a0);
    ctx.restore();

function itemLines(it, cmp) {
  const out = [];

  out.push({ t: slotTxt + (it.lv > 1 ? '   Stufe ' + it.lv : ''), c: P.uidim });
  for (const k in it.stats) {
    const v = it.stats[k];
    let line = (v > 0 ? '+' : '') + v + (STATSUF[k] || '') + ' ' + (STATN[k] || k);
    let col = P.uitx;
    if (cmp) {
      const ov = (cmp.stats && cmp.stats[k]) || 0;
      const d = v - ov;
      if (d !== 0) { line += '  (' + (d > 0 ? '+' : '') + d + ')'; col = d > 0 ? P.grass4 : P.hp; }
    }
    out.push({ t: line, c: col });

  if (cmp) {

      if (it.stats[k] === undefined) out.push({ t: '-' + cmp.stats[k] + (STATSUF[k] || '') + ' ' + (STATN[k] || k), c: P.hp });
    }
  }

function drawDialog(ctx, t, dt) {

  panel(ctx, x, y, w, h, { bg: 'rgba(24,32,54,1)' });

  ctx.save();

  R(x + 4, y + 4, 44, h - 8, 'rgba(20,26,44,.9)');

    t: t, dir: 0, walking: 0, frame: 0, robe: L.robe, robe2: L.robe2, trim: L.trim, skin: L.skin,

  R(x + 54, y + 15, w - 60, 1, P.ui3);
  const page = DLG.pages[DLG.pi] || [];
  const full = page.join('\n');
  DLG.tw = min(full.length, DLG.tw + dt * 90);
  const shown = full.slice(0, floor(DLG.tw));
  const lines = shown.split('\n');
  let ly = y + 20;
  lines.forEach(function (l) {
    wrap(l, w - 66).forEach(function (ll) { text(ctx, ll, x + 54, ly, P.uitx); ly += 9; });
  });
  const complete = DLG.tw >= full.length;
  if (complete && DLG.choices) {
    const chs = DLG.choices;                  // Auswahl festhalten: c.a() kann den Dialog beenden
    for (let i = 0; i < chs.length; i++) {
      const c = chs[i];
      const cy2 = y + h - 8 - (chs.length - i) * 10;
      const over = hit(x + 54, cy2 - 1, w - 60, 10);
      const on = UI.dlgSel === i || over;
      if (over) UI.dlgSel = i;
      text(ctx, (on ? '> ' : '  ') + c.t, x + 54, cy2, on ? P.gold2 : P.uitx);
      if (over && MOUSE.click) { MOUSE.click = 0; sfx('uiSel'); c.a(); break; }
    }
  } else if (complete) {
    const blink2 = sin(t * 6) > 0;
    text(ctx, (TC.on ? 'Tippen: ' : '[E] ') + (DLG.pi < DLG.pages.length - 1 ? 'weiter' : 'beenden'), x + w - 8, y + h - 12, blink2 ? P.gold2 : P.uidim, { right: 1 });
  }
  /* Weiterblaettern per Zeigegeraet: mit dem Finger zaehlt das ganze Spielfeld,
     mit der Maus das Dialogfenster. Ohne das kaeme man ohne Tastatur nicht
     ans Ende eines Gespraechs - und damit nicht an die Questbelohnung. */
  if (MOUSE.click && (TC.on ? hit(0, 0, VW, VH) : hit(x, y, w, h))) {
    MOUSE.click = 0;

  }
}

const KEYS = {};

let SCALE = 1;                     // CSS-Pixel je logischer Einheit
/* Bildaufteilung: Spielfeld liegt immer bei (0,0)-(VW,VH); rundherum Raender

const VIEW = { gx: 0, gy: 0, ml: 0, mr: 0, mt: 0, mb: 0, cw: VW, ch: VH, portrait: 0, bar: 0, sb: 0 };
function safeInsets() {
  try {
    const cs = getComputedStyle(SAFEEL);
    return {
      t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
      b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0
    };

}
function resize() {
  const vv = window.visualViewport;
  const vw = max(1, round(vv ? vv.width : window.innerWidth));
  const vh = max(1, round(vv ? vv.height : window.innerHeight));
  const si = safeInsets();
  const availW = max(80, vw - si.l - si.r), availH = max(60, vh - si.t - si.b);
  SCALE = min(availW / VW, availH / VH);
  const gw = VW * SCALE, gh = VH * SCALE;
  const freeV = availH - gh;
  VIEW.portrait = freeV > gh * .35 ? 1 : 0;
  VIEW.gx = si.l + (availW - gw) / 2;
  /* Nur mit Fingersteuerung rueckt das Bild nach oben und macht unten Platz */
  VIEW.gy = (VIEW.portrait && TC.on) ? si.t + min(freeV * .12, 30) : si.t + (availH - gh) / 2;
  VIEW.ml = VIEW.gx / SCALE; VIEW.mt = VIEW.gy / SCALE;
  VIEW.mr = (vw - VIEW.gx - gw) / SCALE; VIEW.mb = (vh - VIEW.gy - gh) / SCALE;
  VIEW.cw = vw / SCALE; VIEW.ch = vh / SCALE;
  VIEW.sb = si.b / SCALE;
  VIEW.bar = (VIEW.portrait && TC.on) ? max(0, VIEW.mb - VIEW.sb) : 0;
  const dpr = min(window.devicePixelRatio || 1, 2);
  RSWANT = clamp(round(SCALE * dpr * 2) / 2, 1, 4);
  applyRS(min(RSWANT, RSCAP));
  layoutTouch();
}
let RSWANT = 2, RSCAP = 4, QUALT = 0;

    setBoot(i / steps.length, steps[i][0]);
    setTimeout(function () {
      try { steps[i][1](); }
      catch (err) {
        const m = document.getElementById('bootmsg');
        if (m) m.textContent = 'Fehler: ' + err.message;
        console.error(err);
        return;
      }
      i++;
      next();
    }, 20);
  }
  next();
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
</html>
