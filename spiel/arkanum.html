/* --------------------------------------------------------------------------
   2. MATHE / HILFSFUNKTIONEN
   -------------------------------------------------------------------------- */
const PI = Math.PI, TAU = PI * 2;
const floor = Math.floor, ceil = Math.ceil, abs = Math.abs, sqrt = Math.sqrt;
const sin = Math.sin, cos = Math.cos, atan2 = Math.atan2, hypot = Math.hypot;
const min = Math.min, max = Math.max, round = Math.round, pow = Math.pow;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function inv(a, b, v) { return b === a ? 0 : clamp((v - a) / (b - a), 0, 1); }
function dist2(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; }
function dist(x1, y1, x2, y2) { return sqrt(dist2(x1, y1, x2, y2)); }
function angTo(x1, y1, x2, y2) { return atan2(y2 - y1, x2 - x1); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function approach(v, t, s) { return v < t ? min(v + s, t) : max(v - s, t); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function fmt(n) { n = floor(n); return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : '' + n; }

/* Deterministischer Zufall (mulberry32) */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RND = mulberry(1337);
function rnd() { return RND(); }
function rr(a, b) { return a + RND() * (b - a); }
function ri(a, b) { return floor(a + RND() * (b - a + 1)); }
function pick(arr) { return arr[floor(RND() * arr.length) % arr.length]; }
function chance(p) { return RND() < p; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = floor(RND() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* Stabiler Hash fuer Weltkoordinaten -> [0,1) */
function hash2(x, y, s) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 1442695041;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
/* Value-Noise mit glatter Interpolation */
function vnoise(x, y, s) {
  const xi = floor(x), yi = floor(y);
  const xf = smooth(x - xi), yf = smooth(y - yi);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s);
  const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, xf), lerp(c, d, xf), yf);
}
/* Fraktales Rauschen */
function fbm(x, y, oct, s, lac, gain) {
  lac = lac || 2; gain = gain || .5;
  let f = 1, amp = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += vnoise(x * f, y * f, s + i * 77) * amp;
    norm += amp; amp *= gain; f *= lac;
  }
  return sum / norm;
}
/* Ridged-Noise fuer Gebirge / Adern */
function ridge(x, y, oct, s) {
  let f = 1, amp = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += (1 - abs(vnoise(x * f, y * f, s + i * 31) * 2 - 1)) * amp;
    norm += amp; amp *= .5; f *= 2;
  }
  return sum / norm;
}
/* Farbwerkzeuge */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(r, g, b) {
  return '#' + ((1 << 24) + (clamp(round(r), 0, 255) << 16) + (clamp(round(g), 0, 255) << 8) + clamp(round(b), 0, 255)).toString(16).slice(1);
}
function mix(c1, c2, t) {
  const a = hex2rgb(c1), b = hex2rgb(c2);
  return rgb2hex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function shade(c, f) { const a = hex2rgb(c); return rgb2hex(a[0] * f, a[1] * f, a[2] * f); }
function rgba(c, a) { const x = hex2rgb(c); return 'rgba(' + x[0] + ',' + x[1] + ',' + x[2] + ',' + a + ')'; }
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  const c = (1 - abs(2 * l - 1)) * s, x = c * (1 - abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return rgb2hex((r + m) * 255, (g + m) * 255, (b + m) * 255);
}

const FONT = { sheet: null, g: {}, h: 7, gap: 1, spaceW: 3, tints: {} };

(function buildFont() {
  const keys = Object.keys(GLYPHS);
  const cw = 6, chh = 9, cols = 24;
  const rows = ceil(keys.length / cols);
  const cv = mkCanvas(cols * cw, rows * chh + 4);
  cv.x.fillStyle = '#fff';
  keys.forEach(function (k, i) {
    const rowsArr = GLYPHS[k].split('|');
    const cx = (i % cols) * cw, cy = floor(i / cols) * chh;
    let minX = 5, maxX = -1;
    for (let y = 0; y < 7; y++) {
      const r = rowsArr[y] || '.....';
      for (let x = 0; x < 5; x++) {
        if (r[x] === '#') {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        }
      }
    }
    if (maxX < 0) { minX = 0; maxX = -1; }
    for (let y = 0; y < 7; y++) {
      const r = rowsArr[y] || '.....';
      for (let x = minX; x <= maxX; x++) if (r[x] === '#') cv.x.fillRect(cx + x - minX, cy + y, 1, 1);
    }
    FONT.g[k] = { sx: cx, sy: cy, w: maxX - minX + 1 };
  });
  FONT.sheet = cv;
})();

function fontTint(color) {
  let t = FONT.tints[color];
  if (t) return t;
  t = mkCanvas(FONT.sheet.w, FONT.sheet.h);
  t.x.drawImage(FONT.sheet.c, 0, 0);
  t.x.globalCompositeOperation = 'source-in';
  t.x.fillStyle = color;
  t.x.fillRect(0, 0, t.w, t.h);
  t.x.globalCompositeOperation = 'source-over';
  FONT.tints[color] = t;
  return t;
}

function textW(s, sc) {
  sc = sc || 1;
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === ' ') { w += FONT.spaceW + FONT.gap; continue; }
    const g = FONT.g[c];
    w += (g ? g.w : 4) + FONT.gap;
  }
  return max(0, w - FONT.gap) * sc;
}

/* Text zeichnen. opt: {shadow, center, right, alpha, scale} */
function text(ctx, s, x, y, color, opt) {
  opt = opt || {};
  s = '' + s;
  const sc = opt.scale || 1;

/* --------------------------------------------------------------------------
   8. FIGUREN  (Magier, NSCs, Gegner)
   -------------------------------------------------------------------------- */
const SCRATCH = mkCanvas(288, 288);
const SCOX = 144, SCOY = 208;
function flashDraw(ctx, x, y, flash, alpha, fn) {
  if (!flash && (alpha === undefined || alpha >= 1)) { G(ctx); fn(round(x), round(y)); return; }
  SCRATCH.x.clearRect(0, 0, SCRATCH.w, SCRATCH.h);
  G(SCRATCH.x); fn(SCOX, SCOY);
  if (flash > 0) {
    SCRATCH.x.globalCompositeOperation = 'source-atop';
    SCRATCH.x.fillStyle = 'rgba(255,255,255,' + clamp(flash, 0, 1) + ')';
    SCRATCH.x.fillRect(0, 0, SCRATCH.w, SCRATCH.h);
    SCRATCH.x.globalCompositeOperation = 'source-over';
  }
  const oa = ctx.globalAlpha;
  if (alpha !== undefined) ctx.globalAlpha = oa * alpha;
  ctx.drawImage(SCRATCH.c, 0, 0, SCRATCH.w, SCRATCH.h, round(x) - SCOX, round(y) - SCOY, SCRATCH.w, SCRATCH.h);
  ctx.globalAlpha = oa;
}
function shadowAt(x, y, r, a) { ELL(x, y, r, max(1, r * .38), 'rgba(8,10,18,' + (a === undefined ? .34 : a) + ')'); }
/* Figur mit dunkler Kontur zeichnen (haelt Charaktere vom Hintergrund getrennt) */
const PSC = mkCanvas(80, 96), PSC2 = mkCanvas(80, 96), PSX = 40, PSY = 78;
function outlineDraw(ctx, x, y, flash, alpha, fn) {
  PSC.x.clearRect(0, 0, PSC.w, PSC.h);
  G(PSC.x);
  const ret = fn(PSX, PSY);
  if (flash > 0) {
    PSC.x.globalCompositeOperation = 'source-atop';
    PSC.x.fillStyle = 'rgba(255,255,255,' + clamp(flash, 0, 1) + ')';
    PSC.x.fillRect(0, 0, PSC.w, PSC.h);
    PSC.x.globalCompositeOperation = 'source-over';
  }
  PSC2.x.clearRect(0, 0, PSC2.w, PSC2.h);
  PSC2.x.drawImage(PSC.c, 0, 0);
  PSC2.x.globalCompositeOperation = 'source-in';
  PSC2.x.fillStyle = 'rgba(8,10,20,.8)';
  PSC2.x.fillRect(0, 0, PSC2.w, PSC2.h);
  PSC2.x.globalCompositeOperation = 'source-over';
  const ox = round(x) - PSX, oy = round(y) - PSY;
  const oa = ctx.globalAlpha;
  if (alpha !== undefined) ctx.globalAlpha = oa * alpha;
  ctx.drawImage(PSC2.c, ox - 1, oy); ctx.drawImage(PSC2.c, ox + 1, oy);
  ctx.drawImage(PSC2.c, ox, oy - 1); ctx.drawImage(PSC2.c, ox, oy + 1);
  ctx.drawImage(PSC.c, ox, oy);
  ctx.globalAlpha = oa;
  return ret ? [ret[0] - PSX + round(x), ret[1] - PSY + round(y)] : null;
}

/* Stab zeichnen. a = Winkel in rad (0 = senkrecht) */
function drawStaff(x, y, st, a, glow) {
  const len = st.len || 22;
  const tx = x + sin(a) * len, ty = y - cos(a) * len;
  LINE(x, y, tx, ty, st.shaft, 1);
  LINE(x + (abs(sin(a)) < .5 ? 1 : 0), y, tx + (abs(sin(a)) < .5 ? 1 : 0), ty, shade(st.shaft, .75), 1);
  if (st.wrap) { const mx = lerp(x, tx, .45), my = lerp(y, ty, .45); R(mx - 1, my - 1, 3, 3, st.wrap); }
  const gc = st.gem;
  if (glow > 0) { CIR(tx, ty, 3 + glow * 4, rgba(gc, .22 * glow)); CIR(tx, ty, 2 + glow * 2, rgba(gc, .4 * glow)); }
  switch (st.shape) {
    case 'crystal': TRI(tx - 2, ty + 2, tx, ty - 4, tx + 2, ty + 2, gc); D(tx, ty - 1, mix(gc, P.white, .6)); break;
    case 'crescent':
      CIR(tx, ty, 3, gc); CIR(tx + 1, ty - 1, 2, 'rgba(0,0,0,0)');
      g.globalCompositeOperation = 'destination-out'; CIR(tx + 1.5, ty - 1, 2.2, '#000'); g.globalCompositeOperation = 'source-over';
      break;
    case 'skull': ELL(tx, ty, 3, 3, P.bone); D(tx - 1, ty, P.ink); D(tx + 1, ty, P.ink); HL(tx - 1, ty + 2, 3, P.ink); break;
    case 'flame':
      for (let i = 0; i < 5; i++) R(tx - (2 - i * .4), ty - i, max(1, 4 - i), 1, i < 2 ? P.lava1 : i < 4 ? P.fire : P.gold2);
      break;
    case 'ring': RING(tx, ty, 3, gc, 1); D(tx, ty, mix(gc, P.white, .5)); break;
    default: CIR(tx, ty, 2.6, gc); CIR(tx - .6, ty - .8, 1.2, mix(gc, P.white, .55));
  }
  return [tx, ty];
}

/* Allgemeiner Humanoid (Spieler und NSCs) */
function drawHumanoid(x, y, p) {
  const t = p.t || 0, dir = p.dir | 0, side = dir === 2 || dir === 3;
  const fl = dir === 3 ? -1 : 1;                       // 3 = links
  const wk = p.walking ? 1 : 0;
  const ph = p.frame === undefined ? 0 : p.frame;
  const bob = p.walking ? (ph === 1 || ph === 3 ? -1 : 0) : (sin(t * 2.2) > .2 ? -1 : 0);
  const cast = p.castT || 0;
  const lean = cast > 0 ? (side ? fl * 1 : 0) : 0;
  const robe = p.robe || P.arc3, robe2 = p.robe2 || mix(p.robe || P.arc3, P.white, .22);
  const trim = p.trim || P.gold;
  const skin = p.skin || P.skin;
  const by = y + bob;
  if (p.shadow !== false) shadowAt(x, y, 7, .3);
  // Beine
  const l1 = p.walking ? [0, -2, 0, 1][ph] : 0, l2 = p.walking ? [0, 1, 0, -2][ph] : 0;
  R(x - 4, by - 6 + l1, 3, 6 - l1, p.boots || P.wood1);
  R(x + 1, by - 6 + l2, 3, 6 - l2, p.boots || P.wood1);
  R(x - 4, by - 1, 3, 1, shade(p.boots || P.wood1, .7));
  R(x + 1, by - 1, 3, 1, shade(p.boots || P.wood1, .7));
  // Robe
  const hemW = 6 + (p.walking ? (ph % 2) : 0);
  for (let i = 0; i < 13; i++) {
    const yy = by - 6 - i;
    const w = lerp(hemW, 4, i / 12) + (i < 3 ? .5 : 0);
    R(x - w + lean * (i / 12), yy, w * 2, 1, i % 5 === 4 ? robe2 : robe);
  }
  R(x - hemW, by - 6, hemW * 2, 1, shade(robe, .7));
  // Guertel / Zierrat
  R(x - 5, by - 12, 10, 1, trim);
  if (p.cloak) { R(x - (side ? 2 : 6), by - 17, side ? 3 : 12, 9, p.cloak); }
  // Arme
  const armY = by - 16;
  const swing = p.walking ? sin(ph / 2 * PI) * 1.5 : 0;
  if (!side) { R(x - 6, armY + swing, 2, 6, robe2); R(x + 4, armY - swing, 2, 6, robe2); }
  else { R(x + fl * 3, armY, 2, 6, robe2); }
  // Kopf
  const hy = by - 24;
  ELL(x, hy + 3, 4, 4, skin);
  if (!p.hood) {
    if (p.hair) { R(x - 4, hy, 8, 3, p.hair); R(x - 5, hy + 1, 1, 4, p.hair); R(x + 4, hy + 1, 1, 4, p.hair); }
  }
  if (dir === 0) { D(x - 2, hy + 3, P.ink); D(x + 2, hy + 3, P.ink); if (p.eyeGlow) { D(x - 2, hy + 3, p.eyeGlow); D(x + 2, hy + 3, p.eyeGlow); } R(x - 1, hy + 5, 3, 1, shade(skin, .82)); }
  else if (side) { D(x + fl * 2, hy + 3, P.ink); }
  if (p.beard && dir !== 1) { R(x - 3, hy + 5, 6, 3, p.beard); R(x - 2, hy + 8, 4, 2, p.beard); }
  // Kopfbedeckung
  switch (p.hat) {
    case 'hood':
      ELL(x, hy + 2, 6, 5, robe); ELL(x, hy + 1, 5, 4, robe2);
      if (dir !== 1) { ELL(x, hy + 4, 4, 3, shade(P.ink, 1.1)); if (p.eyeGlow) { D(x - 2, hy + 4, p.eyeGlow); D(x + 2, hy + 4, p.eyeGlow); } }
      R(x - 6, hy + 4, 12, 1, trim);
      break;
    case 'wizard':
      R(x - 6, hy, 12, 2, p.hatColor || robe);
      for (let i = 0; i < 11; i++) { const w = 5 - i * .42; R(x - w + (i > 5 ? (i - 5) * .5 : 0), hy - i, w * 2, 1, i % 4 === 3 ? trim : (p.hatColor || robe)); }
      D(x + 2, hy - 11, P.gold2);
      break;
    case 'witch':
      R(x - 7, hy, 14, 2, p.hatColor || P.ink);
      for (let i = 0; i < 13; i++) { const w = 5 - i * .36, xo = sin(i * .3) * 3; R(x - w + xo, hy - i, w * 2, 1, p.hatColor || P.ink); }
      R(x - 6, hy - 1, 12, 1, p.hatBand || P.arc4);
      break;
    case 'cap': R(x - 5, hy - 1, 10, 3, p.hatColor || P.blood); R(x - 6, hy + 1, 12, 1, shade(p.hatColor || P.blood, .7)); break;
    case 'crown':
      R(x - 4, hy - 2, 8, 3, P.gold); for (let i = 0; i < 3; i++) R(x - 4 + i * 3, hy - 4, 1, 2, P.gold2);
      D(x, hy - 1, P.blood);
      break;
    case 'helm':
      ELL(x, hy + 2, 5, 4, P.steel); ELL(x, hy + 1, 4, 3, P.silver);
      R(x - 5, hy + 3, 10, 1, P.steel); if (dir === 0) R(x - 3, hy + 3, 6, 2, P.ink);
      break;
    case 'hair2': R(x - 5, hy - 1, 10, 4, p.hair || P.wood2); R(x - 5, hy + 2, 2, 5, p.hair || P.wood2); R(x + 3, hy + 2, 2, 5, p.hair || P.wood2); break;
  }
  // Stab
  if (p.staff) {
    const a = cast > 0 ? (side ? fl * (0.9 - cast * .5) : -0.35 + cast * .2) : (side ? fl * .18 : .2) + sin(t * 1.6) * .03;
    const sx = side ? x + fl * 4 : x + 6, sy = by - 11;
    return drawStaff(sx, sy, p.staff, a, cast);
  }
  return null;
}

/* ---- Gegner-Grafiken ---------------------------------------------------- */
const EART = {
  moss: function (x, y, e, t) {
    const b = sin(t * 7 + e.seed) * 1;
    shadowAt(x, y, 7, .34);
    R(x - 5, y - 4, 3, 4, P.wood1); R(x + 2, y - 4, 3, 4, P.wood1);
    ELL(x, y - 9 + b, 8, 7, P.black);
    ELL(x, y - 9 + b, 7, 6, P.wood2);
    ELL(x, y - 11 + b, 6, 4, P.moss);
    ELL(x - 1, y - 12 + b, 4, 2, P.grass4);
    R(x - 9, y - 10 + b, 4, 2, P.wood1); R(x + 5, y - 10 + b, 4, 2, P.wood1);
    D(x - 9, y - 9 + b, P.black); D(x + 8, y - 9 + b, P.black);
    R(x - 4, y - 9 + b, 2, 2, P.gold2); R(x + 3, y - 9 + b, 2, 2, P.gold2);
    CIR(x - 3, y - 8 + b, 2.4, rgba(P.gold2, .28)); CIR(x + 4, y - 8 + b, 2.4, rgba(P.gold2, .28));
    HL(x - 2, y - 6 + b, 5, P.black);
    for (let i = 0; i < 4; i++) { const a = i / 4 * TAU + t; D(x + cos(a) * 6, y - 14 + sin(a) * 2 + b, P.grass4); }
  },
  wolf: function (x, y, e, t) {
    const f = e.vx || e.vy ? sin(t * 12 + e.seed) * 1.5 : 0, fl = e.face || 1;
    shadowAt(x, y, 9, .3);
    R(x - 7, y - 4 + f, 2, 4, P.ink); R(x + 5, y - 4 - f, 2, 4, P.ink);
    R(x - 5, y - 4 - f, 2, 4, P.ink); R(x + 3, y - 4 + f, 2, 4, P.ink);

function mkItem(base, rar) {
  const it = {
    uid: ITEMUID++, key: base.k, name: base.n, slot: base.slot || 'staff', rar: rar === undefined ? (base.rar || 0) : rar,
    icon: base.icon || (base.slot ? (base.slot === 'robe' ? 'robe' : base.slot === 'boots' ? 'boots' : base.slot === 'amulet' ? 'amulet' : base.slot === 'ring' ? 'ring' : 'hood') : 'staff'),
    c1: base.c1 || base.shaft, c2: base.c2 || base.gem, c3: base.c3, shape: base.shape, lv: base.lv || 1,
    desc: base.desc || '', stats: {}, uniq: base.uniq || 0

  ['dmg', 'dmgp', 'hp', 'mp', 'mreg', 'crit', 'critd', 'cspd', 'spd', 'arm', 'fire', 'frost', 'bolt', 'arc', 'life', 'thorn', 'luck', 'cdr'].forEach(function (s) {
    if (base[s]) it.stats[s] = base[s];
  });
  if (base.shaft) { it.staff = { shaft: base.shaft, gem: base.gem, shape: base.shape, len: 22, el: base.el }; it.el = base.el; }
  it.value = 12 + it.lv * 8 + it.rar * 40;
  return it;
}
function rollItem(level, rarBoost) {
  const pool = [];
  STAVES.forEach(function (s) { if (!s.uniq && s.lv <= level + 3) pool.push(s); });
  ARMORS.forEach(function (a) { if (a.lv <= level + 3) pool.push(a); });
  if (!pool.length) pool.push(STAVES[0]);
  const weighted = pool.filter(function (p) { return p.lv >= level - 8; });
  const base = pick(weighted.length ? weighted : pool);
  let r = 0, roll = rnd() + (rarBoost || 0);
  if (roll > .985) r = 4; else if (roll > .93) r = 3; else if (roll > .78) r = 2; else if (roll > .48) r = 1;
  r = max(r, base.rar || 0);
  const it = mkItem(base, r);
  const nAff = [0, 1, 2, 3, 4][r];
  const used = {};
  for (let i = 0; i < nAff; i++) {
    const usePre = i % 2 === 0;
    const aff = pick(usePre ? PREFIX : SUFFIX);
    if (used[aff.n]) continue; used[aff.n] = 1;
    if (usePre) it.name = aff.n + ' ' + it.name; else it.name = it.name + ' ' + aff.n;
    for (const k in aff.s) it.stats[k] = (it.stats[k] || 0) + round(aff.s[k] * (1 + level * .04));
  }
  const sc = 1 + level * .055;
  ['dmg', 'hp', 'mp', 'arm'].forEach(function (k) { if (it.stats[k]) it.stats[k] = max(1, round(it.stats[k] * sc)); });
  it.value = 12 + it.lv * 8 + r * 40;
  return it;
}

const RIVER = [];
function buildRiver() {

    const tx = lerp(392, 30, smooth(t)), ty = lerp(132, 452, t);

}
function riverDist(x, y) {

    if (d < best) best = d;

}

function zoneAt(x, y) {

}
function genBiomes(prog) {

  const RG = 4, rw = ceil(WW / RG), rh = ceil(WH / RG);
  const rgrid = new Float32Array(rw * rh).fill(1e9);
  for (let i = 0; i < RIVER.length; i++) {

    const x0 = max(0, floor((r[0] - rad) / RG)), x1 = min(rw - 1, ceil((r[0] + rad) / RG));
    const y0 = max(0, floor((r[1] - rad) / RG)), y1 = min(rh - 1, ceil((r[1] + rad) / RG));
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      const d = dist(gx * RG + RG / 2, gy * RG + RG / 2, r[0], r[1]) - r[2];
      const k = gy * rw + gx;
      if (d < rgrid[k]) rgrid[k] = d;

  for (let y = 0; y < WH; y++) {
    for (let x = 0; x < WW; x++) {
      let b = zoneAt(x, y);
      const se = seaEdge(y), so = southEdge(x);
      let water = 0, shallow = 0;
      if (x < se) { water = 1; if (x > se - 4) shallow = 1; }
      if (y > so) { water = 1; if (y < so + 4) shallow = 1; }
      if (dist(x, y, 214, 468) < 34 + fbm(x * .06, y * .06, 2, 88) * 12) { water = 1; if (dist(x, y, 214, 468) > 30) shallow = 1; }
      const rd = rgrid[floor(y / RG) * rw + floor(x / RG)];
      if (rd < 0) { water = 1; if (rd > -1.6) shallow = 1; }
      if (b === B.MOUNT && rd < 0 && y < 160) { water = 0; shallow = 0; }
      const i = idx(x, y);
      if (water) {

        W.tile[i] = shallow ? T.SHALLOW : T.WATER;
        continue;
      }
      const nearSea = (x < se + 7) || (y > so - 7);
      if (nearSea && b !== B.MOUNT) b = B.COAST;
      W.bio[i] = b;
      W.tile[i] = tileFor(b, x, y);

function genCaves() {

    const d = dist(x, y, cz.x, cz.y) / cz.r;
    const n = fbm(x * .1, y * .1, 4, 77);
    const cave = n > .47 - (1 - d) * .1 && d < 1.05;
    W.tile[i] = cave ? T.CAVE : T.WALL;
    if (hash2(x, y, 9) > .985 && cave) W.tile[i] = T.CRYST;
  }
  const rooms = [[cz.x, cz.y + 62], [cz.x - 34, cz.y + 20], [cz.x + 10, cz.y - 4], [cz.x + 40, cz.y - 34], [cz.x - 20, cz.y - 46], [cz.x, cz.y - 64]];
  for (let i = 0; i < rooms.length; i++) {
    carveRoom(rooms[i][0], rooms[i][1], 5 + (i % 3) * 3);
    if (i > 0) carveTunnel(rooms[i - 1][0], rooms[i - 1][1], rooms[i][0], rooms[i][1]);

function carveRoom(cx, cy, r) {
  for (let y = -r - 2; y <= r + 2; y++) for (let x = -r - 2; x <= r + 2; x++) {
    const tx = floor(cx + x), ty = floor(cy + y);
    if (tx < 1 || ty < 1 || tx >= WW - 1 || ty >= WH - 1) continue;
    const rr2 = r + fbm(tx * .2, ty * .2, 2, 3) * 3 - 1.5;

}
function carveTunnel(x0, y0, x1, y1) {
  let x = x0, y = y0, guard = 0;
  while ((abs(x - x1) > 1 || abs(y - y1) > 1) && guard++ < 900) {
    const w = 2.1 + fbm(x * .1, y * .1, 2, 17) * 1.6;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      if (dx * dx + dy * dy > w * w) continue;
      const tx = floor(x + dx), ty = floor(y + dy);
      if (tx < 1 || ty < 1 || tx >= WW - 1 || ty >= WH - 1) continue;
      const i = idx(tx, ty);
      if (W.tile[i] === T.WALL || W.bio[i] === B.CAVE) W.tile[i] = T.CAVE;

function stampPath(pts, wid, tile) {

    for (let s = 0; s <= steps; s++) {

      const x = lerp(a[0], b[0], t) + (fbm(s * .05 + i, 1.7, 2, 33) - .5) * 1.8;
      const y = lerp(a[1], b[1], t) + (fbm(s * .05 + i, 7.3, 2, 44) - .5) * 1.8;

        if (dx * dx + dy * dy > w * w) continue;
        const tx = floor(x + dx), ty = floor(y + dy);
        if (tx < 0 || ty < 0 || tx >= WW || ty >= WH) continue;
        const k = idx(tx, ty), cur = W.tile[k];
        if (cur === T.WATER || cur === T.SHALLOW || cur === T.SWAMPW) { W.tile[k] = T.BRIDGE; continue; }
        if (cur === T.LAVA) continue;
        if (TSOLID[cur]) { W.tile[k] = tile; continue; }
        W.tile[k] = tile;
      }
    }
  }
}

function updateDrops(dt) {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t += dt; d.life -= dt;
    if (d.life <= 0) { drops.splice(i, 1); continue; }
    d.z += d.vz * dt; d.vz -= 240 * dt;
    if (d.z < 0) { d.z = 0; d.vz *= -.35; d.vx *= .6; d.vy *= .6; }
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= pow(.9, dt * 60); d.vy *= pow(.9, dt * 60);
    const pd = dist(d.x, d.y, PL.x, PL.y - 6);
    if (!PL.dead && pd < 46 && d.t > .35) {
      d.mag = 1;
      const a = angTo(d.x, d.y, PL.x, PL.y - 6);
      const sp = lerp(260, 60, pd / 46);
      d.x += cos(a) * sp * dt; d.y += sin(a) * sp * dt;
    }
    if (!PL.dead && pd < 11 && d.t > .3) {
      if (d.gold) { PL.gold += d.gold; sfx('coin', 40); addDmg(PL.x, PL.y - 30, 0, P.gold2, 0, '+' + d.gold); }
      else if (d.item) {
        if (!addItem(d.item)) continue;

function updatePlayer(dt, t) {

  if (PL.hurtT > 0) PL.hurtT -= dt;
  if (PL.castT > 0) PL.castT -= dt;
  if (PL.dashT > 0) PL.dashT -= dt;
  if (PL.castAnim > 0) PL.castAnim = max(0, PL.castAnim - dt * 4);
  if (PL.slowT > 0) PL.slowT -= dt;
  for (const k in PL.cds) if (PL.cds[k] > 0) PL.cds[k] = max(0, PL.cds[k] - dt);
  if (PL.shieldT > 0) { PL.shieldT -= dt; if (PL.shieldT <= 0) PL.shield = 0; }
  PL.regenT -= dt;
  if (PL.regenT <= 0) {
    PL.regenT = .5;
    giveMana(ST.mreg * .5);
    if (PL.hp < PL.maxHp && !inCombat()) healPlayer(PL.maxHp * .004);
  }
  if (hasBuff('heal') && PL.healAmt) healPlayer(PL.healAmt * dt);
  // Bewegung
  let ix = 0, iy = 0;
  if (!UI.modal) {
    if (key('KeyA') || key('ArrowLeft')) ix -= 1;
    if (key('KeyD') || key('ArrowRight')) ix += 1;
    if (key('KeyW') || key('ArrowUp')) iy -= 1;
    if (key('KeyS') || key('ArrowDown')) iy += 1;
  }
  const len = hypot(ix, iy);
  const sp = ST.moveSpd * tileSpeedMul(PL.x, PL.y) * (PL.slowT > 0 ? .55 : 1) * (PL.castT > 0 ? .55 : 1);
  if (len > 0) {
    ix /= len; iy /= len;

    PL.walkT += dt * (sp / 30);

const NPCBY = {};
function spawnNPCs() {

    let x = d.x * TS + 8, y = d.y * TS + 8;

      if (!blockedAt(x, y, 7)) break;
      const a = rnd() * TAU, dd = 8 + r * 2;
      x = d.x * TS + 8 + cos(a) * dd; y = d.y * TS + 8 + sin(a) * dd;
    }
    const n = {
      id: d.id, n: d.n, tt: d.tt, x: x, y: y, hx: x, hy: y, look: d.look, lines: d.lines || [['...']],
      q: d.q || [], shop: d.shop || 0, dir: 0, t: rnd() * 10, vx: 0, vy: 0, wt: rr(1, 4), line: 0, bob: rnd() * 6
    };
    npcs.push(n); NPCBY[d.id] = n;
  });
}
function updateNPCs(dt, t) {
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    n.t += dt;
    if (DLG.on && DLG.npc === n) { n.moving = 0; n.dir = (PL.x < n.x) ? 3 : 2; continue; }
    n.wt -= dt;
    if (n.wt <= 0) {
      n.wt = rr(2, 6);
      if (rnd() < .5) { n.tx = n.hx + rr(-22, 22); n.ty = n.hy + rr(-22, 22); }
      else { n.tx = null; }
    }
    n.moving = 0;
    if (n.tx !== null && n.tx !== undefined) {
      const d = dist(n.x, n.y, n.tx, n.ty);
      if (d > 3) {
        const a = angTo(n.x, n.y, n.tx, n.ty);
        const nx = n.x + cos(a) * 16 * dt, ny = n.y + sin(a) * 16 * dt;
        if (!blockedAt(nx, ny, 5)) { n.x = nx; n.y = ny; n.moving = 1; n.dir = abs(cos(a)) > abs(sin(a)) ? (cos(a) < 0 ? 3 : 2) : (sin(a) < 0 ? 1 : 0); }
        else n.tx = null;
      } else n.tx = null;
    }
    n.mark = npcMark(n);
  }
}
function npcMark(n) {
  for (let i = 0; i < n.q.length; i++) {
    const id = n.q[i];
    if (qState(id) === 'done') return 2;
  }
  for (let i = 0; i < n.q.length; i++) {
    const id = n.q[i];
    if (qAvailable(id)) return 1;
  }
  for (let i = 0; i < n.q.length; i++) if (qState(id0(n, i)) === 'active') return 3;
  return 0;
}
function id0(n, i) { return n.q[i]; }

const DLG = { on: 0, npc: null, pages: [], pi: 0, tw: 0, choices: null, sel: 0, title: '', sub: '' };
function startDialog(npc) {
  DLG.on = 1; DLG.npc = npc; DLG.pi = 0; DLG.tw = 0; DLG.sel = 0;
  DLG.title = npc.n; DLG.sub = npc.tt || '';
  buildDialog(npc);
  UI.modal = 'dlg';

}
function buildDialog(npc) {
  DLG.choices = null;
  // 1. abgeschlossene Quest abgeben
  for (let i = 0; i < npc.q.length; i++) {
    const id = npc.q[i];
    if (qState(id) === 'done') {
      const d = QUESTS[id];
      DLG.pages = [['Du hast es geschafft.', d.n + ' - erledigt.'], rewardText(d)];
      DLG.onEnd = function () { turnInQuest(id); afterTurnIn(npc, id); };
      return;
    }
  }
  // 2. Lieferziel einer Quest
  for (const qid in PL.q) {
    if (PL.q[qid].st !== 'active') continue;
    const d = QUESTS[qid];
    d.obj.forEach(function (o, oi) {
      if (o.t === 'talk' && o.k === npc.id && PL.q[qid].prog[oi] < o.n) {
        DLG.pages = [['Ah - du bringst mir etwas.', 'Gib her. Und hab Dank.']];
        DLG.onEnd = function () { questEvent('talk', npc.id); buildDialog(npc); DLG.on = 1; DLG.pi = 0; DLG.tw = 0; };
      }
    });
    if (DLG.pages && DLG.onEnd) return;
  }
  // 3. neue Quest anbieten
  for (let i = 0; i < npc.q.length; i++) {
    const id = npc.q[i];
    if (qAvailable(id)) {
      const d = QUESTS[id];
      DLG.pages = [[d.n], wrapArr(d.d)];
      DLG.choices = [
        { t: 'Ich nehme es an.', a: function () { acceptQuest(id); closeDialog(); } },
        { t: 'Spaeter vielleicht.', a: function () { closeDialog(); } }
      ];
      DLG.onEnd = null;
      return;
    }
  }
  // 4. laufende Quest
  for (let i = 0; i < npc.q.length; i++) {
    const id = npc.q[i];
    if (qState(id) === 'active') {
      const d = QUESTS[id], q = PL.q[id];
      const prog = d.obj.map(function (o, k) { return o.d + ': ' + q.prog[k] + '/' + o.n; });
      DLG.pages = [[d.n + ' laeuft noch.'].concat(prog)];
      DLG.onEnd = null;
      break;
    }
  }
  if (!DLG.pages || !DLG.pages.length || DLG.pi >= DLG.pages.length) {
    const l = npc.lines[floor(npc.line++ % npc.lines.length)];
    DLG.pages = [l];
    DLG.onEnd = null;
  }
  if (npc.shop) {
    DLG.choices = (DLG.choices || []).concat([
      { t: 'Zeig mir deine Waren.', a: function () { openShop(npc); } },
      { t: 'Leb wohl.', a: function () { closeDialog(); } }
    ]);
  }
}

    (d.chests || []).forEach(function (v, i) {

        const c = W.chests[i];

        for (let k = 0; k < arr.length; k++) if (arr[k].id === 'chest' + c.i) arr[k].v = 1;

    BOSSACTIVE = null; GAME.title = 0; GAME.won = 0; UI.modal = null;

}

/* --------------------------------------------------------------------------
   27. SPIELSCHLEIFE
   -------------------------------------------------------------------------- */
const GAME = {
  seed: 20260920, time: 60, dayLen: 480, title: 1, won: 0, winT: 0, everWon: 0,
  citadelOpen: 0, inCitadel: 0, bossKilled: {}, areaName: '', areaT: 0, dark: 0,
  lastBio: -1, ready: 0, titleOpts: null, fps: 60
};
EART.crystalnode = function (x, y, e, t) {
  const pul = .5 + sin(t * 3 + e.seed) * .5;
  shadowAt(x, y, 10, .3);
  TRI(x - 8, y, x - 4, y - 22, x - 1, y, P.void3);
  TRI(x + 1, y, x + 5, y - 26, x + 9, y, P.void2);
  TRI(x - 4, y, x, y - 32, x + 4, y, mix(P.void3, P.voidg, .4));
  CIR(x, y - 20, 4 + pul * 2, rgba(P.voidg, .22));
  CIR(x, y - 20, 2.4, mix(P.voidg, P.white, pul * .5));
  for (let i = 0; i < 4; i++) { const a = t * 1.4 + i / 4 * TAU; D(x + cos(a) * 9, y - 18 + sin(a) * 7, rgba(P.voidp, .7)); }
};
function newGame() {

  PL.inv = []; PL.q = {}; PL.buffs = []; PL.cds = {}; PL.shield = 0; PL.dead = 0; PL.deadT = 0;
  PL.ranks = { arcane: 1, fire: 0, frost: 0, bolt: 0, shield: 1, dash: 1, heal: 0, meteor: 0 };
  PL.tal = { vit: 0, res: 0, foc: 0, pre: 0, agi: 0, war: 0 };
  PL.bar = ['arcane', 'shield', 'dash', 'fire', 'frost', 'bolt'];
  PL.eq = { staff: null, robe: null, hood: null, boots: null, amulet: null, ring: null };
  equip(mkItem(STAVES[0], 0));
  equip(mkItem(ARMORS.filter(function (a) { return a.k === 'robe0'; })[0], 0));
  equip(mkItem(ARMORS.filter(function (a) { return a.k === 'hood0'; })[0], 0));
  equip(mkItem(ARMORS.filter(function (a) { return a.k === 'boot0'; })[0], 0));

  refreshStats();

  const start = W.pois.filter(function (p) { return p.id === 'turm'; })[0];
  PL.x = start ? start.x : 170 * TS; PL.y = start ? start.y + 34 : 404 * TS;
  W.fog.fill(0);
  W.pois.forEach(function (p) { p.found = (p.id === 'turm' || p.id === 'ahornfurt') ? 1 : 0; p.wpOn = 0; });
  W.chests.forEach(function (c) { c.open = 0; });
  W.special.forEach(function (s) { s.done = 0; if (s.prop) { s.prop.gone = 0; s.prop.v = s.k === 'katze' ? 2 : 0; } });
  GAME.time = 60; GAME.title = 0; GAME.won = 0; GAME.winT = 0; GAME.citadelOpen = 0;
  GAME.bossKilled = {}; GAME.inCitadel = 0;
  foes.length = 0; projs.length = 0; parts.length = 0; drops.length = 0; areas.length = 0; dmgs.length = 0;
  TOASTS.length = 0;
  BOSSACTIVE = null;
  CAM.x = PL.x - VW / 2; CAM.y = PL.y - VH / 2;
  revealFog(PL.x, PL.y, 14);
  showArea('Turm der Ersten Kerze');
  updateMood(1);
  GAME.hintT = 26;
  toast('Sprich mit Meisterin Sylva.', P.gold2, 'Taste E in ihrer Naehe.');
  try { localStorage.removeItem(SAVEKEY); } catch (e) { }
}
function updateMood(force) {
  let m;
  if (BOSSACTIVE && !BOSSACTIVE.dead) m = BOSSACTIVE.k === 'malakar' ? 'boss' : 'fight';
  else if (inCombat()) m = 'fight';
  else {
    const b = BIOMES[bioAtPx(PL.x, PL.y)];
    m = b ? b.mood : 'calm';
    for (let i = 0; i < W.safeZones.length; i++) {
      const z = W.safeZones[i];
      if (dist2(PL.x, PL.y, z[0], z[1]) < z[2] * z[2] * 1.4) { m = 'town'; break; }
    }
  }
  if (force) { AU.mood = m; AU.nextMood = m; } else setMood(m);
}
let MOODT = 0;
function update(dt, t) {
  MOUSE.wx = MOUSE.x + camX(); MOUSE.wy = MOUSE.y + camY();
  if (GAME.title) { updateParts(dt); return; }
  const blocking = UI.modal && UI.modal !== 'dlg';
  if (UI.modal === 'dlg' || blocking) {
    updateParts(dt);
    if (UI.modal === 'map') {
      const sp = 140 * dt / UI.mapZoom;
      if (key('KeyA') || key('ArrowLeft')) UI.mapX -= sp;
      if (key('KeyD') || key('ArrowRight')) UI.mapX += sp;
      if (key('KeyW') || key('ArrowUp')) UI.mapY -= sp;
      if (key('KeyS') || key('ArrowDown')) UI.mapY += sp;
      UI.zoomT = (UI.zoomT || 0) - dt;
      if (UI.zoomT <= 0) {
        if (key('NumpadAdd') || key('Equal')) { UI.mapZoom = mapZoomStep(1); UI.zoomT = .18; }
        if (key('NumpadSubtract') || key('Minus')) { UI.mapZoom = mapZoomStep(-1); UI.zoomT = .18; }
      }
      if (MOUSE.down && MOUSE.inside) {
        if (UI.dragX !== null && UI.dragX !== undefined) {
          UI.mapX -= (MOUSE.x - UI.dragX) / UI.mapZoom;
          UI.mapY -= (MOUSE.y - UI.dragY) / UI.mapZoom;
        }
        UI.dragX = MOUSE.x; UI.dragY = MOUSE.y;
      } else { UI.dragX = null; }
    }
    return;
  }
  GAME.time += dt;
  PL.aim = angTo(PL.x - camX(), PL.y - 12 - camY(), MOUSE.x, MOUSE.y);
  if (!PL.dead) {
    if ((MOUSE.down && MOUSE.inside) || key('Space')) {
      const k = PL.bar[UI.selSpell || 0];
      if (k) cast(k);
    }
  }
  updatePlayer(dt, t);
  updateFoes(dt, t);
  updateProjs(dt);
  updateAreas(dt);
  updateParts(dt);
  updateDrops(dt);
  updateNPCs(dt, t);
  updateSpawns(dt);
  updateBossSpots();
  updateSched(dt);
  ambientSpawn(dt, t);
  updateCamera(dt);
  W.special.forEach(function (s) { if (s.cd > 0) s.cd -= dt; });
  if (BOSSACTIVE && !BOSSACTIVE.dead && dist2(PL.x, PL.y, BOSSACTIVE.x, BOSSACTIVE.y) > 620 * 620) {
    const bf = BOSSACTIVE;
    for (let i = foes.length - 1; i >= 0; i--) if (foes[i] === bf || foes[i].leash > 1e8) foes.splice(i, 1);
    BOSSACTIVE = null;
    toast('Du hast den Kampf verlassen.', P.uidim, bf.n + ' sammelt seine Kraefte.');
    updateMood(1);
  }
  if (BOSSACTIVE) {
    if (BOSSACTIVE.dead) {
      if (!GAME.bossKilled[BOSSACTIVE.k]) {
        GAME.bossKilled[BOSSACTIVE.k] = 1;
        toast(BOSSACTIVE.n + ' ist bezwungen!', P.gold2);
        if (BOSSACTIVE.k === 'malakar') { GAME.won = 1; GAME.everWon = 1; GAME.winT = 0; GAME.inCitadel = 0; }
      }
      BOSSACTIVE = null;
      updateMood(1);
    }
  }
  MOODT -= dt;
  if (MOODT <= 0) { MOODT = 1.2; updateMood(0); }
  const b = bioAtPx(PL.x, PL.y);
  if (b !== GAME.lastBio) {
    GAME.lastBio = b;
    let name = BIOMES[b].n;
    for (let i = 0; i < W.pois.length; i++) {
      const p = W.pois[i];
      if (p.found && dist2(PL.x, PL.y, p.x, p.y) < pow((p.r + 6) * TS, 2)) { name = p.n; break; }
    }
    showArea(name);
  }
  GAME.autoT = (GAME.autoT || 0) - dt;
  if (GAME.autoT <= 0) { GAME.autoT = 60; if (!PL.dead) saveGameSilent(); }
}
function saveGameSilent() { saveGame(1); }
function render(t, dt) {
  const ctx = CTX;

    drawTitle(ctx, t);
    if (UI.modal === 'help') drawHelp(ctx);

  if (UI.modal !== 'map' && !GAME.won) drawHUD(ctx, t, UI.modal === 'dlg' || UI.modal === 'shop');
  if (UI.modal === 'inv') drawInventory(ctx, t);
  else if (UI.modal === 'skill') drawSkills(ctx, t);
  else if (UI.modal === 'quest') drawQuestLog(ctx, t);
  else if (UI.modal === 'map') drawMap(ctx, t);
  else if (UI.modal === 'shop') drawShop(ctx, t);
  else if (UI.modal === 'menu') drawMenu(ctx, t);
  else if (UI.modal === 'help') drawHelp(ctx);

let LAST = 0, ACC = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!GAME.ready) return;
  let dt = (now - LAST) / 1000;
  LAST = now;
  if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
  dt = min(dt, .05);
  GAME.fps = lerp(GAME.fps, 1 / max(.0001, dt), .05);
  let sdt = dt;
  if (HITSTOP > 0) { HITSTOP -= dt; sdt = dt * .16; }
  const t = GAME.time;

  render(t, dt);

}

function setBoot(p, msg) {
  const f = document.getElementById('barfill'), m = document.getElementById('bootmsg');
  if (f) f.style.width = floor(clamp(p, 0, 1) * 100) + '%';
  if (m && msg) m.textContent = msg;
}
function boot() {
  resize();
  const steps = [
    ['Kacheln werden gemalt', function () { buildAtlas(); buildClouds(); }],
    ['Land wird geformt', function () {
      RND = mulberry(GAME.seed);
      W.cw = ceil(WW / CH); W.ch = ceil(WH / CH);
      W.props = [];

      W.pois = []; W.safeZones = []; W.special = [];
      genBiomes(null);
    }],
    ['Wege werden gezogen', function () { ROADS.forEach(function (r) { stampPath(r, 1.25, T.ROAD); }); }],
    ['Doerfer werden gebaut', function () { buildPOIs(); }],
    ['Waelder wachsen', function () { scatterProps(null); }],
    ['Schaetze werden versteckt', function () { placeChests(); placeSpecials(); }],
    ['Leute ziehen ein', function () { spawnNPCs(); }],
    ['Karte wird gezeichnet', function () { buildMinimap(null); }],
    ['Bereit', function () {
      refreshStats();
      GAME.ready = 1;
      const bt = document.getElementById('boot');
      if (bt) { bt.classList.add('done'); setTimeout(function () { bt.style.display = 'none'; }, 600); }
    }]
  ];
  let i = 0;
  function next() {
    if (i >= steps.length) return;
    setBoot(i / steps.length, steps[i][0]);
    setTimeout(function () {
      try { steps[i][1](); }
      catch (err) {
        const m = document.getElementById('bootmsg');
        if (m) m.textContent = 'Fehler: ' + err.message;
        console.error(err);
        return;
      }
      i++;
