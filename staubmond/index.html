    this.set(this.loops.hum.g.gain, suck ? 0.05 : 0, 0.1); this.set(this.loops.hum.o.frequency, tool === 'plasma' ? 180 : 95);
    const m = this.loops.motor;
    if (v) { const sp = Math.hypot(v.vx, v.vy); this.set(m.o.frequency, (v.def.hover ? 90 : 42) + sp * 5); this.set(m.f.frequency, 300 + sp * 40); this.set(m.g.gain, 0.05 + Math.min(0.06, sp * 0.004), 0.1); }
    else this.set(m.g.gain, 0, 0.15);
    // Förderband-Rattern nur in der Nähe
    let nb = 0; if (Buildings.belts.size) for (const bl of Buildings.active) { if (U.dist2(bl.x, bl.y, P.x, P.y) < 400) nb++; if (nb > 20) break; }
    this.set(this.loops.belt.g.gain, Math.min(0.05, nb * 0.004), 0.2);
    this.music(dt);
  },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tone(freq, type, dur, vol, when, dest, slide) {
    const c = this.ctx, t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    this.env(g, t, 0.005, vol, dur); o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.05);
  },
  burst(freq, q, dur, vol, when, type) {
    const c = this.ctx, t = c.currentTime + (when || 0), n = this.noiseSrc(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q; this.env(g, t, 0.01, vol, dur);
    n.connect(f); f.connect(g); g.connect(this.sfxG); n.start(t); n.stop(t + dur + 0.1);
  },
  sfx(name, arg) {
    if (!this.ok || Settings.d.sfx <= 0) return;
    const now = performance.now(); if (this.lastSfx[name] && now - this.lastSfx[name] < 45) return; this.lastSfx[name] = now;
    switch (name) {
      case 'click': this.tone(1800, 'square', 0.03, 0.04); break;
      case 'coin': this.tone(1320 + Math.random() * 380, 'triangle', 0.07, 0.05); break;
      case 'buy': this.tone(660, 'triangle', 0.09, 0.12); this.tone(990, 'triangle', 0.14, 0.12, 0.07); break;
      case 'error': this.tone(180, 'square', 0.15, 0.07); break;
      case 'unload': this.burst(500, 0.8, 0.35, 0.18); this.tone(300, 'sine', 0.2, 0.08, 0, null, 160); break;
      case 'cash': this.tone(1568, 'triangle', 0.12, 0.13); this.tone(2093, 'triangle', 0.4, 0.13, 0.08); this.burst(6000, 2, 0.08, 0.06); break;
      case 'launch': { const c = this.ctx, t = c.currentTime, n = this.noiseSrc(), f = c.createBiquadFilter(), g = c.createGain(); f.type = 'lowpass'; f.frequency.setValueAtTime(120, t); f.frequency.exponentialRampToValueAtTime(900, t + 2.2); this.env(g, t, 0.15, 0.32, 2.4); n.connect(f); f.connect(g); g.connect(this.sfxG); n.start(t); n.stop(t + 2.8); this.tone(70, 'sawtooth', 2.4, 0.06, 0, null, 480); this.sfx('cash'); break; }
      case 'radio': for (let i = 0; i < 3; i++) this.tone(1240, 'square', 0.05, 0.035, i * 0.09); break;
      case 'door': this.burst(900, 1, 0.12, 0.12); this.tone(220, 'sine', 0.1, 0.08); break;
      case 'build': this.burst(300, 0.7, 0.18, 0.2); this.tone(140, 'square', 0.08, 0.06); this.tone(420, 'triangle', 0.1, 0.06, 0.08); break;
      case 'demolish': this.burst(220, 0.6, 0.4, 0.22); this.tone(120, 'sawtooth', 0.3, 0.06, 0, null, 50); break;
      case 'stamp': this.burst(160, 0.5, 0.2, 0.3); this.tone(90, 'sine', 0.2, 0.2); this.tone(1320, 'triangle', 0.3, 0.06, 0.12); break;
      case 'find': [880, 1108, 1318, 1760].forEach((f, i) => this.tone(f, 'triangle', 0.25, 0.08, i * 0.07)); break;
      case 'research': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 'sine', 0.3, 0.09, i * 0.08)); break;
      case 'memo': this.burst(4000, 1.5, 0.08, 0.05); this.tone(1000, 'sine', 0.06, 0.04, 0.05); break;
      case 'robot': this.tone(1500 + Math.random() * 600, 'square', 0.04, 0.025); this.tone(1900 + Math.random() * 500, 'square', 0.04, 0.025, 0.06); break;
      case 'fanfare': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => { this.tone(f, 'sawtooth', 0.3, 0.05, i * 0.13); this.tone(f / 2, 'triangle', 0.3, 0.07, i * 0.13); }); break;
      case 'impact': { const d = arg || 0, v = Math.max(0.02, 0.3 - d * 0.004); this.burst(120, 0.5, 0.6, v); this.tone(60, 'sine', 0.5, v * 0.7, 0, null, 30); break; }
      case 'step': this.burst(700 + Math.random() * 300, 1.2, 0.05, 0.025); break;
    }
  },
  // Generative Ambient-Musik: ruhige Flächen + pentatonische Töne mit Hall
  music(dt) {
    if (Settings.d.music <= 0) return;
    const c = this.ctx, night = Progression.darkness() > 0.3, reg = World.regionAt(Math.floor(Player.x), Math.floor(Player.y));
    const roots = [220, 196, 174.6, 207.7, 246.9, 185, 164.8], root = roots[reg] * (night ? 0.75 : 1);
    const scale = night ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];
    this.chordT -= dt;
    if (this.chordT <= 0) {
      this.chordT = 9 + Math.random() * 5;
      const deg = [0, 2, 3, 1][Math.floor(Math.random() * 4)], t = c.currentTime;
      for (let i = 0; i < 3; i++) {
        const semi = scale[(deg + i * 2) % 5] + ((deg + i * 2) >= 5 ? 12 : 0), f = root * Math.pow(2, semi / 12) / 2;
        for (const det of [-4, 4]) {
          const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
          o.type = i === 0 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = det; lp.type = 'lowpass'; lp.frequency.value = night ? 700 : 1100;
          g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.022, t + 3.5); g.gain.linearRampToValueAtTime(0.0001, t + 12);
          o.connect(lp); lp.connect(g); g.connect(this.musG); g.connect(this.verb); o.start(t); o.stop(t + 12.2);
        }
      }
    }
    this.musT -= dt;
    if (this.musT <= 0) {
      this.musT = 0.9 + Math.random() * 2.4;
      if (Math.random() < 0.7) {
        const semi = scale[Math.floor(Math.random() * 5)] + 12 * (1 + Math.floor(Math.random() * 2)), f = root * Math.pow(2, semi / 12);
        const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f; this.env(g, t, 0.02, 0.035, 2.2);
        o.connect(g); g.connect(this.musG); g.connect(this.delay); o.start(t); o.stop(t + 2.4);
      }
    }
  },
};

/* ============================================================================
   12. SAVE – IndexedDB, inkrementelle Chunks, Backups, Migration, Export
   ============================================================================ */
const Save = {
  db: null, fallback: false, lastSlot: -1, saving: false, soonT: -1, count: 0,
  async open() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('staubmond', 1);
        r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('core')) db.createObjectStore('core'); if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
    } catch (e) { this.fallback = true; this.db = null; }
  },
  // kleine Promise-Hilfen
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(store, key) {
    if (this.fallback) { const v = localStorage.getItem('sm.' + store + '.' + key); return v ? this.fromLS(JSON.parse(v)) : undefined; }
    return this.req(this.db.transaction(store).objectStore(store).get(key));
  },
  async putMany(store, entries) {
    if (this.fallback) { for (const [k, v] of entries) try { localStorage.setItem('sm.' + store + '.' + k, JSON.stringify(this.toLS(v))); } catch (e) { UI.toast('Speicher voll! Bitte Spielstand exportieren.', 'warn'); throw e; } return; }
    await new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'), os = tx.objectStore(store); for (const [k, v] of entries) os.put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  },
  async delKeys(store, keys) {
    if (this.fallback) { for (const k of keys) localStorage.removeItem('sm.' + store + '.' + k); return; }
    await new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'), os = tx.objectStore(store); for (const k of keys) os.delete(k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  async allChunks(slot) {
    const pre = 's' + slot + ':';
    if (this.fallback) { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('sm.chunks.' + pre)) out.push([k.slice(10), this.fromLS(JSON.parse(localStorage.getItem(k)))]); } return out; }
    return new Promise((res, rej) => {
      const out = [], tx = this.db.transaction('chunks'), os = tx.objectStore('chunks'), rq = os.openCursor(IDBKeyRange.bound(pre, pre + '￿'));
      rq.onsuccess = () => { const c = rq.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
      rq.onerror = () => rej(rq.error);
    });
  },
  toLS(v) { if (v && typeof v === 'object' && !Array.isArray(v)) { const o = {}; for (const k in v) o[k] = v[k] instanceof Uint8Array ? { __u8: this.b64(v[k]) } : v[k]; return o; } return v; },
  fromLS(v) { if (v && typeof v === 'object') for (const k in v) if (v[k] && v[k].__u8 !== undefined) v[k] = this.unb64(v[k].__u8); return v; },
  b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  // Lauflängen-Kodierung (Wert, Länge ≤ 255)
  rle(a) { const out = []; let i = 0; while (i < a.length) { const v = a[i]; let n = 1; while (i + n < a.length && a[i + n] === v && n < 255) n++; out.push(v, n); i += n; } return new Uint8Array(out); },
  unrle(r, len) { const a = new Uint8Array(len); let p = 0; for (let i = 0; i < r.length; i += 2) { a.fill(r[i], p, p + r[i + 1]); p += r[i + 1]; } return a; },
  async gz(u8) { if (!window.CompressionStream) return null; try { const s = new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); } catch (e) { return null; } },
  async ungz(u8) { const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); },
  async encodeChunk(ch) {
    const d = this.rle(ch.dust), z = d.length > 300 ? await this.gz(d) : null;
    const rec = { ci: ch.ci, d: z && z.length < d.length ? z : d, z: !!(z && z.length < d.length) };
    if (ch.meteor && ch.meteor.some(v => v)) rec.m = this.rle(ch.meteor);
    return rec;
  },
  async decodeChunk(rec) {
    const raw = rec.z ? await this.ungz(rec.d) : rec.d;
    return { ci: rec.ci, dust: this.unrle(raw, 4096), meteor: rec.m ? this.unrle(rec.m, 4096) : null, rev: 1 };
  },
  // Kern-Datensatz bauen
  coreJSON() {
    Player.save(); Vehicles.save(); Buildings.save(); Robots.save();
    G.saved = Date.now(); G.lastReal = Date.now(); G.version = CONFIG.version;
    const cs = []; for (let i = 0; i < NCH * NCH; i++) if (World.cleanable[i] >= 0) cs.push(i, World.cleanable[i], World.chunkClean[i]);
    G.chunkStats = cs; G.glanzCache = World.glanz();
    return JSON.stringify(G);
  },
  preview() { return { t: G.t, licence: G.licence, glanz: World.glanz(), saved: Date.now(), mission: G.mission, money: G.money }; },
  soon() { this.soonT = 1.5; },
  update(dt) {
    if (Game.state !== 'play' || Net.isClient()) return;
    this.timer = (this.timer || 0) + dt;
    if (this.soonT > 0) { this.soonT -= dt; if (this.soonT <= 0) { this.soonT = -1; this.saveNow(); } }
    if (this.timer >= CONFIG.save.autosave) { this.timer = 0; this.saveNow(); }
  },
  async saveNow(full) {
    if (!G || this.saving || Game.state !== 'play' || Net.isClient()) return;
    this.saving = true;
    try {
      const json = this.coreJSON(), slot = G.slot;
      const rec = { json, sum: U.fnv(json), v: CONFIG.saveSchema, t: Date.now(), preview: this.preview() };
      const entries = [['s' + slot, rec]];
      if (full || this.count++ % 4 === 0) entries.push(['s' + slot + 'b' + (this.count % CONFIG.save.backups), rec]);
      await this.putMany('core', entries);
      // nur geänderte Chunks, in Häppchen
      const list = full ? World.chunks.filter(Boolean).map(c => c.ci) : [...World.dirtySave];
      for (let i = 0; i < list.length; i += 64) {
        const part = list.slice(i, i + 64), ents = [];
        for (const ci of part) { const ch = World.chunks[ci]; if (ch) ents.push(['s' + slot + ':' + ci, await this.encodeChunk(ch)]); World.dirtySave.delete(ci); }
        if (ents.length) await this.putMany('chunks', ents);
        await new Promise(r => setTimeout(r, 0));
      }
      this.lastSlot = slot;
    } catch (e) { console.warn('Speichern fehlgeschlagen', e); UI.toast('Speichern fehlgeschlagen – bitte exportieren.', 'warn'); }
    this.saving = false;
  },
  validate(rec) {
    if (!rec || typeof rec.json !== 'string' || U.fnv(rec.json) !== rec.sum) return null;
    try { const g = JSON.parse(rec.json); if (typeof g.money !== 'number' || typeof g.t !== 'number' || !g.player || !g.stats || g.seed === undefined) return null; return g; } catch (e) { return null; }
  },
  // Migration: fehlende Felder aus einem frischen Zustand ergänzen, Schema anheben
  migrate(g) {
    const fresh = newState(g.seed, g.mission, g.slot);
    const fill = (dst, src) => { for (const k in src) { if (dst[k] === undefined) dst[k] = src[k]; else if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && typeof dst[k] === 'object') fill(dst[k], src[k]); } };
    fill(g, fresh);
    if ((g.v || 1) < 2) { g.stats.builtBy = g.stats.builtBy || {}; }
    g.v = CONFIG.saveSchema;
    return g;
  },
  // jüngster gültiger Kern-Datensatz (Hauptdatensatz, sonst Backups)
  async bestCore(slot) {
    const main = await this.get('core', 's' + slot);
    if (this.validate(main)) return { rec: main, restored: false };
    const backs = [];
    for (let i = 0; i < CONFIG.save.backups; i++) { const r = await this.get('core', 's' + slot + 'b' + i); if (r) backs.push(r); }
    backs.sort((a, b) => b.t - a.t);
    for (const r of backs) if (this.validate(r)) return { rec: r, restored: true };
    return null;
  },
  async loadSlot(slot) {
    const best = await this.bestCore(slot);
    if (!best) return null;
    let g = this.validate(best.rec); const restored = best.restored;
    g = this.migrate(g); g.slot = slot;
    const raw = await this.allChunks(slot), chunks = [];
    for (const [, rec] of raw) { try { chunks.push(await this.decodeChunk(rec)); } catch (e) { console.warn('Chunk defekt', e); } }
    return { g, chunks, restored };
  },
  async listSlots() {
    const out = [];
    for (let i = 0; i < CONFIG.save.slots; i++) { try { const r = await this.get('core', 's' + i); out.push(r && r.preview ? r.preview : null); } catch (e) { out.push(null); } }
    return out;
  },
  async deleteSlot(slot) {
    const keys = ['s' + slot]; for (let i = 0; i < CONFIG.save.backups; i++) keys.push('s' + slot + 'b' + i);
    await this.delKeys('core', keys);
    const ch = await this.allChunks(slot); await this.delKeys('chunks', ch.map(c => c[0]));
  },
  async exportSlot(slot) {
    const best = await this.bestCore(slot); if (!best) { UI.toast('Platz ist leer.'); return; }
    const rec = best.rec;
    const ch = await this.allChunks(slot);
    const data = { format: 'staubmond-save', version: CONFIG.version, schema: CONFIG.saveSchema, core: rec, chunks: ch.map(([k, r]) => ({ ci: r.ci, d: this.b64(r.d), z: r.z, m: r.m ? this.b64(r.m) : null })) };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'staubmond-platz' + (slot + 1) + '-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    UI.toast('Spielstand exportiert.', 'good');
  },
  importDialog(slot, done) {
    const inp = U.h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (data.format !== 'staubmond-save' || !this.validate(data.core)) throw new Error('ungültig');
        await this.deleteSlot(slot);
        const rec = data.core; const g = this.validate(rec); g.slot = slot; const json = JSON.stringify(g);
        await this.putMany('core', [['s' + slot, { json, sum: U.fnv(json), v: rec.v, t: Date.now(), preview: rec.preview }]]);
        const ents = data.chunks.map(c => ['s' + slot + ':' + c.ci, { ci: c.ci, d: this.unb64(c.d), z: c.z, m: c.m ? this.unb64(c.m) : undefined }]);
        for (let i = 0; i < ents.length; i += 100) await this.putMany('chunks', ents.slice(i, i + 100));
        UI.toast('Spielstand importiert (Platz ' + (slot + 1) + ').', 'good'); if (done) done();
      } catch (e) { UI.toast('Import fehlgeschlagen: Datei ist kein gültiger Staubmond-Spielstand.', 'warn'); }
      inp.remove();
    });
    document.body.appendChild(inp); inp.click();
  },
};

/* ============================================================================
   12b. SHOP – alle zustandsändernden Befehle mit einfachen Argumenten (IDs).
   UI, Tastatur, Touch und Koop-Clients rufen ausschließlich diese Befehle auf.
   ============================================================================ */
const Shop = {
  fail(why) { return { ok: false, why }; },
  miss(p) { return 'Es fehlen ' + U.money(p - G.money); },
  // Einstieg: im Koop-Client an den Host weiterleiten, sonst lokal ausführen
  do(name, ...args) {
    if (Net.isClient()) { Net.forward('shop', { name, args }); return { ok: true, pending: true }; }
    const f = this[name]; if (typeof f !== 'function') return this.fail('Unbekannter Befehl');
    try { return f.apply(this, args) || { ok: true }; } catch (e) { console.warn('Befehl fehlgeschlagen', name, e); return this.fail('Fehler: ' + e.message); }
  },
  tool(id) {
    const t = CONFIG.tools.find(x => x.id === id); if (!t) return this.fail('Unbekannt');
    if (t.licence > G.licence) return this.fail('Lizenz ' + t.licence + ' nötig');
    if (!G.tools[id]) { const p = Economy.toolPrice(t); if (!Economy.spend(p)) return this.fail(this.miss(p)); G.tools[id] = 1; G.stats.ups++; Bus.emit('purchase', id); G.tool = id; return { ok: true, msg: t.name + ' gekauft und ausgerüstet!' }; }
    G.tool = id; return { ok: true };
  },
  upgrade(id) {
    const u = Economy.upDef(id); if (!u) return this.fail('Unbekannt');
    if ((u.licence || 0) > G.licence) return this.fail('Lizenz ' + u.licence + ' nötig');
    const lvl = G.up[id] || 0; if (lvl >= CONFIG.upgradeLevels) return this.fail('Maximum erreicht');
    const p = Economy.upPrice(id); if (!Economy.spend(p)) return this.fail(this.miss(p));
    G.up[id] = lvl + 1; G.stats.ups++; Bus.emit('purchase', id); return { ok: true };
  },
  licence() { const c = Economy.canBuyLicence(); if (!c.ok) return this.fail(c.why); return Economy.buyLicence() ? { ok: true } : this.fail('Nicht möglich'); },
  vehicle(type) {
    const d = Vehicles.def(type); if (!d) return this.fail('Unbekannt');
    if (d.licence > G.licence) return this.fail('Lizenz ' + d.licence + ' nötig');
    const price = Math.round(d.price * Economy.fx('upgradePrice'));
    const v = Vehicles.buy(type); if (!v) return this.fail(this.miss(price));
    G.stats.ups++; Bus.emit('purchase', type); return { ok: true, msg: d.name + ' gekauft! Steht am Depot bereit.' };
  },
  vehUp(vid, key) {
    const v = Vehicles.byId(vid); if (!v) return this.fail('Fahrzeug fehlt');
    if (v.up[key] >= CONFIG.vehicleUpgradeLevels) return this.fail('Maximum erreicht');
    const p = Vehicles.upPrice(v, key); if (!Economy.spend(p)) return this.fail(this.miss(p));
    v.up[key]++; G.stats.ups++; return { ok: true };
  },
  recallVeh(vid, garageId) {
    const v = Vehicles.byId(vid); if (!v) return this.fail('Fahrzeug fehlt');
    if (garageId) { if (!Vehicles.recall(v, garageId)) return this.fail('Gerade nicht möglich'); v.garage = garageId; return { ok: true }; }

  },
  robot(model, hid) {

  place(type, x, y, rot) { return Buildings.place(type, x, y, rot); },
  remove(bid) { const b = Buildings.byId(bid); if (!b) return this.fail('Gebäude fehlt'); return Buildings.remove(b) ? { ok: true } : this.fail('Abriss nicht möglich'); },
  move(bid, x, y, rot) { const b = Buildings.byId(bid); if (!b) return this.fail('Gebäude fehlt'); return Buildings.move(b, x, y, rot); },
  rotate(bid) { const b = Buildings.byId(bid); if (!b) return this.fail('Gebäude fehlt'); return Buildings.rotate(b) ? { ok: true } : this.fail('Drehen nicht möglich'); },

  unbelts(cells) { return { ok: true, n: Buildings.removeBeltsAt(cells) }; },
  beltRotate(x, y) { const bl = Buildings.beltAt(x, y); if (!bl) return this.fail('Kein Band'); const old = bl.dir; bl.dir = (bl.dir + 1) & 3; Buildings.relink(); Buildings.pushUndo({ k: 'belts', cells: [[bl.x, bl.y, bl.dir, [old, bl.tier]]] }); return { ok: true }; },
  undo() { Buildings.doUndo(); return { ok: true }; },
  launch(bid) { const b = Buildings.byId(bid); if (!b || !Buildings.canLaunch(b)) return this.fail('Kapsel nicht bereit oder leer.'); Buildings.launch(b, false); return { ok: true }; },
  swapOrder(oid) { return Progression.swapOrder(oid) ? { ok: true } : this.fail('Kein kostenloser Tausch mehr in dieser Stunde.'); },

/* ============================================================================
   13. NET – optionaler Koop per Einladungscode (host-autoritativ)
   ============================================================================ */
/* Transporte: PeerJS (Internet, WebRTC, Host-ID „staubmond-CODE“) oder BroadcastChannel (dieses Gerät) */
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const NetLocal = {
  // gleiches Gerät, mehrere Tabs/Fenster
  start(host, code, h) {
    this.ch = new BroadcastChannel('staubmond-coop-' + code); this.host = host; this.h = h;
    this.me = host ? 'host' : 'c' + Math.random().toString(36).slice(2, 9);
    this.ch.onmessage = e => {
      const m = e.data; if (!m || m.to !== this.me) return;
      if (m.k === 'hello' && host) { h.onOpen(m.from); this.post(m.from, 'ack'); }
      else if (m.k === 'ack' && !host) { this.ok = true; h.onOpen('host'); }
      else if (m.k === 'bye') h.onClose(m.from);
      else if (m.k === 'msg') h.onData(m.from, m.d);
    };
    if (!host) { this.post('host', 'hello'); setTimeout(() => { if (!this.ok) h.onError('Kein Spiel mit diesem Code auf diesem Gerät gefunden.'); }, 2500); }
    else setTimeout(() => h.onReady(), 0);
  },
  post(to, k, d) { if (this.ch) this.ch.postMessage({ from: this.me, to, k, d }); },
  send(to, d) { this.post(to, 'msg', d); },
  drop(to) { this.post(to, 'bye'); },
  close() { if (this.ch) { this.post(this.host ? '*' : 'host', 'bye'); this.ch.close(); this.ch = null; } },
};
const NetPeer = {
  conns: new Map(),
  load() {
    return new Promise((res, rej) => {
      if (window.Peer) return res();
      const s = document.createElement('script'); s.src = PEERJS_URL; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = () => res(); s.onerror = () => rej(new Error('PeerJS konnte nicht geladen werden (offline?).'));
      document.head.appendChild(s);
    });
  },
  async start(host, code, h) {
    this.h = h; this.host = host;
    await this.load();
    const peer = this.peer = host ? new window.Peer('staubmond-' + code, { debug: 0 }) : new window.Peer({ debug: 0 });
    peer.on('error', e => h.onError(e && e.type === 'unavailable-id' ? 'Code bereits vergeben – bitte erneut hosten.' : e && e.type === 'peer-unavailable' ? 'Kein Spiel mit diesem Code gefunden.' : 'Verbindungsfehler: ' + (e && e.type || e)));
    const wire = c => {
      c.on('open', () => { this.conns.set(c.peer, c); h.onOpen(host ? c.peer : 'host'); });
      c.on('data', d => { d = this.unpart(c.peer, d); if (d) h.onData(host ? c.peer : 'host', d); });
      c.on('close', () => { this.conns.delete(c.peer); h.onClose(host ? c.peer : 'host'); });
      c.on('error', e => console.warn('Koop-Verbindung:', e && (e.type || e.message) || e));
    };
    if (host) { peer.on('open', () => h.onReady()); peer.on('connection', wire); }
    else peer.on('open', () => wire(peer.connect('staubmond-' + code, { reliable: true, serialization: 'json' })));
  },
  // Nachrichten über ~5.000 Zeichen (Spielstand, Chunk-Snapshots) in Teile zerlegen: PeerJS verwirft
  // JSON-Nachrichten ab ~16 KB; 5.000 Zeichen bleiben auch mit Escapes/UTF-8 sicher darunter
  PART: 5000,
  send(to, d) {
    const c = this.host ? this.conns.get(to) : this.conns.values().next().value; if (!c || !c.open) return;
    const j = JSON.stringify(d), L = this.PART; if (j.length < L) { c.send(d); return; }
    const id = (this.pid = (this.pid || 0) + 1), n = Math.ceil(j.length / L);
    for (let i = 0; i < n; i++) c.send({ __p: id, i, n, s: j.slice(i * L, (i + 1) * L) });
  },
  unpart(from, d) {
    if (!d || d.__p === undefined) return d;
    const key = from + ':' + d.__p, buf = (this.parts = this.parts || new Map());
    let e = buf.get(key); if (!e) { e = { n: d.n, got: 0, s: [] }; buf.set(key, e); }
    if (e.s[d.i] === undefined) { e.s[d.i] = d.s; e.got++; }
    if (e.got < e.n) return null;
    buf.delete(key);
    try { return JSON.parse(e.s.join('')); } catch (err) { return null; }
  },
  drop(to) { const c = this.conns.get(to); if (c) c.close(); },
  close() { for (const c of this.conns.values()) try { c.close(); } catch (e) { } this.conns.clear(); if (this.peer) try { this.peer.destroy(); } catch (e) { } this.peer = null; },
};

const PLAYER_COLORS = THEME.crew;
const EMOTES = { wave: '👋 Winken', here: '📍 Hierher!', good: '👍 Gute Arbeit' };

const Net = {
  role: null, tr: null, code: '', name: 'Crew', peers: new Map(), others: [], myId: 0, myColor: PLAYER_COLORS[0],
  banned: new Set(), buildDirty: false, t: 0, inT: 0, rid: 1, emote: null, kind: 'peer', status: '',
  bobT: {},
  isClient() { return this.role === 'client'; },
  // alle anderen Crew-Mitglieder als einheitliche, geglättete Liste
  list() {

  },
  isHost() { return this.role === 'host'; },
  crewBonus() { return this.role === 'host' ? CONFIG.economy.crewBonus * this.peers.size : this.role === 'client' ? CONFIG.economy.crewBonus * this.others.length : 0; },
  send(to, m) { if (this.tr) this.tr.send(to, m); },
  broadcast(m) { for (const id of this.peers.keys()) this.send(id, m); },
  // Client → Host: Befehle weiterleiten
  forward(kind, d) {
    if (!this.isClient()) return false;

  },
  b64(u8) { return Save.b64(u8); }, unb64(s) { return Save.unb64(s); },
  packChunk(ch) { return [ch.ci, this.b64(Save.rle(ch.dust)), ch.meteor && ch.meteor.some(v => v) ? this.b64(Save.rle(ch.meteor)) : null, ch.rev]; },

  /* ---------- Host ---------- */
  async host(kind) {
    if (this.role || !G || Game.state !== 'play') return;
    this.kind = kind; this.code = String(100000 + Math.floor(Math.random() * 900000));
    const tr = this.tr = kind === 'local' ? NetLocal : NetPeer;
    this.status = 'Starte …'; this.refresh();
    try {
      await tr.start(true, this.code, {
        onReady: () => { this.role = 'host'; this.status = 'Bereit – Code weitergeben.'; this.refresh(); UI.toast('Koop gestartet. Einladungscode: ' + this.code, 'good', 8000); },
        onOpen: id => { },
        onData: (id, m) => this.hostData(id, m),

  },
  remotePlayer(id, name) {
    const used = new Set([...this.peers.values()].map(p => p.color));
    const color = PLAYER_COLORS.slice(1).find(c => !used.has(c)) || PLAYER_COLORS[1];
    const dep = Buildings.mainDepot(), c = Buildings.center(dep);
    const rp = Object.create(Player);
    Object.assign(rp, { id: 'p' + id.slice(-6), peer: id, name, color, x: c.x + (Math.random() - 0.5) * 6, y: dep.y + dep.h + 3, px: 0, py: 0, dir: -Math.PI / 2, tx: 0, ty: 0, ptx: 0, pty: 0,
      load: new Float64Array(NGOODS), veh: null, cleaning: false, cleanFx: 0, moving: false, bob: 0, view: null, known: new Map(), bg: null, lastIn: performance.now(), emote: null });

  },
  hostData(id, m) {
    if (!m || !m.t) return;
    let rp = this.peers.get(id);
    if (m.t === 'join') {
      if (m.v !== CONFIG.version) { this.send(id, { t: 'deny', why: 'Unterschiedliche Spielversion (Host ' + CONFIG.version + ', Sie ' + m.v + '). Bitte beide Seiten neu laden.' }); setTimeout(() => this.tr.drop(id), 300); return; }
      if (this.banned.has(id) || this.banned.has(m.name)) { this.send(id, { t: 'deny', why: 'Der Host hat Sie von diesem Spiel ausgeschlossen.' }); setTimeout(() => this.tr.drop(id), 300); return; }
      if (this.peers.size >= CONFIG.net.maxPlayers - 1) { this.send(id, { t: 'deny', why: 'Die Crew ist voll (max. ' + CONFIG.net.maxPlayers + ' Personen).' }); setTimeout(() => this.tr.drop(id), 300); return; }

    if (!rp) return;
    if (m.t === 'in') {
      const now = performance.now(), dt = Math.min(0.25, (now - rp.lastIn) / 1000); rp.lastIn = now;
      rp.px = rp.x; rp.py = rp.y; rp.ptx = rp.tx; rp.pty = rp.ty;
      rp.x = U.wrapX(m.x); rp.y = m.y; rp.dir = m.dir; rp.tx = U.wrapX(m.tx); rp.ty = m.ty; rp.moving = m.mv; rp.view = m.view;
      const v = rp.veh;

        v.nx = U.wrapX(m.vx); v.ny = m.vy; v.na = m.va; v.vx = m.vvx || 0; v.vy = m.vvy || 0; rp.x = v.nx; rp.y = v.ny;

        }
      } else if (m.cl) {
        if (v) { v.x = U.wrapX(rp.x + Math.cos(rp.dir) * 1.1); v.y = rp.y + Math.sin(rp.dir) * 1.1; v.a = rp.dir; }
        const budget = Math.min(Economy.toolPower() * dt, rp.ctxCap() - rp.ctxLoad());
        if (budget > 0) { const kg = World.stroke(rp.ptx, rp.pty, rp.tx, rp.ty, Economy.toolRadius(), budget, false, Economy.fx('yield')); Player.takeCol.call(rp, kg); }
      } else if (v) { v.x = U.wrapX(rp.x + Math.cos(rp.dir) * 1.1); v.y = rp.y + Math.sin(rp.dir) * 1.1; v.a = rp.dir; }

  },
  dropPeer(id, why) {

  },
  hostTick(dt) {

    for (const [id, rp] of this.peers) {

      if (rp.rx === undefined || Math.abs(U.dx(rp.rx, rp.x)) > 20 || Math.abs(rp.ry - rp.y) > 20) { rp.rx = rp.x; rp.ry = rp.y; rp.rtx = rp.tx; rp.rty = rp.ty; }

    const all = [[0, this.name || 'Host', PLAYER_COLORS[0], Player.x, Player.y, Player.dir, Player.tx, Player.ty, Player.cleaning ? 1 : 0, Player.veh ? Player.veh.id : 0, this.emote]];
    for (const rp of this.peers.values()) all.push([rp.id, rp.name, rp.color, rp.x, rp.y, rp.dir, rp.tx, rp.ty, rp.cleaning ? 1 : 0, rp.veh ? rp.veh.id : 0, rp.emote]);
    const veh = Vehicles.list.map(v => [v.id, v.type, +v.x.toFixed(2), +v.y.toFixed(2), +v.a.toFixed(3), Math.round(Vehicles.loadKg(v) * 10) / 10, v.incoming > 0 ? 1 : 0, v.driver || (v === Player.veh ? 'host' : 0), v.up.speed, v.up.width, v.up.cap]);
    const rob = Robots.list.map(r => [r.id, r.model, +r.x.toFixed(2), +r.y.toFixed(2), +r.a.toFixed(2), r.state, r.warn ? 1 : 0, Math.round(Robots.loadKg(r)), r.hangar, r.assign]);
    const slow = this.t - (this.stateT || 0) >= 0.5;
    let state = null;
    if (slow) {
      this.stateT = this.t;
      G.incRate = Economy.incomePerMin();
      const g = {}; for (const k of ['incRate', 'money', 'licence', 'tools', 'tool', 'up', 'research', 'fp', 'orders', 'swapsUsed', 'swapHour', 'stats', 'demand', 'day', 't', 'ev', 'robotUp', 'secDone', 'finds', 'nextId', 'ended', 'mission', 'avgVal']) g[k] = G[k];
      const sp = []; for (let i = 0; i < NSEC * NSEC; i++) sp.push(Math.round(World.secProgress[i] * 10000));
      const cs = []; for (const ci of this.statDirty || []) cs.push(ci, World.cleanable[ci], World.chunkClean[ci]); this.statDirty = new Set();
      state = { g, sp, cs, assigns: Robots.assigns };
    }

    if (build) { this.buildDirty = false; this.buildT = this.t; Buildings.save(); }
    for (const [id, rp] of this.peers) {
      const msg = { t: 'snap', p: all.filter(p => p[0] !== rp.id), v: veh, r: rob, you: { load: Array.from(rp.load), veh: rp.veh ? rp.veh.id : 0 } };

    Bus.on('removed', b => Actors.onRemoved(b, Buildings.price(b.type)));

  async newGame(slot, seed, mission) {
    this.showWait('Der Mond wird vermessen …', 0.2);

  async loadGame(slot) {

  startWorld(chunks) {

    for (let i = 0; i < cs.length; i += 3) { const ci = cs[i]; World.cleanable[ci] = cs[i + 1]; World.chunkClean[ci] = cs[i + 2]; const s = World.secOfChunk(ci); World.secCleanable[s] += cs[i + 1]; World.secClean[s] += cs[i + 2]; World.secKnown[s]++; }

  // Offline-Fortschritt: Abwesenheit nachsimulieren (max. 8 h, 50 % / 80 % Effizienz)

  fullscreen() {

  tick(dt) {
    Prof.start('logic');
    Actions.run();
    const I = Input.poll();

    G.t += dt;
    Player.update(dt, I);
    Vehicles.update(dt);
    Buildings.update(dt);
    Robots.update(dt);
    Progression.update(dt);

  // Partikel, Fußspuren, Reifenspuren
  effects(dt) {
    const P = Player, v = P.veh && P.veh.def.kind !== 'cart' ? P.veh : null;
    // Roboter-Piepsen in der Nähe
    if (Robots.list.length && VFX.r() < 0.004) { const r = Robots.list[Math.floor(VFX.r() * Robots.list.length)]; if (r.near && U.dist2(r.x, r.y, P.x, P.y) < 900) Audio.sfx('robot'); }

    }
  },
};

/* ============================================================================
   15. DEBUG – Pacing-Simulation (beschleunigt), Zeitraffer
   ============================================================================ */
const Debug = {
  timeScale: 1,
  // Modell eines zügigen Spielers auf Basis der CONFIG-Werte (1-s-Schritte)
  pacing(hours) {
    const C = CONFIG, H = (hours || 12) * 3600;
    const kgCell = r => C.regions[r].density[0] / 255 * C.world.kgPerFullCell * (C.regions[r].massMul || 1);
    const val = r => r === R_RUECK ? 1.6 : C.goods[C.regions[r].dust].value;
    if (!World.secRegion) World.init(CONFIG.world.seed);
    const secAvail = [0, 0, 0, 0, 0, 0, 0]; for (let i = 0; i < 576; i++) secAvail[World.secRegion[i]]++;
    secAvail[R_GLITZER] += 12;   // viele Inseln liegen über Sektorgrenzen
    const secDone = [0, 0, 0, 0, 0, 0, 0];
    const S = { t: 0, money: 0, tool: 0, up: { container: 0, shoes: 0, suction: 0, haggle: 0 }, veh: -1, vu: { speed: 0, width: 0, cap: 0 }, lic: 0, rob: [0, 0, 0, 0], ru: { speed: 0, radius: 0, cap: 0 }, cells: 0, secCells: 0, sectors: 0, fp: 0, res: {}, proc: 0, belts: false, hangars: 0, region: 0 };
    const ev = [], mark = txt => { if (!ev.some(e => e.txt === txt)) ev.push({ t: S.t, txt }); };
    const upV = (id, l) => { const d = C.upgrades.find(u => u.id === id); return d.mode === 'mul' ? d.start * Math.pow(1 + d.step, l) : d.start + (d.start || 1) * d.step * l; };
    const upP = (id, l) => C.upgrades.find(u => u.id === id).base * Math.pow(C.upgradeGrowth, l);
    const fx = k => { let v = ADDITIVE_FX.has(k) ? 0 : 1; for (const br of C.research) for (const n of br.nodes) if (S.res[n.id] && n.fx[k] !== undefined) v = ADDITIVE_FX.has(k) ? v + n.fx[k] : v * n.fx[k]; return v; };
    const RU = C.robotUpgrades, VU = C.vehicleUpgrades;
    const robotRate = m => { const d = C.robots[m]; return 2 * d.radius * (1 + RU[1].step * S.ru.radius) * fx('robotRadius') * 0.86 * d.speed * (1 + RU[0].step * S.ru.speed) * fx('robotSpeed'); };
    const nRob = () => S.rob.reduce((a, b) => a + b, 0);
    const buy = p => { if (S.money < p) return false; S.money -= p; return true; };
    let income = 20, carpetStart = -1;
    for (S.t = 0; S.t < H; S.t++) {
      let best = -1; for (const r of C.regions) if (r.licence <= S.lic && secDone[r.id] < secAvail[r.id] && (best < 0 || kgCell(r.id) * val(r.id) > kgCell(best) * val(best))) best = r.id;
      const mapDone = best < 0; if (best < 0) best = 0;
      const kc = kgCell(best), suction = upV('suction', S.up.suction);
      let kgps, cap, spd, dist;
      if (S.veh >= 0) { const v = C.vehicles[S.veh]; const w = v.width + S.vu.width + fx('vehWidth'), sp = v.speed * (1 + VU[0].step * S.vu.speed) * fx('vehSpeed'); kgps = Math.min(w * sp * C.vehiclePowerPerCell * suction * fx('vehPower'), w * sp * 0.78 * kc); cap = v.cap * (1 + VU[2].step * S.vu.cap) * fx('vehCap'); spd = sp; dist = S.hangars ? 60 : 100; }
      else { const tr = C.tools[S.tool].radius * fx('toolRadius'); kgps = Math.min(C.tools[S.tool].power * suction * fx('toolPower'), 2 * tr * upV('shoes', S.up.shoes) * 0.7 * kc * 1.6); cap = upV('container', S.up.container) * fx('container') + (S.cart ? C.vehicles[0].cap : 0); spd = upV('shoes', S.up.shoes) * (S.cart ? 0.8 : 1); dist = Math.min(110, 6 + 0.8 * Math.sqrt(S.secCells / Math.PI)); }
      const trip = 2 * dist / spd + 2, eff = (cap / kgps) / (cap / kgps + trip);
      const playerKg = mapDone ? 0 : kgps * eff * 0.9;
      let robotKg = 0;
      for (let m = 0; m < 4; m++) if (S.rob[m] && !mapDone) {
        const d = C.robots[m], rate = robotRate(m), capR = d.cap * (1 + RU[2].step * S.ru.cap) * fx('robotCap'), sp = d.speed * (1 + RU[0].step * S.ru.speed) * fx('robotSpeed');
        const fill = capR / (rate * kc), tripR = 2 * (S.belts ? 45 : 110) / sp;
        const e = (fx('selfEmpty') && m > 0 ? 0.95 : fill / (fill + tripR)) * 0.85;
        robotKg += S.rob[m] * rate * kc * e;
      }
      const procMul = [1, 1.3, 1.6, 2.1][S.proc];
      const demand = S.t < C.economy.demandInterval && C.regions[best].dust === 0 ? 1.5 : 1.08;
      const mul = upV('haggle', S.up.haggle) * (1 + S.sectors * C.economy.sectorIncomeBonus) * demand * fx('income');
      const base = (playerKg + robotKg * procMul) * val(best) * mul;
      // Aufträge: früh viele kleine Prämien, später ca. +45 %
      const orders = S.t < 1200 ? Math.max(base * 0.6, C.orders.minReward / 75) : base * 0.45;
      const inc = base + orders;
      income = income * 0.985 + inc * 60 * 0.015;
      if (this.trace && S.t % 300 === 0) this.trace.push([Math.round(S.t / 60), Math.round(income), S.lic, S.sectors, Math.round(playerKg / kc), Math.round(robotKg / kc), S.rob.join('/'), S.ru.speed + '/' + S.ru.radius, S.veh + ':' + S.vu.width, best]);
      S.money += inc;
      const dc = (playerKg + robotKg) / kc; S.cells += dc; S.secCells += dc;
      if (S.t === 45) { mark('Erste Kapsel gestartet'); S.money += C.economy.tutorialBonus; }
      if (S.t === 200) S.money += 2 * C.findReward.base;   // zwei Fundstücke am Start
      while (S.secCells >= 65536 * 0.98 && S.sectors < 576) { S.secCells -= 65536 * 0.98; S.sectors++; secDone[best]++; S.fp++; S.money += C.regions[best].sectorBonus * fx('sectorBonus'); if (S.sectors === 1) mark('Erster Sektor abgeschlossen'); }
      S.fp += 1 / 200;
      if (S.t % 5) continue;
      const nextTool = C.tools[S.tool + 1];
      if (nextTool && nextTool.licence <= S.lic && buy(nextTool.price)) { S.tool++; mark(nextTool.name + ' gekauft'); }
      if (!S.cart && S.veh < 0 && S.tool >= 2 && buy(C.vehicles[0].price)) { S.cart = true; mark('Schubkarre gekauft'); }
      const nv = C.vehicles.findIndex((v, i) => i > S.veh && i > 0 && v.licence <= S.lic);
      if (nv > 0 && C.vehicles[nv].price < Math.max(1200, income * 30) && buy(C.vehicles[nv].price)) { S.veh = nv; S.vu = { speed: 0, width: 0, cap: 0 }; mark(C.vehicles[nv].name + ' gekauft'); }
      if (S.veh >= 0) for (const k of ['width', 'cap', 'speed']) { const p = C.vehicles[S.veh].price * C.vehicleUpgradeCost * Math.pow(C.vehicleUpgradeGrowth, S.vu[k]); if (S.vu[k] < 5 && p < income * 3 && buy(p)) S.vu[k]++; }
      // auf das nächste Werkzeug/Fahrzeug sparen, wenn es in Reichweite ist
      const nvp = nv > 0 ? C.vehicles[nv].price : Infinity, ntp = nextTool && nextTool.licence <= S.lic ? nextTool.price : Infinity, target = Math.min(nvp, ntp);
      const saving = target < Infinity && target < income * 5;
      for (const k of ['container', 'suction', 'haggle', 'shoes']) { const p = upP(k, S.up[k]); if (S.up[k] < 15 && p < income * 1.5 && (!saving || p < target * 0.12) && buy(p)) S.up[k]++; }
      if (S.lic < 6) { const L = C.licences[S.lic]; if (S.sectors >= L.sectors && buy(L.price * fx('licencePrice'))) { S.lic++; mark('Lizenz ' + S.lic + ' (' + L.name + ')'); if (S.lic === 6) mark('Rückseite erreicht'); } }
      if (S.lic >= 1) {
        if (S.hangars * (6 + fx('hangarSlots')) <= nRob() && buy(5000 + 1500)) { S.hangars++; if (S.hangars === 1) mark('Erster Hangar'); }
        if (!S.belts && S.hangars && buy(300 + 300 + 60 * 5)) { S.belts = true; mark('Erstes Förderband'); }
        const fleet = C.robotFleet[S.lic] + fx('fleet');
        let top = -1; for (let m = 3; m >= 0; m--) if (C.robots[m].licence <= S.lic) { top = m; break; }
        if (top >= 0) {
          const p = C.robots[top].price * fx('robotPrice');
          if (nRob() < fleet) { if (nRob() < S.hangars * (6 + fx('hangarSlots')) && p < income * 6 && buy(p)) { S.rob[top]++; const n = nRob(); if (n === 1) mark('Erster Roboter'); if (n === 5) mark('5 Roboter'); if (n === 20) mark('20 Roboter'); if (n === 50) mark('50 Roboter'); } }
          else { let w = -1; for (let m = 0; m < top; m++) if (S.rob[m]) { w = m; break; } if (w >= 0 && p - C.robots[w].price < income * 6) { S.money += C.robots[w].price * fx('robotPrice'); S.rob[w]--; if (buy(p)) S.rob[top]++; else S.rob[w]++; } }
        }
      }
      if (S.lic >= 2 && S.proc < 1 && buy(4000 * 2)) { S.proc = 1; mark('Verdichter läuft'); }
      if (S.lic >= 3 && S.proc < 2 && buy(18000 + 25000 * 2)) { S.proc = 2; mark('Ziegelpresse + Teleport-Netz'); }
      if (S.lic >= 4 && S.proc < 3 && buy(90000)) { S.proc = 3; mark('Mondglas-Produktion'); }
      for (const k of ['speed', 'radius', 'cap']) { const p = C.robotUpgradeBase * Math.pow(C.robotUpgradeGrowth, S.ru[k]); if (S.ru[k] < 10 && nRob() > 3 && p < income * 3 && buy(p)) S.ru[k]++; }
      for (const br of C.research) for (let i = 0; i < br.nodes.length; i++) { const n = br.nodes[i]; if (S.res[n.id]) continue; if (S.fp >= n.cost) { S.fp -= n.cost; S.res[n.id] = 1; } break; }
      if (S.lic >= 6 && carpetStart < 0) carpetStart = S.sectors;
      if (carpetStart >= 0 && S.sectors - carpetStart >= 24) mark('Großer Teppichkrater gereinigt');
    }
    return { events: ev, final: { money: S.money, income, sectors: S.sectors, robots: nRob(), licence: S.lic } };
  },
  showPacing() {
    const r = this.pacing(12);
    UI.panel({ title: 'Pacing-Simulation', sub: 'Modell eines zügigen Spielers mit den aktuellen CONFIG-Werten (12 Std. in Millisekunden)', icon: 'chart', render: b => {
      const kv = U.h('div', { class: 'kv' });
      for (const e of r.events) { kv.appendChild(U.h('span', { text: e.txt })); kv.appendChild(U.h('span', { text: U.time(e.t) })); }
      b.appendChild(kv);
      b.appendChild(U.h('div', { class: 'sect-title', text: 'Zielwerte (Pacing-Tabelle)' }));
      const t2 = U.h('div', { class: 'kv' });
      for (const p of CONFIG.pacing) { t2.appendChild(U.h('span', { text: p.goal })); t2.appendChild(U.h('span', { text: p.t + ' Min.' })); }
      b.appendChild(t2);
      b.appendChild(U.h('div', { class: 'note', style: { marginTop: '10px' }, text: 'Nach 12 Std.: ' + U.money(r.final.income) + '/Min., ' + r.final.sectors + ' Sektoren, ' + r.final.robots + ' Roboter, Lizenz ' + r.final.licence + '.' }));
    } });
    return r;
  },
  setScale(k) { this.timeScale = k; UI.toast('Zeitraffer ×' + k); },
};

window.addEventListener('load', () => { Game.boot().catch(e => { console.error(e); const b = document.getElementById('boot'); b.classList.remove('gone'); b.textContent = 'Fehler beim Start: ' + e.message; }); });

</script>
