      for (let i = 0; i < n && budgetKg - tot > 1e-9; i++) {
        const t0 = i / n, t1 = (i + 1) / n;
        tot += this.stroke(ax + (bx - ax) * t0, ay + (by - ay) * t0, ax + (bx - ax) * t1, ay + (by - ay) * t1, r, budgetKg - tot, full, yieldMul);
        for (let k = 0; k < NGOODS; k++) acc[k] += col[k];
      }
      col.set(acc); return tot;
    }
    const R = r + 0.5, sc = this._sc, ym = yieldMul || 1;
    const x0 = Math.floor(Math.min(ax, bx) - R), x1 = Math.floor(Math.max(ax, bx) + R);
    const y0 = Math.max(0, Math.floor(Math.min(ay, by) - R)), y1 = Math.min(WSIZE - 1, Math.floor(Math.max(ay, by) + R));
    const sx = bx - ax, sy = by - ay, sl2 = sx * sx + sy * sy;
    let n = 0, demand = 0, lci = -1, lb = null, lch = null;
    for (let y = y0; y <= y1; y++) {
      const cyy = y + 0.5;
      for (let xu = x0; xu <= x1; xu++) {
        const cxx = xu + 0.5;
        let t = sl2 > 0 ? ((cxx - ax) * sx + (cyy - ay) * sy) / sl2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
        const ddx = cxx - (ax + sx * t), ddy = cyy - (ay + sy * t), d = Math.sqrt(ddx * ddx + ddy * ddy);
        let w = R - d; if (w <= 0) continue; if (w > 1) w = 1;
        if (full && d < r) w = 1;
        const x = (xu >= 0 && xu < WSIZE) ? xu : U.wrapI(xu);
        const ci = (y >> 6) * NCH + (x >> 6), li = ((y & 63) << 6) | (x & 63);
        if (ci !== lci) { lci = ci; lb = this.base(ci); lch = this.chunks[ci]; }
        const ch = lch, b = lb;
        if (this.lockMask[b.region[li]]) continue;
        const v = ch ? ch.dust[li] : b.dust[li];
        const m = ch && ch.meteor ? ch.meteor[li] : 0;
        if (v === 0 && m === 0) continue;
        if (n >= 8192) break;
        const mm = (CONFIG.regions[b.region[li]].massMul || 1) * ym;
        const dk = (v + m) * w * KG_UNIT * mm;
        sc.ci[n] = ci; sc.li[n] = li; sc.w[n] = w; sc.x[n] = x; sc.y[n] = y; sc.kg[n] = mm; sc.dk[n] = dk;
        demand += dk;
        n++;
      }
    }
    if (n === 0 || demand <= 0) return 0;
    // Leistung verteilen: Kernzellen (hohe Abdeckung) zuerst, Rest auffüllen
    if (budgetKg >= demand) sc.fr.fill(1, 0, n);
    else {
      let Q = 0, used = 0;
      for (let i = 0; i < n; i++) Q += sc.dk[i] * sc.w[i] * sc.w[i];
      for (let i = 0; i < n; i++) { const r0 = Math.min(sc.dk[i], budgetKg * sc.dk[i] * sc.w[i] * sc.w[i] / Q); sc.fr[i] = r0; used += r0; }
      const left = budgetKg - used;
      if (left > 1e-12) { let Rr = 0; for (let i = 0; i < n; i++) Rr += sc.dk[i] - sc.fr[i]; const k = Rr > 0 ? Math.min(1, left / Rr) : 0; for (let i = 0; i < n; i++) sc.fr[i] += (sc.dk[i] - sc.fr[i]) * k; }
      for (let i = 0; i < n; i++) sc.fr[i] = sc.dk[i] > 0 ? sc.fr[i] / sc.dk[i] : 0;
    }
    let total = 0; lci = -1;
    for (let i = 0; i < n; i++) {
      const ci = sc.ci[i], li = sc.li[i];
      if (ci !== lci) { lci = ci; lch = this.mat(ci); lb = this.base(ci); }
      const ch = lch, b = lb, w = sc.w[i] * sc.fr[i], mm = sc.kg[i];
      // Meteorstaub zuerst
      if (ch.meteor && ch.meteor[li]) {
        const mv = ch.meteor[li], rem = Math.min(mv, Math.floor(mv * w + this._rand()));
        if (rem > 0) { ch.meteor[li] = mv - rem; const kg = rem * KG_UNIT * mm; col[6] += kg; total += kg; }
      }
      const v = ch.dust[li]; if (v === 0) { this._mark(ci, li); continue; }
      let rem = Math.floor(v * w + this._rand()); if (rem > v) rem = v;
      if (rem <= 0) continue;
      let nv = v - rem;
      if (nv <= CLEAN_T) { rem = v; nv = 0; }
      ch.dust[li] = nv;
      const kg = rem * KG_UNIT * mm; col[b.type[li]] += kg; total += kg;
      if (v > CLEAN_T && nv <= CLEAN_T && this.isCleanableT(b.terr[li])) this.cellCleaned(ci, sc.x[i], sc.y[i]);
      this._mark(ci, li);
    }
    this._flushMarks();
    return total;
  },
  _mk: new Map(),
  _mark(ci, li) {
    const lx = li & 63, ly = li >> 6; let d = this._mk.get(ci);
    if (!d) { d = [lx, ly, lx, ly]; this._mk.set(ci, d); }
    else { if (lx < d[0]) d[0] = lx; if (ly < d[1]) d[1] = ly; if (lx > d[2]) d[2] = lx; if (ly > d[3]) d[3] = ly; }
  },
  _flushMarks() { for (const [ci, d] of this._mk) this.markDirty(ci, d[0], d[1], d[2], d[3]); this._mk.clear(); },

  // Koop-Client: Chunk-Daten vom Host übernehmen
  applyChunk(ci, dust, meteor, rev) {
    this.ensureStats(ci);
    let ch = this.chunks[ci];
    if (!ch) { ch = { ci, dust, meteor, rev: rev || 1 }; this.chunks[ci] = ch; }
    else { ch.dust = dust; ch.meteor = meteor; ch.rev = rev || ch.rev + 1; }
    const b = this.base(ci); let clean = 0;
    for (let i = 0; i < 4096; i++) if (dust[i] <= CLEAN_T && this.isCleanableT(b.terr[i])) clean++;
    this.secClean[this.secOfChunk(ci)] += clean - this.chunkClean[ci]; this.chunkClean[ci] = clean;
    this.markTex(ci, 0, 0, 63, 63); this.dirtyMap.add(ci);
  },
  cellCleaned(ci, x, y) {
    this.chunkClean[ci]++;
    if (Net.role === 'host') (Net.statDirty || (Net.statDirty = new Set())).add(ci);
    const s = this.secOfChunk(ci);
    this.secClean[s]++;
    this.updateSector(s);
    G.stats.cells++;
    const fl = this.findsByChunk.get(ci);
    if (fl) for (const f of fl) if (!G.finds[f.id] && Math.floor(f.x) === x && Math.floor(f.y) === y) { G.finds[f.id] = 1; if (this.onFind) this.onFind(f); }
    if (this.onCellClean) this.onCellClean(x, y);
  },

  /* --- Meteorstaub auftragen (Haufen) --- */
  addMeteor(cx, cy, r, peak) {
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let xu = Math.floor(cx - r); xu <= Math.ceil(cx + r); xu++) {
      if (y < 0 || y >= WSIZE) continue;
      const d = Math.hypot(xu + 0.5 - cx, y + 0.5 - cy); if (d > r) continue;
      const x = U.wrapI(xu), ci = (y >> 6) * NCH + (x >> 6), li = ((y & 63) << 6) | (x & 63);
      if (!this.isCleanableT(this.base(ci).terr[li])) continue;
      const ch = this.mat(ci); if (!ch.meteor) ch.meteor = new Uint8Array(4096);
      ch.meteor[li] = Math.min(255, ch.meteor[li] + Math.round(peak * (1 - (d / r) * (d / r) * 0.8)));
      this._mark(ci, li);
    }
    this._flushMarks();
  },

  /* Anteil sauberer Zellen in einem Rechteck (Stichprobe) */
  areaClean(x0, y0, w, h, step) {
    let n = 0, c = 0; step = step || 4;
    for (let y = y0 + step / 2; y < y0 + h; y += step) for (let x = x0 + step / 2; x < x0 + w; x += step) {
      const xi = Math.floor(x), yi = Math.floor(y); if (!this.isCleanableT(this.terrAt(xi, yi))) continue;
      n++; if (this.dustAt(xi, yi) <= CLEAN_T) c++;
    }
    return n ? c / n : 1;
  },
  // Region gesperrt?
  locked(region) { return this.lockMask[region]; },
  lockMask: [false, true, true, true, true, true, true],
  updateLocks() { for (let i = 0; i < 7; i++) this.lockMask[i] = CONFIG.regions[i].licence > G.licence; },
};

/* ============================================================================
   4. ECONOMY – Geld, Preise, Upgrades, Lizenzen, Forschungseffekte
   ============================================================================ */
let G = null;   // aktueller Spielstand (serialisierbar)
const ADDITIVE_FX = new Set(['vehWidth', 'hangarSlots', 'fleet', 'turbo', 'selfEmpty', 'findSensor', 'offlineEff', 'swaps']);

function newState(seed, mission, slot) {
  const st = CONFIG.world.start;
  return {
    v: CONFIG.saveSchema, seed: seed >>> 0, mission: mission || 0, slot: slot || 0, created: Date.now(), saved: 0, version: CONFIG.version,
    t: 0, day: CONFIG.events.dayLength * 0.12, money: CONFIG.player.startMoney, licence: 0,
    tool: 'zahnbuerste', tools: { zahnbuerste: 1 },
    up: { container: 0, shoes: 0, suction: 0, haggle: 0, capsule: 0, magnet: 0 },
    research: {}, fp: 0,
    player: { x: st.x + 0.5, y: st.y + 5.6, dir: -Math.PI / 2, load: new Array(NGOODS).fill(0), veh: 0 },
    vehicles: [], buildings: [], belts: [], robots: [], assigns: [], nextId: 1,
    finds: {}, secDone: [], chunkStats: [],
    orders: [], orderSeq: 1, swapsUsed: 0, swapHour: 0,
    tut: 0, tutSkip: false,
    demand: { type: 0, until: CONFIG.economy.demandInterval },
    ev: { meteor: CONFIG.events.meteor.firstAfter, wind: CONFIG.events.solarWind.firstAfter, windUntil: 0, inspect: CONFIG.events.inspection.firstAfter, insp: null, night: false },
    stats: { cells: 0, kgSold: 0, moneyEarned: 0, capsules: 0, robotCells: 0, robotKg: 0, sectors: 0, ups: 0, builds: 0, findsFound: 0, ordersDone: 0, sandMade: 0, kgByType: new Array(NGOODS).fill(0) },
    avgVal: 1, waypoint: null, ended: false, endSeen: false, lastReal: Date.now(),
  };
}

const Economy = {
  fxCache: null,
  incBuckets: new Float64Array(60), incSec: -1,
  resetFx() { this.fxCache = null; },
  fx(key) {
    if (!this.fxCache) {
      const c = {};
      for (const br of CONFIG.research) for (const n of br.nodes) if (G.research[n.id]) for (const k in n.fx) {
        if (ADDITIVE_FX.has(k)) c[k] = (c[k] || 0) + n.fx[k]; else c[k] = (c[k] || 1) * n.fx[k];
      }
      this.fxCache = c;
    }
    const v = this.fxCache[key];
    return v === undefined ? (ADDITIVE_FX.has(key) ? 0 : 1) : v;
  },
  upDef(id) { return CONFIG.upgrades.find(u => u.id === id); },
  upValue(id, lvl) {
    const d = this.upDef(id); if (lvl === undefined) lvl = G.up[id] || 0;
    if (d.mode === 'mul') return d.start * Math.pow(1 + d.step, lvl);
    return d.start + (d.start || 1) * d.step * lvl;
  },
  upPrice(id, lvl) { const d = this.upDef(id); if (lvl === undefined) lvl = G.up[id] || 0; return Math.round(d.base * Math.pow(CONFIG.upgradeGrowth, lvl) * this.fx('upgradePrice')); },
  containerCap() { return this.upValue('container') * this.fx('container'); },
  walkSpeed() { return this.upValue('shoes'); },
  suction() { return this.upValue('suction'); },
  magnet() { return Math.min(0.9, this.upValue('magnet')); },
  capsuleCooldown() { return CONFIG.depot.capsuleCooldown * this.upValue('capsule'); },
  remoteUnload() { return (G.up.capsule || 0) >= CONFIG.remoteUnloadLevel; },
  tool() { return CONFIG.tools.find(t => t.id === G.tool); },
  toolPrice(t) { return Math.round(t.price * this.fx('upgradePrice')); },
  toolRadius() { return this.tool().radius * this.fx('toolRadius'); },
  toolPower() { return this.tool().power * this.suction() * this.fx('toolPower'); },
  buildPrice(def) { return Math.round(def.price * this.fx('buildPrice')); },
  robotPrice(def) { return Math.round(def.price * this.fx('robotPrice')); },
  licenceDef(lvl) { return CONFIG.licences[lvl - 1]; },
  licencePrice(lvl) { return Math.round(this.licenceDef(lvl).price * this.fx('licencePrice')); },
  // Wert pro kg (Meteorstaub: 3-facher Wert der besten freigeschalteten Rohstaubart)
  value(type) {
    if (type === 6) { let best = 1; for (const r of CONFIG.regions) if (r.licence <= G.licence && r.dust >= 0) best = Math.max(best, CONFIG.goods[r.dust].value); return best * 3; }
    return CONFIG.goods[type].value;
  },
  incomeMul() {
    return this.upValue('haggle') * (1 + G.stats.sectors * CONFIG.economy.sectorIncomeBonus) * (1 + G.mission * CONFIG.economy.missionBonus)
      * this.fx('income') * (1 + (typeof Net !== 'undefined' ? Net.crewBonus() : 0));
  },
  demandMul(type) { return G.demand.type === type ? 1 + CONFIG.economy.demandBonus * this.fx('demand') : 1; },
  // verkauft eine Warenliste (kg pro Ware) und schreibt Geld gut
  sell(kg, source) {
    let total = 0, kgT = 0;
    const m = this.incomeMul() * (source === 'ramp' ? this.fx('rampBonus') : 1);
    for (let t = 0; t < NGOODS; t++) if (kg[t] > 0) {
      total += kg[t] * this.value(t) * this.demandMul(t) * m; kgT += kg[t];
      G.stats.kgByType[t] += kg[t];
    }
    if (total <= 0) return 0;
    G.money += total; G.stats.kgSold += kgT; G.stats.moneyEarned += total;
    if (kgT > 1) G.avgVal = G.avgVal * 0.9 + (total / kgT) * 0.1;
    this.track(total);
    Bus.emit('sold', kg, total, source);
    return total;
  },
  grant(amount, reason) {
    if (amount <= 0) return;
    G.money += amount; G.stats.moneyEarned += amount; this.track(amount);
    Bus.emit('grant', amount, reason);
  },
  spend(n) { if (G.money + 1e-6 < n) return false; G.money -= n; Bus.emit('spend', n); return true; },
  track(v) { const s = Math.floor(G.t); this.rollTo(s); this.incBuckets[s % 60] += v; },
  rollTo(s) {
    if (this.incSec < 0 || s - this.incSec >= 60) { this.incBuckets.fill(0); this.incSec = s; return; }
    while (this.incSec < s) { this.incSec++; this.incBuckets[this.incSec % 60] = 0; }
  },
  incomePerMin() {
    this.rollTo(Math.floor(G.t));
    let sum = 0; for (let i = 0; i < 60; i++) sum += this.incBuckets[i];
    return sum * 60 / Math.min(60, Math.max(10, G.t));
  },
  rawTypesUnlocked() {
    const out = []; for (const r of CONFIG.regions) if (r.licence <= G.licence && r.dust >= 0 && !out.includes(r.dust)) out.push(r.dust);
    return out;
  },
  updateDemand() {
    if (G.t < G.demand.until) return;
    const types = this.rawTypesUnlocked(); let t = types[Math.floor(Math.random() * types.length)];
    if (types.length > 1 && t === G.demand.type) t = types[(types.indexOf(t) + 1) % types.length];
    G.demand.type = t; G.demand.until = G.t + CONFIG.economy.demandInterval;
    if (G.t > 60) UI.radio(TXT.radio.demand.replace('{d}', CONFIG.goods[t].name).replace('{p}', Math.round(CONFIG.economy.demandBonus * this.fx('demand') * 100)));
  },
  canBuyLicence() {
    const n = G.licence + 1; if (n > 6) return { ok: false, why: 'Höchste Lizenz erreicht' };
    const d = this.licenceDef(n), p = this.licencePrice(n);
    if (G.stats.sectors < d.sectors) return { ok: false, why: 'Noch ' + (d.sectors - G.stats.sectors) + ' Sektor(en) abschließen' };
    if (G.money < p) return { ok: false, why: 'Es fehlen ' + U.money(p - G.money) };
    return { ok: true };
  },
  buyLicence() {
    const c = this.canBuyLicence(); if (!c.ok) return false;
    if (!this.spend(this.licencePrice(G.licence + 1))) return false;
    G.licence++;
    Bus.emit('licence', G.licence);
    return true;
  },
};

/* ============================================================================
   5. PLAYER & VEHICLES – Bewegung, Kollision, Werkzeuge, Kapazität
   ============================================================================ */
// Kollision: Zellen, die ein Beweger nicht betreten darf
const Move = {
  cellBlocked(x, y, kind) {
    if (y < 2 || y >= WSIZE - 2) return true;
    const t = World.terrAt(x, y);
    if (kind === 'walk') { if (t === T_ROCK || t === T_GRAVEL || t === T_CANYON) return true; }
    else if (kind === 'veh') { if (t === T_ROCK || t === T_GRAVEL || t === T_CANYON || t === T_RIMS || t === T_RIML) return true; }
    else if (kind === 'crawl') { if (t === T_ROCK || t === T_CANYON || t === T_RIML) return true; }
    else if (kind === 'hover') { if (t === T_ROCK) return true; }
    if (World.locked(World.regionAt(x, y))) return true;
    if (Buildings.solidAt(x, y)) return true;
    return false;
  },
  circleFree(px, py, r, kind) {
    const x0 = Math.floor(px - r), x1 = Math.floor(px + r), y0 = Math.floor(py - r), y1 = Math.floor(py + r);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const nx = Math.max(x, Math.min(px, x + 1)), ny = Math.max(y, Math.min(py, y + 1));
      const dx = px - nx, dy = py - ny;
      if (dx * dx + dy * dy >= r * r) continue;
      if (this.cellBlocked(x, y, kind)) return false;
    }
    return true;
  },
  // bewegt o (x,y) um (dx,dy) mit Gleiten an Hindernissen; gibt Bits zurück (1 = x blockiert, 2 = y blockiert)
  slide(o, dx, dy, r, kind) {
    let hit = 0;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.45));
    const sx = dx / steps, sy = dy / steps;
    for (let i = 0; i < steps; i++) {
      if (sx !== 0) { if (this.circleFree(o.x + sx, o.y, r, kind)) o.x += sx; else hit |= 1; }
      if (sy !== 0) { if (this.circleFree(o.x, o.y + sy, r, kind)) o.y += sy; else hit |= 2; }
    }
    o.x = U.wrapX(o.x);
    return hit;
  },
  // Geschwindigkeitsfaktor durch Gelände (Kraterränder, Hänge) unter Berücksichtigung der Magnetstiefel
  terrainFactor(x, y, walking) {
    const xi = Math.floor(x), yi = Math.floor(y), t = World.terrAt(xi, yi), reg = World.regionAt(xi, yi), mag = Economy.magnet();
    let f = 1;
    if (walking && (t === T_RIMS || t === T_RIML)) f *= 1 - (1 - CONFIG.player.rimSlow) * (1 - mag);
    if (reg === R_KRATER) f *= 1 - (1 - CONFIG.player.slopeSlow) * (1 - mag);
    return f;
  },
  // freie Stelle um (x,y) suchen (für Aussteigen, Fahrzeuglieferung)
  findFree(x, y, r, kind, maxR) {
    if (this.circleFree(x, y, r, kind)) return { x, y };
    for (let rad = 1; rad <= (maxR || 12); rad += 0.75) for (let a = 0; a < 16; a++) {
      const px = U.wrapX(x + Math.cos(a / 16 * Math.PI * 2) * rad), py = y + Math.sin(a / 16 * Math.PI * 2) * rad;
      if (this.circleFree(px, py, r, kind)) return { x: px, y: py };
    }
    return null;
  },
};

const Player = {
  x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, dir: 0, tx: 0, ty: 0, ptx: 0, pty: 0,
  load: new Float64Array(NGOODS), cleaning: false, cleanFx: 0, bob: 0, full: false, veh: null, moving: false, speed: 0,
  stepAcc: 0, lastStepSide: 0,
  init() {
    const p = G.player;
    this.x = this.px = p.x; this.y = this.py = p.y; this.dir = p.dir; this.vx = this.vy = 0;
    this.load.fill(0); for (let i = 0; i < NGOODS; i++) this.load[i] = p.load[i] || 0;
    this.veh = p.veh ? Vehicles.byId(p.veh) : null;
    if (this.veh) { this.x = this.veh.x; this.y = this.veh.y; }
    this.tx = this.ptx = this.x; this.ty = this.pty = this.y;
  },
  save() { const p = G.player; p.x = this.x; p.y = this.y; p.dir = this.dir; p.load = Array.from(this.load); p.veh = this.veh ? this.veh.id : 0; },
  loadKg() { let s = 0; for (let i = 0; i < NGOODS; i++) s += this.load[i]; return s; },
  ownCap() { return Economy.containerCap(); },
  // Gesamt-Ladung und -Kapazität im aktuellen Kontext (zu Fuß / Schubkarre / Fahrzeug)
  ctxLoad() { const v = this.veh; if (!v) return this.loadKg(); if (v.def.kind === 'cart') return this.loadKg() + Vehicles.loadKg(v); return Vehicles.loadKg(v); },
  ctxCap() { const v = this.veh; if (!v) return this.ownCap(); if (v.def.kind === 'cart') return this.ownCap() + Vehicles.cap(v); return Vehicles.cap(v); },
  // Staub aufnehmen (World.col) – zuerst eigener Behälter, Rest in die Schubkarre
  takeCol(kgTotal) {
    if (kgTotal <= 0 || (this === Player && Net.isClient())) return;
    const free = Math.max(0, this.ownCap() - this.loadKg());
    const toSelf = Math.min(1, free / kgTotal);
    for (let t = 0; t < NGOODS; t++) { const k = World.col[t]; if (!k) continue; this.load[t] += k * toSelf; if (toSelf < 1 && this.veh) this.veh.load[t] += k * (1 - toSelf); }
    Bus.emit('collect', kgTotal);
  },
  update(dt, I) {
    this.px = this.x; this.py = this.y; this.ptx = this.tx; this.pty = this.ty;
    const v = this.veh;
    if (v && v.def.kind !== 'cart') { Vehicles.drive(v, dt, I); this.x = v.x; this.y = v.y; this.dir = v.a; this.cleaning = I.clean && Vehicles.loadKg(v) < Vehicles.cap(v) - 0.01; this.tx = this.x; this.ty = this.y; return; }
    // zu Fuß (oder mit Schubkarre)
    const P = CONFIG.player;
    let mx = I.mx, my = I.my; const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
    const reg = World.regionAt(Math.floor(this.x), Math.floor(this.y)), ice = CONFIG.regions[reg].slippery;
    const cap = this.ctxCap(), full = this.ctxLoad() >= cap - 0.005;
    this.full = full;
    const cleaning = I.clean && !full;
    let spd = Economy.walkSpeed() * Move.terrainFactor(this.x, this.y, true);
    if (I.clean && !Economy.fx('turbo')) spd *= P.cleanSpeedMul;
    if (v) spd *= 0.8;
    const acc = ice ? P.iceAccel + (P.accel - P.iceAccel) * Economy.magnet() : P.accel;
    const k = 1 - Math.exp(-acc * dt);
    this.vx += (mx * spd - this.vx) * k; this.vy += (my * spd - this.vy) * k;
    const r = v ? 0.75 : P.radius;
    const hit = Move.slide(this, this.vx * dt, this.vy * dt, r, 'walk');
    if (hit & 1) this.vx *= 0.3; if (hit & 2) this.vy *= 0.3;
    this.speed = Math.hypot(this.vx, this.vy);
    this.moving = this.speed > 0.3;
    if (ml > 0.15) this.dir = U.angLerp(this.dir, Math.atan2(my, mx), 1 - Math.exp(-14 * dt));
    if (this.moving) { this.bob += dt * this.speed * 1.4; this.stepAcc += this.speed * dt; }
    // Werkzeugposition: Richtung Maus (Desktop) oder Blickrichtung
    let aim = this.dir;
    if (I.aimX !== null && !v) { const ax = U.dx(this.x, I.aimX), ay = I.aimY - this.y; if (ax * ax + ay * ay > 0.04) aim = Math.atan2(ay, ax); }
    const rad = Economy.toolRadius(), reach = P.toolReach + rad * 0.45;
    let tx = this.x + Math.cos(aim) * reach, ty = this.y + Math.sin(aim) * reach;
    if (rad < 1.3) { const sn = 0.55; tx = U.lerp(tx, Math.floor(tx) + 0.5, sn); ty = U.lerp(ty, Math.floor(ty) + 0.5, sn); }
    this.tx = U.wrapX(tx); this.ty = ty;
    if (v) { v.x = U.wrapX(this.x + Math.cos(this.dir) * 1.1); v.y = this.y + Math.sin(this.dir) * 1.1; v.a = this.dir; }
    this.cleaning = cleaning;
    if (cleaning) {
      const budget = Math.min(Economy.toolPower() * dt, cap - this.ctxLoad());
      const sx = Math.abs(U.dx(this.ptx, this.tx)) > 3 ? this.tx : this.ptx, sy = Math.abs(this.pty - this.ty) > 3 ? this.ty : this.pty;
      const kg = World.stroke(sx, sy, this.tx, this.ty, rad, budget, false, Economy.fx('yield'));
      this.takeCol(kg);
      this.cleanFx = kg / dt;
    } else this.cleanFx = 0;
  },
  // Abladen an einer Abgabestelle (Depot, Trichter, Hangar)
  unloadTo(b) {
    let moved = 0;
    const add = (arr) => { for (let t = 0; t < NGOODS; t++) if (arr[t] > 0) { moved += arr[t]; Buildings.deliver(b, t, arr[t]); arr[t] = 0; } };
    add(this.load); if (this.veh) add(this.veh.load);
    if (moved > 0) Bus.emit('unload', moved, b, this);
    return moved;
  },
};

const Vehicles = {
  list: [],
  def(type) { return CONFIG.vehicles.find(v => v.id === type); },
  byId(id) { return this.list.find(v => v.id === id) || null; },
  init() {
    this.list = G.vehicles.map(s => this.fromSave(s));
  },
  fromSave(s) {
    const v = { id: s.id, type: s.type, def: this.def(s.type), x: s.x, y: s.y, a: s.a || 0, px: s.x, py: s.y, pa: s.a || 0, vx: 0, vy: 0, fs: 0,
      up: Object.assign({ speed: 0, width: 0, cap: 0 }, s.up), load: new Float64Array(NGOODS), incoming: s.incoming || 0, garage: s.garage || 0, spin: 0 };
    if (s.load) for (let i = 0; i < NGOODS; i++) v.load[i] = s.load[i] || 0;
    return v;
  },
  save() { G.vehicles = this.list.map(v => ({ id: v.id, type: v.type, x: v.x, y: v.y, a: v.a, up: v.up, load: Array.from(v.load), incoming: v.incoming, garage: v.garage })); },
  loadKg(v) { let s = 0; for (let i = 0; i < NGOODS; i++) s += v.load[i]; return s; },
  cap(v) { return v.def.cap * (1 + CONFIG.vehicleUpgrades[2].step * v.up.cap) * Economy.fx('vehCap'); },
  maxSpeed(v) { return v.def.speed * (1 + CONFIG.vehicleUpgrades[0].step * v.up.speed) * Economy.fx('vehSpeed'); },
  width(v) { return v.def.width + v.up.width + Economy.fx('vehWidth'); },
  power(v) { return this.width(v) * this.maxSpeed(v) * CONFIG.vehiclePowerPerCell * Economy.suction() * Economy.fx('vehPower'); },
  kind(v) { return v.def.hover ? 'hover' : v.def.smallRims ? 'crawl' : 'veh'; },
  upPrice(v, key) { const lvl = v.up[key]; return Math.round(v.def.price * CONFIG.vehicleUpgradeCost * Math.pow(CONFIG.vehicleUpgradeGrowth, lvl) * Economy.fx('upgradePrice')); },
  buy(type) {
    const d = this.def(type), price = Math.round(d.price * Economy.fx('upgradePrice'));
    if (d.licence > G.licence || !Economy.spend(price)) return null;
    const dep = Buildings.mainDepot();
    const spot = Move.findFree(dep.x + dep.w / 2 + 4 + this.list.length % 3 * 3, dep.y + dep.h + 3, d.body, 'veh', 30) || { x: dep.x + dep.w + 3, y: dep.y + dep.h + 3 };
    const v = this.fromSave({ id: G.nextId++, type, x: spot.x, y: spot.y, a: -Math.PI / 2, up: {} });
    this.list.push(v);
    Bus.emit('vehicleBought', v);
    return v;
  },
  enter(v, P) {
    P = P || Player;
    if (P.veh || v.driver) return;
    P.veh = v; v.driver = P === Player ? 0 : P.id; v.garage = 0; v.fs = 0; v.vx = v.vy = 0;
    if (P === Player && v.def.kind !== 'cart') Camera.setZoom(Camera.tz * 0.7);
    if (v.def.kind !== 'cart') { P.x = v.x; P.y = v.y; }
    Bus.emit('enter', v);
  },
  exit(P) {
    P = P || Player;
    const v = P.veh; if (!v) return;
    v.driver = 0;
    if (v.def.kind === 'cart') { P.veh = null; Bus.emit('exit', v); return; }
    const side = v.a + Math.PI / 2, d = v.def.body + 1;
    let spot = null;
    for (const s of [side, side + Math.PI, v.a + Math.PI, v.a]) { const x = U.wrapX(v.x + Math.cos(s) * d), y = v.y + Math.sin(s) * d; if (Move.circleFree(x, y, CONFIG.player.radius, 'walk')) { spot = { x, y }; break; } }
    if (!spot) spot = Move.findFree(v.x, v.y, CONFIG.player.radius, 'walk', 10) || { x: v.x, y: v.y };
    P.veh = null; P.x = P.px = spot.x; P.y = P.py = spot.y; P.vx = P.vy = 0;
    v.vx = v.vy = v.fs = 0;
    if (P === Player) Camera.setZoom(Camera.tz / 0.7);
    Bus.emit('exit', v);
  },
  // Fahrzeug fahren: Lenkung zur Joystick-Richtung, Trägheit, leichtes Driften
  drive(v, dt, I) {
    v.px = v.x; v.py = v.y; v.pa = v.a;
    const d = v.def, kind = this.kind(v);
    let mx = I.mx, my = I.my; let ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; ml = 1; }
    const xi = Math.floor(v.x), yi = Math.floor(v.y), reg = World.regionAt(xi, yi), R = CONFIG.regions[reg];
    let vmax = this.maxSpeed(v);
    if (!d.hover) vmax *= 1 - (1 - R.vehSpeed) * (1 - Economy.magnet());
    if (kind === 'crawl') { const t = World.terrAt(xi, yi); if (t === T_RIMS || t === T_GRAVEL) vmax *= 0.6; }
    let throttle = 0;
    if (ml > CONFIG.input.deadzone) {
      const target = Math.atan2(my, mx), diff = U.angDiff(v.a, target);
      const turn = d.turn * (0.55 + 0.45 * Math.min(1, Math.abs(v.fs) / 4));
      v.a += U.clamp(diff, -turn * dt, turn * dt);
      throttle = ml * Math.max(0, Math.cos(diff));
      if (Math.abs(diff) > 2.4 && Math.abs(v.fs) < 2) throttle = -0.35 * ml;
    }
    const ca = Math.cos(v.a), sa = Math.sin(v.a);
    let fs = v.vx * ca + v.vy * sa, ls = -v.vx * sa + v.vy * ca;
    fs += (throttle * vmax - fs) * (1 - Math.exp(-d.accel * dt * (throttle === 0 ? 0.6 : 1)));
    const grip = d.hover ? 1.6 : R.slippery ? 1.3 + 4 * Economy.magnet() : 7;
    ls *= Math.exp(-grip * dt);
    v.vx = ca * fs - sa * ls; v.vy = sa * fs + ca * ls; v.fs = fs;
    const hit = Move.slide(v, v.vx * dt, v.vy * dt, d.body, kind);
    if (hit) { if (hit & 1) v.vx *= -0.15; if (hit & 2) v.vy *= -0.15; }
    v.spin += fs * dt;
    // Bürste
    if (I.clean) {
      const cap = this.cap(v), free = cap - this.loadKg(v);
      if (free > 0.001) {
        const back = d.body * 0.55, w = this.width(v) / 2;
        const ax = v.px - Math.cos(v.pa) * back, ay = v.py - Math.sin(v.pa) * back, bx = v.x - ca * back, by = v.y - sa * back;
        const kg = World.stroke(ax, ay, bx, by, w, Math.min(this.power(v) * dt, free), false, Economy.fx('yield'));
        if (kg > 0) { for (let t = 0; t < NGOODS; t++) v.load[t] += World.col[t]; Bus.emit('collect', kg); }
        v.cleanFx = kg / dt;
      } else v.cleanFx = 0;
    } else v.cleanFx = 0;
  },
  recallFee(v) { return Math.max(CONFIG.vehicleRecallMin, Math.round(v.def.price * CONFIG.vehicleRecallFee)); },
  recall(v, toGarage) {
    if (v === Player.veh || v.incoming > 0) return false;
    if (!toGarage && !Economy.spend(this.recallFee(v))) return false;
    v.incoming = toGarage ? 4 : CONFIG.vehicleRecallTime; v.dest = toGarage || null; v.caller = Net.actor ? Net.actor.peer : null;
    return true;
  },
  update(dt) {
    for (const v of this.list) {
      if (v === Player.veh || v.driver) continue;
      v.px = v.x; v.py = v.y; v.pa = v.a;
      if (v.incoming > 0) {
        v.incoming -= dt;
        if (v.incoming <= 0) {
          v.incoming = 0;
          const C = (v.caller && Net.peers.get(v.caller)) || Player; v.caller = null;
          let tx = C.x + Math.cos(C.dir) * 4, ty = C.y + Math.sin(C.dir) * 4;
          if (v.dest) { const g = Buildings.byId(v.dest); if (g) { tx = g.x + g.w / 2; ty = g.y + g.h + v.def.body + 1; } v.dest = null; }
          const spot = Move.findFree(tx, ty, v.def.body, this.kind(v), 20) || { x: tx, y: ty };
          v.x = v.px = spot.x; v.y = v.py = spot.y; v.vx = v.vy = 0;
          Bus.emit('vehicleArrived', v);
        }
      } else if (v.vx || v.vy) {
        // ausrollen
        v.vx *= Math.exp(-3 * dt); v.vy *= Math.exp(-3 * dt);
        if (Math.abs(v.vx) + Math.abs(v.vy) < 0.05) v.vx = v.vy = 0;
        Move.slide(v, v.vx * dt, v.vy * dt, v.def.body, this.kind(v));
      }
    }
  },
  nearest(x, y, maxD) {
    let best = null, bd = maxD * maxD;
    for (const v of this.list) { if (v === Player.veh || v.incoming > 0 || v.driver) continue; const d = U.dist2(x, y, v.x, v.y); if (d < bd) { bd = d; best = v; } }
    return best;
  },
};

/* ============================================================================
   6. BUILDINGS & LOGISTICS – Gebäude, Förderbänder, Verarbeitung, Funknetz
   ============================================================================ */
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
const DEPOT_DEF = { id: 'depot', name: 'Hauptdepot', price: 0, w: CONFIG.depot.size, h: CONFIG.depot.size, licence: 0, cat: 'infra', drop: true, in: true, fixed: true };
const Pool = {
  items: [],
  get(t, kg) { const it = this.items.pop() || { t: 0, kg: 0, p: 0, tick: 0 }; it.t = t; it.kg = kg; it.p = 0; it.tick = 0; return it; },
  free(it) { if (this.items.length < 4000) this.items.push(it); },
};

const Buildings = {
  list: [], map: new Map(), occ: new Map(), belts: new Map(), active: new Set(),
  undo: [], tick: 0, coverage: null, covDirty: true, online: new Set(), lights: [], teleports: [],
  def(type) { return type === 'depot' ? DEPOT_DEF : CONFIG.buildings.find(b => b.id === type); },
  byId(id) { return this.map.get(id) || null; },
  mainDepot() { return this.list.find(b => b.type === 'depot'); },
  cellKey(x, y) { return y * WSIZE + U.wrapI(x); },
  at(x, y) { return this.occ.get(y * WSIZE + U.wrapI(x)) || null; },
  beltAt(x, y) { return this.belts.get(y * WSIZE + U.wrapI(x)) || null; },
  solidAt(x, y) { if (!this.occ.size) return false; const b = this.occ.get(y * WSIZE + U.wrapI(x)); return !!b && b.type !== 'teleport'; },
  dims(def, rot) { return (rot & 1) ? [def.h, def.w] : [def.w, def.h]; },

  init() {
    this.list = []; this.map.clear(); this.occ.clear(); this.belts.clear(); this.active.clear(); this.undo = [];
    World.bridgeCells.clear();
    for (const s of G.buildings) this.addFromSave(s);
    for (const s of G.belts) this.addBelt(s.x, s.y, s.d, s.t, s.items);
    if (!this.mainDepot()) {
      const st = CONFIG.world.start, n = CONFIG.depot.size;
      this.addFromSave({ id: G.nextId++, type: 'depot', x: st.x - (n >> 1), y: st.y - (n >> 1), rot: 1 });
    }
    this.relink(); this.covDirty = true;
  },
  newB(type, x, y, rot, id) {
    const def = this.def(type), [w, h] = this.dims(def, rot);
    return { id: id || G.nextId++, type, def, x: U.wrapI(x), y, rot, w, h, store: new Float64Array(NGOODS), inBuf: new Float64Array(NGOODS), outBuf: new Float64Array(NGOODS),
      capsule: new Float64Array(NGOODS), cool: 0, launch: 0, status: 'ok', prog: 0, rr: 0, lastIn: 0, hold: null, outT: null, cells: null, name: '', anim: 0, worked: 0 };
  },
  addFromSave(s) {
    const b = this.newB(s.type, s.x, s.y, s.rot || 0, s.id);
    for (const k of ['store', 'inBuf', 'outBuf', 'capsule']) if (s[k]) for (let i = 0; i < NGOODS; i++) b[k][i] = s[k][i] || 0;
    if (s.hold) b.hold = Pool.get(s.hold[0], s.hold[1]);
    b.cool = s.cool || 0; b.name = s.name || '';
    if (s.cells) b.cells = s.cells;
    this.register(b);
    return b;
  },
  register(b) {
    this.list.push(b); this.map.set(b.id, b);
    if (b.type === 'bridge') { for (const k of b.cells) World.bridgeCells.set(k, b.id); }
    else for (let yy = 0; yy < b.h; yy++) for (let xx = 0; xx < b.w; xx++) this.occ.set((b.y + yy) * WSIZE + U.wrapI(b.x + xx), b);
    if (b.type === 'antenna' || b.type === 'outpost' || b.type === 'depot') this.covDirty = true;
    this.refreshLists();
  },
  unregister(b) {
    this.list.splice(this.list.indexOf(b), 1); this.map.delete(b.id);
    if (b.type === 'bridge') { for (const k of b.cells) World.bridgeCells.delete(k); }
    else for (let yy = 0; yy < b.h; yy++) for (let xx = 0; xx < b.w; xx++) this.occ.delete((b.y + yy) * WSIZE + U.wrapI(b.x + xx));
    if (b.type === 'antenna' || b.type === 'outpost') this.covDirty = true;
    this.refreshLists();
  },
  refreshLists() {
    this.lights = this.list.filter(b => b.type === 'lamp');
    this.teleports = this.list.filter(b => b.type === 'teleport');
  },
  save() {
    G.buildings = this.list.map(b => {
      const s = { id: b.id, type: b.type, x: b.x, y: b.y, rot: b.rot };
      for (const k of ['store', 'inBuf', 'outBuf', 'capsule']) if (b[k].some(v => v > 0)) s[k] = Array.from(b[k]);
      if (b.hold) s.hold = [b.hold.t, b.hold.kg];
      if (b.cool) s.cool = b.cool; if (b.name) s.name = b.name; if (b.cells) s.cells = b.cells;
      return s;
    });
    const belts = []; for (const bl of this.belts.values()) belts.push({ x: bl.x, y: bl.y, d: bl.dir, t: bl.tier, items: bl.items.length ? bl.items.map(i => [i.t, i.kg, Math.round(i.p * 100) / 100]) : undefined });
    G.belts = belts;
  },
  // Abstand Spieler → Gebäuderechteck
  distTo(b, x, y) {
    const dx = U.dx(b.x + b.w / 2, x), dy = y - (b.y + b.h / 2);
    const ex = Math.max(0, Math.abs(dx) - b.w / 2), ey = Math.max(0, Math.abs(dy) - b.h / 2);
    return Math.hypot(ex, ey);
  },
  center(b) { return { x: U.wrapX(b.x + b.w / 2), y: b.y + b.h / 2 }; },
  nearest(x, y, filter, maxD) {
    let best = null, bd = maxD === undefined ? Infinity : maxD;
    for (const b of this.list) { if (filter && !filter(b)) continue; const d = this.distTo(b, x, y); if (d < bd) { bd = d; best = b; } }
    return best;
  },

  /* --- Platzierung prüfen --- */
  cellIssue(x, y) {
    if (y < 2 || y >= WSIZE - 2) return 'Kartenrand';
    const reg = World.regionAt(x, y);
    if (World.locked(reg)) return 'Region gesperrt (Lizenz ' + CONFIG.regions[reg].licence + ')';
    const t = World.terrAt(x, y);
    if (t === T_ROCK || t === T_GRAVEL) return 'Felsen im Weg';
    if (t === T_CANYON) return 'Schlucht – erst eine Brücke bauen';
    if (World.dustAt(x, y) > CLEAN_T || World.meteorAt(x, y) > 0) return 'Boden zu staubig – erst putzen';
    return null;
  },
  validate(type, x, y, rot, ignore) {
    const def = this.def(type);
    if (type === 'bridge') return this.validateBridge(x, y, rot);
    const [w, h] = this.dims(def, rot);
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
      const cx = U.wrapI(x + xx), cy = y + yy;
      const issue = this.cellIssue(cx, cy); if (issue) return { ok: false, why: issue };
      const o = this.at(cx, cy); if (o && o !== ignore) return { ok: false, why: 'Platz belegt' };
      if (this.beltAt(cx, cy) && !def.belt) return { ok: false, why: 'Förderband im Weg' };
      if (def.belt && o) return { ok: false, why: 'Platz belegt' };
    }
    return { ok: true };
  },
  // Brücke: Ghost-Zelle muss in einer Schlucht liegen; Spannweite ≤ 12; Breite 7
  bridgeSpan(x, y, rot) {
    if (World.terrAt(x, y) !== T_CANYON) return null;
    const ax = (rot & 1) ? 0 : 1, ay = (rot & 1) ? 1 : 0;
    let a = 0, b = 0;
    while (a < 16 && World.terrAt(x - ax * (a + 1), y - ay * (a + 1)) === T_CANYON) a++;
    while (b < 16 && World.terrAt(x + ax * (b + 1), y + ay * (b + 1)) === T_CANYON) b++;
    return { a, b, len: a + b + 1, ax, ay };
  },
  validateBridge(x, y, rot) {
    const sp = this.bridgeSpan(x, y, rot);
    if (!sp) return { ok: false, why: 'Brücken nur über Schluchten' };
    if (sp.len > CONFIG.bridgeMaxLen) return { ok: false, why: 'Schlucht hier zu breit (' + sp.len + ' > 12)' };
    if (World.locked(World.regionAt(x, y))) return { ok: false, why: 'Region gesperrt' };
    const ends = [[x - sp.ax * (sp.a + 1), y - sp.ay * (sp.a + 1)], [x + sp.ax * (sp.b + 1), y + sp.ay * (sp.b + 1)]];
    for (const [ex, ey] of ends) { const t = World.terrAt(ex, ey); if (t === T_ROCK || t === T_GRAVEL) return { ok: false, why: 'Kein fester Ankerpunkt' }; }
    for (const k of this.bridgeCellsFor(x, y, rot, sp)) if (World.bridgeCells.has(k)) return { ok: false, why: 'Hier steht schon eine Brücke' };
    return { ok: true, span: sp };
  },
  bridgeCellsFor(x, y, rot, sp) {
    const out = [], px = sp.ay, py = sp.ax;   // senkrecht zur Spannrichtung
    for (let s = -sp.a - 3; s <= sp.b + 3; s++) for (let q = -3; q <= 3; q++) {
      const cx = U.wrapI(x + sp.ax * s + px * q), cy = y + sp.ay * s + py * q;
      if (World.base(World.ci(cx, cy)).terr[((cy & 63) << 6) | (cx & 63)] === T_CANYON) out.push(cy * WSIZE + cx);
    }
    return out;
  },
  price(type) { return Economy.buildPrice(this.def(type)); },

  /* --- Bauen, Abreißen, Verschieben, Drehen (mit Rückgängig) --- */
  place(type, x, y, rot, noUndo) {
    const def = this.def(type);
    if (def.licence > G.licence) return { ok: false, why: 'Lizenz ' + def.licence + ' nötig' };
    const v = this.validate(type, x, y, rot); if (!v.ok) return v;
    const price = this.price(type);
    if (!Economy.spend(price)) return { ok: false, why: 'Es fehlen ' + U.money(price - G.money) };
    const b = this.newB(type, x, y, rot);
    if (type === 'bridge') { b.cells = this.bridgeCellsFor(x, y, rot, v.span); b.span = v.span; }
    if (type === 'teleport') b.name = 'Plattform ' + (this.teleports.length + 1);
    b.paid = price;
    this.register(b); this.relink();
    if (!noUndo) this.pushUndo({ k: 'place', id: b.id, paid: price });
    G.stats.builds++;
    Bus.emit('built', b);
    return { ok: true, b };
  },
  // Inhalt eines Gebäudes/Bands als Geld erstatten (nichts geht verloren)
  refundGoods(arr) { let v = 0; for (let t = 0; t < NGOODS; t++) if (arr[t] > 0) { v += arr[t] * Economy.value(t); arr[t] = 0; } return v; },
  snapshot(b) { return { id: b.id, type: b.type, x: b.x, y: b.y, rot: b.rot, name: b.name }; },
  remove(b, noUndo) {
    if (!b || b.def.fixed) return false;
    if (b.type === 'hangar' && Robots.list.some(r => r.hangar === b.id)) { UI.toast('Im Hangar wohnen noch Roboter. Erst Roboter umsiedeln oder verkaufen.', 'warn'); return false; }
    let goods = this.refundGoods(b.store) + this.refundGoods(b.inBuf) + this.refundGoods(b.outBuf) + this.refundGoods(b.capsule);
    if (b.hold) { goods += b.hold.kg * Economy.value(b.hold.t); Pool.free(b.hold); b.hold = null; }
    if (b.type === 'garage') for (const v of Vehicles.list) if (v.garage === b.id) { v.garage = 0; const dep = this.mainDepot(); const sp = Move.findFree(dep.x + dep.w + 4, dep.y + dep.h + 4, v.def.body, 'veh', 40); if (sp) { v.x = sp.x; v.y = sp.y; } }
    const refund = this.price(b.type);
    this.unregister(b); this.relink();
    Economy.grant(refund + goods, 'refund');
    if (goods > 1) UI.toast('Gelagerte Ware erstattet: ' + U.money(goods));
    if (!noUndo) this.pushUndo({ k: 'remove', snap: this.snapshot(b), refund });
    Bus.emit('removed', b);
    return true;
  },
  move(b, x, y, rot, noUndo) {
    if (b.def.fixed) return { ok: false, why: 'Das Hauptdepot bleibt, wo es ist.' };
    if (b.type === 'bridge') return { ok: false, why: 'Brücken lassen sich nicht verschieben' };
    const old = { x: b.x, y: b.y, rot: b.rot };
    this.unregister(b);
    const [w, h] = this.dims(b.def, rot);
    const v = this.validate(b.type, x, y, rot);
    if (!v.ok) { this.register(b); return v; }
    b.x = U.wrapI(x); b.y = y; b.rot = rot; b.w = w; b.h = h;
    this.register(b); this.relink();
    if (!noUndo) this.pushUndo({ k: 'move', id: b.id, from: old });
    return { ok: true };
  },
  rotate(b, noUndo) {
    if (b.def.fixed || b.type === 'bridge') return false;
    const r = this.move(b, b.x, b.y, (b.rot + 1) & 3, true);
    if (!r.ok) { UI.toast('Drehen nicht möglich: ' + r.why, 'warn'); return false; }
    if (!noUndo) this.pushUndo({ k: 'rotate', id: b.id });
    return true;
  },
  pushUndo(a) { this.undo.push(a); if (this.undo.length > 20) this.undo.shift(); },
  doUndo() {
    const a = this.undo.pop(); if (!a) { UI.toast('Nichts zum Rückgängigmachen.'); return; }
    if (a.k === 'place') { const b = this.byId(a.id); if (b) { this.unregisterRefund(b, a.paid); } }
    else if (a.k === 'remove') {
      const s = a.snap;
      if (!Economy.spend(a.refund)) { UI.toast('Zu wenig Geld für Rückgängig.', 'warn'); this.undo.push(a); return; }
      const v = this.validate(s.type, s.x, s.y, s.rot);
      if (!v.ok) { Economy.grant(a.refund); UI.toast('Rückgängig nicht möglich: ' + v.why, 'warn'); return; }
      const b = this.newB(s.type, s.x, s.y, s.rot, s.id); b.name = s.name;
      if (s.type === 'bridge') b.cells = this.bridgeCellsFor(s.x, s.y, s.rot, this.bridgeSpan(s.x, s.y, s.rot));
      this.register(b); this.relink();
    }
    else if (a.k === 'move') { const b = this.byId(a.id); if (b) this.move(b, a.from.x, a.from.y, a.from.rot, true); }
    else if (a.k === 'rotate') { const b = this.byId(a.id); if (b) this.move(b, b.x, b.y, (b.rot + 3) & 3, true); }
    else if (a.k === 'belts') {
      const bp = t => Economy.buildPrice(CONFIG.buildings.find(b => b.belt === t));
      for (const c of a.cells) {
        const bl = this.beltAt(c[0], c[1]); if (!bl) continue;
        if (c[3]) { const diff = bp(bl.tier) - bp(c[3][1]); bl.dir = c[3][0]; bl.tier = c[3][1]; if (diff > 0) Economy.grant(diff, 'refund'); }
        else this.removeBelt(bl);
      }
      this.relink();
    }
    else if (a.k === 'unbelts') { let cost = 0; for (const c of a.cells) cost += Economy.buildPrice(CONFIG.buildings.find(b => b.belt === c[3])); if (!Economy.spend(cost)) { UI.toast('Zu wenig Geld für Rückgängig.', 'warn'); this.undo.push(a); return; } for (const c of a.cells) if (!this.beltAt(c[0], c[1]) && !this.at(c[0], c[1])) this.addBelt(c[0], c[1], c[2], c[3]); this.relink(); }
    Audio.sfx('click');
  },
  unregisterRefund(b, paid) {
    let goods = this.refundGoods(b.store) + this.refundGoods(b.inBuf) + this.refundGoods(b.outBuf) + this.refundGoods(b.capsule);
    if (b.hold) { goods += b.hold.kg * Economy.value(b.hold.t); b.hold = null; }
    this.unregister(b); this.relink(); Economy.grant(paid + goods, 'refund');
  },

  /* --- Förderbänder --- */
  addBelt(x, y, dir, tier, items) {
    x = U.wrapI(x);
    const k = y * WSIZE + x;
    const bl = { k, x, y, dir, tier, items: [], next: null, inMask: 0 };
    if (items) for (const it of items) { const p = Pool.get(it[0], it[1]); p.p = it[2] || 0; bl.items.push(p); }
    bl.items.sort((a, b) => b.p - a.p);
    this.belts.set(k, bl);
    if (bl.items.length) this.active.add(bl);
    return bl;
  },
  // Band entfernen: Preis + Ladung (Grundwert) werden erstattet – es geht nichts verloren
  removeBelt(bl) {
    let goods = 0;
    for (const it of bl.items) { goods += it.kg * Economy.value(it.t); Pool.free(it); }
    bl.items.length = 0;
    this.belts.delete(bl.k); this.active.delete(bl);
    const refund = Economy.buildPrice(CONFIG.buildings.find(b => b.belt === bl.tier));
    Economy.grant(refund + goods, 'refund');
    return refund + goods;
  },
  // Band-Pfad bauen (Liste von [x, y, dir]); vorhandene Bänder werden umgebaut
  placeBeltPath(path, tier) {
    const def = CONFIG.buildings.find(b => b.belt === tier);
    if (def.licence > G.licence) return { ok: false, why: 'Lizenz ' + def.licence + ' nötig' };
    const price = Economy.buildPrice(def);
    const cells = [];
    let cost = 0, skipped = 0;
    for (const [x, y, d] of path) {
      const ex = this.beltAt(x, y);
      if (!ex) { if (this.at(x, y) || this.cellIssue(x, y)) { skipped++; continue; } }
      else if (ex.dir === d && ex.tier === tier) continue;
      cost += price - (ex ? Economy.buildPrice(CONFIG.buildings.find(b => b.belt === ex.tier)) : 0);
      cells.push([x, y, d, ex ? [ex.dir, ex.tier] : null]);
    }
    if (!cells.length) return { ok: false, why: skipped ? 'Kein gültiges Feld (Boden zu staubig?)' : 'Nichts zu bauen' };
    if (cost > 0 && !Economy.spend(cost)) return { ok: false, why: 'Es fehlen ' + U.money(cost - G.money) };
    if (cost < 0) Economy.grant(-cost, 'refund');
    for (const [x, y, d, ex] of cells) {
      if (ex) { const bl = this.beltAt(x, y); bl.dir = d; bl.tier = tier; }
      else this.addBelt(x, y, d, tier);
    }
    this.relink();
    this.pushUndo({ k: 'belts', cells: cells.map(c => [c[0], c[1], c[2], c[3]]) });
    G.stats.builds += cells.length;
    Bus.emit('beltsBuilt', cells.length);
    return { ok: true, n: cells.length, skipped };
  },
  removeBeltsAt(cells) {
    const snaps = [];
    for (const [x, y] of cells) { const bl = this.beltAt(x, y); if (bl) { snaps.push([bl.x, bl.y, bl.dir, bl.tier]); this.removeBelt(bl); } }
    if (snaps.length) { this.relink(); this.pushUndo({ k: 'unbelts', cells: snaps }); }
    return snaps.length;
  },
  beltCanAccept(bl) { const it = bl.items, g = CONFIG.belts.gaps[bl.tier]; return it.length === 0 || (it[it.length - 1].p >= g && it.length <= 1 / g); },

  // Verknüpfungen neu berechnen (nach jeder Bauänderung)
  relink() {
    for (const bl of this.belts.values()) { bl.inMask = 0; bl.next = null; }
    for (const bl of this.belts.values()) {
      const nx = U.wrapI(bl.x + DX[bl.dir]), ny = bl.y + DY[bl.dir];
      const nb = this.beltAt(nx, ny);
      if (nb && nb.dir !== ((bl.dir + 2) & 3)) { bl.next = nb; nb.inMask |= 1 << ((bl.dir + 2) & 3); continue; }
      const b = this.at(nx, ny);
      if (b && b.def.in) bl.next = b;
    }
    for (const b of this.list) {
      b.outT = null;
      if (!b.def.out || b.type === 'splitter') continue;
      const p = this.outPort(b), nb = this.beltAt(p.x, p.y);
      if (nb && nb.dir !== ((b.rot + 2) & 3)) b.outT = nb;
      else { const o = this.at(p.x, p.y); if (o && o !== b && o.def.in) b.outT = o; }
    }
    if (Net.isHost()) Net.buildDirty = true;
  },
  outPort(b) {
    const r = b.rot;
    if (r === 0) return { x: U.wrapI(b.x + b.w), y: b.y + (b.h >> 1) };
    if (r === 1) return { x: U.wrapI(b.x + (b.w >> 1)), y: b.y + b.h };
    if (r === 2) return { x: U.wrapI(b.x - 1), y: b.y + (b.h >> 1) };
    return { x: U.wrapI(b.x + (b.w >> 1)), y: b.y - 1 };
  },

  /* --- Warenannahme --- */
  total(arr) { let s = 0; for (let i = 0; i < NGOODS; i++) s += arr[i]; return s; },
  machineAccepts(b, t) {
    const M = CONFIG.machines;
    if (b.type === 'compressor') return CONFIG.goods[t].compress === true;
    if (b.type === 'brickpress') return t === 7;
    if (b.type === 'glassoven') return t === 4 || t === 7;
    return false;
  },
  // Paket von einem Band annehmen?
  accept(b, it) {
    const t = it.t, kg = it.kg;
    switch (b.type) {
      case 'depot': case 'outpost': b.store[t] += kg; b.lastIn = G.t; return true;
      case 'ramp': b.store[t] += kg; b.lastIn = G.t; return true;
      case 'silo': if (this.total(b.store) + kg > b.def.buffer) return false; b.store[t] += kg; b.lastIn = G.t; return true;
      case 'splitter': if (b.hold) return false; b.hold = Pool.get(t, kg); return true;
      case 'compressor': case 'brickpress': case 'glassoven': {
        if (this.machineAccepts(b, t)) { if (b.inBuf[t] + kg > CONFIG.machines.inBuffer) return false; b.inBuf[t] += kg; }
        else { if (this.total(b.outBuf) + kg > CONFIG.machines.outBuffer) return false; b.outBuf[t] += kg; }
        b.lastIn = G.t; return true;
      }
    }
    return false;
  },
  // Abgabe durch Spieler/Fahrzeug/Roboter
  deliver(b, t, kg) { b.store[t] += kg; b.lastIn = G.t; },
  dropAccepts(b, kg) {
    if (b.type === 'depot' || b.type === 'outpost') return true;
    if (b.def.buffer) return this.total(b.store) + kg <= b.def.buffer;
    return false;
  },
  dropPoints() { return this.list.filter(b => b.def.drop); },

  /* --- Simulation pro Logik-Tick --- */
  update(dt) {
    this.tick++;
    const tick = this.tick, sp = CONFIG.belts.speeds, bm = Economy.fx('beltSpeed');
    // Bänder
    for (const bl of this.active) {
      const it = bl.items, n = it.length;
      if (!n) { this.active.delete(bl); continue; }
      const step = sp[bl.tier] * bm * dt, gap = CONFIG.belts.gaps[bl.tier];
      for (let i = 0; i < n; i++) {
        const p = it[i]; if (p.tick === tick) continue;
        const lim = i === 0 ? 1 : it[i - 1].p - gap;
        const np = Math.min(p.p + step, lim); if (np > p.p) p.p = np;
      }
      const f = it[0];
      if (f.p >= 1 && f.tick !== tick && bl.next) {
        const nx = bl.next;
        if (nx.items) { if (this.beltCanAccept(nx)) { it.shift(); f.p = 0; f.tick = tick; nx.items.push(f); this.active.add(nx); } }
        else if (this.accept(nx, f)) { it.shift(); Pool.free(f); }
      }
    }
    // Gebäude
    for (let i = 0; i < this.list.length; i++) this.updateB(this.list[i], dt);
    if (this.covDirty) this.rebuildCoverage();
  },
  // Koop-Client: Pakete nur optisch weiterschieben (der Host bleibt maßgeblich)
  animateBelts(dt) {
    const tick = ++this.tick, sp = CONFIG.belts.speeds, bm = Economy.fx('beltSpeed');
    for (const bl of this.active) {
      const it = bl.items, n = it.length; if (!n) { this.active.delete(bl); continue; }
      const step = sp[bl.tier] * bm * dt, gap = CONFIG.belts.gaps[bl.tier];
      for (let i = 0; i < n; i++) { const p = it[i]; if (p.tick === tick) continue; const lim = i === 0 ? 1 : it[i - 1].p - gap; const np = Math.min(p.p + step, lim); if (np > p.p) p.p = np; }
      const f = it[0], nx = bl.next;
      if (f.p >= 1 && f.tick !== tick && nx && nx.items && this.beltCanAccept(nx)) { it.shift(); f.p = 0; f.tick = tick; nx.items.push(f); this.active.add(nx); }
    }
  },
  updateB(b, dt) {
    switch (b.type) {
      case 'depot': case 'outpost': this.updateDepot(b, dt); break;
      case 'ramp': this.updateRamp(b, dt); break;
      case 'compressor': case 'brickpress': case 'glassoven': this.updateMachine(b, dt); this.output(b, b.outBuf); break;
      case 'hopper': case 'hangar': case 'silo': this.output(b, b.store); break;
      case 'splitter': this.updateSplitter(b); break;
    }
    if (b.anim > 0) b.anim -= dt;
  },
  // Depot: Puffer → Kapsel (200 kg) → Start
  updateDepot(b, dt) {
    const D = CONFIG.depot;
    if (b.launch > 0) { b.launch -= dt; }
    if (b.cool > 0) { b.cool -= dt; return; }
    let cap = this.total(b.capsule);
    if (cap < D.capsuleKg) {
      const st = this.total(b.store);
      if (st > 0) {
        const want = Math.min(D.capsuleKg - cap, st, 250 * dt), f = want / st;
        for (let t = 0; t < NGOODS; t++) { const m = b.store[t] * f; b.capsule[t] += m; b.store[t] -= m; if (b.store[t] < 1e-9) b.store[t] = 0; }
        cap += want;
      }
    }
    if (cap >= D.capsuleKg - 1e-6) { this.launch(b, true); }
  },
  canLaunch(b) { return b.cool <= 0 && this.total(b.capsule) + this.total(b.store) >= CONFIG.depot.minManualKg; },
  launch(b, auto) {
    if (b.cool > 0) return 0;
    // manueller Start: alles, was im Puffer liegt, kommt noch mit (bis 200 kg)
    if (!auto) { const cap = this.total(b.capsule), st = this.total(b.store); const want = Math.min(CONFIG.depot.capsuleKg - cap, st); if (want > 0) { const f = want / st; for (let t = 0; t < NGOODS; t++) { const m = b.store[t] * f; b.capsule[t] += m; b.store[t] -= m; } } }
    const kg = this.total(b.capsule); if (kg <= 0) return 0;
    const money = Economy.sell(b.capsule, 'depot');
    b.capsule.fill(0);
    b.cool = Economy.capsuleCooldown(); b.launch = CONFIG.depot.launchTime;
    G.stats.capsules++;
    Bus.emit('launch', b, money, kg);
    return money;
  },
  updateRamp(b, dt) {
    if (b.launch > 0) b.launch -= dt;
    b.cool -= dt;
    if (b.cool <= 0) {
      b.cool = CONFIG.machines.rampInterval;
      const kg = this.total(b.store);
      if (kg > 0) { const m = Economy.sell(b.store, 'ramp'); b.store.fill(0); b.launch = CONFIG.depot.launchTime; G.stats.capsules++; Bus.emit('launch', b, m, kg); }
    }
  },
  updateMachine(b, dt) {
    const M = CONFIG.machines, rate = M[b.type].rate * Economy.fx('machineSpeed') * dt, out = this.total(b.outBuf);
    if (out >= M.outBuffer) { b.status = 'blocked'; return; }
    let used = 0;
    if (b.type === 'glassoven') {
      const n = Math.min(rate / 3, b.inBuf[4] / 1, b.inBuf[7] / 2, M.outBuffer - out);
      if (n > 0) { b.inBuf[4] -= n; b.inBuf[7] -= n * 2; b.outBuf[9] += n; used = n * 3; }
    } else {
      const def = M[b.type];
      let budget = Math.min(rate, (M.outBuffer - out) * def.inKg / def.outKg);
      for (let t = 0; t < NGOODS && budget > 0; t++) if (b.inBuf[t] > 0 && this.machineAccepts(b, t)) {
        const take = Math.min(b.inBuf[t], budget); b.inBuf[t] -= take; budget -= take; used += take;
        b.prog += take;
      }
      if (b.prog >= def.inKg) { const n = Math.floor(b.prog / def.inKg); b.prog -= n * def.inKg; b.outBuf[def.out] += n * def.outKg; if (def.out === 7) G.stats.sandMade += n * def.outKg; Bus.emit('produced', def.out, n * def.outKg); }
    }
    if (used > 0) { b.status = 'ok'; b.worked = G.t; } else if (G.t - b.worked > 0.5) b.status = 'wait';
  },
  // Ausgabe auf das Ausgangsband (ein Paket pro Tick, wenn Platz)
  output(b, src) {
    const T = b.outT;
    if (!T) { if (this.total(src) > 0.01) b.status = b.status === 'ok' && b.type !== 'hopper' && b.type !== 'hangar' && b.type !== 'silo' ? 'ok' : 'nooutput'; return; }
    const isBelt = !!T.items;
    if (isBelt && !this.beltCanAccept(T)) { if (this.total(src) > 0.01 && b.type !== 'compressor' && b.type !== 'brickpress' && b.type !== 'glassoven') b.status = 'blocked'; return; }
    const pk = CONFIG.belts.packetKg, idle = G.t - b.lastIn > 3;
    let t = -1;
    for (let k = 0; k < NGOODS; k++) { const tt = (b.rr + k) % NGOODS; if (src[tt] >= pk - 1e-9 || (idle && src[tt] > 0.05)) { t = tt; break; } }
    if (t < 0) { if (b.type === 'hopper' || b.type === 'hangar' || b.type === 'silo') b.status = 'ok'; return; }
    const kg = Math.min(pk, src[t]);
    const it = Pool.get(t, kg);
    if (isBelt) { src[t] -= kg; if (src[t] < 1e-9) src[t] = 0; T.items.push(it); it.tick = this.tick; this.active.add(T); }
    else { if (this.accept(T, it)) { src[t] -= kg; if (src[t] < 1e-9) src[t] = 0; } Pool.free(it); }
    b.rr = (t + 1) % NGOODS;
    if (b.type === 'hopper' || b.type === 'hangar' || b.type === 'silo') b.status = 'ok';
  },
  updateSplitter(b) {
    if (!b.hold) return;
    for (let k = 0; k < 4; k++) {
      const d = (b.rr + k) & 3, bl = this.beltAt(b.x + DX[d], b.y + DY[d]);
      if (bl && bl.dir === d && this.beltCanAccept(bl)) { bl.items.push(b.hold); b.hold.p = 0; b.hold.tick = this.tick; this.active.add(bl); b.hold = null; b.rr = (d + 1) & 3; return; }
    }
  },

  /* --- Funknetz: Depots + Antennen-Ketten, Abdeckungsraster 16×16 Zellen --- */
  radioRadius(b) {
    let r = b.type === 'antenna' ? CONFIG.antennaRadius : CONFIG.depotRadioRadius;
    r *= Economy.fx('radio');
    const reg = World.regionAt(b.x, b.y); if (CONFIG.regions[reg].signal) r *= CONFIG.regions[reg].signal;
    return r;
  },
  rebuildCoverage() {
    this.covDirty = false;
    const N = WSIZE / 16;
    if (!this.coverage) this.coverage = new Uint8Array(N * N);
    const cov = this.coverage; cov.fill(0);
    const nodes = this.list.filter(b => b.type === 'antenna' || b.type === 'depot' || b.type === 'outpost');
    const on = new Set(nodes.filter(b => b.type !== 'antenna'));
    let changed = true;
    while (changed) {
      changed = false;
      for (const a of nodes) {
        if (on.has(a)) continue;
        const ca = this.center(a);
        for (const o of on) { const co = this.center(o); if (U.dist(ca.x, ca.y, co.x, co.y) <= this.radioRadius(o)) { on.add(a); changed = true; break; } }
      }
    }
    this.online = on; this.covStamp = (this.covStamp || 0) + 1;
    for (const b of on) {
      const c = this.center(b), r = this.radioRadius(b), rg = r / 16;
      const gx0 = Math.floor((c.x - r) / 16), gx1 = Math.floor((c.x + r) / 16), gy0 = Math.max(0, Math.floor((c.y - r) / 16)), gy1 = Math.min(N - 1, Math.floor((c.y + r) / 16));
      for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
        const dx = (gx + 0.5) * 16 - c.x, dy = (gy + 0.5) * 16 - c.y;
        if (dx * dx + dy * dy <= r * r) cov[gy * N + (((gx % N) + N) % N)] = 1;
      }
    }
    Bus.emit('coverage');
  },
  covered(x, y) {
    if (!this.coverage || this.covDirty) this.rebuildCoverage();
    const N = WSIZE / 16, gx = Math.floor(U.wrapX(x) / 16), gy = U.clamp(Math.floor(y / 16), 0, N - 1);
    return this.coverage[gy * N + gx] === 1;
  },
  hangarSlots() { return CONFIG.hangarSlots + Economy.fx('hangarSlots'); },
  lit(x, y) { for (const l of this.lights) { const c = this.center(l); if (U.dist2(c.x, c.y, x, y) < CONFIG.lampRadius * CONFIG.lampRadius) return true; } return false; },
};

/* ============================================================================
   7. INPUT – Tastatur, Maus, Touch → gemeinsame Aktions-Schicht
   ============================================================================ */
const DEFAULT_BINDS = {
  up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  clean: ['Space'], interact: ['KeyE'], terminal: ['KeyT'], build: ['KeyB'], rotate: ['KeyR'], move: ['KeyM'], demolish: ['KeyX'],
  map: ['Tab'], research: ['KeyF'], orders: ['KeyJ'], album: ['KeyK'], zoomIn: ['Equal', 'NumpadAdd', 'BracketRight'], zoomOut: ['Minus', 'NumpadSubtract', 'Slash'],
  coop: ['KeyC'], pause: ['Escape'], debug: ['F3'],
};
const BIND_NAMES = { up: 'Hoch', down: 'Runter', left: 'Links', right: 'Rechts', clean: 'Putzen (halten)', interact: 'Interagieren', terminal: 'Terminal öffnen', build: 'Baumodus',
  rotate: 'Drehen', move: 'Verschieben / Karte', demolish: 'Abreißen', map: 'Karte', research: 'Forschung', orders: 'Aufträge', album: 'Album', zoomIn: 'Hineinzoomen', zoomOut: 'Herauszoomen', coop: 'Crew / Emotes (Koop)', pause: 'Pause / Menü', debug: 'Debug-Anzeige' };

const Settings = {
  d: {
    quality: 'auto', noShake: false, particles: 1, music: 0.55, sfx: 0.8, profile: 'auto', autoClean: false, lefty: false,
    joySize: 1, joyFixed: false, btnAlpha: 0.9, vibrate: true, fps: false, binds: null, tutorial: true, cameraPulse: true,
    // rein optisch (VFX): Effektstärke, Lichtblitze, Bewegung reduzieren
    fxStrength: undefined, flashes: true, reduceMotion: undefined,
  },
  load() { try { const s = JSON.parse(localStorage.getItem('staubmond.settings') || '{}'); Object.assign(this.d, s); } catch (e) { } if (!this.d.binds) this.d.binds = JSON.parse(JSON.stringify(DEFAULT_BINDS)); for (const k in DEFAULT_BINDS) if (!this.d.binds[k]) this.d.binds[k] = DEFAULT_BINDS[k].slice(); },
  save() { try { localStorage.setItem('staubmond.settings', JSON.stringify(this.d)); } catch (e) { } },
  set(k, v) { this.d[k] = v; this.save(); Bus.emit('settings', k, v); },
};

const Input = {
  keys: new Set(), profile: 'desktop', detected: 'desktop', touchMode: false, lastKind: null,
  mouse: { x: 0, y: 0, inside: false, down: false, active: false, wx: 0, wy: 0 },
  joy: { id: null, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0 },
  cleanBtn: false, canvasPtrs: new Map(), pinch: null, rebinding: null, tapStart: null,
  intent: { mx: 0, my: 0, clean: false, aimX: null, aimY: null },

  detect() {
    const coarse = matchMedia('(pointer: coarse)').matches, touch = navigator.maxTouchPoints > 1 || ('ontouchstart' in window);
    const short = Math.min(window.screen.width, window.screen.height);
    this.detected = !(coarse || touch) ? 'desktop' : short < 600 ? 'phone' : 'tablet';
    if (!this.lastKind) this.lastKind = this.detected === 'desktop' ? 'key' : 'touch';
    this.applyProfile();
  },
  applyProfile() {
    const p = Settings.d.profile === 'auto' ? this.detected : Settings.d.profile;
    this.profile = p;
    document.body.classList.toggle('prof-phone', p === 'phone');
    document.body.classList.toggle('prof-tablet', p === 'tablet');
    document.body.classList.toggle('prof-desktop', p === 'desktop');
    document.body.classList.toggle('lefty', !!Settings.d.lefty);
    this.setTouchMode(p !== 'desktop' && this.lastKind !== 'key');
    const r = (p === 'tablet' ? CONFIG.input.joyRadiusTablet : CONFIG.input.joyRadiusPhone) * Settings.d.joySize;
    document.documentElement.style.setProperty('--joy-r', r + 'px');
    document.documentElement.style.setProperty('--btn-alpha', Settings.d.btnAlpha);
    Bus.emit('profile', p);
  },
  setTouchMode(on) {
    if (this.touchMode === on) return;
    this.touchMode = on;
    document.body.classList.toggle('touchmode', on);
    Bus.emit('touchmode', on);
  },
  isTouchProfile() { return this.profile !== 'desktop'; },
  hintKind() { return this.touchMode ? 'touch' : 'desktop'; },

  init(canvas) {
    this.canvas = canvas;
    addEventListener('keydown', e => this.onKey(e, true));
    addEventListener('keyup', e => this.onKey(e, false));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; this.cleanBtn = false; this.endJoy(); });
    canvas.addEventListener('pointerdown', e => this.onDown(e));
    addEventListener('pointermove', e => this.onMove(e), { passive: false });
    addEventListener('pointerup', e => this.onUp(e));
    addEventListener('pointercancel', e => this.onUp(e));
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.lastKind = 'mouse'; this.setTouchMode(false); Actions.zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerleave', () => { this.mouse.inside = false; });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.panel-body, .tabs')) e.preventDefault(); }, { passive: false });
    // Putz-Button
    const cb = document.getElementById('btn-clean');
    cb.innerHTML = Icons.svg('broom', '#fff') + '<span>PUTZEN</span>';
    cb.addEventListener('pointerdown', e => { e.preventDefault(); cb.setPointerCapture(e.pointerId); this.cleanBtn = true; cb.classList.add('on'); this.lastKind = 'touch'; Audio.unlock(); Haptics.tap(); });
    const off = () => { this.cleanBtn = false; cb.classList.remove('on'); };
    cb.addEventListener('pointerup', off); cb.addEventListener('pointercancel', off); cb.addEventListener('lostpointercapture', off);
    this.detect();
    const mq = matchMedia('(pointer: coarse)'); if (mq.addEventListener) mq.addEventListener('change', () => this.detect());
  },
  bound(action, code) { const b = Settings.d.binds[action]; return b && b.includes(code); },
  actionFor(code) { for (const a in Settings.d.binds) if (Settings.d.binds[a].includes(code)) return a; return null; },
  onKey(e, down) {
    if (this.rebinding) { if (down) { e.preventDefault(); this.rebinding(e.code); this.rebinding = null; } return; }
    const tag = (e.target && e.target.tagName) || ''; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const a = this.actionFor(e.code);
    if (down) {
      Audio.unlock();
      if (this.lastKind !== 'key' && this.lastKind !== 'mouse') { this.lastKind = 'key'; this.setTouchMode(false); }
      this.lastKind = 'key';
      if (e.ctrlKey && e.code === 'KeyZ') { e.preventDefault(); Actions.push('undo'); return; }
    }
    if (!a) return;
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F3'].includes(e.code) || a === 'map') e.preventDefault();
    if (down) { if (e.repeat) return; this.keys.add(a); if (!['up', 'down', 'left', 'right', 'clean'].includes(a)) Actions.key(a); }
    else this.keys.delete(a);
  },
  // Bildschirmhälfte für den Joystick
  inJoyZone(x, y) {
    const w = innerWidth, left = !Settings.d.lefty;
    if (Settings.d.joyFixed) { const jx = left ? 110 : w - 110, jy = innerHeight - 130; return Math.hypot(x - jx, y - jy) < 140; }
    return left ? x < w * 0.5 : x > w * 0.5;
  },
  onDown(e) {
    Audio.unlock();
    this.canvas.focus({ preventScroll: true });
    if (e.pointerType === 'mouse') {
      this.lastKind = 'mouse'; this.setTouchMode(false);
      this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.inside = true; this.mouse.active = true;
      if (Build.active) { if (e.button === 0) Build.pointerDown(e.clientX, e.clientY, e.pointerId, 'mouse'); else if (e.button === 2) Build.cancel(); else if (e.button === 1) this.pinch = { pan: true, x: e.clientX, y: e.clientY, id: e.pointerId }; return; }
      if (e.button === 0) { this.mouse.down = true; this.tapStart = { x: e.clientX, y: e.clientY, t: performance.now() }; }
      if (e.button === 2) Actions.tapWorld(e.clientX, e.clientY);
      return;
    }
    // Touch / Stift
    e.preventDefault();
    this.lastKind = 'touch'; if (this.profile !== 'desktop') this.setTouchMode(true); else this.setTouchMode(true);
    const p = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), role: null, type: e.pointerType };
    this.canvasPtrs.set(e.pointerId, p);
    if (Build.active) {
      const others = [...this.canvasPtrs.values()].filter(q => q !== p);
      if (others.length === 0) { p.role = 'build'; Build.pointerDown(p.x, p.y, p.id, 'touch'); }
      else { for (const q of others) if (q.role === 'build') { Build.pointerCancel(q.id); q.role = 'cam'; } p.role = 'cam'; this.startPinch(); }
      return;
    }
    if (this.joy.id === null && this.inJoyZone(p.x, p.y)) { p.role = 'joy'; this.startJoy(p); return; }
    p.role = 'cam';
    if ([...this.canvasPtrs.values()].filter(q => q.role === 'cam').length >= 2) this.startPinch();
  },
  startJoy(p) {
    const j = this.joy; j.id = p.id;
    if (Settings.d.joyFixed) { j.ox = Settings.d.lefty ? innerWidth - 110 : 110; j.oy = innerHeight - 130; } else { j.ox = p.x; j.oy = p.y; }
    j.x = p.x; j.y = p.y; this.updJoy();
    UI.joyShow(true, j.ox, j.oy);
  },
  updJoy() {
    const j = this.joy, R = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--joy-r')) || 56;
    let dx = j.x - j.ox, dy = j.y - j.oy; const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    j.vx = dx / R; j.vy = dy / R;
    const m = Math.hypot(j.vx, j.vy); if (m < CONFIG.input.deadzone) { j.vx = 0; j.vy = 0; }
    UI.joyKnob(dx, dy);
  },
  endJoy() { const j = this.joy; j.id = null; j.vx = j.vy = 0; UI.joyShow(false); },
  startPinch() {
    const cams = [...this.canvasPtrs.values()].filter(q => q.role === 'cam');
    if (cams.length < 2) return;
    const [a, b] = cams;
    this.pinch = { a: a.id, b: b.id, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: Camera.tz, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  },
  onMove(e) {
    if (e.pointerType === 'mouse') {
      this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.inside = e.target === this.canvas; this.mouse.active = true;
      if (this.pinch && this.pinch.pan) { Camera.pan(-(e.clientX - this.pinch.x), -(e.clientY - this.pinch.y)); this.pinch.x = e.clientX; this.pinch.y = e.clientY; return; }
      if (Build.active) Build.pointerMove(e.clientX, e.clientY, e.pointerId);
      return;
    }
    const p = this.canvasPtrs.get(e.pointerId); if (!p) return;
    e.preventDefault();
    const lx = p.x, ly = p.y; p.x = e.clientX; p.y = e.clientY;
    if (p.role === 'joy') { this.joy.x = p.x; this.joy.y = p.y; this.updJoy(); return; }
    if (p.role === 'build') { Build.pointerMove(p.x, p.y, p.id); return; }
    if (p.role === 'cam' && this.pinch && (this.pinch.a === p.id || this.pinch.b === p.id)) {
      const a = this.canvasPtrs.get(this.pinch.a), b = this.canvasPtrs.get(this.pinch.b); if (!a || !b) return;
      const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      Camera.setZoom(this.pinch.z0 * d / this.pinch.d0);
      if (Build.active || Camera.free) Camera.pan(-(cx - this.pinch.cx), -(cy - this.pinch.cy));
      this.pinch.cx = cx; this.pinch.cy = cy;
    }
  },
  onUp(e) {
    if (e.pointerType === 'mouse') {
      if (this.pinch && this.pinch.pan) this.pinch = null;
      if (e.button === 0) {
        if (Build.active) Build.pointerUp(e.clientX, e.clientY, e.pointerId);
        else if (this.mouse.down && this.tapStart && performance.now() - this.tapStart.t < 220 && Math.hypot(e.clientX - this.tapStart.x, e.clientY - this.tapStart.y) < 6) Actions.tapWorld(e.clientX, e.clientY, true);
        this.mouse.down = false;
      }
      return;
    }
    const p = this.canvasPtrs.get(e.pointerId); if (!p) return;
    this.canvasPtrs.delete(e.pointerId);
    if (p.role === 'joy') this.endJoy();
    else if (p.role === 'build') Build.pointerUp(p.x, p.y, p.id);
    else if (p.role === 'cam') {
      if (this.pinch && (this.pinch.a === p.id || this.pinch.b === p.id)) this.pinch = null;
      if (!this.pinch && performance.now() - p.t < 260 && Math.hypot(p.x - p.sx, p.y - p.sy) < 12 && e.type === 'pointerup') Actions.tapWorld(p.x, p.y, true);
    }
  },
  // pro Logik-Tick: Bewegungs- und Putz-Absicht
  poll() {
    const I = this.intent, k = this.keys;
    let mx = (k.has('right') ? 1 : 0) - (k.has('left') ? 1 : 0), my = (k.has('down') ? 1 : 0) - (k.has('up') ? 1 : 0);
    if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
    if (this.joy.id !== null) { mx = this.joy.vx; my = this.joy.vy; }
    if (UI.modal) { mx = 0; my = 0; }
    I.mx = mx; I.my = my;
    const moving = Math.hypot(mx, my) > 0.2;
    I.clean = !UI.modal && (k.has('clean') || (this.mouse.down && !Build.active) || this.cleanBtn || (Settings.d.autoClean && moving));
    if (this.mouse.active && this.mouse.inside && !this.touchMode && !Build.active) { const w = Camera.toWorld(this.mouse.x, this.mouse.y); I.aimX = w.x; I.aimY = w.y; }
    else { I.aimX = null; I.aimY = null; }
    return I;
  },
};

const Haptics = { tap(ms) { if (Settings.d.vibrate && navigator.vibrate) try { navigator.vibrate(ms || 8); } catch (e) { } } };

/* Zentrale Aktions-Schicht: Tastatur, Touch und Netzwerk lösen dieselben Aktionen aus */
const Actions = {
  queue: [],
  // sofort ausführen (Ereignisse laufen nie parallel zur Logik); im Koop leiten interact() und Shop.do() selbst an den Host weiter
  push(name, arg) { this.exec(name, arg); },
  key(a) {
    if (a === 'debug') { UI.toggleDebug(); return; }
    if (a === 'pause') { if (Build.active) { if (Build.sel || Build.moving) Build.cancel(); else Build.toggle(false); return; } if (UI.closeTop()) return; this.push('pause'); return; }
    if (a === 'zoomIn') { Camera.setZoom(Camera.tz * 1.2); return; }
    if (a === 'zoomOut') { Camera.setZoom(Camera.tz / 1.2); return; }
    if (a === 'move' && !Build.active) a = 'map';
    this.push(a);
  },
  run() {
    while (this.queue.length) {
      const [a, arg] = this.queue.shift();
      this.exec(a, arg);
    }
  },
  exec(a, arg) {
    if (!G) return;
    switch (a) {
      case 'interact': return this.interact(arg);
      case 'terminal': return this.terminal();
      case 'build': if (UI.modal && !UI.sidePanel()) return; return Build.toggle();
      case 'rotate': return Build.rotateKey();
      case 'move': return Build.moveKey();
      case 'demolish': return Build.demolishKey();
      case 'undo': return Shop.do('undo');
      case 'map': return UI.toggleMap();
      case 'research': return UI.open('research');
      case 'orders': return UI.open('orders');
      case 'album': return UI.open('album');
      case 'coop': return Net.role ? Net.panel() : undefined;
      case 'pause': return UI.open('pause');
    }
  },
  // Kontext-Aktionen in Reichweite (nach Priorität)
  context(P) {
    const out = []; P = P || Player; if (!G || (P === Player && Build.active)) return out;
    const R = CONFIG.player.interactRange, v = P.veh;
    const load = P.loadKg() + (v ? Vehicles.loadKg(v) : 0);
    const drop = Buildings.nearest(P.x, P.y, b => b.def.drop, R + (v ? v.def.body : 0));
    if (drop && load > 0.001) out.push({ id: 'unload', label: 'Abladen', icon: 'unload', b: drop });
    else if (load > 0.001 && Economy.remoteUnload() && Buildings.covered(P.x, P.y)) out.push({ id: 'remote', label: 'Fernabladen', icon: 'radio' });
    const dep = Buildings.nearest(P.x, P.y, b => b.type === 'depot' || b.type === 'outpost', R + (v ? v.def.body : 0));
    if (dep && Buildings.canLaunch(dep) && !(drop && load > 0.001)) out.push({ id: 'launch', label: 'Kapsel starten', icon: 'rocket', b: dep });
    if (!v) { const nv = Vehicles.nearest(P.x, P.y, 3.2 + 1.5); if (nv && !nv.driver && U.dist(P.x, P.y, nv.x, nv.y) < nv.def.body + 2.2) out.push({ id: 'enter', label: nv.def.kind === 'cart' ? 'Schieben' : 'Einsteigen', icon: 'car', v: nv }); }
    // im Fahrzeug: Aussteigen vor Terminal (E steigt nach Abladen/Kapselstart aus)
    if (v) out.push({ id: 'exit', label: v.def.kind === 'cart' ? 'Loslassen' : 'Aussteigen', icon: 'exit', sec: true });
    const term = this.nearTerminal(P);
    if (term) out.push({ id: 'terminal', label: term.type === 'teleport' ? 'Teleport' : 'Terminal', icon: term.type === 'teleport' ? 'teleport' : 'terminal', b: term, sec: true });
    return out;
  },
  nearTerminal(P) {
    P = P || Player; const v = P.veh;
    return Buildings.nearest(P.x, P.y, b => ['depot', 'outpost', 'hangar', 'garage', 'teleport', 'silo', 'compressor', 'brickpress', 'glassoven', 'ramp', 'hopper', 'antenna', 'splitter', 'lamp'].includes(b.type), CONFIG.player.interactRange + (v ? v.def.body : 0));
  },
  interact(id, P) {
    P = P || Player;
    const ctx = this.context(P), me = P === Player;
    if (!ctx.length) { if (me && !id && P.ctxLoad() > 0.01) UI.toast('Zum Abladen näher an ein Depot gehen (orangefarbener Pfeil).'); return; }
    let c = id ? ctx.find(x => x.id === id) : ctx[0]; if (!c) return;
    if (me && Net.isClient() && c.id !== 'terminal') { Net.forward('interact', c.id); if (c.id === 'unload' || c.id === 'remote') Audio.sfx('unload'); return; }
    switch (c.id) {
      case 'unload': { const kg = P.unloadTo(c.b); if (kg > 0 && me) Audio.sfx('unload'); break; }
      case 'remote': { const dep = Buildings.mainDepot(); const kg = P.unloadTo(dep); if (kg > 0 && me) { Audio.sfx('radio'); UI.toast('Fernabladen: ' + U.kg(kg) + ' per Funk ins Hauptdepot geschickt.'); } break; }
      case 'launch': Buildings.launch(c.b, false); break;
      case 'enter': Vehicles.enter(c.v, P); if (me) Audio.sfx('door'); break;
      case 'exit': Vehicles.exit(P); if (me) Audio.sfx('door'); break;
      case 'terminal': if (me) UI.openBuilding(c.b); break;
    }
  },
  terminal() { const t = this.nearTerminal(); if (t) UI.openBuilding(t); else UI.toast('Kein Terminal in Reichweite.'); },
  // Tipp/Klick in die Welt: Gebäude in Reichweite öffnen
  tapWorld(sx, sy, tap) {
    if (UI.modal && !UI.sidePanel()) return;
    const w = Camera.toWorld(sx, sy), b = Buildings.at(Math.floor(w.x), Math.floor(w.y));
    if (b && Buildings.distTo(b, Player.x, Player.y) < CONFIG.player.interactRange + 4) { UI.openBuilding(b); return; }
    if (b) UI.toast(b.def.name + ': näher herangehen, um das Terminal zu öffnen.');
  },
  zoomAt(f, sx, sy) { Camera.setZoom(Camera.tz * f); },
};

/* ============================================================================
   8a. CAMERA – weich folgend, Vorausschau, stufenloser Zoom
   ============================================================================ */
const Camera = {
  x: 0, y: 0, zoom: 1, tz: 1, panX: 0, panY: 0, free: false, pulse: 0, W: 800, H: 600, ox: 0, oy: 0, kickA: 0, kickT: 0, kickD: 0,
  // kurzer Kamera-Impuls in Bildschirmpixeln (rein optisch)
  kick(px, ms) { if (Settings.d.noShake || !Settings.d.cameraPulse || VFX.reduce()) return; this.kickA = Math.max(this.kickA, px); this.kickD = ms / 1000; this.kickT = this.kickD; },
  init() { this.x = Player.x; this.y = Player.y; this.panX = this.panY = 0; this.zoom = this.tz = this.defaultZoom(); },
  defaultZoom() {
    const C = CONFIG.camera, p = Input.profile;
    if (p === 'tablet') return C.zoomTablet;
    if (p === 'phone') return innerHeight > innerWidth ? C.zoomPhonePortrait : C.zoomPhone;
    return C.zoomDesktop;
  },
  scale() { return CONFIG.world.cellPx * this.zoom; },
  setZoom(z) { this.tz = U.clamp(z, CONFIG.camera.zoomMin, CONFIG.camera.zoomMax); },
  pan(dxPx, dyPx) { const s = this.scale(); this.panX += dxPx / s; this.panY += dyPx / s; },
  update(dt, tx, ty, vx, vy) {
    const C = CONFIG.camera;
    this.zoom += (this.tz - this.zoom) * (1 - Math.exp(-10 * dt));
    if (!Build.active && !this.free) { this.panX *= Math.exp(-4 * dt); this.panY *= Math.exp(-4 * dt); }
    const la = C.lookAhead;
    const gx = tx + vx * la + this.panX, gy = ty + vy * la + this.panY;
    const k = 1 - Math.exp(-C.lerp * dt);
    this.x = U.wrapX(this.x + U.dx(this.x, gx) * k); this.y += (gy - this.y) * k;
    if (Math.abs(U.dx(this.x, gx)) > 200 || Math.abs(gy - this.y) > 200) { this.x = U.wrapX(gx); this.y = gy; }
    this.y = U.clamp(this.y, 0, WSIZE);
    if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt);
    if (this.kickT > 0) { this.kickT -= dt; const f = Math.max(0, this.kickT / this.kickD) * this.kickA; this.ox = (VFX.r() - 0.5) * 2 * f; this.oy = (VFX.r() - 0.5) * 2 * f; if (this.kickT <= 0) { this.ox = this.oy = 0; this.kickA = 0; } }
  },
  effScale() { const p = this.pulse > 0 && Settings.d.cameraPulse && !Settings.d.noShake ? 1 - Math.sin((1 - this.pulse / 1.2) * Math.PI) * 0.06 : 1; return this.scale() * p; },
  toWorld(sx, sy) { const s = this.effScale(); return { x: U.wrapX(this.x + (sx - this.W / 2) / s), y: this.y + (sy - this.H / 2) / s }; },
  toScreen(wx, wy) { const s = this.effScale(); return { x: this.W / 2 + U.dx(this.x, wx) * s, y: this.H / 2 + (wy - this.y) * s }; },
  snap() { this.x = U.wrapX(Player.x); this.y = Player.y; },
};

/* ============================================================================
   8b. RENDERER – Chunk-Textur-Cache, LOD, Partikel, Licht
   ============================================================================ */
const GOOD_COL = THEME.goods;

  // feine, weltfeste Körnung als Überlagerung (bleibt bei jedem Zoom scharf)

  // Nacht: Dunkelheits-Ebene in niedriger Auflösung, Lichter herausgeschnitten
  drawNight(s) {

/* ============================================================================
   8d. GROUND-FX – Glanzband, Frisch-geputzt-Schimmer, Wischstreifen, Glanzsterne,
   Luftstaub und Vignette. Alles rein optisch, nichts davon wird gespeichert.
