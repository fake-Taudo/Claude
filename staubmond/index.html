const Ground = {
  masks: new Map(), layer: null, lctx: null, mimg: null,
  fresh: null, fHead: 0, fN: 0, wipes: [], glints: [], glintT: 0, motes: [], vig: null, vigKey: '', camPrev: null,
  init() {
    this.fresh = new Float32Array(FX_CONFIG.fresh.max * 3);
    this.layer = document.createElement('canvas'); this.lctx = this.layer.getContext('2d');
    this.mimg = new ImageData(64, 64);
  },
  reset() { this.masks.clear(); this.fHead = 0; this.fN = 0; this.wipes.length = 0; this.glints.length = 0; },
  // eine Zelle ist gerade sauber geworden (nur sichtbare, nie im Offline-Modus)
  onClean(x, y) {
    if (Robots.offlineMode || !Renderer.s || !Renderer.inView(x + 0.5, y + 0.5, 2)) return;
    const F = this.fresh, i = this.fHead * 3; F[i] = x + 0.5; F[i + 1] = y + 0.5; F[i + 2] = VFX.t;
    GLGround.freshDirty.add(World.ci(x, y));
    this.fHead = (this.fHead + 1) % FX_CONFIG.fresh.max; if (this.fN < FX_CONFIG.fresh.max) this.fN++;
  },
  // Wischstreifen in Bewegungsrichtung (vom Putz-Effekt gemeldet)
  wipe(x0, y0, x1, y1, w) {
    if (!VFX.T.gloss) return;
    const L = this.wipes; L.push({ x0, y0, x1, y1, w, t: VFX.t }); if (L.length > FX_CONFIG.wipe.max) L.shift();
  },
  /* --- Saubere Fläche als Maske (1 px pro Zelle) --- */
  mask(ci) {
    let e = this.masks.get(ci);
    if (!e) {
      const cv = document.createElement('canvas'); cv.width = cv.height = 64;
      e = { cv, ctx: cv.getContext('2d'), stamp: 0 };
      this.paintMask(ci, e, 0, 0, 63, 63);
      this.masks.set(ci, e);
      if (this.masks.size > 140) { const arr = [...this.masks].sort((a, b) => a[1].stamp - b[1].stamp); for (let i = 0; i < 30; i++) this.masks.delete(arr[i][0]); }
    }
    e.stamp = Renderer.stamp;
    return e;
  },
  paintMask(ci, e, x0, y0, x1, y1) {
    const b = World.base(ci), ch = World.chunks[ci], D = ch ? ch.dust : b.dust, T = b.terr, d = this.mimg.data;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const li = y * 64 + x, t = T[li], o = li * 4;
      d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = (t === T_ROCK || t === T_GRAVEL || t === T_CANYON) ? 0 : D[li] <= CLEAN_T ? 255 : 0;
    }
    e.ctx.putImageData(this.mimg, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  },
  maskDirty(ci, x0, y0, x1, y1) { const e = this.masks.get(ci); if (e) this.paintMask(ci, e, x0, y0, x1, y1); },
  /* --- Glanz-Ebene über dem Boden (¼ Auflösung, auf saubere Fläche maskiert) --- */
  draw(s) {
    const R = Renderer, ctx = R.ctx, k = R.k, W = R.W, H = R.H, T = VFX.T, now = VFX.t;
    if (R.gl) { this.drawWipes(s); this.drawGlints(s); return; }
    if (!T.gloss || R.lod !== 0 || Camera.zoom < 0.55) { this.drawGlints(s); return; }
    const q = FX_CONFIG.gloss.maskRes, lw = Math.ceil(W / q), lh = Math.ceil(H / q), l = this.lctx, sq = s / q;
    if (this.layer.width !== lw || this.layer.height !== lh) { this.layer.width = lw; this.layer.height = lh; }
    l.setTransform(1, 0, 0, 1, 0, 0); l.globalCompositeOperation = 'source-over'; l.globalAlpha = 1; l.clearRect(0, 0, lw, lh);
    const str = VFX.strength() / (VFX.reduce() ? 0.5 : 1), boost = 1 + Clean.intensity * FX_CONFIG.clean.rampBoost;
    // 1) wanderndes Glanzband (diagonal, alle ~7 s)
    const G2 = FX_CONFIG.gloss, per = G2.period, ph = ((now % per) / per) * 1.6 - 0.3;
    const dlen = lw + lh, cx = ph * dlen;
    const gr = l.createLinearGradient(cx - dlen * G2.width, 0, cx + dlen * G2.width, dlen * 0);
    const ga = G2.alpha * str * boost;
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,' + ga.toFixed(3) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    l.save(); l.transform(1, 0, -0.7, 1, lh * 0.35, 0); l.fillStyle = gr; l.fillRect(-lh, 0, lw + lh * 2, lh); l.restore();

    l.globalCompositeOperation = 'lighter';
    let n = 0;
    for (let j = 0; j < this.fN; j++) {
      const i = j * 3, age = now - F[i + 2]; if (age > life || age < 0) continue;
      const x = R.sx(F[i]) / q, y = R.sy(F[i + 1]) / q; if (x < -4 || y < -4 || x > lw + 4 || y > lh + 4) continue;
      const a = Math.pow(1 - age / life, 1.6) * fs; if (a < 0.02) continue;
      const rr = sq * 1.1; l.globalAlpha = a > 1 ? 1 : a; l.drawImage(VFX.atlas, sp[0], sp[1], 64, 64, x - rr, y - rr, rr * 2, rr * 2); n++;

    for (let i = this.wipes.length - 1; i >= 0; i--) {
      const w = this.wipes[i], age = now - w.t; if (age > FX_CONFIG.wipe.life) { this.wipes.splice(i, 1); continue; }
      const a = (1 - age / FX_CONFIG.wipe.life) * 0.5 * str;
      l.globalAlpha = a; l.strokeStyle = '#ffffff'; l.lineWidth = Math.max(1, w.w * sq * 0.35);
      l.beginPath(); l.moveTo(R.sx(w.x0) / q, R.sy(w.y0) / q); l.lineTo(R.sx(w.x1) / q, R.sy(w.y1) / q); l.stroke();
    }
    l.globalAlpha = 1;
    // 3) auf saubere Fläche maskieren
    l.globalCompositeOperation = 'destination-in'; l.imageSmoothingEnabled = true;
    for (const ci of R.visibleChunks(0)) {
      const m = this.mask(ci), cxw = (ci % NCH) * CH, cyw = ((ci / NCH) | 0) * CH;
      const X = R.sx(cxw) / q, Y = R.sy(cyw) / q; let XX = X;
      // Ost-West-Umlauf: sx liefert den nächsten Abstand zur Kamera
      l.drawImage(m.cv, XX, Y, CH * sq, CH * sq);
    }
    // außerhalb aller Masken nichts stehen lassen: Rand mit leerer Fläche
    l.globalCompositeOperation = 'source-over';
    // 4) weich auf den Boden legen
    ctx.save(); ctx.setTransform(k, 0, 0, k, 0, 0); ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'soft-light'; ctx.drawImage(this.layer, 0, 0, lw * q, lh * q);
    ctx.restore();
    this.drawGlints(s);
  },
  // Wischstreifen direkt (GL-Modus): helle Striche auf frisch geputztem Boden
  drawWipes(s) {
    if (!this.wipes.length) return;
    const R = Renderer, ctx = R.ctx, k = R.k, now = VFX.t, str = VFX.strength() / (VFX.reduce() ? 0.5 : 1);
    ctx.save(); ctx.setTransform(k, 0, 0, k, 0, 0); ctx.lineCap = 'round'; ctx.strokeStyle = '#ffffff';
    for (let i = this.wipes.length - 1; i >= 0; i--) {
      const w = this.wipes[i], age = now - w.t; if (age > FX_CONFIG.wipe.life) { this.wipes.splice(i, 1); continue; }
      ctx.globalAlpha = (1 - age / FX_CONFIG.wipe.life) * 0.16 * str; ctx.lineWidth = Math.max(1, w.w * s * 0.3);
      ctx.beginPath(); ctx.moveTo(R.sx(w.x0), R.sy(w.y0)); ctx.lineTo(R.sx(w.x1), R.sy(w.y1)); ctx.stroke();
    }
    ctx.restore();
  },
  // Fuß- und Reifenspuren als Vektor-Abdrücke (GL-Modus), nur auf Staub
  drawDecals(s) {

    let n = 0;

            ctx.fillStyle = 'rgba(30,22,14,0.2)'; for (let q = 0; q < 3; q++) ctx.fillRect(-0.45 + q * 0.33, yy - 0.11, 0.12, 0.22);
            ctx.fillStyle = 'rgba(255,244,222,0.1)'; ctx.fillRect(-0.5, yy + 0.13, 1, 0.04);

    for (let k = 3; k < C2.length; k += 4) C2[k] = 0;
    let any = false;
    for (let j = 0; j < Ground.fN; j++) {
      const i = j * 3, age = now - F[i + 2]; if (age > life || age < 0) continue;
      const lx = Math.floor(F[i] - X0), ly = Math.floor(F[i + 1] - Y0); if (lx < -1 || ly < -1 || lx > 64 || ly > 64) continue;
      const v = Math.pow(1 - age / life, 1.6) * 255, o = ((ly + 1) * 66 + lx + 1) * 4 + 3; if (v > C2[o]) C2[o] = v; any = true;
    }

    if (upload) { const gl = this.gl; gl.bindTexture(gl.TEXTURE_2D, rec.tC2); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 66, 66, gl.RGBA, gl.UNSIGNED_BYTE, C2); }
  },
  markDirty(ci) { const r = this.chunks.get(ci); if (r) r.dirty = true; },
  // Zeichnen aller sichtbaren Chunks; liefert false, wenn ein Chunk noch fehlt (2D zeichnet dort Ersatz)
  draw(s, budgetEnd) {
    const gl = this.gl, R = Renderer, W = R.cv.width, H = R.cv.height, k = R.k, L = this.loc, T = VFX.T, E = FX_CONFIG.edge;
    this.resize(W, H); gl.viewport(0, 0, W, H);
    gl.clearColor(0.012, 0.02, 0.024, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.prog);
    const full = T.shade >= 2 ? 1 : 0, str = VFX.strength() / (VFX.reduce() ? 0.5 : 1);
    gl.uniform4f(L.uE, E.warp, E.rim, E.wall, E.shadow);
    gl.uniform4f(L.uF, full, 1 / (s * k), E.shadowOff, str);
    const G2 = FX_CONFIG.gloss, ph = ((VFX.t % G2.period) / G2.period) * 1.6 - 0.3, boost = 1 + Clean.intensity * FX_CONFIG.clean.rampBoost;
    gl.uniform4f(L.uG, ph, G2.width * 0.55, T.gloss ? G2.alpha * str * boost : 0, T.gloss ? FX_CONFIG.fresh.strength * 2.4 * str * boost : 0);
    gl.uniform2f(L.uScr, W, H);
    const wv = Rewards.waveU(); gl.uniform4f(L.uW, wv[0], wv[1], wv[2], wv[3]);
    gl.uniform1f(L.uTime, VFX.t % 1000);
    // Lichter für Spiegelungen auf sauberem Boden (Lampen, Scheinwerfer) – nur nachts
    const night = Math.max(Progression.darkness(), Camera.y < WSIZE * 0.15 || Camera.y > WSIZE * 0.85 ? 0.7 : 0);
    gl.uniform1f(L.uNight, night);
    if (night > 0.01) {
      const lt = this.lt || (this.lt = new Float32Array(24)); lt.fill(0); let n = 0;
      const P = Player, pv = P.veh, add = (x, y, r, a) => { if (n < 6) { lt[n * 4] = x; lt[n * 4 + 1] = y; lt[n * 4 + 2] = r; lt[n * 4 + 3] = a; n++; } };
      add(P.x + Math.cos(P.dir) * (pv ? 6 : 3.5), P.y + Math.sin(P.dir) * (pv ? 6 : 3.5), pv ? 8 : 5, 1);
      for (const b of Buildings.list) if (b.type === 'lamp' && R.inView(b.x, b.y, CONFIG.lampRadius)) add(b.x + 0.5, b.y + 0.5, CONFIG.lampRadius, 0.9);
      gl.uniform4fv(L.uLt, lt);
    }
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, this.glob.bed);
    gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, this.glob.warp);
    gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, this.glob.grain);
    const vr = R.viewRect(), cx0 = Math.floor(vr.x0 / CH), cx1 = Math.floor(vr.x1 / CH), cy0 = Math.max(0, Math.floor(vr.y0 / CH)), cy1 = Math.min(NCH - 1, Math.floor(vr.y1 / CH));
    const missing = [];
    let built = 0;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const ci = cy * NCH + ((cx % NCH) + NCH) % NCH;
      let rec = this.chunks.get(ci);
      if (!rec || rec.dirty || !rec.complete) {
        // neue Chunks: Basisdaten erzeugen kostet Zeit → Budget (mindestens einer pro Frame)
        const cheap = World.chunks[ci] || World.hasBase(ci);
        if (!rec && !cheap && built > 0 && performance.now() > budgetEnd) { missing.push([ci, cx, cy]); continue; }
        if (!rec) { rec = { stamp: 0 }; this.chunks.set(ci, rec); }
        if (rec.dirty || !rec.tL || (!rec.complete && (performance.now() < budgetEnd || !built))) { this.build(ci, rec); built++; }
      } else if (rec.fresh || this.freshDirty.has(ci)) this.applyFresh(ci, rec, true);
      rec.stamp = R.stamp;
      const X0 = (cx * CH - Camera.x) * s + R.W / 2, Y0 = (cy * CH - Camera.y) * s + R.H / 2;
      const x0 = X0 / R.W * 2 - 1, x1 = (X0 + CH * s) / R.W * 2 - 1, y0 = 1 - Y0 / R.H * 2, y1 = 1 - (Y0 + CH * s) / R.H * 2;
      gl.uniform4f(L.uRect, x0, y0, x1, y1);
      gl.uniform2f(L.uOrg, (((cx % NCH) + NCH) % NCH) * CH, cy * CH);

      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rec.tC1);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, rec.tC2);
      gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, rec.tN);

    this.freshDirty.clear();
    // Speicher begrenzen
    if (this.chunks.size > 140) {
      const arr = [...this.chunks].sort((a, b) => a[1].stamp - b[1].stamp);
      for (let i = 0; i < this.chunks.size - 120; i++) { const r = arr[i][1]; for (const t of [r.tL, r.tC1, r.tC2, r.tN]) if (t) gl.deleteTexture(t); this.chunks.delete(arr[i][0]); }
    }
    return missing;
  },
  freshDirty: new Set(),
  reset() { const gl = this.gl; if (gl) for (const r of this.chunks.values()) for (const t of [r.tL, r.tC1, r.tC2, r.tN]) if (t) gl.deleteTexture(t); this.chunks.clear(); },
};

/* ============================================================================
   8f. CLEAN – Putz-Feedback und Spielfigur-Animation (rein optisch, liest nur)
   Werkzeug-Schwung, aufgewirbelter und eingesaugter Staub, Werkzeug-Effekte,
   Behälter-voll-Zustand, Hüpfen in Mondschwerkraft, weiche Drehung, Leerlauf.
   ============================================================================ */
const Clean = {
  intensity: 0, hold: 0, acc: 0, swing: 0, sw: 0, t: 0, prevHead: null, wasFull: false, fullT: -9, kgTick: 0, pulse: 0, swapT: 0, lastTool: null,
  hopPh: 0, hopH: 0, land: 0, side: 0, idle: 0, look: 0, flash: 0,
  // Werkzeug-Optik: Schwungbogen (±Grad), Frequenz (Hz), Griff-Abstand, Stiellänge-Faktor
  TOOL: {
    zahnbuerste:  { deg: 12, hz: 11, jitter: 0.6, grip: 0.42 },
    handbuerste:  { deg: 18, hz: 6, jitter: 0.25, grip: 0.5 },
    besen:        { deg: 28, hz: 3.2, jitter: 0.15, grip: 0.45 },
    mopp:         { deg: 10, hz: 3, jitter: 0.1, grip: 0.45, circle: 0.32 },
    saugrucksack: { deg: 20, hz: 2, jitter: 0.1, grip: 0.5 },
    sauglanze:    { deg: 12, hz: 1.2, jitter: 0.05, grip: 0.45 },
    plasma:       { deg: 22, hz: 2.5, jitter: 0.08, grip: 0.42 },
  },
  def() { return this.TOOL[G.tool] || this.TOOL.zahnbuerste; },
  // sichtbare Werkzeugkopf-Position: logische Putzposition, um den Spieler geschwenkt
  head(P, tx, ty, px, py) {
    const d = this.def(), a0 = Math.atan2(ty - py, U.dx(px, tx)), reach = Math.hypot(U.dx(px, tx), ty - py);
    const a = a0 + this.sw;
    let hx = px + Math.cos(a) * reach, hy = py + Math.sin(a) * reach;
    if (d.circle && this.swing > 0.01) { hx += Math.cos(this.t * d.hz * 6.283) * d.circle * this.swing; hy += Math.sin(this.t * d.hz * 6.283) * d.circle * this.swing; }
    return { x: hx, y: hy, a, reach };
  },
  // pro Render-Frame (nicht in der Logik): Zustände nachführen und Partikel erzeugen
  frame(dt) {
    if (!G || Game.state !== 'play') return;
    const P = Player, d = this.def(), T = FX_CONFIG.clean, vis = Draw.vis;
    this.t += dt;
    const onFoot = !P.veh || P.veh.def.kind === 'cart';
    const cleaning = onFoot && P.cleaning, wiping = onFoot && Input.intent && Input.intent.clean;
    // Intensität steigt nach ~2 s Dauerputzen leicht an
    if (cleaning) this.hold += dt; else this.hold = 0;
    const tgt = this.hold > T.rampTime ? 1 : 0;
    this.intensity += (tgt - this.intensity) * Math.min(1, dt * (tgt > this.intensity ? 0.8 : 2.5));
    // Schwung: läuft beim Putzen (auch bei vollem Behälter), klingt sonst aus
    const want = wiping ? 1 : 0;
    this.swing += (want - this.swing) * Math.min(1, dt * 10);
    const ph = this.t * d.hz * 6.283, jit = Math.sin(this.t * 17.3) * d.jitter + Math.sin(this.t * 5.1) * d.jitter * 0.5;
    this.sw = this.swing * (d.deg * Math.PI / 180) * (Math.sin(ph) + jit * 0.35) * (VFX.reduce() ? 0.5 : 1);
    // Werkzeugwechsel (Kauf/Ausrüsten): kurzes Aufblitzen
    if (this.lastTool !== G.tool) { if (this.lastTool) { this.swapT = 0.4; this.flash = 1; } this.lastTool = G.tool; }
    if (this.swapT > 0) this.swapT -= dt; if (this.flash > 0) this.flash -= dt * 3;
    // Behälter: Puls je volles kg, Voll-Blase beim Übergang
    const kg = P.ctxLoad(), cap = P.ctxCap(), full = kg >= cap - 0.01;
    if (kg > 0.01) this.lastType = this.loadType();
    const fv = cap > 0 ? kg / cap : 0; this.fillVis = fv < this.fillVis ? this.fillVis + (fv - this.fillVis) * Math.min(1, dt * 2.6) : fv;
    if (Math.floor(kg) > this.kgTick) this.pulse = 1;
    this.kgTick = Math.floor(kg); if (this.pulse > 0) this.pulse -= dt * 4;
    if (full && !this.wasFull && kg > 0) this.fullT = VFX.t;
    this.wasFull = full;
    // Drehung, Hüpfen, Leerlauf
    this.anim(dt, P, vis);
    if (!onFoot || !Renderer.inView(P.x, P.y, 4)) { this.prevHead = null; return; }
    const H = this.head(P, P.tx, P.ty, P.x, P.y), rad = Economy.toolRadius();
    // Wischstreifen (frischer Boden, in Bewegungsrichtung)
    if (cleaning && this.prevHead && VFX.T.gloss) { const dx = U.dx(this.prevHead.x, H.x), dy = H.y - this.prevHead.y; if (dx * dx + dy * dy > 0.01 && dx * dx + dy * dy < 4) Ground.wipe(this.prevHead.x, this.prevHead.y, H.x, H.y, Math.max(0.3, rad * 0.9)); }
    this.prevHead = cleaning ? H : null;
    if (full && wiping) { this.fullFx(dt, P, vis); return; }
    if (!cleaning || P.cleanFx <= 0) return;
    // Staubwölkchen an der Vorderkante, fliegen nach außen und dann in den Rücken-Tank
    const xi = Math.floor(H.x), yi = Math.floor(H.y), ty = World.typeAt(xi, yi), dens = World.dustAt(xi, yi);
    this.acc += P.cleanFx * dt * T.perKgParticles * (1 + this.intensity * T.rampBoost) * VFX.strength() + T.minPerFrame * VFX.strength();
    let n = Math.floor(this.acc); this.acc -= n; if (n > 6) n = 6;
    const id = G.tool;
    for (let i = 0; i < n; i++) {
      const a = H.a + VFX.rr(-1.2, 1.2), r = rad * VFX.rr(0.2, 0.9), x = H.x + Math.cos(a) * r, y = H.y + Math.sin(a) * r;
      const dark = dens > 140 && VFX.r() < 0.6, col = dark ? VFX.PAL.dark0 + ty : ty, out = VFX.rr(0.6, 2.2);
      const life = VFX.rr(T.lifeMin, T.lifeMax) * 1.25, size = (dark ? VFX.rr(0.13, 0.22) : VFX.rr(0.08, 0.16)) * (0.8 + Math.min(1.2, rad * 0.25));
      if (id === 'plasma') {
        // Staub verdampft zu Funken
        Particles.emit('plasma', x, y, 0.15, Math.cos(a) * out * 2, Math.sin(a) * out * 2, VFX.rr(1, 3), VFX.rr(0.25, 0.5), 0.14, VFX.PAL.plasma);
        if (VFX.r() < 0.4) Particles.emit('ember', x, y, 0.2, Math.cos(a) * out, Math.sin(a) * out, VFX.rr(0.5, 1.5), 0.45, 0.22, VFX.PAL.plasma);
        continue;
      }
      if (id === 'saugrucksack' || id === 'sauglanze') {
        // Strudel direkt in die Düse
        const j = Particles.emit('dust', x, y, 0.05, -Math.sin(a) * out * 1.6, Math.cos(a) * out * 1.6, VFX.rr(0.3, 0.8), life * 0.7, size, col, 2, H.x, H.y);
        if (j >= 0) Particles.hs[j] = 0.9;
        continue;
      }
      const j = Particles.emit('dust', x, y, 0.06, Math.cos(a) * out, Math.sin(a) * out, VFX.rr(0.8, 1.7), life, size, col, 1);
      if (j >= 0) Particles.hs[j] = T.homeAt;
    }
    // Werkzeug-Spezialeffekte
    if (id === 'zahnbuerste' && VFX.r() < 0.05 * VFX.strength()) Particles.emit('foam', H.x, H.y, 0.15, VFX.rr(-1, 1), VFX.rr(-1, 1), VFX.rr(1.2, 2.2), 0.9, VFX.rr(0.09, 0.15), VFX.PAL.foam);
    else if (id === 'handbuerste' && VFX.r() < 0.35 * VFX.strength()) { const s2 = VFX.r() < 0.5 ? 1 : -1, a = H.a + s2 * 1.57; Particles.emit('puff', H.x, H.y, 0.1, Math.cos(a) * 1.6, Math.sin(a) * 1.6, 0.3, 0.6, 0.18, ty); }
    else if (id === 'besen' && VFX.r() < 0.5 * VFX.strength()) { const a = H.a + VFX.rr(-0.5, 0.5); Particles.emit('puff', H.x + Math.cos(H.a) * rad * 0.6, H.y + Math.sin(H.a) * rad * 0.6, 0.05, Math.cos(a) * 2.4, Math.sin(a) * 2.4, 0.2, 0.7, 0.26, ty); }
    else if (id === 'mopp' && VFX.T.gloss && VFX.r() < 0.5) Ground.wipe(H.x - Math.cos(H.a) * 0.2, H.y - Math.sin(H.a) * 0.2, H.x, H.y, rad * 1.4);
    else if (id === 'plasma' && VFX.r() < 0.3) Particles.emit('ring', H.x, H.y, 0.05, 0, 0, 0, 0.35, rad * 0.25, VFX.PAL.plasma);
  },
  // voller Behälter: Tank blinkt, Staub rieselt vom Tank, keine Saug-Partikel
  fullFx(dt, P, vis) {
    if (VFX.r() < 0.5 * VFX.strength()) {
      const a = (vis.dir || P.dir) + Math.PI + VFX.rr(-0.5, 0.5), ty = this.loadType();
      Particles.emit('drip', VFX.tank.x + Math.cos(a) * 0.2, VFX.tank.y + Math.sin(a) * 0.2, 0.75, Math.cos(a) * 0.3, Math.sin(a) * 0.3, 0, VFX.rr(0.5, 0.8), VFX.rr(0.06, 0.1), ty);
    }
  },
  loadType() { const L = Player.load; let best = 0; for (let t = 1; t < 7; t++) if (L[t] > L[best]) best = t; return best; },
  lastType: 0, fillVis: 0,
  loadTypeOf(actor) { return !actor || actor === Player ? this.lastType : 0; },
  // Animation der Figur: weiche Drehung (~120 ms), Hüpfen 2 Hz, Landewölkchen + Fußabdrücke, Leerlauf
  anim(dt, P, vis) {
    if (vis.dir === undefined) vis.dir = P.dir;
    vis.dir = U.angLerp(vis.dir, P.dir, 1 - Math.exp(-dt / 0.045));
    const onFoot = !P.veh || P.veh.def.kind === 'cart', spd = onFoot ? P.speed : 0;
    const amp = U.clamp(spd / 6, 0, 1);
    const prev = this.hopPh;
    if (amp > 0.05) this.hopPh += dt * 2 * (0.75 + amp * 0.4); else this.hopPh = this.hopPh % 1 < 0.5 ? Math.max(0, (this.hopPh % 1) - dt * 2) + Math.floor(this.hopPh) : this.hopPh + dt * 2;
    const f = this.hopPh % 1;
    this.hopH = Math.sin(Math.PI * f) * 0.34 * amp * (VFX.reduce() ? 0.5 : 1);
    if (Math.floor(this.hopPh) > Math.floor(prev) && amp > 0.15) this.onLand(P, vis);
    if (this.land > 0) this.land -= dt * 5;
    // Leerlauf: nach 4 s Stillstand kurz nach links und rechts schauen
    if (amp < 0.05 && !P.cleaning) this.idle += dt; else this.idle = 0;
    const lt = this.idle - 4; this.look = lt > 0 && lt < 2.4 ? Math.sin(lt / 2.4 * Math.PI * 2) * 0.55 : this.look * Math.exp(-dt * 6);
    if (this.idle > 9) this.idle = 2;
  },
  onLand(P, vis) {
    this.land = 1;
    const a = Math.atan2(P.vy, P.vx);
    for (const side of [-1, 1]) {
      const fx = P.x + Math.cos(a + Math.PI / 2) * 0.17 * side, fy = P.y + Math.sin(a + Math.PI / 2) * 0.17 * side;
      if (VFX.T.decals > 0 && World.dustAt(Math.floor(fx), Math.floor(fy)) > 30) World.addDecal(fx, fy, a, 0);
    }
    const xi = Math.floor(P.x), yi = Math.floor(P.y), d = World.dustAt(xi, yi);
    if (d > 20 && Renderer.inView(P.x, P.y, 2)) { const ty = World.typeAt(xi, yi); for (let i = 0; i < 3; i++) { const b = VFX.r() * 6.283; Particles.emit('puff', P.x + Math.cos(b) * 0.2, P.y + Math.sin(b) * 0.2, 0.02, Math.cos(b) * 0.9, Math.sin(b) * 0.9, 0.2, 0.55, 0.12 + d / 2000, ty); } }
    if (VFX.r() < 0.35) Audio.sfx('step');
  },
  // „Voll!“-Blase über der Figur (Bildschirmraum)
  drawOverlay() {
    const age = VFX.t - this.fullT; if (age < 0 || age > 1.5 || !G) return;
    const R = Renderer, ctx = R.ctx, P = Player, x = R.sx(P.x), y = R.sy(P.y) - 1.4 * R.s - 18;
    const a = Math.min(1, age * 8, (1.5 - age) * 4), pop = age < 0.2 ? 0.7 + age * 1.8 : 1;
    ctx.save(); ctx.setTransform(R.k, 0, 0, R.k, 0, 0); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(pop, pop);
    ctx.fillStyle = THEME.warn; Draw.rr(ctx, -30, -15, 60, 28, 12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 20); ctx.lineTo(6, 12); ctx.fill();
    ctx.fillStyle = '#1a1206'; ctx.font = '900 15px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Voll!', 0, -1);
    ctx.restore();
  },
};

/* ============================================================================
   8g. PAYDAY – Abladen und Kapselstart als sichtbare Momente, Münzflug zum Konto,
   zusammengefasste Popups. Die Logik bucht sofort; alles hier läuft nur hinterher.
   ============================================================================ */
const Payday = {
  bs: new Map(), launches: [], coins: [], held: 0, heldT: 0, shown: 0, tw: null, lastTxt: '', glowT: 0, target: null,
  st(b) { let s = this.bs.get(b.id); if (!s) { s = { fill: Buildings.total(b.capsule), open: 0, glow: 0, clickN: 0, click: 0, stream: null, launch: null, label: null }; this.bs.set(b.id, s); } return s; },
  reset() { this.bs.clear(); this.launches.length = 0; this.coins.length = 0; this.held = 0; this.tw = null; this.shown = G ? G.money : 0; },
  // Einlass-Punkt des Depots (Trichteröffnung) bzw. Mitte anderer Abgabestellen
  intake(b) {
    const c = Buildings.center(b);
    if (b.type !== 'depot' && b.type !== 'outpost') return c;
    const lw = (b.rot & 1) ? b.h : b.w, o = Draw.rotOff(-lw / 2 + 0.4 + lw * 0.225, 0, b.rot); return { x: c.x + o.x, y: c.y + o.y };
  },
  pad(b) {
    const c = Buildings.center(b); if (b.type === 'ramp') return c;
    const lw = (b.rot & 1) ? b.h : b.w, o = Draw.rotOff(lw / 2 - lw * 0.28, 0, b.rot); return { x: c.x + o.x, y: c.y + o.y };
  },
  // Abladen: Klappe öffnet, Staubstrom vom Tank in den Trichter, ein Popup „+x kg“
  onUnload(kg, b, actor) {
    if (!b || kg <= 0) return;
    const s = this.st(b), U2 = FX_CONFIG.unload;
    s.open = 1; s.glow = 1;
    const dur = U.clamp(U2.base + U2.perKg * kg, U2.base, U2.max);
    const from = actor === Player || !actor ? VFX.tank : { x: actor.x, y: actor.y, z: 0.8 };
    s.stream = { t: 0, dur, kg, n: Math.round(U.clamp(kg * 2.5, 8, 54) * Math.max(0.3, VFX.strength())), done: 0, from, ty: Clean.loadTypeOf(actor) };
    const p = this.intake(b);
    Renderer.popup(p.x, p.y - 0.5, '+' + U.kg(kg), THEME.ui.text, kg, 'kg');
    Haptics.tap(15);
  },
  // Kapselstart: Vorbereitung → Zündung → Aufstieg → Auszahlung (Kurzversion bei Serien)
  onLaunch(b, money, kg) {
    const now = VFX.t; this.launches = this.launches.filter(t => now - t < FX_CONFIG.capsule.burstWindow);
    const short = this.launches.length > 0 || VFX.reduce();
    this.launches.push(now);
    const s = this.st(b), p = this.pad(b), vis = Renderer.inView(p.x, p.y, 6);
    s.launch = { t0: now, short, money, kg: kg || 0, vis, paid: false, ignited: false, h: 0 };
    s.fill = 0;
    if (kg > 0) s.label = { t0: now, txt: U.kg(kg) + ' verkauft' + (money > 0 ? ' · +' + U.money(money) : '') };

  },
  // Münzen fliegen vom Bildschirmrand (Kapsel) zum Kontostand
  payout(b, s, p, edge) {
    const L = s.launch; if (!L || L.paid) return; L.paid = true;
    const R = Renderer, tgt = UI.moneyTarget(); if (!tgt) { this.held = Math.max(0, this.held - L.money); return; }
    let sx = R.sx(p.x), sy = 6;
    if (edge) { const dx = U.dx(Camera.x, p.x), dy = p.y - Camera.y, a = Math.atan2(dy, dx); sx = U.clamp(R.W / 2 + Math.cos(a) * R.W, 10, R.W - 10); sy = U.clamp(R.H / 2 + Math.sin(a) * R.H, 10, R.H - 10); }
    const n = Math.max(3, Math.min(FX_CONFIG.coinsMax, Math.round(3 + Math.log10(1 + L.money) * 3)));
    for (let i = 0; i < n; i++) this.coins.push({ x: sx + VFX.rr(-18, 18), y: sy + VFX.rr(-8, 8), sx, sy, cx: (sx + tgt.x) / 2 + VFX.rr(-120, 120), cy: Math.min(sy, tgt.y) + VFX.rr(40, 160), tx: tgt.x, ty: tgt.y, t: -i * 0.045, dur: VFX.rr(0.55, 0.8), val: L.money / n, rot: VFX.r() * 6 });
    if (!edge && FX_CONFIG && Settings.d.flashes) Particles.emit('glint', p.x, Camera.y - R.H / 2 / R.s + 0.4, 0, 0, 0, 0, 0.5, 1.6, VFX.PAL.gold, 0, 0, 0, true);
  },
  frame(dt) {
    if (!G) return;
    const now = VFX.t, C = FX_CONFIG.capsule;
    for (const [id, s] of this.bs) {
      const b = Buildings.byId(id); if (!b) { this.bs.delete(id); continue; }
      const cap = Buildings.total(b.capsule);
      // Füllring: steigt mit dem Staubstrom, nie über den echten Wert
      if (s.stream) {
        const st = s.stream; st.t += dt;
        const p = this.intake(b), want = Math.floor(st.n * Math.min(1, st.t / st.dur));
        for (; st.done < want; st.done++) {
          const j = Particles.emit('stream', st.from.x + VFX.rr(-0.15, 0.15), st.from.y + VFX.rr(-0.15, 0.15), 0.8, VFX.rr(-1.5, 1.5), VFX.rr(-2.5, -0.5), VFX.rr(1, 2.4), 0.9, VFX.rr(0.11, 0.18), st.ty, 2, p.x, p.y, true);
          if (j >= 0) Particles.hs[j] = 0.92;

      if (s.open > 0 && !s.stream) s.open -= dt * 2.2; if (s.glow > 0) s.glow -= dt * 1.4;
      // Kapselstart-Phasen (eigene Uhr, unabhängig vom Logik-Timer)
      const L = s.launch;
      if (L) {
        const e = now - L.t0, k = L.short ? C.shortTotal / (C.prep + C.ignite + C.ascent + C.pay) : 1, P2 = this.pad(b);
        const tI = C.prep * k, tA = (C.prep + C.ignite) * k, tP = (C.prep + C.ignite + C.ascent) * k, tE = tP + C.pay * k;
        if (L.vis && e >= tI && !L.ignited) { L.ignited = true; this.ignite(b, P2, L); }
        if (L.vis && e >= tI && e < tP) {
          // Rauchspur mit Glut
          const h = this.altitude(L, e, tA, tP);
          if (VFX.r() < (L.short ? 0.5 : 0.9)) Particles.emit('smoke', P2.x + VFX.rr(-0.2, 0.2), P2.y - h + 0.6, 0, VFX.rr(-0.4, 0.4), VFX.rr(0.3, 1.2), 0.2, VFX.rr(1.2, 2.2), VFX.rr(0.35, 0.6), VFX.PAL.smoke);

        }
        if (L.vis && e >= tP && !L.paid) this.payout(b, s, P2, false);

      if (s.label && now - s.label.t0 > 2.8) s.label = null;
    }
    // Münzen
    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i]; c.t += dt; if (c.t < 0) continue;
      const u = Math.min(1, c.t / c.dur), e = 1 - Math.pow(1 - u, 2.2), m = 1 - e;
      c.x = m * m * c.sx + 2 * m * e * c.cx + e * e * c.tx; c.y = m * m * c.sy + 2 * m * e * c.cy + e * e * c.ty; c.rot += dt * 8;

  },
  altitude(L, e, tA, tP) {
    if (e < tA) return 0;
    const u = (e - tA) / (tP - tA), top = (Renderer.sy(0) >= 0 ? 0 : 0) + (Renderer.H / 2 + 80) / Renderer.s;

  },
  // Zündung: Blitz (nicht bildschirmfüllend), Rauch- und Staubring am Boden, kleiner Kamera-Impuls
  ignite(b, p, L) {

    else Particles.emit('ember', p.x, p.y, 0.3, 0, 0, 0, 0.4, 1.4, VFX.PAL.flame, 0, 0, 0, true);
    const xi = Math.floor(p.x), yi = Math.floor(p.y), ty = World.typeAt(xi, yi);
    for (let i = 0; i < n; i++) {
      const a = i / n * 6.283 + VFX.rr(-0.15, 0.15), sp = VFX.rr(4, 7);
      Particles.emit('puff', p.x + Math.cos(a) * 0.8, p.y + Math.sin(a) * 0.8, 0.05, Math.cos(a) * sp, Math.sin(a) * sp, 0.3, VFX.rr(0.7, 1.1), VFX.rr(0.3, 0.5), i & 1 ? VFX.PAL.smoke : ty, 0, 0, 0, true);

    if (!L.short && Settings.d.cameraPulse && !Settings.d.noShake && !VFX.reduce()) Camera.kick(FX_CONFIG.capsule.pulsePx, FX_CONFIG.capsule.pulseMs);
  },
  // fliegende Kapseln und Startplatz-Effekte (Welt)
  draw() {
    const R = Renderer, ctx = R.ctx, now = VFX.t, C = FX_CONFIG.capsule;
    for (const [id, s] of this.bs) {
      const L = s.launch; if (!L || !L.vis) continue;
      const b = Buildings.byId(id); if (!b) continue;
      const p = this.pad(b), e = now - L.t0, k = L.short ? C.shortTotal / (C.prep + C.ignite + C.ascent + C.pay) : 1;
      const tI = C.prep * k, tA = (C.prep + C.ignite) * k, tP = (C.prep + C.ignite + C.ascent) * k;

      const sc = (0.7 + 0.3 * rise) * (1 + Math.sin(Math.min(1, u / 0.6) * Math.PI) * 0.55) * (u > 0.6 ? 1 - (u - 0.6) * 0.9 : 1);

  },
  // Bildschirmraum: Münzen, Beschriftung am Startplatz
  drawHUD() {

  // HUD-Kontostand: zählt in 400 ms hoch (ease-out), hält eintreffende Münzen kurz zurück

/* ============================================================================
   8h. REWARDS – große und mittlere Belohnungsmomente (Sektor, Fundstück, Kauf)
   ============================================================================ */
const Rewards = {
  wave: null, border: null, beams: [],
  // Sektor abgeschlossen: Lichtwelle vom Spieler über den sichtbaren Sektor, Grenze leuchtet
  sector(s) {
    const P = Player, vr = Renderer.viewRect(), rmax = Math.hypot(vr.x1 - vr.x0, vr.y1 - vr.y0) * 0.65;
    this.wave = { x: P.x, y: P.y, t0: VFX.t, dur: VFX.reduce() ? 0.45 : 1.2, rmax, s };
    this.border = { s, t0: VFX.t };
    const sx = (s % NSEC) * SEC, sy = ((s / NSEC) | 0) * SEC;
    for (let i = 0; i < 26 * VFX.strength(); i++) {
      const x = U.wrapX(vr.x0 + VFX.r() * (vr.x1 - vr.x0)), y = vr.y0 + VFX.r() * (vr.y1 - vr.y0);
      if (y < sy || y >= sy + SEC || U.dx(sx, x) < 0 || U.dx(sx, x) >= SEC) continue;
      const d = U.dist(P.x, P.y, x, y), j = Particles.emit('glint', x, y, 0, 0, 0, 0, 0.7 + d / rmax * 1.2, VFX.rr(0.5, 1.1), VFX.PAL.white, 0, 0, 0, true);
      if (j >= 0) Particles.alpha[j] = 1;
    }
  },
  // Uniform für den GL-Boden: Welt-x, Welt-y, Radius, Stärke
  waveU() {
    const w = this.wave; if (!w) return [0, 0, -100, 0];
    const u = (VFX.t - w.t0) / w.dur; if (u > 1.35) { this.wave = null; return [0, 0, -100, 0]; }
    const e = 1 - Math.pow(1 - Math.min(1, u), 2);
    return [w.x, w.y, e * w.rmax, (u < 1 ? 1 : 1 - (u - 1) / 0.35) * (Settings.d.flashes ? 1 : 0.5)];
  },
  // Fundstück: Lichtstrahl aus dem Boden, Objekt steigt drehend auf, fliegt dann ins Album
  find(f) { if (!Robots.offlineMode) this.beams.push({ x: f.x, y: f.y, t0: VFX.t, gold: !!f.gold, flown: false }); },
  draw() {
    const R = Renderer, ctx = R.ctx, now = VFX.t;
    // Sektorgrenze als dünne, petrolfarbene Leuchtlinie
    if (this.border) {
      const b = this.border, age = now - b.t0; if (age > 2.2) this.border = null;
      else {
        const sx = (b.s % NSEC) * SEC, sy = ((b.s / NSEC) | 0) * SEC, a = Math.min(1, age * 4) * Math.max(0, 1 - (age - 1.2));
        R.at(sx, sy); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.max(0, a);
        ctx.strokeStyle = THEME.alop.petrolLight; ctx.lineWidth = 0.5; ctx.strokeRect(0, 0, SEC, SEC);
        ctx.globalAlpha = Math.max(0, a) * 0.35; ctx.lineWidth = 2.2; ctx.strokeRect(0, 0, SEC, SEC);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
    }
    // Canvas-Rückfall: Lichtwelle als Ring (im GL-Modus übernimmt der Shader)
    if (this.wave && !R.gl) {
      const [x, y, r, a] = this.waveU();
      if (a > 0) { R.at(x, y); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.5; ctx.strokeStyle = THEME.clean.light; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, r), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    }
    for (let i = this.beams.length - 1; i >= 0; i--) {
      const B = this.beams[i], age = now - B.t0;
      if (age > 1.6) { if (!B.flown) { B.flown = true; UI.flyIcon(R.sx(B.x), R.sy(B.y - 2.2), 'album', B.gold ? THEME.money : '#FFE9C9'); } this.beams.splice(i, 1); continue; }
      if (!R.inView(B.x, B.y, 6)) continue;
      const a = Math.min(1, age * 5) * Math.min(1, (1.6 - age) * 3), rise = Math.min(1, age / 1.1);
      R.at(B.x, B.y);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, 0, 0, -8); g.addColorStop(0, 'rgba(255,233,168,' + (0.75 * a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,233,168,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-0.7, 0); ctx.lineTo(-0.25, -8); ctx.lineTo(0.25, -8); ctx.lineTo(0.7, 0); ctx.closePath(); ctx.fill();
      const sp = VFX.spr('glint', VFX.PAL.gold); ctx.globalAlpha = a; ctx.drawImage(VFX.atlas, sp[0], sp[1], 64, 64, -1.4, -1.4 - rise * 2.2, 2.8, 2.8); ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      // das Fundstück dreht sich beim Aufsteigen
      ctx.save(); ctx.translate(0, -rise * 2.2); ctx.rotate(age * 5); ctx.scale(Math.cos(age * 7) * 0.5 + 0.6, 1);
      ctx.fillStyle = B.gold ? THEME.money : '#E9DFC9'; this.relic(ctx); ctx.restore();
    }
  },
  relic(ctx) { ctx.beginPath(); ctx.moveTo(0, -0.42); ctx.lineTo(0.36, -0.1); ctx.lineTo(0.24, 0.38); ctx.lineTo(-0.24, 0.38); ctx.lineTo(-0.36, -0.1); ctx.closePath(); ctx.fill(); ctx.strokeStyle = THEME.outline; ctx.lineWidth = 0.06; ctx.stroke(); },
};

/* ============================================================================
   8i. ACTORS – optischer Zustand von Fahrzeugen, Robotern und Gebäuden
   (Raddrehung, Federung, Neigung, Ein-/Ausstieg, Landung, Bau-/Abriss-Animation,
   Rückstau auf Bändern). Nur gelesen aus der Logik, nie gespeichert.
   ============================================================================ */
const Actors = {
  veh: new Map(), rob: new Map(), bld: new Map(), belt: new Map(), jump: null, lastVeh: null, land: new Map(), antT: 0,
  vs(v) { let s = this.veh.get(v.id); if (!s) { s = { wheel: 0, bounce: 0, bv: 0, lean: 0, pa: v.a, pvx: v.vx, pvy: v.vy, spring: 0, track: 0 }; this.veh.set(v.id, s); } return s; },
  rs(r) { let s = this.rob.get(r.id); if (!s) { s = { load: Robots.loadKg(r), blink: VFX.r() * 4, ph: VFX.r() * 6.28 }; this.rob.set(r.id, s); } return s; },
  reset() { this.veh.clear(); this.rob.clear(); this.bld.clear(); this.belt.clear(); this.jump = null; this.land.clear(); this.lastVeh = Player.veh; },
  frame(dt) {
    if (!G || dt <= 0) return;
    const P = Player;
    // Ein- und Aussteigen: Figur springt im Bogen, Fahrzeug federt ein
    if (P.veh !== this.lastVeh) {
      const nv = P.veh, ov = this.lastVeh;
      if (nv && nv.def.kind !== 'cart') { this.jump = { x0: this.lastPX, y0: this.lastPY, v: nv, t0: VFX.t, enter: true }; this.vs(nv).spring = 1; }
      else if (ov && ov.def.kind !== 'cart') { this.jump = { x0: ov.x, y0: ov.y, t0: VFX.t, enter: false }; this.vs(ov).spring = 0.7; }
      this.lastVeh = nv;
    }
    this.lastPX = P.x; this.lastPY = P.y;
    if (this.jump && VFX.t - this.jump.t0 > 0.28) this.jump = null;
    for (const v of Vehicles.list) {
      const s = this.vs(v), sp = Math.hypot(v.vx, v.vy), ca = Math.cos(v.a), sa = Math.sin(v.a), fs = v.vx * ca + v.vy * sa;
      s.wheel += fs * dt;
      // Federung: Beschleunigung längs → Nicken, Drehrate → Neigung in Kurven
      const ax = (v.vx - s.pvx) / dt, ay = (v.vy - s.pvy) / dt, along = U.clamp(ax * ca + ay * sa, -40, 40);
      const turn = U.clamp(U.angDiff(s.pa, v.a) / dt, -6, 6);
      // gedämpfte Feder (stabil, begrenzt)
      const kd = Math.min(dt, 0.05);
      s.bv += (-along * 0.0012 - s.bounce * 90 - s.bv * 9) * kd; s.bounce = U.clamp(s.bounce + s.bv * kd, -0.08, 0.08);
      s.lean += (U.clamp(turn * sp * 0.012, -0.12, 0.12) - s.lean) * Math.min(1, dt * 8);
      if (!isFinite(s.bounce) || !isFinite(s.bv)) { s.bounce = 0; s.bv = 0; }
      if (s.spring > 0) s.spring -= dt * 2.5;
      s.pvx = v.vx; s.pvy = v.vy; s.pa = v.a;
      // Bremsspuren und Drift-Streifen im Staub
      const lat = Math.abs(-v.vx * sa + v.vy * ca);
      if (v.def.kind !== 'cart' && !v.def.hover && VFX.T.decals >= 2 && (lat > 2.2 || along < -9) && sp > 3) {
        s.track += sp * dt; if (s.track > 0.6) { s.track = 0; if (World.dustAt(Math.floor(v.x), Math.floor(v.y)) > 30) World.addDecal(v.x, v.y, v.a, 1, v.def.body * 1.25); }
      }
      // Bürstenwalze: Staubfontäne seitlich nach hinten
      if (v.cleanFx > 0 && Renderer.inView(v.x, v.y, 4) && v.def.kind !== 'cart') {

  },

/* ============================================================================
   6b. ROBOTS – K.E.H.R.-Bots: Zuweisung, Rasenmäher-Bahnen, Funknetz, Fernsimulation
   ============================================================================ */
const Robots = {
  list: [], assigns: [], tick: 0, offlineMode: false, offlineKg: 0, warnT: 0,
  def(m) { return CONFIG.robots.find(r => r.id === m); },
  init() {
    if (!G.robotUp) G.robotUp = { speed: 0, radius: 0, cap: 0 };
    this.assigns = (G.assigns || []).map(a => Object.assign({}, a));
    this.list = (G.robots || []).map(s => this.fromSave(s));
  },
  fromSave(s) {
    const r = { id: s.id, model: s.model, def: this.def(s.model), x: s.x, y: s.y, px: s.x, py: s.y, a: s.a || 0, state: s.state || 'home', load: new Float64Array(NGOODS),
      hangar: s.hangar, assign: s.assign || 0, rowY: s.rowY || 0, dir: s.dir || 1, col: s.col || 0, tx: NaN, timer: 0, warn: false, spin: 0, near: false, dropId: 0, cleanFx: 0 };
    if (s.load) for (let i = 0; i < NGOODS; i++) r.load[i] = s.load[i] || 0;
    if (r.state === 'toDrop' || r.state === 'radio') r.state = 'work';
    return r;
  },
  save() {
    G.robots = this.list.map(r => ({ id: r.id, model: r.model, x: r.x, y: r.y, a: r.a, state: r.state, load: Array.from(r.load), hangar: r.hangar, assign: r.assign, rowY: r.rowY, dir: r.dir, col: r.col }));
    G.assigns = this.assigns.map(a => Object.assign({}, a));
  },
  speed(r) { return r.def.speed * (1 + CONFIG.robotUpgrades[0].step * G.robotUp.speed) * Economy.fx('robotSpeed') * (G.ev.windUntil > G.t ? CONFIG.events.solarWind.mul : 1); },
  radius(r) { return r.def.radius * (1 + CONFIG.robotUpgrades[1].step * G.robotUp.radius) * Economy.fx('robotRadius'); },
  cap(r) { return r.def.cap * (1 + CONFIG.robotUpgrades[2].step * G.robotUp.cap) * Economy.fx('robotCap'); },
  power(r) { return 2 * this.radius(r) * this.speed(r) * CONFIG.robotPowerPerCell * Economy.fx('robotPower') * Economy.suction(); },
  loadKg(r) { let s = 0; for (let i = 0; i < NGOODS; i++) s += r.load[i]; return s; },
  upPrice(key) { return Math.round(CONFIG.robotUpgradeBase * Math.pow(CONFIG.robotUpgradeGrowth, G.robotUp[key]) * Economy.fx('upgradePrice')); },
  inHangar(h) { return this.list.filter(r => r.hangar === h.id).length; },
  fleetCap() { return CONFIG.robotFleet[G.licence] + Economy.fx('fleet'); },
  buy(model, h) {
    const d = this.def(model), price = Economy.robotPrice(d);
    if (d.licence > G.licence) return { ok: false, why: 'Lizenz ' + d.licence + ' nötig' };
    if (this.list.length >= this.fleetCap()) return { ok: false, why: 'Stellenplan ausgeschöpft (' + this.fleetCap() + ' Roboter bei Lizenz ' + G.licence + ')' };
    if (this.inHangar(h) >= Buildings.hangarSlots()) return { ok: false, why: 'Hangar voll (' + Buildings.hangarSlots() + ' Plätze)' };
    if (!Economy.spend(price)) return { ok: false, why: 'Es fehlen ' + U.money(price - G.money) };
    const c = Buildings.center(h);
    const r = this.fromSave({ id: G.nextId++, model, x: c.x + (Math.random() - 0.5) * 2, y: h.y + h.h + 1, hangar: h.id, state: 'home' });
    this.list.push(r);
    Bus.emit('robotBought', r);
    return { ok: true, r };
  },
  sell(r) { Economy.grant(Economy.robotPrice(r.def) + this.loadKg(r) * 1, 'refund'); this.list.splice(this.list.indexOf(r), 1); },
  /* --- Zuweisungen --- */
  areaFor(s) { const sx = s % NSEC, sy = (s / NSEC) | 0; return { x0: sx * SEC, y0: sy * SEC, w: SEC, h: SEC, sector: s }; },
  assignArea(robots, area, auto) {
    const a = { id: G.nextId++, x0: U.wrapI(area.x0), y0: Math.max(2, area.y0), w: area.w, h: Math.min(area.h, WSIZE - 2 - Math.max(2, area.y0)), sector: area.sector === undefined ? -1 : area.sector, auto: auto !== false, nextY: 0, pass: 0, claims: 0, done: false, created: G.t };
    a.nextY = a.y0;
    this.assigns.push(a);
    for (const r of robots) { this.release(r); r.assign = a.id; r.state = 'work'; r.tx = NaN; r.rowY = 0; }
    this.cleanupAssigns();
    Bus.emit('assigned', a, robots.length);
    return a;
  },
  release(r) { r.assign = 0; r.rowY = 0; r.tx = NaN; },
  recall(robots) { for (const r of robots) { this.release(r); if (r.state !== 'toDrop') r.state = 'home'; } this.cleanupAssigns(); },
  cleanupAssigns() { this.assigns = this.assigns.filter(a => this.list.some(r => r.assign === a.id)); },
  assignById(id) { return this.assigns.find(a => a.id === id) || null; },
  robotsOf(a) { return this.list.filter(r => r.assign === a.id); },
  idle(h) { return this.list.filter(r => (!h || r.hangar === h.id) && !r.assign); },
  assignedSector(s) { return this.assigns.find(a => a.sector === s && !a.done); },
  // Ist der Bereich fertig?
  areaDone(a) {
    if (a.sector >= 0) return World.secDone[a.sector] || (World.secKnown[a.sector] === 16 && World.secProgress[a.sector] >= CONFIG.world.sectorDoneFrac);
    return World.areaClean(a.x0, a.y0, a.w, a.h, 4) >= CONFIG.world.sectorDoneFrac;
  },
  finish(a) {
    a.done = true;
    const robots = this.robotsOf(a);
    if (!this.offlineMode) UI.radio(TXT.radio.robotsDone.replace('{s}', a.sector >= 0 ? U.sectorLabel(a.sector) : 'Rechteck'));
    if (a.auto && a.sector >= 0) {
      const next = this.nextSector(a.sector);
      if (next >= 0) { const na = this.assignArea(robots, this.areaFor(next), true); return na; }
    }
    this.recall(robots);
  },
  nextSector(s) {
    const sx = s % NSEC, sy = (s / NSEC) | 0;
    let best = -1, bd = 1e9;
    for (let rad = 1; rad <= 3 && best < 0; rad++) for (let oy = -rad; oy <= rad; oy++) for (let ox = -rad; ox <= rad; ox++) {
      if (Math.max(Math.abs(ox), Math.abs(oy)) !== rad) continue;
      const ny = sy + oy; if (ny < 0 || ny >= NSEC) continue;
      const ns = ny * NSEC + ((sx + ox) % NSEC + NSEC) % NSEC;
      if (World.secDone[ns] || this.assignedSector(ns)) continue;
      if (World.locked(World.secRegion[ns])) continue;
      const c = this.areaFor(ns);
      if (!Buildings.covered(c.x0 + 128, c.y0 + 128)) continue;
      const d = ox * ox + oy * oy - World.secProgress[ns];
      if (d < bd) { bd = d; best = ns; }
    }
    return best;
  },
  /* --- Spalte im Bahnstreifen schmutzig? --- */
  colDirty(x, yb0, yb1) {
    const xi = U.wrapI(Math.floor(x));
    for (let y = yb0; y <= yb1; y++) {
      if (y < 2 || y >= WSIZE - 2) continue;
      if (World.dustAt(xi, y) > CLEAN_T || World.meteorAt(xi, y) > 0) {
        const t = World.terrAt(xi, y);
        if (t === T_ROCK || t === T_GRAVEL || t === T_CANYON || t === T_BRIDGE) continue;
        if (World.locked(World.regionAt(xi, y))) continue;
        return true;
      }
    }
    return false;
  },
  // Bahnen reihum vergeben: Start bei der Zeile nächst dem ersten Roboter, danach umlaufend
  claimRow(r, a) {
    const band = Math.max(1, this.radius(r) * 2 * 0.86);
    if (a.covered === undefined) { a.covered = 0; a.nextY = U.clamp(Math.floor(r.y - a.y0 - 1), 0, a.h - 1) + a.y0; }
    if (a.covered >= a.h) return false;
    if (a.nextY >= a.y0 + a.h) a.nextY = a.y0;
    r.rowY = Math.min(a.y0 + a.h - 0.5, a.nextY + band / 2);
    a.nextY += band; a.covered += band;
    a.claims++; r.dir = U.dx(a.x0, r.x) < a.w / 2 ? 1 : -1;   // am näheren Ende beginnen (Schlangenlinien)
    r.col = r.dir > 0 ? 0 : a.w - 1;
    r.tx = NaN; r.band = band;
    return true;
  },
  // nächsten schmutzigen Abschnitt in der Bahn suchen (Ziel = Ende des zusammenhängenden Abschnitts)
  scan(r, a, maxCols) {
    const b = r.band || 2, yb0 = Math.floor(r.rowY - b / 2), yb1 = Math.floor(r.rowY + b / 2);
    let col = r.col, n = 0;
    while (col >= 0 && col < a.w && n < maxCols) { if (this.colDirty(a.x0 + col + 0.5, yb0, yb1)) break; col += r.dir; n++; }
    if (col < 0 || col >= a.w) { r.col = col; return -1; }
    if (n >= maxCols) { r.col = col; return 0; }
    let end = col, m = 0;
    while (m < 40) { const nc = end + r.dir; if (nc < 0 || nc >= a.w || !this.colDirty(a.x0 + nc + 0.5, yb0, yb1)) break; end = nc; m++; }
    r.sx = U.wrapX(a.x0 + col + 0.5 - r.dir * 0.4);
    r.col = end; r.tx = U.wrapX(a.x0 + end + 0.5 + r.dir * 0.3);
    return 1;
  },
  terrainMul(r) {
    if (r.def.fly) return 1;
    const t = World.terrAt(Math.floor(r.x), Math.floor(r.y)), T = CONFIG.robotTerrain;
    if (t === T_ROCK || t === T_GRAVEL) return T.rock;
    if (t === T_CANYON) return T.canyon;
    if (t === T_RIML || (t === T_RIMS && !r.def.smallRims)) return T.rim;
    return 1;
  },
  moveTo(r, tx, ty, dt, cleanIt) {
    const dx = U.dx(r.x, tx), dy = ty - r.y, d = Math.hypot(dx, dy);
    if (d < 1e-4) return true;
    let sp = this.speed(r) * this.terrainMul(r);
    if (!r.def.fly && World.regionAt(Math.floor(r.x), Math.floor(r.y)) === R_RUECK) sp *= 0.6;   // schwaches Signal auf der Rückseite
    if (cleanIt && !this.offlineMode) {
      // vor dichtem Staub abbremsen, damit eine Bahn sauber wird
      const rad = this.radius(r), fx = r.x + Math.sign(dx) * (rad + 0.6);
      let s = 0; for (let q = -1; q <= 1; q++) s += World.dustAt(Math.floor(fx), Math.floor(r.y + q * rad * 0.5));
      const need = (s / 3) * KG_UNIT * 1.2 * 2 * rad * sp;
      if (need > 0) sp *= U.clamp(this.power(r) / need, 0.25, 1);
    }
    const step = sp * dt;
    const ox = r.x, oy = r.y;
    if (step >= d) { r.x = U.wrapX(tx); r.y = ty; }
    else { r.x = U.wrapX(r.x + dx / d * step); r.y += dy / d * step; }
    r.a = Math.atan2(dy, dx);
    r.spin += step;
    if (cleanIt) this.cleanAlong(r, ox, oy, dt);
    return step >= d;
  },
  cleanAlong(r, ox, oy, dt) {
    const cap = this.cap(r), free = cap - this.loadKg(r);
    if (free <= 0.001) return;
    const c0 = G.stats.cells;
    const kg = World.stroke(ox, oy, r.x, r.y, this.radius(r), Math.min(this.power(r) * dt * (this.offlineMode ? 1.15 : 1), free), r.far || this.offlineMode, Economy.fx('yield'));
    if (kg > 0) { for (let t = 0; t < NGOODS; t++) r.load[t] += World.col[t]; G.stats.robotKg += kg; }
    G.stats.robotCells += G.stats.cells - c0;
    r.cleanFx = kg / dt;
  },
  bestDrop(r) {
    let best = null, bd = Infinity; const kg = this.loadKg(r);
    for (const b of Buildings.list) {
      if (!b.def.drop || !Buildings.dropAccepts(b, kg)) continue;
      const c = Buildings.center(b); if (!Buildings.covered(c.x, c.y)) continue;
      const d = U.dist2(r.x, r.y, c.x, c.y); if (d < bd) { bd = d; best = b; }
    }
    return best;
  },
  unload(r, b) {
    const kg = this.loadKg(r);
    if (this.offlineMode) { this.offlineKg += kg; r.load.fill(0); return; }
    for (let t = 0; t < NGOODS; t++) if (r.load[t] > 0) { Buildings.deliver(b, t, r.load[t]); r.load[t] = 0; }
    if (r.near) Audio.sfx('robot');
  },
  step(r, dt) {
    if (!Buildings.covered(r.x, r.y)) {
      if (!r.warn) { r.warn = true; if (!this.offlineMode && G.t - this.warnT > 30) { this.warnT = G.t; UI.radio(TXT.radio.noSignal); } }
      return;
    }
    r.warn = false;
    const a = r.assign ? this.assignById(r.assign) : null;
    if (r.assign && !a) r.assign = 0;
    switch (r.state) {
      case 'home': case 'idle': {
        if (a) { r.state = 'work'; return; }
        const h = Buildings.byId(r.hangar);
        if (!h) { const any = Buildings.list.find(b => b.type === 'hangar'); if (any) r.hangar = any.id; else return; }
        const hh = Buildings.byId(r.hangar), slot = this.list.filter(q => q.hangar === r.hangar).indexOf(r);
        const tx = U.wrapX(hh.x + (slot % 3) * 1.2 + 0.4), ty = hh.y + hh.h + 0.8 + Math.floor(slot / 3) * 1.2;
        if (this.loadKg(r) > 0.01) { const d = this.bestDrop(r); if (d) { r.state = 'toDrop'; r.dropId = d.id; return; } }
        if (this.moveTo(r, tx, ty, dt, false)) r.state = 'idle';
        return;
      }
      case 'work': {
        if (!a) { r.state = 'home'; return; }
        if (this.loadKg(r) >= this.cap(r) * 0.995) { this.beginUnload(r); return; }
        if (!r.rowY) {
          if (!this.claimRow(r, a)) {
            if (this.areaDone(a)) { if (!a.done) this.finish(a); return; }
            if (a.pass < 3) { a.pass++; a.covered = undefined; return; }
            if (!a.done) this.finish(a); return;
          }
        }
        if (isNaN(r.tx)) {
          const res = this.scan(r, a, this.offlineMode ? 600 : 96);
          if (res === -1) { r.rowY = 0; return; }
          if (res === 0) return;
          r.appr = Math.abs(U.dx(r.x, r.sx)) > 1.2 || Math.abs(r.y - r.rowY) > 1.2;
        }
        // erst zum Anfang des schmutzigen Abschnitts, dann putzend bis zum Ende
        if (r.appr) { if (this.moveTo(r, r.sx, r.rowY, dt, Math.abs(r.y - r.rowY) < 1.5)) r.appr = false; return; }
        if (this.moveTo(r, r.tx, r.rowY, dt, true)) { r.col += r.dir; r.tx = NaN; }
        return;
      }
      case 'toDrop': {
        const b = Buildings.byId(r.dropId);
        if (!b || !Buildings.dropAccepts(b, this.loadKg(r))) { const d = this.bestDrop(r); if (!d) { r.state = r.assign ? 'work' : 'home'; return; } r.dropId = d.id; return; }
        const c = Buildings.center(b), arrive = Buildings.distTo(b, r.x, r.y) < 1.2;
        if (arrive || this.moveTo(r, c.x, b.y + b.h + 0.6, dt, false)) { this.unload(r, b); r.state = r.assign ? 'work' : 'home'; }
        return;
      }
      case 'radio': {
        r.timer -= dt;
        if (r.timer <= 0) { const b = this.bestDrop(r); if (b) this.unload(r, b); r.state = r.assign ? 'work' : 'home'; }
        return;
      }
    }
  },
  beginUnload(r) {
    if (Economy.fx('selfEmpty') && r.model !== 'mk1') { r.state = 'radio'; r.timer = 1; return; }
    const b = this.bestDrop(r);
    if (!b) return;
    r.state = 'toDrop'; r.dropId = b.id;
  },
  update(dt) {
    this.tick++;
    const g = this.tick % CONFIG.robotFarGroups, farDt = dt * CONFIG.robotFarGroups;
    for (let i = 0; i < this.list.length; i++) {
      const r = this.list[i];
      const near = Renderer.inView(r.x, r.y, 12);
      if (near) {
        if (!r.near) { r.px = r.x; r.py = r.y; }
        r.near = true; r.far = false; r.px = r.x; r.py = r.y;
        this.step(r, dt);
        if (r.cleanFx > 0 && Math.random() < 0.5) Fx.dust(r.x, r.y, this.radius(r), r.a, 0);
      } else {
        r.near = false; r.far = true;
        if (i % CONFIG.robotFarGroups === g) { r.px = r.x; r.py = r.y; this.step(r, farDt); }
      }
    }
  },
  // Offline: Roboter mit groben Schritten nachsimulieren (Erlöse über Durchschnittswert)
  offlineStep(dt) { for (const r of this.list) { r.far = true; this.step(r, dt); } },
  draw(alpha, lod) { Draw.robotList(alpha, lod); },
};

/* ============================================================================
   9. PROGRESSION – Sektoren, Fundstücke, Lizenzen, Aufträge, Events, Tutorial
   ============================================================================ */
const ORDER_KINDS = {
  cells: { title: 'Flächenreinigung', text: 'Bitte reinigen Sie {n} Zellen Mondoberfläche. Die Erde schaut zu.' },
  deliver: { title: 'Lieferauftrag', text: 'Die Erde bestellt {kg} {dust}. Verwendungszweck: geheim (vermutlich Katzenstreu).' },

const Progression = {
  rates: { cells: 30, t: 0, c0: 0 }, insp: null, tutT: 0, carpetSecs: [],
  init() {
    // Sektoren des Großen Teppichkraters (Endziel)
    const c = World.carpet; this.carpetSecs = [];
    for (let s = 0; s < NSEC * NSEC; s++) { const sx = (s % NSEC) * SEC + 128, sy = ((s / NSEC) | 0) * SEC + 128; if (U.dist(sx, sy, c.x, c.y) < c.r * 0.92) this.carpetSecs.push(s); }
    if (!G.stats.builtBy) G.stats.builtBy = {};
    if (!G.orders.length) this.fillOrders();
    this.rates.c0 = G.stats.cells; this.rates.t = G.t;
  },
  /* --- Sektor abgeschlossen --- */
  sectorDone(s) {
    if (Robots.offlineMode) { G.secDone.push(s); G.stats.sectors++; Robots.offlineSectors = (Robots.offlineSectors || 0) + 1; const bonus = this.sectorBonus(s); Economy.grant(bonus, 'sector'); G.fp += CONFIG.sectorReward.fp; return; }
    G.secDone.push(s); G.stats.sectors++;
    const bonus = this.sectorBonus(s);
    Economy.grant(bonus, 'sector'); G.fp += CONFIG.sectorReward.fp;
    UI.stamp(s, bonus); Net.fx('stamp', [s, bonus]);
    Fx.sectorWave(s);
    Audio.sfx('stamp');
    Bus.emit('sectorDone', s);
    Save.soon();
    this.checkEnding();
  },
  sectorBonus(s) { return Math.round(CONFIG.regions[World.secRegion[s]].sectorBonus * Economy.fx('sectorBonus') * (1 + G.mission * 0.25)); },
  /* --- Fundstücke --- */
  findReward(f) { const reg = CONFIG.regions[f.region]; return Math.round(CONFIG.findReward.base * Math.pow(3.2, reg.licence) * (f.gold ? 3 : 1) * Economy.fx('findReward')); },
  onFind(f) {
    G.stats.findsFound++;
    const m = this.findReward(f), fp = CONFIG.findReward.fp + (f.gold ? 1 : 0);
    Economy.grant(m, 'find'); G.fp += fp;
    if (Robots.offlineMode) return;
    UI.findPopup(f, m, fp); Net.fx('find', [f.id, m, fp]);
    Fx.burst(f.x, f.y, 3, 30);
    Audio.sfx('find');
    Bus.emit('find', f);
  },
  /* --- Tag/Nacht --- */
  dayPhase() { const L = CONFIG.events.dayLength; return ((G.day % L) + L) % L / L; },
  darkness() {
    if (!G) return 0;
    const p = this.dayPhase(), n0 = 1 - CONFIG.events.nightFrac, fade = 0.04;
    let d = 0;
    if (p > n0 + fade && p < 1 - fade) d = 1;
    else if (p > n0 && p <= n0 + fade) d = (p - n0) / fade;
    else if (p >= 1 - fade) d = (1 - p) / fade;
    return d * 0.82;
  },
  /* --- Pro Logik-Tick (gedrosselt) --- */
  update(dt) {
    G.day += dt;
    const night = this.darkness() > 0.4;
    if (night !== G.ev.night) { G.ev.night = night; if (G.t > 30) UI.radio(night ? TXT.radio.night : TXT.radio.day); Bus.emit('night', night); }
    Economy.updateDemand();
    this.events(dt);
    if (Math.floor(G.t * 2) !== Math.floor((G.t - dt) * 2)) this.slow();
  },
  slow() {
    // Raten (Zellen/Min) für Auftragsgrößen
    if (G.t - this.rates.t >= 20) { const r = (G.stats.cells - this.rates.c0) / ((G.t - this.rates.t) / 60); this.rates.cells = this.rates.cells * 0.6 + r * 0.4; this.rates.c0 = G.stats.cells; this.rates.t = G.t; }
    this.checkOrders();
    this.tutorial();
    if (G.licence >= 6 && !G.ended) this.checkEnding();
  },
  events(dt) {
    const E = CONFIG.events, ev = G.ev;
    if (G.t >= ev.meteor) { ev.meteor = G.t + U.lerp(E.meteor.every[0], E.meteor.every[1], Math.random()); if (!Player.veh || true) this.meteorShower(); }
    if (G.t >= ev.wind && G.licence >= 1 && Robots.list.length) { ev.wind = G.t + U.lerp(E.solarWind.every[0], E.solarWind.every[1], Math.random()); ev.windUntil = G.t + E.solarWind.duration; UI.radio(TXT.radio.solarWindSoon); Audio.sfx('radio'); ev.windMsg = true; }
    else if (G.t >= ev.wind && !Robots.list.length) ev.wind = G.t + 300;
    if (ev.windMsg && G.t > ev.windUntil) { ev.windMsg = false; UI.radio(TXT.radio.solarWindEnd); }
    if (!ev.insp && G.t >= ev.inspect) this.startInspection();
    if (ev.insp) {
      const I = ev.insp;
      if (World.secProgress[I.s] >= E.inspection.threshold) { Economy.grant(I.reward, 'inspection'); UI.radio(TXT.radio.inspectionOk.replace('{s}', U.sectorLabel(I.s)).replace('{r}', U.money(I.reward))); Audio.sfx('cash'); ev.insp = null; ev.inspect = G.t + U.lerp(E.inspection.every[0], E.inspection.every[1], Math.random()); }
      else if (G.t > I.until) { UI.radio(TXT.radio.inspectionFail.replace('{s}', U.sectorLabel(I.s))); ev.insp = null; ev.inspect = G.t + U.lerp(E.inspection.every[0], E.inspection.every[1], Math.random()); }
    }
    Fx.updateMeteors(dt);
  },
  meteorShower() {
    const E = CONFIG.events.meteor, n = Math.round(U.lerp(E.piles[0], E.piles[1], Math.random()));
    UI.radio(TXT.radio.meteor); Audio.sfx('radio');
    for (let i = 0; i < n; i++) {
      let x = 0, y = 0, ok = false;
      for (let k = 0; k < 12 && !ok; k++) {
        const a = Math.random() * Math.PI * 2, d = (Player.veh ? 10 : 6) + Math.random() * (Player.veh ? 22 : 14);
        x = U.wrapX(Player.x + Math.cos(a) * d); y = U.clamp(Player.y + Math.sin(a) * d, 10, WSIZE - 10);
        ok = !World.locked(World.regionAt(Math.floor(x), Math.floor(y))) && World.isCleanableT(World.terrAt(Math.floor(x), Math.floor(y))) && !Buildings.at(Math.floor(x), Math.floor(y));
      }
      if (ok) Fx.meteor(x, y, U.lerp(E.radius[0], E.radius[1], Math.random()) * (1 + G.licence * 0.15), 1 + i * 0.6 + Math.random());
    }
  },
  startInspection() {
    const E = CONFIG.events.inspection;
    const ps = U.sectorAt(Player.x, Player.y);
    const cands = [ps];
    const sx = ps % NSEC, sy = (ps / NSEC) | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) { const ny = sy + oy; if (ny >= 0 && ny < NSEC) cands.push(ny * NSEC + ((sx + ox) % NSEC + NSEC) % NSEC); }
    const ok = cands.filter(s => !World.secDone[s] && World.secProgress[s] > 0.35 && World.secProgress[s] < E.threshold && !World.locked(World.secRegion[s]));
    if (!ok.length) { G.ev.inspect = G.t + 240; return; }
    const s = ok[0], m = E.window * Economy.fx('inspectTime');
    G.ev.insp = { s, until: G.t + m, reward: Math.round(Math.max(this.sectorBonus(s) * 1.5, Economy.incomePerMin() * E.reward)) };
    UI.radio(TXT.radio.inspection.replace('{s}', U.sectorLabel(s)).replace('{m}', Math.round(m / 60))); Audio.sfx('radio');
  },
  /* --- Aufträge (ALOP-Memos) --- */
  statOf(kind, o) {
    const S = G.stats;
    switch (kind) {
      case 'cells': return S.cells; case 'deliver': return S.kgByType[o.type]; case 'capsules': return S.capsules; case 'upgrade': return S.ups;
      case 'earn': return S.moneyEarned; case 'sectors': return S.sectors; case 'robotCells': return S.robotCells; case 'sand': return S.sandMade;
      case 'antenna': case 'hopper': return S.builtBy[kind] || 0; case 'belts': return S.builtBy.belt || 0; case 'robots': return S.builtBy.robot || 0;
      case 'find': { let n = 0; for (const f of World.finds) if (G.finds[f.id] && f.region === o.region) n++; return n; }
    }
    return 0;
  },
  orderProgress(o) {
    if (o.kind === 'sectorPct') return U.clamp(World.secProgress[o.s] / (o.p / 100), 0, 1);
    return U.clamp((this.statOf(o.kind, o) - o.base) / o.goal, 0, 1);
  },
  makeOrder(exclude) {
    const L = G.licence, inc = Math.max(20, Economy.incomePerMin()), cand = [];
    const add = (w, k, f) => { if (!exclude.includes(k)) cand.push([w, k, f]); };
    const cellRate = Math.max(60, this.rates.cells);
    add(3, 'cells', () => ({ goal: Math.max(150, Math.round(cellRate * 3.5 / 50) * 50) }));
    const types = Economy.rawTypesUnlocked();
    add(3, 'deliver', () => { const t = types[Math.floor(Math.random() * types.length)]; return { type: t, goal: Math.max(10, Math.round(inc * 3 / Economy.value(t) / 5) * 5) }; });
    add(1.5, 'capsules', () => ({ goal: G.t < 900 ? 2 : 3 + Math.floor(Math.random() * 3) }));
    add(1.5, 'upgrade', () => ({ goal: 1 + (L > 1 ? 1 : 0) }));
    add(2, 'earn', () => ({ goal: Math.round(inc * 4 / 10) * 10 }));
    const ps = U.sectorAt(Player.x, Player.y);
    if (!World.secDone[ps] && World.secProgress[ps] < 0.75) add(2, 'sectorPct', () => { const p = World.secProgress[ps] < 0.4 ? 50 : 80; return { s: ps, p }; });
    const regs = []; for (const f of World.finds) if (!G.finds[f.id] && CONFIG.regions[f.region].licence <= L && !regs.includes(f.region)) regs.push(f.region);
    if (regs.length && G.t > 300) add(1, 'find', () => { const r = regs[Math.floor(Math.random() * regs.length)]; return { region: r, goal: 1 }; });
    if (L >= 1) { add(1.5, 'antenna', () => ({ goal: 1 + Math.floor(Math.random() * 2) })); add(1.2, 'hopper', () => ({ goal: 1 })); add(1.5, 'belts', () => ({ goal: 20 + Math.floor(Math.random() * 4) * 10 })); add(1.5, 'robots', () => ({ goal: 1 + Math.floor(L / 2) })); }
    if (L >= 1 && Robots.list.length) add(2.5, 'robotCells', () => ({ goal: Math.max(500, Math.round(Robots.list.length * 600 / 100) * 100) }));
    if (L >= 2) add(1.5, 'sand', () => ({ goal: Math.max(50, Math.round(inc * 2 / 3.5 / 10) * 10) }));
    if (G.stats.sectors >= 1) add(1, 'sectors', () => ({ goal: 1 + Math.floor(L / 3) }));
    let tw = 0; for (const c of cand) tw += c[0];
    let r = Math.random() * tw, pick = cand[0];
    for (const c of cand) { r -= c[0]; if (r <= 0) { pick = c; break; } }
    const o = Object.assign({ id: G.orderSeq++, kind: pick[1] }, pick[2]());
    o.base = this.statOf(o.kind, o);
    o.reward = Math.round(Math.max(CONFIG.orders.minReward, inc * CONFIG.orders.rewardMinutes) * Economy.fx('orderReward'));
    o.fp = Math.random() < 0.35 ? 2 : 1;
    o.signer = TXT.signers[Math.floor(Math.random() * TXT.signers.length)];
    return o;
  },
  orderText(o) {
    const K = ORDER_KINDS[o.kind];
    const rep = s => s.replace('{n}', U.int(o.goal)).replace('{kg}', U.kg(o.goal)).replace('{dust}', o.type !== undefined ? CONFIG.goods[o.type].name : '')
      .replace('{m}', U.money(o.goal)).replace(/\{S\}/g, o.s !== undefined ? U.sectorLabel(o.s) : '').replace('{p}', o.p).replace('{R}', o.region !== undefined ? CONFIG.regions[o.region].name : '');
    return { title: rep(K.title), text: rep(K.text) };
  },
  fillOrders() {
    while (G.orders.length < CONFIG.orders.active) G.orders.push(this.makeOrder(G.orders.map(o => o.kind)));
  },
  checkOrders() {
    if (G.tut < TXT.tutorial.length - 1 && !G.tutSkip) return;
    for (let i = 0; i < G.orders.length; i++) {
      const o = G.orders[i];
      if (this.orderProgress(o) >= 1) {
        Economy.grant(o.reward, 'order'); G.fp += o.fp; G.stats.ordersDone++;
        const ot = '📋 Auftrag erledigt: ' + this.orderText(o).title + ' · +' + U.money(o.reward) + ' · +' + o.fp + ' FP'; UI.toast(ot, 'good'); Net.fx('toast', [ot, 'good']);
        Audio.sfx('stamp');
        G.orders.splice(i, 1, this.makeOrder(G.orders.map(x => x.kind)));
        Bus.emit('orderDone', o);
      }
    }
    if (G.orders.length < CONFIG.orders.active) this.fillOrders();
  },
  swapsLeft() { const h = Math.floor(G.t / 3600); if (h !== G.swapHour) { G.swapHour = h; G.swapsUsed = 0; } return CONFIG.orders.swapPerHour + Economy.fx('swaps') - G.swapsUsed; },
  swapOrder(id) {
    if (this.swapsLeft() <= 0) return false;
    const i = G.orders.findIndex(o => o.id === id); if (i < 0) return false;
    G.swapsUsed++;
    G.orders.splice(i, 1, this.makeOrder(G.orders.map(x => x.kind)));
    return true;
  },
  /* --- Tutorial --- */
  tutorial() {
    if (G.tutSkip || G.tut >= TXT.tutorial.length) return;
    const id = TXT.tutorial[G.tut].id, P = Player;
    let done = false;
    if (id === 'move') done = U.dist(P.x, P.y, CONFIG.world.start.x + 0.5, CONFIG.world.start.y + 5.6) > 3;
    else if (id === 'clean') done = G.stats.cells >= 3;
    else if (id === 'fill') done = P.loadKg() >= Math.min(4, Economy.containerCap() * 0.95) || G.stats.capsules > 0;
    else if (id === 'unload') done = this.tutFlags.unload || G.stats.capsules > 0;
    else if (id === 'launch') done = G.stats.capsules > 0;
    else if (id === 'buy') done = G.stats.ups > 0;
    if (done) {
      if (id === 'launch') { Economy.grant(CONFIG.economy.tutorialBonus, 'tutorial'); UI.toast('Einarbeitungsprämie: +' + U.money(CONFIG.economy.tutorialBonus) + ' – damit reicht es für ein erstes Upgrade!', 'good'); }
      G.tut++; Audio.sfx('memo'); UI.tutorial();
    }
  },
  tutFlags: { unload: false },
  /* --- Ende: Großer Teppichkrater --- */
  carpetProgress() { let p = 0; for (const s of this.carpetSecs) p += Math.min(1, World.secProgress[s] / CONFIG.world.sectorDoneFrac); return this.carpetSecs.length ? p / this.carpetSecs.length : 0; },
  checkEnding() {
    if (G.ended || !this.carpetSecs.length) return;
    if (this.carpetSecs.every(s => World.secDone[s])) { G.ended = true; G.stats.endTime = G.t; UI.ending(); Net.fx('ending'); Save.soon(); }
  },
};

/* Effekte: Staubwolken, Funkeln, Meteore, Sektor-Welle */
const Fx = {
  meteors: [], cleanAcc: 0,
  dust(x, y, r, dir, type) {
    if (!Renderer.inView(x, y, 2)) return;
    const a = VFX.r() * Math.PI * 2, d = VFX.r() * r;
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    const i = Particles.spawn(0, px, py, 0.05, (VFX.r() - 0.5) * 2.2, (VFX.r() - 0.5) * 2.2, 0.6 + VFX.r() * 1.4, 0.9 + VFX.r() * 0.8, 0.12 + VFX.r() * 0.1, type);
    if (i >= 0) { Particles.tx[i] = x; Particles.ty[i] = y; }
  },
  sparkle(x, y) { if (Renderer.inView(x, y, 1)) Particles.spawn(1, x + VFX.r(), y + VFX.r(), 0.1, 0, 0, 0, 0.5 + VFX.r() * 0.4, 0.22, 0); },
  burst(x, y, kind, n) { for (let i = 0; i < n; i++) { const a = VFX.r() * Math.PI * 2, s = 1 + VFX.r() * 4; Particles.spawn(kind === 3 ? 1 : 4, x, y, 0.3, Math.cos(a) * s, Math.sin(a) * s, 2 + VFX.r() * 3, 0.6 + VFX.r() * 0.6, 0.18, 0); } },
  sectorWave(s) { Rewards.sector(s); },
  meteor(x, y, r, delay) { this.meteors.push({ x, y, r, t: -delay, sx: x - 30, sy: y - 30 }); },
  updateMeteors(dt) {
    for (let i = this.meteors.length - 1; i >= 0; i--) {
      const m = this.meteors[i]; m.t += dt;
      if (m.t < 0) continue;
      const p = m.t / 1.4;
      if (p >= 1) {
        World.addMeteor(m.x, m.y, m.r, 200);
        this.burst(m.x, m.y, 4, 26); EventsFx.impact(m.x, m.y, m.r); Audio.sfx('impact', U.dist(m.x, m.y, Player.x, Player.y));
        if (U.dist(m.x, m.y, Player.x, Player.y) < 40) Camera.kick(3, 160);
        this.meteors.splice(i, 1); continue;
      }
      const x = U.lerp(m.sx, m.x, p), y = U.lerp(m.sy, m.y, p);
      if (Renderer.inView(x, y, 4) && VFX.r() < 0.6) Particles.spawn(5, x, y, (1 - p) * 30, 0, 0, -1, 0.5, 0.35, 0);
    }
  },
};

/* ============================================================================
   6c. BUILD – Baumodus: Geist-Vorschau, Bänder ziehen, Drehen, Verschieben, Abreißen
   ============================================================================ */
const Build = {
  active: false, sel: null, rot: 0, mode: 'place', moving: null, ghost: null, path: [], drag: null, beltTier: 1, pending: false, lastMs: { x: 0, y: 0 }, delCells: [],
  toggle(on) {
    const want = on === undefined ? !this.active : on;
    if (want === this.active) return;
    if (want && Player.veh && Player.veh.def.kind !== 'cart') { UI.toast('Zum Bauen bitte aussteigen.'); return; }
    if (want && G.licence < 1) { UI.toast('Bauen erfordert Lizenz 1 (Reinigungsfachkraft). Das Hauptdepot reicht vorerst.', 'warn'); return; }
    this.active = want; this.sel = null; this.moving = null; this.mode = 'place'; this.path = []; this.drag = null; this.ghost = null; this.pending = false;
    if (!want) Camera.panX = Camera.panY = 0;
    UI.buildDock(want);
    Audio.sfx('click');
  },
  select(type) {
    if (!type) { this.sel = null; this.pending = false; UI.buildDock(true); return; }
    const def = Buildings.def(type);
    if (def.licence > G.licence) { UI.toast(def.name + ': Lizenz ' + def.licence + ' nötig.', 'warn'); return; }
    this.sel = type; this.mode = 'place'; this.moving = null; this.pending = false; this.ghost = null;
    if (def.belt) this.beltTier = def.belt;
    if (Input.touchMode) { const c = Camera.toWorld(Renderer.W / 2, Renderer.H / 2 - 40); this.setGhost(c.x, c.y); this.pending = !def.belt; }
    UI.buildDock(true);
  },
  cancel() {
    if (this.drag) { this.drag = null; this.path = []; return; }
    if (this.sel || this.moving) { this.sel = null; this.moving = null; this.mode = 'place'; this.ghost = null; this.pending = false; UI.buildDock(true); return; }
    if (this.mode !== 'place') { this.mode = 'place'; UI.buildDock(true); return; }
    this.toggle(false);
  },
  setMode(m) { this.mode = this.mode === m ? 'place' : m; this.sel = null; this.moving = null; this.ghost = null; this.pending = false; UI.buildDock(true); },
  rotateKey() {
    if (!this.active) return;
    if (this.sel) { this.rot = (this.rot + 1) & 3; if (this.ghost) this.setGhost(this.ghost.wx, this.ghost.wy); Audio.sfx('click'); return; }
    const w = this.pointerWorld(); const b = w && Buildings.at(Math.floor(w.x), Math.floor(w.y));
    if (b) { if (UI.act('rotate', b.id).ok) Audio.sfx('build'); }
    else if (w && Buildings.beltAt(Math.floor(w.x), Math.floor(w.y))) UI.act('beltRotate', U.wrapI(Math.floor(w.x)), Math.floor(w.y));
  },
  moveKey() { if (this.active) this.setMode('move'); },
  demolishKey() { if (this.active) this.setMode('demolish'); },
  pointerWorld() {
    if (this.ghost) return { x: this.ghost.wx, y: this.ghost.wy };
    if (Input.mouse.active) return Camera.toWorld(Input.mouse.x, Input.mouse.y);
    return null;
  },
  footprint(type, rot) { const def = Buildings.def(type); return Buildings.dims(def, rot); },
  setGhost(wx, wy) {
    if (!this.sel) { this.ghost = { wx, wy }; return; }
    const def = Buildings.def(this.sel), [w, h] = this.footprint(this.sel, this.rot);
    const x = U.wrapI(Math.floor(wx) - ((w - 1) >> 1)), y = Math.floor(wy) - ((h - 1) >> 1);
    let v;
    if (this.moving) { v = { ok: true }; Buildings.unregister(this.moving); v = Buildings.validate(this.sel, x, y, this.rot); Buildings.register(this.moving); }
    else if (def.belt) v = { ok: true };
    else v = Buildings.validate(this.sel, x, y, this.rot);
    if (v.ok && !this.moving && !def.belt && G.money < Buildings.price(this.sel)) v = { ok: false, why: 'Es fehlen ' + U.money(Buildings.price(this.sel) - G.money) };

  pointerCancel(id) { if (this.drag && this.drag.id === id) { this.drag = null; this.path = []; } },

  update() {

      const rr0 = CONFIG.antennaRadius * Economy.fx('radio');
      for (const a of Buildings.list) { if (a.type !== 'antenna' && a.type !== 'depot' && a.type !== 'outpost') continue; const c = Buildings.center(a); if (!R.inView(c.x, c.y, rr0 + 2)) continue; R.at(c.x, c.y); const gr = ctx.createRadialGradient(0, 0, rr0 * 0.2, 0, 0, rr0); gr.addColorStop(0, 'rgba(99,203,198,0.05)'); gr.addColorStop(1, 'rgba(99,203,198,0.02)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, rr0, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(99,203,198,0.55)'; ctx.lineWidth = 2 / R.s; ctx.setLineDash([8 / R.s, 6 / R.s]); ctx.stroke(); ctx.setLineDash([]); }
