<style>
/* ==========================================================================
   STAUBMOND – Stylesheet (HUD, Menüs, Touch-Steuerung)
   ========================================================================== */
:root {
  /* Farb-Tokens aus THEME (werden beim Start zusätzlich per JS aus THEME gesetzt) */
  --orange: #FF7A2F; --orange-d: #D9560F; --orange-l: #FFB27A;
  --petrol: #1F8F8C; --petrol-d: #105957; --petrol-l: #63CBC6;
  --white: #F4F6FA; --ink: #0B0E14; --muted: #AEB8C7; --muted-2: #8793A5;
  --panel: rgba(18,23,34,.88); --panel-2: rgba(27,34,48,.94); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);
  --good: #5BE39A; --bad: #FF5470; --warn: #FFB020; --money: #FFC24A; --paper: #F3ECDD; --paper-ink: #2B2A26; --stamp: #C4362C;
  --void: #0B0E14; --surface-solid: #121722;
  --t-instant: 80ms; --t-fast: 140ms; --t-base: 240ms; --t-spring: 260ms; --t-slow: 420ms;
  --ease: cubic-bezier(.2,.8,.2,1); --ease-slow: cubic-bezier(.16,1,.3,1); --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --gap: 10px; --radius: 14px; --btn-alpha: .9; --joy-r: 56px; --clean-size: 96px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--white);
  position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
#game, #ground { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ground { pointer-events: none; visibility: hidden; }
#ui { position: absolute; inset: 0; pointer-events: none; font-size: 14px; }
#ui > * { pointer-events: none; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.pe { pointer-events: auto !important; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; }
.hud-box { position: absolute; background: rgba(18,23,34,.72); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#hud-money { top: calc(10px + var(--sat)); left: calc(10px + var(--sal)); padding: 8px 14px 8px 12px; min-width: 150px; }
#hud-money .m { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
#hud-money .m .cur { color: var(--orange); margin-left: 4px; }
#hud-money .r { font-size: 12px; color: var(--muted); white-space: nowrap; }
#hud-money .d { font-size: 11px; color: var(--warn); margin-top: 2px; white-space: nowrap; }
#hud-money.pop .m { animation: moneypop .35s ease-out; }
#hud-money.gold { box-shadow: 0 0 0 1px rgba(255,194,74,.55), 0 0 26px rgba(255,194,74,.35); }
#hud-money.gold .m { color: var(--money); }
#hud-money { transition: box-shadow var(--t-slow) var(--ease-slow); }
@keyframes moneypop { 0% { transform: scale(1); } 40% { transform: scale(1.08); color: var(--orange-l); } 100% { transform: scale(1); } }
.money-pop { position: absolute; font-weight: 800; color: var(--orange-l); font-size: 15px; pointer-events: none;
  animation: floatup 1.2s ease-out forwards; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; }
@keyframes floatup { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }
#hud-sector { top: calc(10px + var(--sat)); left: 50%; transform: translateX(-50%); padding: 6px 14px 6px 8px; display: flex; align-items: center; gap: 10px;
  transition: opacity .5s, transform .5s; white-space: nowrap; }
#hud-sector.dim { opacity: .55; }
#hud-sector.flash { animation: secflash .8s ease-out; }
@keyframes secflash { 0% { transform: translateX(-50%) scale(1.12); background: rgba(31,143,140,.85); } 100% { transform: translateX(-50%) scale(1); } }
#hud-sector svg { width: 34px; height: 34px; flex: none; }
#hud-sector .t { font-weight: 700; font-size: 14px; }
#hud-sector .s { font-size: 11px; color: var(--muted); }
#hud-mapwrap { top: calc(10px + var(--sat)); right: calc(10px + var(--sar)); width: 176px; height: 176px; border-radius: 50%; overflow: hidden; padding: 0; cursor: pointer; }
#hud-minimap { width: 100%; height: 100%; display: block; border-radius: 50%; }
#hud-icons { position: absolute; top: calc(194px + var(--sat)); right: calc(10px + var(--sar)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 240px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(18,23,34,.74); display: grid; place-items: center;
  cursor: pointer; pointer-events: auto; position: relative; padding: 0; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: manipulation; }
.icon-btn:hover { background: rgba(31,143,140,.6); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .k { position: absolute; bottom: -2px; right: 1px; font-size: 9px; color: var(--muted); font-weight: 700; }
.icon-btn .badge { position: absolute; top: -4px; right: -4px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 800; border-radius: 9px; min-width: 17px; height: 17px; padding: 0 4px; display: grid; place-items: center; }
#hud-glanz { left: calc(10px + var(--sal)); bottom: calc(10px + var(--sab)); padding: 5px 10px; font-size: 11px; color: var(--muted); }
#hud-glanz b { color: var(--white); font-weight: 700; }
#hud-load { left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--sab)); padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 300px; }
#hud-load .tool { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
#hud-load .tool svg { width: 26px; height: 26px; }
#hud-load .bar { flex: 1; height: 14px; border-radius: 7px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; min-width: 120px; }
#hud-load .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--petrol), var(--petrol-l)); border-radius: 7px; transition: width .15s; }
#hud-load .bar.warn i { background: linear-gradient(90deg, var(--orange-d), var(--warn)); }
#hud-load .bar.full i { background: linear-gradient(90deg, #b8322d, var(--bad)); animation: pulse .8s infinite alternate; }
@keyframes pulse { from { opacity: .7; } to { opacity: 1; } }
#hud-load .kg { font-size: 12px; font-weight: 700; min-width: 86px; text-align: right; white-space: nowrap; }
#hud-goal { left: calc(10px + var(--sal)); top: calc(96px + var(--sat)); padding: 8px 10px; width: 250px; font-size: 12px; pointer-events: auto; cursor: pointer; }
#hud-goal .h { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
#hud-goal .g { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
#hud-goal .g .p { flex: none; width: 34px; height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
#hud-goal .g .p i { display: block; height: 100%; background: var(--orange); }
#hud-goal .g .x { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hud-goal.collapsed .g:not(:first-of-type) { display: none; }
#hud-hint { left: calc(10px + var(--sal)); bottom: calc(40px + var(--sab)); padding: 6px 10px; font-size: 12px; color: var(--muted); max-width: 46vw; }
#hud-hint kbd, .kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.12); color: var(--white); font: 700 11px/16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center; margin-right: 3px; }
#hud-arrow { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
#hud-arrow .lbl { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; background: rgba(18,23,34,.8); padding: 2px 6px; border-radius: 6px; }
#hud-build { left: 50%; transform: translateX(-50%); bottom: calc(66px + var(--sab)); padding: 6px 12px; font-size: 13px; text-align: center; }
#hud-build .reason { color: var(--bad); font-weight: 700; }
#hud-wait { left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 16px 22px; text-align: center; min-width: 260px; }
#hud-wait .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 10px; }
#hud-wait .bar i { display: block; height: 100%; width: 0; background: var(--orange); }

/* Toasts / Funksprüche */
#toasts { position: absolute; top: calc(64px + var(--sat)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(560px, 92vw); }
.toast { background: rgba(8, 26, 22, .9); border: 1px solid rgba(91,227,154,.35); color: #c9f5dc; padding: 8px 14px; border-radius: 12px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.3); animation: toastin .3s ease-out; max-width: 100%; text-align: center; }
.toast.radio::before { content: "📡 "; }
.toast.warn { background: rgba(40, 26, 6, .92); border-color: rgba(255,194,74,.4); color: #ffe3a3; }
.toast.good { background: rgba(10, 40, 26, .92); }
.toast.out { animation: toastout .4s ease-in forwards; }
@keyframes toastin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes toastout { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- Touch-Steuerung ---------- */
#touch { position: absolute; inset: 0; }
#joy { position: absolute; width: calc(var(--joy-r) * 2); height: calc(var(--joy-r) * 2); margin: calc(var(--joy-r) * -1) 0 0 calc(var(--joy-r) * -1);
  border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.22); opacity: var(--btn-alpha); }
#joy i { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
#joy.idle { opacity: calc(var(--btn-alpha) * .45); }
.tbtn { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(18,23,34,.55);
  display: grid; place-items: center; opacity: var(--btn-alpha); touch-action: none; padding: 0; color: #fff; }
.tbtn:active, .tbtn.on { background: rgba(255,122,31,.75); border-color: rgba(255,255,255,.6); }
#btn-clean { width: var(--clean-size); height: var(--clean-size); right: calc(22px + var(--sar)); bottom: calc(26px + var(--sab)); }
#btn-clean svg { width: 46%; height: 46%; }
#btn-clean span { position: absolute; bottom: 12%; font-size: 10px; font-weight: 800; letter-spacing: .05em; }
#ctx { position: absolute; right: calc(16px + var(--sar)); bottom: calc(var(--clean-size) + 40px + var(--sab)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.ctx-btn { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; border-radius: 30px; background: var(--orange); color: #fff; font-weight: 800; font-size: 15px;
  border: 2px solid rgba(255,255,255,.4); box-shadow: 0 6px 16px rgba(0,0,0,.35); touch-action: manipulation; min-height: 52px; opacity: var(--btn-alpha); cursor: pointer; }
.ctx-btn.sec { background: rgba(31,143,140,.92); font-size: 13px; min-height: 44px; padding: 7px 14px 7px 10px; }
.ctx-btn svg { width: 24px; height: 24px; }
.ctx-btn .key { font-size: 10px; opacity: .8; background: rgba(0,0,0,.25); padding: 1px 5px; border-radius: 4px; }
body.touchmode .ctx-btn .key { display: none; }
#ctx.desk { right: 50%; transform: translateX(50%); bottom: calc(70px + var(--sab)); align-items: center; flex-direction: row; }
#build-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--sab)); display: flex; gap: 8px; pointer-events: auto; }
#build-bar .btn { min-width: 64px; min-height: 52px; }
body.lefty #btn-clean { right: auto; left: calc(22px + var(--sal)); }
body.lefty #ctx { right: auto; left: calc(16px + var(--sal)); align-items: flex-start; }
body.lefty #ctx.desk { left: 50%; }
body.prof-tablet { --joy-r: 70px; --clean-size: 124px; }
body.prof-tablet #btn-clean { right: calc(60px + var(--sar)); bottom: calc(70px + var(--sab)); }
body.prof-tablet #ctx { right: calc(50px + var(--sar)); bottom: calc(var(--clean-size) + 90px + var(--sab)); }
body.prof-tablet.lefty #btn-clean { left: calc(60px + var(--sal)); }
body.prof-tablet.lefty #ctx { left: calc(50px + var(--sal)); }
body.prof-tablet #hud-mapwrap { width: 230px; height: 230px; }
body.prof-tablet #hud-icons { top: calc(248px + var(--sat)); }

/* Handy: kompakteres HUD (hoch: Spalte rechts, quer: Leiste oben) */
body.prof-phone #hud-money { padding: 6px 10px; min-width: 0; max-width: min(190px, 48vw); }
body.prof-phone #hud-money .m { font-size: 19px; }
body.prof-phone #hud-money .r, body.prof-phone #hud-money .d { font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
body.prof-phone #hud-glanz { display: none; }
body.prof-phone #hud-mapwrap { width: 104px; height: 104px; }
body.prof-phone #hud-sector { top: calc(122px + var(--sat)); left: auto; right: calc(10px + var(--sar)); transform: none; padding: 3px 9px 3px 4px; gap: 6px; max-width: 190px; }
body.prof-phone #hud-sector.flash { animation: none; background: rgba(31,143,140,.85); }
body.prof-phone #hud-sector svg { width: 26px; height: 26px; }
body.prof-phone #hud-sector .t { font-size: 11.5px; }
body.prof-phone #hud-sector .s { font-size: 10px; }
body.prof-phone #hud-icons { top: calc(166px + var(--sat)); max-width: 104px; gap: 5px; }
body.prof-phone .icon-btn { width: 44px; height: 44px; }
body.prof-phone .icon-btn .k { display: none; }
body.prof-phone #hud-goal { top: calc(84px + var(--sat)); width: min(200px, 48vw); font-size: 11px; padding: 5px 8px; pointer-events: none; }
body.prof-phone #hud-goal .g:nth-of-type(n+3) { display: none; }
body.prof-phone.tut #hud-goal { display: none; }
body.prof-phone #tutorial { top: calc(84px + var(--sat)); left: calc(10px + var(--sal)); transform: none; width: calc(100vw - 134px - var(--sal) - var(--sar)); }
body.prof-phone #tutorial .memo { font-size: 12px; padding: 10px 12px 8px; }
body.prof-phone #tutorial .memo .mt { font-size: 13px; }
body.prof-phone #toasts { top: calc(150px + var(--sat)); left: calc(10px + var(--sal)); transform: none; width: calc(100vw - 134px - var(--sal) - var(--sar)); align-items: flex-start; }
body.prof-phone.tut #toasts { top: calc(290px + var(--sat)); }
body.prof-phone .toast { font-size: 12px; padding: 7px 10px; text-align: left; }
body.prof-phone #hud-load { bottom: calc(10px + var(--sab)); min-width: 0; width: min(46vw, 260px); left: calc(50% - 20px); padding: 5px 8px; gap: 6px; }
body.prof-phone #hud-load .tool span { display: none; }
body.prof-phone #hud-load .kg { min-width: 0; font-size: 11px; }
body.prof-phone #hud-load .bar { min-width: 50px; }
body.prof-phone #hud-hint { display: none; }
body.prof-phone.lefty #hud-load { left: calc(50% + 20px); }
@media (orientation: landscape) and (max-height: 520px) {
  body.prof-phone #hud-sector { top: calc(8px + var(--sat)); right: auto; left: calc(min(190px, 48vw) + 20px + var(--sal)); }
  body.prof-phone #hud-icons { top: calc(8px + var(--sat)); right: calc(122px + var(--sar)); max-width: none; flex-wrap: nowrap; }
  body.prof-phone #hud-goal { top: calc(84px + var(--sat)); }
  body.prof-phone #tutorial { top: calc(84px + var(--sat)); width: min(330px, 39vw); }
  body.prof-phone #tutorial .memo { font-size: 11.5px; }
  body.prof-phone #toasts, body.prof-phone.tut #toasts { top: calc(62px + var(--sat)); left: auto; right: calc(122px + var(--sar)); width: min(340px, 39vw); align-items: flex-end; }
  body.prof-phone #ctx { bottom: calc(var(--clean-size) + 30px + var(--sab)); }
}
body.touchmode #hud-hint { display: none; }
body.building #hud-hint, body.building #hud-load, body.building #hud-glanz { display: none; }

/* ---------- Panels, Menüs ---------- */
#panel-root { position: absolute; inset: 0; }
.backdrop { position: absolute; inset: 0; background: rgba(3,7,9,.55); pointer-events: auto; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, calc(100vw - 24px)); max-height: calc(100vh - 24px - var(--sat) - var(--sab));
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); pointer-events: auto; display: flex; flex-direction: column;
  animation: panelin .22s cubic-bezier(.2,.9,.3,1.2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
@keyframes panelin { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } }
.panel.small { width: min(460px, calc(100vw - 24px)); }
body.prof-phone .panel { width: 100vw; max-height: none; height: 100%; top: 0; left: 0; transform: none; border-radius: 0; animation: panelin-ph .2s ease-out;
  padding-top: var(--sat); padding-bottom: var(--sab); padding-left: var(--sal); padding-right: var(--sar); }
body.prof-phone .panel.small { height: auto; top: 50%; left: 50%; transform: translate(-50%,-50%); width: calc(100vw - 20px); border-radius: 18px; padding: 0; }
@keyframes panelin-ph { from { opacity: 0; } }
body.prof-tablet .panel.side { left: auto; right: 0; top: 0; transform: none; height: 100%; max-height: none; width: min(440px, 46vw); border-radius: 18px 0 0 18px;
  padding-top: var(--sat); padding-bottom: var(--sab); padding-right: var(--sar); animation: sidein .25s ease-out; }
@keyframes sidein { from { transform: translateX(40px); opacity: 0; } }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex: none; }
.panel-head h2 { margin: 0; font-size: 18px; flex: 1; letter-spacing: -.01em; }
.panel-head .sub { font-size: 12px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }
.panel-close { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; font-size: 20px; display: grid; place-items: center; touch-action: manipulation; }
.panel-close:hover { background: rgba(255,255,255,.12); }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 14px; border-radius: 10px 10px 0 0; background: transparent; border: 0; color: var(--muted); font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 13px; touch-action: manipulation; }
.tab.on { background: rgba(255,255,255,.08); color: var(--white); box-shadow: inset 0 -2px 0 var(--orange); }
.panel-body { padding: 14px 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; flex: 1; user-select: text; -webkit-user-select: text; }
.panel-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; flex: none; }
.btn { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); padding: 10px 16px; border-radius: 11px; cursor: pointer; font-weight: 700; font-size: 14px;
  touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; pointer-events: auto; }
.btn:hover { background: rgba(255,255,255,.13); }
.btn.primary { background: var(--orange); border-color: rgba(255,255,255,.3); color: #fff; }
.btn.primary:hover { background: #ff8a38; }
.btn.petrol { background: var(--petrol); border-color: rgba(255,255,255,.2); }
.btn.petrol:hover { background: #179398; }
.btn.danger { background: rgba(255,84,112,.18); border-color: rgba(255,84,112,.45); }
.btn:disabled, .btn.disabled { opacity: .42; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: 12px; border-radius: 9px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.card .row { display: flex; gap: 10px; align-items: center; }
.card .ic { width: 44px; height: 44px; flex: none; border-radius: 11px; background: rgba(255,255,255,.06); display: grid; place-items: center; }
.card .ic svg { width: 34px; height: 34px; }
.card h3 { margin: 0; font-size: 15px; }
.card .meta { font-size: 12px; color: var(--muted); }
.card .vals { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; }
.card .vals b { color: var(--white); font-weight: 600; }
.card .vals .up { color: var(--good); }
.card .price { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 4px; }
.card .price .miss { font-size: 11px; color: var(--warn); }
.card.locked { opacity: .55; }
.card.locked .lock { font-size: 12px; color: var(--warn); font-weight: 700; }
.card.owned { border-color: rgba(91,227,154,.35); }
.card.current { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange) inset; }
.lvl { display: flex; gap: 2px; margin: 2px 0; flex-wrap: wrap; }
.lvl i { width: 9px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.12); }
.lvl i.on { background: var(--orange); }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.sect-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; font-weight: 700; }
.sect-title:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-size: 14px; }
.kv span:nth-child(2n) { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.setting:last-child { border-bottom: 0; }
.setting .lbl small { display: block; color: var(--muted); font-size: 11px; }
.setting select, .setting input[type=range] { pointer-events: auto; }
select { background: var(--surface-solid); color: var(--white); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 13px; min-height: 38px; }
input[type=range] { width: 150px; accent-color: var(--orange); }
.switch { position: relative; width: 50px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.16); border: 0; cursor: pointer; flex: none; transition: background .2s; padding: 0; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch.on { background: var(--orange); }
.switch.on::after { transform: translateX(20px); }
.seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--petrol); color: #fff; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.1); }
.pill.good { background: rgba(91,227,154,.2); color: var(--good); }
.pill.warn { background: rgba(255,194,74,.18); color: var(--warn); }
.pill.bad { background: rgba(255,84,112,.18); color: var(--bad); }

/* Memo-Stil (ALOP) */
.memo { background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 14px 16px 12px; font-family: "Courier New", Courier, ui-monospace, monospace; font-size: 13px; line-height: 1.45;
  position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.12), 0 10px 24px rgba(0,0,0,.3); }
.memo .mh { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px dashed rgba(43,42,38,.35); padding-bottom: 5px; margin-bottom: 8px; gap: 8px; }
.memo .mt { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.memo .ms { font-size: 11px; opacity: .75; margin-top: 8px; }
.memo .stamp { position: absolute; right: 12px; bottom: 10px; transform: rotate(-12deg); border: 3px solid var(--stamp); color: var(--stamp); font-weight: 900; padding: 2px 8px; border-radius: 6px; font-size: 13px; opacity: .85; font-family: system-ui, sans-serif; letter-spacing: .06em; }
.memo .prog { height: 6px; border-radius: 3px; background: rgba(43,42,38,.15); overflow: hidden; margin: 8px 0 2px; }
.memo .prog i { display: block; height: 100%; background: var(--petrol); }
.memo .rew { font-weight: 700; color: #6a3c0c; }
.memos { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
#tutorial { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100px + var(--sat)); width: min(420px, calc(100vw - 24px)); pointer-events: none !important; }
#tutorial button { pointer-events: auto; }
body.prof-phone #tutorial { top: calc(170px + var(--sat)); }
@media (orientation: landscape) and (max-height: 520px) { body.prof-phone #tutorial { top: calc(54px + var(--sat)); width: min(380px, 50vw); } }
.memo .kbd { background: rgba(43,42,38,.12); color: var(--paper-ink); }
#tutorial .memo { animation: memoin .35s cubic-bezier(.2,.9,.3,1.3); }
@keyframes memoin { from { opacity: 0; transform: translateY(-10px) rotate(-1deg); } }
#tutorial .tb { display: flex; justify-content: space-between; margin-top: 8px; gap: 8px; align-items: center; }
#tutorial .tb button { font-family: system-ui, sans-serif; font-size: 12px; background: transparent; border: 1px solid rgba(43,42,38,.35); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--paper-ink); min-height: 34px; }

/* Forschungsbaum */
.tree { display: grid; grid-template-columns: repeat(3, minmax(200px, 1fr)); gap: 12px; }
.branch h3 { margin: 0 0 8px; font-size: 14px; text-align: center; }
.node { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; font-size: 12px; position: relative; margin-bottom: 18px; cursor: pointer; }
.node::after { content: ""; position: absolute; left: 50%; bottom: -19px; width: 2px; height: 18px; background: rgba(255,255,255,.14); }
.node:last-child::after { display: none; }
.node.done { border-color: rgba(91,227,154,.55); background: rgba(22, 52, 40, .7); }
.node.done::after { background: var(--good); }
.node.avail { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange) inset; }
.node.locked { opacity: .5; }
.node.final { border-width: 2px; }
.node b { display: block; font-size: 13px; margin-bottom: 2px; }
.node .c { position: absolute; top: 8px; right: 9px; font-weight: 800; font-size: 11px; color: var(--orange-l); }
body.prof-phone .tree { grid-template-columns: 1fr; }
body.prof-phone .tree .branch { display: none; }
body.prof-phone .tree .branch.on { display: block; }

/* Album */
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.find { aspect-ratio: 1; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; text-align: center; padding: 6px; cursor: pointer; position: relative; overflow: hidden; }
.find.has { border-color: rgba(255,194,74,.4); }
.find svg { width: 40px; height: 40px; }
.find .n { position: absolute; bottom: 4px; left: 0; right: 0; font-size: 9px; color: var(--muted); }

/* Vollkarte */
#map { position: absolute; inset: 0; background: var(--void); pointer-events: auto; }
#map canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#map .mtop { position: absolute; top: calc(10px + var(--sat)); left: calc(10px + var(--sal)); right: calc(10px + var(--sar)); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
#map .mtop > * { pointer-events: auto; }
#map .layers { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
#map .layers button { font-size: 12px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(18,23,34,.82); cursor: pointer; color: var(--muted); font-weight: 700; min-height: 36px; }
#map .layers button.on { color: #fff; background: var(--petrol); }
#map .minfo { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--sab)); width: min(520px, calc(100vw - 20px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; pointer-events: auto; }
#map .minfo h3 { margin: 0 0 4px; font-size: 16px; }
#map .minfo .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
#map .legend { position: absolute; left: calc(10px + var(--sal)); top: calc(62px + var(--sat)); font-size: 11px; color: var(--muted); background: rgba(18,23,34,.8); padding: 6px 9px; border-radius: 10px; }
body.prof-phone #map .legend { display: none; }

/* Hauptmenü */
#menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-start; pointer-events: none; padding: calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal)); }
#menu .mbox { pointer-events: auto; width: min(400px, 100%); margin-left: clamp(0px, 7vw, 120px); }
#menu h1 { font-size: clamp(44px, 9vw, 76px); margin: 0; letter-spacing: -.04em; line-height: .95; font-weight: 900; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
#menu h1 span { color: var(--orange); }
#menu .tag { color: var(--muted); margin: 8px 0 26px; font-size: 15px; }
#menu .mbtns { display: flex; flex-direction: column; gap: 10px; }
#menu .mbtns .btn { justify-content: flex-start; padding: 14px 18px; font-size: 16px; border-radius: 14px; background: rgba(18,23,34,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#menu .mbtns .btn.primary { background: var(--orange); }
#menu .foot { margin-top: 20px; font-size: 11px; color: var(--muted-2); }
@media (max-width: 600px) { #menu { align-items: flex-end; } #menu .mbox { margin: 0 auto; } }
.slot { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
.slot .info { flex: 1; font-size: 12px; color: var(--muted); }
.slot .info b { font-size: 15px; color: var(--white); display: block; margin-bottom: 2px; }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* Urkunden-Sequenz */
#fx { position: absolute; inset: 0; }
.ceremony { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(31,143,140,.35), rgba(3,7,9,.92) 70%); display: grid; place-items: center; pointer-events: auto; animation: fadein .4s; padding: 16px; }
.certificate { width: min(560px, 94vw); background: var(--paper); color: var(--paper-ink); border-radius: 8px; padding: 26px 28px 22px; text-align: center; position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,.6); border: 10px double #b9a272; animation: certin 1s cubic-bezier(.2,.9,.3,1.2); font-family: Georgia, "Times New Roman", serif; }
@keyframes certin { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
.certificate .seal { width: 86px; height: 86px; margin: 0 auto 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--orange-l), var(--orange) 50%, var(--orange-d)); display: grid; place-items: center;
  color: #fff; font-weight: 900; font-family: system-ui, sans-serif; font-size: 13px; letter-spacing: .05em; box-shadow: 0 4px 12px rgba(0,0,0,.3); animation: sealspin 1.4s ease-out; }
@keyframes sealspin { from { transform: rotate(-200deg) scale(0); } }
.certificate h2 { font-size: 13px; letter-spacing: .25em; text-transform: uppercase; margin: 6px 0; font-family: system-ui, sans-serif; }
.certificate .rank { font-size: clamp(22px, 5vw, 32px); font-weight: 700; margin: 10px 0; color: #5a3a10; }
.certificate p { font-size: 14px; line-height: 1.5; margin: 8px 0; }
.certificate .unl { font-family: system-ui, sans-serif; font-size: 12px; background: rgba(43,42,38,.08); border-radius: 8px; padding: 8px 10px; margin-top: 12px; text-align: left; }
.certificate .sig { display: flex; justify-content: space-between; margin-top: 18px; font-size: 11px; font-style: italic; gap: 10px; }
.certificate .sig span { border-top: 1px solid rgba(43,42,38,.5); padding-top: 3px; flex: 1; }
.certificate .stampbig { position: absolute; right: 18px; top: 18px; transform: rotate(14deg); border: 4px solid var(--stamp); color: var(--stamp); font-family: system-ui, sans-serif; font-weight: 900; padding: 4px 10px; border-radius: 8px; opacity: 0; animation: stampin .4s 1.2s forwards; }
@keyframes stampin { from { transform: rotate(14deg) scale(2.4); opacity: 0; } to { transform: rotate(14deg) scale(1); opacity: .85; } }
.ceremony .skip { position: absolute; bottom: calc(20px + var(--sab)); left: 50%; transform: translateX(-50%); }
.confetti { position: absolute; width: 8px; height: 14px; top: -20px; animation: confetti linear forwards; pointer-events: none; }
@keyframes confetti { to { transform: translateY(110vh) rotate(720deg); } }


/* --- Belohnungen: Stempel, Funken, fliegende Symbole, Urkunde --- */
.alop-stamp { position: absolute; left: 50%; top: 36%; transform: translate(-50%,-50%) rotate(-7deg); border: 6px solid var(--stamp); color: var(--stamp); background: rgba(243,236,221,.95); border-radius: 14px; padding: 10px 22px 12px; text-align: center; font-weight: 900; letter-spacing: .06em; box-shadow: 0 16px 50px rgba(0,0,0,.45); pointer-events: none; animation: stampSlam .42s cubic-bezier(.2,1.5,.4,1) both; }
.alop-stamp .big { font-size: clamp(24px, 6.4vw, 44px); line-height: 1.05; }
.alop-stamp .sub { font-size: 15px; letter-spacing: 0; color: var(--paper-ink); margin-top: 4px; font-weight: 800; }
.alop-stamp .rew { margin-top: 8px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.alop-stamp .rew span { background: rgba(43,42,38,.08); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--paper-ink); letter-spacing: 0; }
.alop-stamp .rew span.m { background: rgba(255,194,74,.3); }
@keyframes stampSlam { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-7deg) scale(2.4); } 60% { opacity: 1; transform: translate(-50%,-50%) rotate(-7deg) scale(.95, 1.05); } 100% { opacity: 1; transform: translate(-50%,-50%) rotate(-7deg) scale(1); } }
.alop-stamp.out { transition: opacity .4s, transform .4s; opacity: 0; transform: translate(-50%,-58%) rotate(-7deg) scale(.96); }
.dustpuff { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: radial-gradient(circle, rgba(169,149,121,.8), rgba(169,149,121,0) 70%); pointer-events: none; animation: puffOut .7s ease-out forwards; }
@keyframes puffOut { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(2.6); opacity: 0; } }
.buy-stamp { position: absolute; border: 3px solid var(--stamp); color: var(--stamp); font-weight: 900; letter-spacing: .08em; font-size: 15px; padding: 3px 10px; border-radius: 8px; background: rgba(243,236,221,.94); pointer-events: none; transform: translate(-50%,-50%) rotate(-9deg); animation: buyStamp .9s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes buyStamp { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-9deg) scale(2.2); } 22% { opacity: 1; transform: translate(-50%,-50%) rotate(-9deg) scale(.92, 1.08); } 34% { transform: translate(-50%,-50%) rotate(-9deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%) rotate(-9deg) scale(1); } }
.spark { position: absolute; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--money) 40%, rgba(255,194,74,0) 70%); pointer-events: none; animation: sparkOut .6s ease-out forwards; }
@keyframes sparkOut { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
.fly-icon { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 10px; background: rgba(18,23,34,.92); border: 1px solid var(--line-2); display: grid; place-items: center; pointer-events: none; transition: transform .7s cubic-bezier(.5,0,.2,1), opacity .25s .5s; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.fly-icon svg { width: 22px; height: 22px; }
.fly-text { position: absolute; transform: translate(0,0); font-weight: 900; font-size: 20px; color: var(--money); text-shadow: 0 2px 6px rgba(0,0,0,.6); pointer-events: none; transition: transform .72s cubic-bezier(.5,0,.2,1), opacity .72s; white-space: nowrap; margin: -12px 0 0 -30px; }
.icon-btn.got, #hud-load.got { animation: gotPulse .45s var(--ease-spring); }
@keyframes gotPulse { 40% { transform: scale(1.12); box-shadow: 0 0 0 3px rgba(255,194,74,.5); } }
.ceremony { background: rgba(11,14,20,.6) !important; cursor: pointer; }
.ceremony.out { transition: opacity .35s; opacity: 0; }
.certificate { animation: unroll .7s cubic-bezier(.2,.9,.3,1.15) !important; transform-origin: 50% 0; }
@keyframes unroll { 0% { transform: scaleY(.04) scaleX(.94); opacity: .3; } 60% { transform: scaleY(1.03); opacity: 1; } 100% { transform: none; } }
.certificate::before, .certificate::after { content: ''; position: absolute; left: -14px; right: -14px; height: 14px; border-radius: 7px; background: linear-gradient(#e9dfc6, #c9b98f 55%, #a8976c); box-shadow: 0 3px 6px rgba(0,0,0,.25); }
.certificate::before { top: -17px; } .certificate::after { bottom: -17px; }
.certificate .seal { animation: sealDrop .45s .85s cubic-bezier(.2,1.6,.4,1) both !important; }
@keyframes sealDrop { from { transform: scale(2.6) rotate(-30deg); opacity: 0; } }
.certificate .rank { font-size: clamp(26px, 6vw, 38px) !important; color: #5a3a10; }
.certificate .unl-t { font: 800 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: rgba(43,42,38,.72); margin-top: 12px; }
.cert-unlocks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.cert-unlocks .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(43,42,38,.07); border: 1px solid rgba(43,42,38,.16); border-radius: 999px; padding: 4px 10px 4px 6px; font: 700 12px system-ui, sans-serif; color: var(--paper-ink); opacity: 0; animation: chipIn .3s var(--ease-spring) forwards; }
.cert-unlocks .chip svg { width: 18px; height: 18px; }
@keyframes chipIn { from { opacity: 0; transform: translateY(6px) scale(.8); } to { opacity: 1; transform: none; } }
.goldfall { position: absolute; top: -10px; border-radius: 50%; background: radial-gradient(circle, #fff7d6, var(--money) 55%, rgba(255,194,74,0) 72%); animation: goldfall linear forwards; pointer-events: none; opacity: 0; }
@keyframes goldfall { 0% { opacity: 0; } 10% { opacity: 1; } to { transform: translate(var(--dx), 105vh); opacity: .25; } }
.ceremony .hint { position: absolute; bottom: calc(24px + var(--sab)); left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 13px; }
body.reduce-motion .certificate, body.reduce-motion .alop-stamp, body.reduce-motion .buy-stamp { animation-duration: .12s !important; }

/* Debug */
#debug { position: absolute; top: calc(8px + var(--sat)); left: 50%; transform: translateX(-50%); margin-top: 52px; background: rgba(0,0,0,.72); color: #8f8; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 6px 9px; border-radius: 8px; white-space: pre; }
#fps { position: absolute; bottom: calc(4px + var(--sab)); right: calc(6px + var(--sar)); font: 11px ui-monospace, Menlo, monospace; color: #8f8; background: rgba(0,0,0,.5); padding: 2px 5px; border-radius: 5px; }
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); color: var(--muted); font-size: 14px; z-index: 5; transition: opacity .5s; }
#boot.gone { opacity: 0; pointer-events: none; }
.rebind { min-width: 90px; }
.rebind.wait { background: var(--orange); }
.help-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; align-items: center; }
</style>
</head>
<body>
<canvas id="ground" aria-hidden="true"></canvas>
  <canvas id="game" tabindex="0" aria-label="Spielfläche"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="hud-money" class="hud-box pe" title="Fünfmal antippen: Debug-Anzeige"><div class="m num"><span id="money-v">0</span><span class="cur">₥</span></div><div class="r num" id="money-r">0 ₥/Min.</div><div class="d" id="money-d"></div></div>
    <div id="hud-sector" class="hud-box"></div>
    <div id="hud-mapwrap" class="hud-box pe"><canvas id="hud-minimap" width="176" height="176"></canvas></div>
    <div id="hud-icons"></div>

   ---------------------------------------------------------------------------
   DESIGN- UND TECHNIK-ENTSCHEIDUNGEN (selbst getroffen, kurz dokumentiert)
   ---------------------------------------------------------------------------
   Welt
   - 6.144 × 6.144 Zellen, Chunks 64², Sektoren 4×4 Chunks (24×24 = 576), Spalten
     A–X, Zeilen 1–24. Die Welt ist deterministisch aus dem Seed; unberührte Chunks

     Kraterhügel (Rest), Rillental (zwei wellige Ost-West-Bänder mit Schluchten),
     Glitzerfelder (Inseln im Hochland), Polare Schatten (oben/unten), Rückseite
     (gegenüberliegende Längengrade, mit dem Großen Teppichkrater bei x = 0).
   - Gesperrte Regionen sind schraffiert und werden durch ein Absperrband blockiert.
   - Startsektor ist M-13 (Sektormitte), damit das Depot mitten in einem Sektor steht.
   - Kraterränder haben Lücken, damit Fahrzeuge nie dauerhaft ausgesperrt sind.
   - Die Rückseite hat alle Staubarten; "1,5-facher Wert" wird als 1,5-fache Masse

     Mittelwert aller 576 Sektor-Fortschritte (4 Nachkommastellen).

     alter und neuer Werkzeugposition. Fällt eine Zelle auf ≤ 8, wird sie auf 0 gesetzt.
   - Depot: Kapsel fasst 200 kg und startet automatisch; manueller Start ist jederzeit
     möglich (für den 60-Sekunden-Kern-Loop). Geld kommt beim Kapselstart.
   - Balancing per Pacing-Modell (Debug → „Pacing-Simulation“, F3): Startgebiet mit
     dünnerem Staub, Tutorial-Prämie, frühe Aufträge, zwei Fundstücke am Start und
     anfangs +50 % Erdnachfrage auf Mondstaub. Bürstenbreiten der Fahrzeuge verbreitert

     15 Min. für den ersten Sektor – das ist bei 256×256 Zellen nicht erreichbar.
   - Der Mond ist endlich (≈ 23 Mio. ₥ Rohwert): Lizenz 5 kostet 15 Mio., Lizenz 6
     80 Mio. ₥ statt 30/400 Mio., sonst wäre die Rückseite kaum erreichbar.
   - „Stellenplan“: Die Roboterzahl ist je Lizenz begrenzt (6/12/24/30/40/60, Forschung
     +10). Ohne Grenze explodiert die Flotte exponentiell und der Mond ist nach
     1,5 Std. sauber. Verkaufen erstattet 100 %, alte Modelle lassen sich also
     verlustfrei ersetzen. Roboter-Upgrades +4 %/Stufe, Forschung moderat.
   - Rückseite: halber Funkradius und 60 % Robotertempo („Signal schwach“).
   - Prozent-Upgrades: Behälter multiplikativ, alle anderen additiv (sonst explodiert
     das Lauftempo). Verarbeitungsmaschinen reichen Waren, die sie nicht verarbeiten,
     einfach durch (kein Verstopfen). Der Verdichter nimmt nur Staubarten an, bei
     denen sich Verdichten lohnt.
   - Kapsel-Logistik ab Stufe 5: "Fernabladen" – Behälter per Funk ins Depot schicken.
   Roboter
   - Roboter fahren über Felsen und Kraterränder (langsamer) und hüpfen über
     Schluchten (sehr langsam) – sie bleiben nie stecken. Drohnen ignorieren alles.
   - Ferne Roboter laufen in 6 Gruppen à 10 Hz; Offline-Fortschritt simuliert die
     Roboter mit 1-s-Schritten, Erlöse werden über den zuletzt gemessenen
     Durchschnittswert pro kg abgerechnet (Förderbänder ruhen offline).
   Bauen
   - Förderband-Pakete à 2,5 kg; Stufe 1/2/3 = 4/6/9 Zellen/s bei 1/2/4 Paketen pro Zelle
     → 10/30/90 kg/s. Pakete werden nur übergeben, wenn das Ziel Platz hat (Rückstau).
     Abriss erstattet 100 % und schreibt Ladung/Puffer als Geld (Grundwert) gut.
   - Ein "Verteiler" ist zugleich Zusammenführer: nimmt von allen Seiten, gibt
     reihum an alle abgehenden Bänder.
   Technik
   - Feste Logik-Rate 60 Hz mit Akkumulator, Rendering per rAF mit Interpolation.
   - Chunk-Texturen: 1/2/4 px pro Zelle je nach Qualität, LOD-Stufe 1 px/Zelle beim
     Herauszoomen und Sektor-Übersichtsbilder für sehr weite Zooms.
   - Speichern: IndexedDB (Kern + geänderte Chunks, RLE + gzip), 5 rotierende
     Kern-Backups, FNV-Prüfsumme, Schema-Migration, Export/Import als Datei.
   Koop (optional, Phase 7)
   - Transport: PeerJS (WebRTC, Host-ID „staubmond-<6-stelliger Code>“, öffentlicher
     PeerJS-Vermittlungsserver, danach direkte Verbindung) oder BroadcastChannel für
     mehrere Tabs auf demselben Gerät (offline testbar).
   - Host-autoritativ: Der Host simuliert Welt, Wirtschaft, Gebäude und Roboter. Clients
     senden 15×/s Position, Blickfeld und „putzt gerade“; der Host führt die Putzstriche
     aus. Alle Käufe/Bauaktionen laufen über die Befehlsschicht (Shop) und werden an den
     Host weitergeleitet. Snapshots 10×/s (Spieler, Fahrzeuge, Roboter, geänderte
     Chunks – nahe zuerst), Spielzustand 2×/s, Gebäude bei Änderung.
   - Gemeinsame Kasse und Fortschritt; nur der Host speichert. Der eigene Spielstand der
     Clients bleibt unberührt. Crew-Bonus +5 % Einkommen je Mitspieler.
   - Verlässt jemand das Spiel (oder reißt die Verbindung ab, 15 s ohne Meldung), geht

   - Versionsprüfung beim Beitritt, max. 8 Personen, Host kann entfernen und sperren.

/* ============================================================================
   2. HILFSFUNKTIONEN – Mathe, Rauschen, Formatierung, Pools
   ============================================================================ */
const WSIZE = CONFIG.world.size, CH = CONFIG.world.chunk, NCH = WSIZE / CH, SEC = CH * CONFIG.world.sectorChunks, NSEC = WSIZE / SEC;
const CLEAN_T = CONFIG.world.cleanThreshold, KG_UNIT = CONFIG.world.kgPerFullCell / 255;
const NGOODS = CONFIG.goods.length;

const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: t => t * t * (3 - 2 * t),
  wrapX: x => { x %= WSIZE; return x < 0 ? x + WSIZE : x; },
  wrapI: x => ((x % WSIZE) + WSIZE) % WSIZE,
  dx(a, b) { let d = (b - a) % WSIZE; if (d < -WSIZE / 2) d += WSIZE; else if (d >= WSIZE / 2) d -= WSIZE; return d; },
  dist(ax, ay, bx, by) { const dx = U.dx(ax, bx), dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
  dist2(ax, ay, bx, by) { const dx = U.dx(ax, bx), dy = by - ay; return dx * dx + dy * dy; },
  angLerp(a, b, t) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * t; },
  angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; },
  now: () => performance.now(),
  // Schneller 32-Bit-Hash für Gitterpunkte
  hash(x, y, s) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  },
  hashI(x, y, s) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return h >>> 0;
  },
  rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
  // Periodisches Value-Noise: x in Gitterkoordinaten, Periode p (Gitterpunkte) in x-Richtung
  vnoise(x, y, p, s) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    let x0 = xi % p; if (x0 < 0) x0 += p; const x1 = x0 + 1 === p ? 0 : x0 + 1;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = U.hash(x0, yi, s), b = U.hash(x1, yi, s), c = U.hash(x0, yi + 1, s), d = U.hash(x1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  },
  // fBm mit Skalen, die WSIZE teilen (3·2^k) → nahtloser Ost-West-Umlauf
  fbm(x, y, scale, oct, s) {
    let sum = 0, amp = 1, norm = 0;
    for (let o = 0; o < oct; o++) {
      sum += amp * U.vnoise(x / scale, y / scale, WSIZE / scale, s + o * 7919);
      norm += amp; amp *= 0.5; scale /= 2;
    }
    return sum / norm;
  },
  // Deutsche Zahlformate
  _nf0: new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }),
  _nf1: new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
  _nf2: new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  _nf4: new Intl.NumberFormat('de-DE', { minimumFractionDigits: 4, maximumFractionDigits: 4 }),
  big(n) {
    const a = Math.abs(n);
    if (a < 1000) return U._nf0.format(Math.floor(n));
    const units = [[1e15, 'Brd.'], [1e12, 'Bio.'], [1e9, 'Mrd.'], [1e6, 'Mio.'], [1e3, 'Tsd.']];
    for (const [v, u] of units) if (a >= v) { const x = n / v; return (Math.abs(x) < 100 ? U._nf1.format(Math.floor(x * 10) / 10) : U._nf0.format(Math.floor(x))) + ' ' + u; }
    return U._nf0.format(n);
  },
  money(n) { return U.big(n) + ' ₥'; },
  kg(n) {
    if (n < 10) return U._nf1.format(n) + ' kg';
    if (n < 1000) return U._nf0.format(n) + ' kg';
    if (n < 1e6) return U._nf1.format(n / 1000) + ' t';
    return U.big(n / 1000) + ' t';
  },
  int(n) { return U._nf0.format(n); },
  f1(n) { return U._nf1.format(n); },
  f2(n) { return U._nf2.format(n); },
  pct(f, d = 0) { return (d === 4 ? U._nf4 : d === 1 ? U._nf1 : U._nf0).format(f * 100) + ' %'; },
  time(sec) {
    sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + ' Std. ' + m + ' Min.'; if (m > 0) return m + ' Min. ' + (s < 10 ? '0' : '') + s + ' s'; return s + ' s';
  },
  clock(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; },
  sectorLabel(i) { const sx = i % NSEC, sy = (i / NSEC) | 0; return String.fromCharCode(65 + sx) + '-' + (sy + 1); },
  sectorAt(x, y) { return (U.clamp(Math.floor(y / SEC), 0, NSEC - 1)) * NSEC + Math.floor(U.wrapX(x) / SEC); },
  esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },
  // FNV-1a über einen String (Prüfsumme)
  fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16); },
  pick(arr, r) { return arr[Math.floor(r * arr.length) % arr.length]; },
  // DOM-Helfer
  h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k]; if (v == null || v === false) continue;
      if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v; else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);

    }
    for (const c of kids.flat(3)) { if (c == null || c === false) continue; el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); }
    return el;
  },
};

/* Einfacher Ereignis-Bus (Statistik, Aufträge, Tutorial, Netz) */
const Bus = {
  map: new Map(),
  on(ev, fn) { if (!this.map.has(ev)) this.map.set(ev, []); this.map.get(ev).push(fn); },
  emit(ev, a, b, c, d) { const l = this.map.get(ev); if (l) for (let i = 0; i < l.length; i++) l[i](a, b, c, d); },
};

/* Kleine Stoppuhr für Profiling im Debug-Overlay */
const Prof = { t: {}, start(k) { this.t[k + '_s'] = performance.now(); }, end(k) { const d = performance.now() - this.t[k + '_s']; this.t[k] = (this.t[k] || d) * 0.9 + d * 0.1; } };

/* ============================================================================
   3. WORLD – Mondkarte, Chunks, Staubdaten, Regionen, Sektoren
   ============================================================================ */
const T_GROUND = 0, T_ROCK = 1, T_GRAVEL = 2, T_CANYON = 3, T_RIMS = 4, T_RIML = 5, T_BRIDGE = 6;
const R_EBENE = 0, R_MARE = 1, R_KRATER = 2, R_RILLE = 3, R_GLITZER = 4, R_POLAR = 5, R_RUECK = 6;
const NF = 9;                                   // Anzahl niederfrequenter Felder
const REL_AMP = [1.6, 2.2, 6.5, 4.5, 3.5, 4.5, 5.5];

const World = {
  seed: 0, s: 0,
  chunks: null, cleanable: null, chunkClean: null,
  secClean: null, secCleanable: null, secKnown: null, secProgress: null, secDone: null, secRegion: null, secTouched: null,
  chunkRegion: null, chunkAvg: null,
  glanzSum: 0,
  baseCache: new Map(), baseStamp: 0,
  rockCache: new Map(), craterMemo: new Map(), islandMemo: new Map(),
  hugeCraters: [], finds: [], findsByChunk: new Map(),
  pendingStats: [], pendingSet: new Set(),
  dirtyTex: new Set(), dirtySave: new Set(), dirtyMap: new Set(),
  bridgeCells: new Map(),
  col: new Float64Array(NGOODS),             // Sammelpuffer für stroke()
  rnd: 12345,
  onCellClean: null,                          // Callback (x, y, ci)
  onFind: null,
  _F: new Float32Array(11 * 11 * NF), _M: new Float32Array(19 * 19 * 2), _f: new Float32Array(NF),
  _h: new Float32Array(66 * 66), _reg: new Uint8Array(66 * 66),
  _sc: { ci: new Int32Array(8192), li: new Int32Array(8192), w: new Float32Array(8192), x: new Int32Array(8192), y: new Int32Array(8192), kg: new Float32Array(8192), dk: new Float32Array(8192), fr: new Float32Array(8192) },

  init(seed) {
    this.seed = seed >>> 0; this.s = (seed * 2654435761) >>> 0;
    const N = NCH * NCH, S = NSEC * NSEC;
    this.chunks = new Array(N).fill(null);
    this.cleanable = new Int16Array(N).fill(-1);
    this.chunkClean = new Int16Array(N);
    this.secClean = new Int32Array(S); this.secCleanable = new Int32Array(S); this.secKnown = new Uint8Array(S);
    this.secProgress = new Float32Array(S); this.secDone = new Uint8Array(S); this.secRegion = new Uint8Array(S); this.secTouched = new Uint8Array(S);
    this.chunkRegion = new Uint8Array(N); this.chunkAvg = new Uint8Array(N);
    this.glanzSum = 0;
    this.baseCache.clear(); this.rockCache.clear(); this.craterMemo.clear(); this.islandMemo.clear();
    this.pendingStats.length = 0; this.pendingSet.clear();
    this.dirtyTex.clear(); this.dirtySave.clear(); this.dirtyMap.clear(); this.bridgeCells.clear(); this.findsByChunk.clear(); this.texRect.clear(); this.decals.clear();
    // Riesenkrater (feste Liste aus dem Seed) + Großer Teppichkrater
    const r = U.rng(this.s ^ 0x9e3779b9), C = CONFIG.world.craters;
    this.hugeCraters = [];
    let guard = 0;
    while (this.hugeCraters.length < C.huge.count && guard++ < 400) {
      const x = r() * WSIZE, y = WSIZE * (0.2 + r() * 0.6), R = C.huge.rMin + r() * (C.huge.rMax - C.huge.rMin);
      if (U.dist(x, y, CONFIG.world.start.x, CONFIG.world.start.y) < R * 1.6 + 900) continue;
      if (U.dist(x, y, C.carpet.x, C.carpet.y) < R + C.carpet.r + 200) continue;
      if (this.hugeCraters.some(c => U.dist(c.x, c.y, x, y) < (c.r + R) * 1.1)) continue;
      this.hugeCraters.push(this.makeCrater(x, y, R, r(), true));
    }
    this.carpet = this.makeCrater(C.carpet.x, C.carpet.y, C.carpet.r, 0.37, true); this.carpet.carpet = true;
    this.hugeCraters.push(this.carpet);
    // Übersicht: Region und mittlerer Staub pro Chunk (für Karte, Minimap, Sektor-Regionen)
    const regCount = new Uint16Array(S * 7);
    for (let cy = 0; cy < NCH; cy++) for (let cx = 0; cx < NCH; cx++) {
      const i = cy * NCH + cx, x = cx * CH + 32, y = cy * CH + 32;
      const a = this.sample(x - 14, y - 10), b = this.sample(x + 13, y + 15);
      this.chunkRegion[i] = this.sample(x, y).region;
      this.chunkAvg[i] = (a.dust + b.dust) >> 1;
      regCount[(((cy >> 2) * NSEC) + (cx >> 2)) * 7 + this.chunkRegion[i]]++;
    }
    for (let s = 0; s < S; s++) { let best = 0, bi = 0; for (let k = 0; k < 7; k++) if (regCount[s * 7 + k] > best) { best = regCount[s * 7 + k]; bi = k; } this.secRegion[s] = bi; }
    this.placeFinds();
  },

  makeCrater(x, y, R, h, huge) {
    const gaps = [], n = R < 25 ? 1 : 1 + Math.floor(h * 3);
    for (let i = 0; i < n; i++) gaps.push(((h * 7.31 + i * 2.39) % 1) * Math.PI * 2);
    const gw = Math.max(R < 25 ? 0.55 : 0.18, 7 / R);
    return { x, y, r: R, gaps, gw, small: R < 25, depth: R * (huge ? 0.12 : 0.17), rim: R * (huge ? 0.035 : 0.06) };
  },

  /* --- Niederfrequente Felder an einem Punkt --- */
  fields(x, y, out, o) {
    const s = this.s, W = CONFIG.world, st = W.start;
    const lat = (y - WSIZE / 2) / (WSIZE / 2), dxC = U.dx(WSIZE / 2, x), lon = dxC / (WSIZE / 2);
    out[o] = Math.abs(lat) - (W.polarLat + (U.fbm(x, y, 768, 2, s + 1) - 0.5) * 2 * W.polarWarp);
    out[o + 1] = Math.abs(lon) - (W.farSideLon + (U.fbm(x, y, 768, 2, s + 2) - 0.5) * 2 * W.farSideWarp);
    const nb = (U.fbm(x, y, 384, 2, s + 3) - 0.5) * 0.035;
    out[o + 2] = Math.abs(lat - this.bandC(x, 0)) - (W.bands[0].half + nb);
    out[o + 3] = Math.abs(lat - this.bandC(x, 1)) - (W.bands[1].half + nb);
    const d = U.dist(x, y, st.x, st.y);
    out[o + 4] = (d - (W.ebeneRadius + (U.fbm(x, y, 384, 2, s + 4) - 0.5) * 2 * W.ebeneWarp)) / W.ebeneRadius;
    out[o + 5] = (d - (W.mareRing + (U.fbm(x, y, 768, 2, s + 5) - 0.5) * 520)) / W.mareRing;
    out[o + 6] = U.fbm(x, y, 1536, 3, s + 6) - W.mareThreshold;
    out[o + 7] = U.fbm(x, y, 768, 2, s + 7);
    out[o + 8] = U.fbm(x, y, 96, 1, s + 8);
  },
  bandC(x, k) { return CONFIG.world.bands[k].lat + (U.fbm(x, k * 977 + 13, 1536, 2, this.s + 20 + k) - 0.5) * 0.09; },
  // Region aus Feldwerten; glitter = Wert < 0 bedeutet "in einer Glitzerinsel"
  classify(f, o, glitter) {
    if (f[o] > 0) return R_POLAR;
    if (f[o + 1] > 0) return R_RUECK;
    if (f[o + 2] < 0 || f[o + 3] < 0) return R_RILLE;
    if (f[o + 4] < 0) return R_EBENE;
    if (f[o + 5] < 0 || f[o + 6] > 0) return R_MARE;
    if (glitter < 0) return R_GLITZER;
    return R_KRATER;
  },
  dustTypeFor(region, sub, glitter, lat) {
    if (region !== R_RUECK) return CONFIG.regions[region].dust;
    if (glitter < 0) return 4;
    if (Math.abs(lat) > 0.6 && sub > 0.62) return 5;
    return sub < 0.36 ? 1 : sub < 0.55 ? 0 : sub < 0.74 ? 2 : 3;
  },

  /* --- Glitzerinseln (Raster 320) --- */
  islandsNear(x0, y0, x1, y1) {
    const G = CONFIG.world.glitterGrid, NG = WSIZE / G, res = [];
    for (let gy = Math.floor((y0 - 160) / G); gy <= Math.floor((y1 + 160) / G); gy++) for (let gx = Math.floor((x0 - 160) / G); gx <= Math.floor((x1 + 160) / G); gx++) {
      const key = ((gx % NG) + NG) % NG + gy * 1000;
      let isl = this.islandMemo.get(key);
      if (isl === undefined) {
        isl = null;
        const h = U.hash(((gx % NG) + NG) % NG, gy, this.s + 31);
        if (h < CONFIG.world.glitterChance) {
          const ix = (gx + 0.2 + 0.6 * U.hash(gx, gy, this.s + 32)) * G, iy = (gy + 0.2 + 0.6 * U.hash(gx, gy, this.s + 33)) * G;
          const reg = this.sampleRegionNoGlitter(U.wrapX(ix), iy);
          if (reg === R_KRATER || reg === R_RUECK) isl = { x: ix, y: iy, r: U.lerp(CONFIG.world.glitterRadius[0], CONFIG.world.glitterRadius[1], U.hash(gx, gy, this.s + 34)) };
        }
        this.islandMemo.set(key, isl);
      }
      if (isl) res.push({ x: isl.x + (gx * G - (((gx % NG) + NG) % NG) * G), y: isl.y, r: isl.r });
    }
    return res;
  },
  glitterVal(isl, x, y, warp) {
    let best = 9;
    for (let i = 0; i < isl.length; i++) { const I = isl[i], dx = x - I.x, dy = y - I.y; const v = Math.sqrt(dx * dx + dy * dy) / I.r - 1 + (warp - 0.5) * 0.7; if (v < best) best = v; }
    return best;
  },
  sampleRegionNoGlitter(x, y) { const f = this._f; this.fields(x, y, f, 0); return this.classify(f, 0, 1); },

  /* --- Krater: Raster klein (48) und mittel (256), plus Riesenliste --- */
  craterCell(level, gx, gy) {
    const C = CONFIG.world.craters, L = level === 0 ? C.small : C.medium, G = L.grid, NG = WSIZE / G;
    const wx = ((gx % NG) + NG) % NG, key = level * 100000000 + gy * 100000 + wx;
    let c = this.craterMemo.get(key);
    if (c !== undefined) return c;
    c = null;
    if (gy >= 0 && gy < NG) {
      const s = this.s + 40 + level * 11;
      const x = (wx + 0.15 + 0.7 * U.hash(wx, gy, s + 1)) * G, y = (gy + 0.15 + 0.7 * U.hash(wx, gy, s + 2)) * G;
      const reg = this.sampleRegionNoGlitter(x, y);
      if (U.hash(wx, gy, s) < L.chance[reg]) {
        const R = L.rMin + Math.pow(U.hash(wx, gy, s + 3), 1.6) * (L.rMax - L.rMin);
        const st = CONFIG.world.start;
        if (U.dist(x, y, st.x, st.y) > R * 1.7 + 40) c = this.makeCrater(x, y, R, U.hash(wx, gy, s + 4), false);
      }
    }
    if (this.craterMemo.size > 60000) this.craterMemo.clear();
    this.craterMemo.set(key, c);
    return c;
  },
  // alle Krater, die das Rechteck [x0,x1]×[y0,y1] (unverpackte x) beeinflussen, mit x nahe x0
  cratersNear(x0, y0, x1, y1, out) {
    out.length = 0;
    const C = CONFIG.world.craters;
    for (let level = 0; level < 2; level++) {
      const L = level === 0 ? C.small : C.medium, G = L.grid, m = L.rMax * 1.65;
      for (let gy = Math.floor((y0 - m) / G); gy <= Math.floor((y1 + m) / G); gy++) for (let gx = Math.floor((x0 - m) / G); gx <= Math.floor((x1 + m) / G); gx++) {
        const c = this.craterCell(level, gx, gy); if (!c) continue;
        const cx = x0 + U.dx(x0, c.x), ext = c.r * 1.65;

        out.push({ c, x: cx });

    for (const c of this.hugeCraters) {

      out.push({ c, x: cx });
    }
    return out;
  },
  // Kraterprofil: liefert [dh, dustMul, rimFlag]
  craterAt(c, cx, x, y, res) {
    const dx = x - cx, dy = y - c.y, d = Math.sqrt(dx * dx + dy * dy), t = d / c.r;
    if (t >= 1.62) return false;

    if (t < 0.88) { const q = t / 0.88; res[0] += -c.depth * (1 - q * q); res[1] *= CONFIG.world.craters.interiorDust; }
    else if (t < 1.12) {

    return true;
  },

  /* --- Felsbrocken pro Chunk (deterministisch) --- */
  rocksOf(ci) {
    let list = this.rockCache.get(ci);
    if (list) return list;
    list = [];
    const cx = ci % NCH, cy = (ci / NCH) | 0, X0 = cx * CH, Y0 = cy * CH;
    const reg = this.chunkRegion ? this.chunkRegion[ci] : this.sample(X0 + 32, Y0 + 32).region;
    const mean = CONFIG.world.rocksPerChunk[reg];
    const r = U.rng(U.hashI(cx, cy, this.s + 77));
    let n = 0; { let L = Math.exp(-mean), p = 1; do { n++; p *= r(); } while (p > L && n < 14); n--; }
    const st = CONFIG.world.start, fl = this.findsByChunk.get(ci);
    for (let i = 0; i < n; i++) {
      const x = X0 + 3 + r() * (CH - 6), y = Y0 + 3 + r() * (CH - 6);
      const big = r(), R = CONFIG.world.rockRadius[0] + Math.pow(big, 2.2) * (CONFIG.world.rockRadius[1] - CONFIG.world.rockRadius[0]);
      if (U.dist(x, y, st.x, st.y) < 34) continue;
      if (fl && fl.some(f => U.dist(f.x, f.y, x, y) < 6)) continue;

      list.push({ x, y, r: R, verts, gravel: R < CONFIG.world.gravelRadius, tone: r() });
    }
    if (this.rockCache.size > 5000) this.rockCache.clear();
    this.rockCache.set(ci, list);
    return list;
  },

  /* --- Schluchten im Rillental: Mittellinie und Halbbreite pro Spalte --- */
  canyonY(x, k, j) {
    const W = CONFIG.world, yc = WSIZE / 2 + this.bandC(x, k) * (WSIZE / 2);

  canyonHW(x, k, j) { const W = CONFIG.world; return U.lerp(W.canyonHalfWidth[0], W.canyonHalfWidth[1], U.fbm(x, j * 71 + k * 19, 96, 2, this.s + 51)); },

  /* --- Einzelpunkt-Abfrage (näherungsweise, für Übersicht/Platzierung) --- */
  sample(x, y, noCraters) {

    const R = CONFIG.regions[region];
    let dust = R.density[0] + R.density[1] * (U.fbm(x, y, 96, 2, this.s + 9) - 0.5) * 2.2;

  /* --- Fundstücke: 150 deterministische Positionen --- */
  placeFinds() {
    const r = U.rng(this.s ^ 0xF1D5), st = CONFIG.world.start, objs = TXT.findObjects, vars = TXT.findVariants;
    this.finds = [];
    const add = (x, y) => {
      const id = this.finds.length, o = objs[id % objs.length], v = vars[Math.floor(id / objs.length) % vars.length];
      const end = o[0] === 'm' ? 'er' : o[0] === 'f' ? 'e' : 'es';
      let name = v.adj + end + ' ' + o[1]; name = name.charAt(0).toUpperCase() + name.slice(1);
      const f = { id, x: Math.floor(x) + 0.5, y: Math.floor(y) + 0.5, name, text: o[2] + ' ' + v.note, gold: v === vars[2], region: 0, obj: id % objs.length };

      this.finds.push(f);
      const ci = (Math.floor(f.y) >> 6) * NCH + (Math.floor(f.x) >> 6);
      if (!this.findsByChunk.has(ci)) this.findsByChunk.set(ci, []);
      this.findsByChunk.get(ci).push(f);

    let guard = 0;
    while (this.finds.length < CONFIG.world.finds && guard++ < 20000) {
      const x = r() * WSIZE, y = 40 + r() * (WSIZE - 80);
      if (U.dist(x, y, st.x, st.y) < 60) continue;
      const sp = this.sample(x, y, true); if (sp.canyonNear) continue;
      if (this.finds.some(f => U.dist(f.x, f.y, x, y) < 90)) continue;
      add(x, y);
    }
  },

  /* --- Basisdaten eines Chunks erzeugen (Staub, Terrain, Schattierung, Region) --- */
  base(ci) {
    let b = this.baseCache.get(ci);
    if (b) { b.stamp = ++this.baseStamp; return b; }
    b = this.genBase(ci);
    b.stamp = ++this.baseStamp;
    this.baseCache.set(ci, b);
    if (this.baseCache.size > CONFIG.perf.baseCache) this.evictBase();
    return b;
  },
  evictBase() {
    // entfernt die ältesten 10 % (amortisiert)
    const arr = []; for (const [k, v] of this.baseCache) arr.push([v.stamp, k]);
    arr.sort((a, b) => a[0] - b[0]);
    const n = Math.ceil(arr.length * 0.1);
    for (let i = 0; i < n; i++) this.baseCache.delete(arr[i][1]);
  },
  hasBase(ci) { return this.baseCache.has(ci); },

  genBase(ci) {
    const cx = ci % NCH, cy = (ci / NCH) | 0, X0 = cx * CH, Y0 = cy * CH, s = this.s, Wc = CONFIG.world;
    const F = this._F, M = this._M, H = this._h, REG = this._reg;
    // 1) Felder auf 8er-Raster (11×11, Rand 8)
    for (let gy = 0; gy < 11; gy++) for (let gx = 0; gx < 11; gx++) this.fields(U.wrapX(X0 - 8 + gx * 8), U.clamp(Y0 - 8 + gy * 8, 0, WSIZE), F, (gy * 11 + gx) * NF);
    // 2) Dichte- und Relief-Makro auf 4er-Raster (19×19, Rand 4)
    for (let gy = 0; gy < 19; gy++) for (let gx = 0; gx < 19; gx++) {
      const x = U.wrapX(X0 - 4 + gx * 4), y = Y0 - 4 + gy * 4, o = (gy * 19 + gx) * 2;
      M[o] = U.fbm(x, y, 96, 2, s + 9); M[o + 1] = U.fbm(x, y, 96, 2, s + 10);

    // 3) Krater, Inseln, Felsen in der Umgebung
    const craters = this.cratersNear(X0 - 1, Y0 - 1, X0 + 65, Y0 + 65, []);
    const isl = this.islandsNear(X0 - 1, Y0 - 1, X0 + 65, Y0 + 65);
    const rocks = [];
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const ny = cy + oy; if (ny < 0 || ny >= NCH) continue;
      const nx = (cx + ox + NCH) % NCH, list = this.rocksOf(ny * NCH + nx);

        const nC = Wc.canyonsPerBand; canyon = { yc: new Float32Array(2 * nC * 66), hw: new Float32Array(2 * nC * 66) };
        const sy = new Float32Array(19), sh = new Float32Array(19);
        for (let k = 0; k < 2; k++) for (let j = 0; j < nC; j++) {
          for (let q = 0; q < 19; q++) { const x = U.wrapX(X0 - 4 + q * 4); sy[q] = this.canyonY(x, k, j); sh[q] = this.canyonHW(x, k, j); }
          for (let lx = -1; lx < 65; lx++) {

      const gyf = (ly + 0.5 + 8) / 8, gy0 = Math.min(9, Math.floor(gyf)), ty = gyf - gy0;
      const myf = (ly + 0.5 + 4) / 4, my0 = Math.min(17, Math.floor(myf)), tmy = myf - my0;
      const lat = (y - WSIZE / 2) / (WSIZE / 2);

        const x = X0 + lx + 0.5, k66 = (ly + 1) * 66 + lx + 1;

        const g = isl.length ? this.glitterVal(isl, x, y, fi[8]) : 1;
        const reg = this.classify(fi, 0, g);
        REG[k66] = reg;
        const mxf = (lx + 0.5 + 4) / 4, mx0 = Math.min(17, Math.floor(mxf)), tmx = mxf - mx0;
        const m00 = (my0 * 19 + mx0) * 2, m10 = m00 + 2, m01 = m00 + 38, m11 = m01 + 2;
        const relief = (M[m00 + 1] + (M[m10 + 1] - M[m00 + 1]) * tmx) * (1 - tmy) + (M[m01 + 1] + (M[m11 + 1] - M[m01 + 1]) * tmx) * tmy;

        if (lx < 0 || ly < 0 || lx > 63 || ly > 63) continue;
        const li = ly * 64 + lx;

        type[li] = this.dustTypeFor(reg, fi[7], g, lat);

        for (let i = 0; i < rocks.length; i++) {
          const rk = rocks[i], ddx = x - rk.x, ddy = y - rk.y;

  },

  /* --- Zellzugriff (x, y ganzzahlig) --- */
  ci(x, y) { return (y >> 6) * NCH + (U.wrapI(x) >> 6); },
  dustAt(x, y) {
    if (y < 0 || y >= WSIZE) return 0;
    x = U.wrapI(x); const ci = (y >> 6) * NCH + (x >> 6), li = ((y & 63) << 6) | (x & 63), ch = this.chunks[ci];

  },
  meteorAt(x, y) {
    if (y < 0 || y >= WSIZE) return 0;
    x = U.wrapI(x); const ch = this.chunks[(y >> 6) * NCH + (x >> 6)];
    return ch && ch.meteor ? ch.meteor[((y & 63) << 6) | (x & 63)] : 0;
  },
  terrAt(x, y) {
    if (y < 0 || y >= WSIZE) return T_ROCK;
    x = U.wrapI(x); const ci = (y >> 6) * NCH + (x >> 6);
    const t = this.base(ci).terr[((y & 63) << 6) | (x & 63)];
    if (t === T_CANYON && this.bridgeCells.size && this.bridgeCells.has(y * WSIZE + x)) return T_BRIDGE;
    return t;
  },
  regionAt(x, y) {
    if (y < 0) y = 0; else if (y >= WSIZE) y = WSIZE - 1;
    x = U.wrapI(x); return this.base((y >> 6) * NCH + (x >> 6)).region[((y & 63) << 6) | (x & 63)];
  },
  typeAt(x, y) {
    if (y < 0) y = 0; else if (y >= WSIZE) y = WSIZE - 1;
    x = U.wrapI(x); return this.base((y >> 6) * NCH + (x >> 6)).type[((y & 63) << 6) | (x & 63)];
  },
  isCleanableT(t) { return t !== T_ROCK && t !== T_GRAVEL && t !== T_CANYON && t !== T_BRIDGE; },
  isClean(x, y) { return this.dustAt(x, y) <= CLEAN_T; },
  massMul(region) { return CONFIG.regions[region].massMul || 1; },

  /* --- Statistik: putzbare Zellen pro Chunk, Sektorfortschritt --- */
  ensureStats(ci) {
    if (this.cleanable[ci] >= 0) return;
    const b = this.base(ci);
    this.cleanable[ci] = b.cleanable;
    const ch = this.chunks[ci];
    let clean = b.initClean;
    if (ch) { clean = 0; for (let i = 0; i < 4096; i++) if (ch.dust[i] <= CLEAN_T && this.isCleanableT(b.terr[i])) clean++; }
    this.chunkClean[ci] = clean;
    const s = this.secOfChunk(ci);
    this.secCleanable[s] += b.cleanable; this.secClean[s] += clean; this.secKnown[s]++;

  },
  secOfChunk(ci) { const cx = ci % NCH, cy = (ci / NCH) | 0; return (cy >> 2) * NSEC + (cx >> 2); },
  chunksOfSector(s) { const sx = s % NSEC, sy = (s / NSEC) | 0, out = []; for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) out.push((sy * 4 + y) * NCH + sx * 4 + x); return out; },
  touchSector(s) {
    if (this.secTouched[s]) return;
    this.secTouched[s] = 1;
    for (const ci of this.chunksOfSector(s)) if (this.cleanable[ci] < 0 && !this.pendingSet.has(ci)) { this.pendingSet.add(ci); this.pendingStats.push(ci); }
  },
  processPending(budgetMs) {

    while (this.pendingStats.length && performance.now() - t0 < budgetMs) {
      const ci = this.pendingStats.shift(); this.pendingSet.delete(ci); this.ensureStats(ci);
    }
  },
  sectorEstCleanable(s) { return this.secCleanable[s] + (16 - this.secKnown[s]) * 4000; },
  updateSector(s) {

    const p = this.secKnown[s] === 16 ? (this.secCleanable[s] > 0 ? this.secClean[s] / this.secCleanable[s] : 1) : this.secClean[s] / this.sectorEstCleanable(s);

    this.glanzSum += Math.min(p, 1) - Math.min(old, 1);

  },
  glanz() { return this.glanzSum / (NSEC * NSEC); },

  /* --- Chunk materialisieren (erste Änderung) --- */
  mat(ci) {

    const b = this.base(ci);
    this.ensureStats(ci);
    ch = { ci, dust: b.dust.slice(), meteor: null, decals: null, rev: 1 };
    this.chunks[ci] = ch;
    this.touchSector(this.secOfChunk(ci));
    return ch;
  },
  markDirty(ci, x0, y0, x1, y1) {

    const ch = this.chunks[ci]; if (ch) { ch.rev++; this.dirtySave.add(ci); this.dirtyMap.add(ci); }
  },
  // Textur-Teilrechteck als veraltet markieren (auch für unberührte Chunks, z. B. Fußspuren)
  texRect: new Map(), decals: new Map(),
  markTex(ci, x0, y0, x1, y1) {
    const d = this.texRect.get(ci);
    if (!d) this.texRect.set(ci, [x0, y0, x1, y1]);
    else { if (x0 < d[0]) d[0] = x0; if (y0 < d[1]) d[1] = y0; if (x1 > d[2]) d[2] = x1; if (y1 > d[3]) d[3] = y1; }
    this.dirtyTex.add(ci);
  },
  // Fuß- (k=0) und Reifenspuren (k=1) als Abziehbilder pro Chunk (nicht gespeichert)
  addDecal(x, y, a, k, w) {
    const xi = U.wrapI(Math.floor(x)), yi = Math.floor(y); if (yi < 0 || yi >= WSIZE) return;
    const ci = (yi >> 6) * NCH + (xi >> 6);

    arr.push({ x: U.wrapX(x), y, a, k, w: w || 0 }); if (arr.length > FX_CONFIG.decals.perChunk) arr.shift();
    const lx = xi & 63 ? xi - (xi >> 6) * 64 : 0, ly = yi - (yi >> 6) * 64, r = k ? Math.ceil(w || 1) + 1 : 1;

  _rand() { let x = this.rnd; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.rnd = x | 0; return (x >>> 0) / 4294967296; },

  /* --- Putzen: Kapsel von (ax,ay) nach (bx,by) mit Radius r ---

  stroke(ax, ay, bx, by, r, budgetKg, full, yieldMul) {
