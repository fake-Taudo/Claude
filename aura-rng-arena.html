<script>
/* =====================================================================
   AURA RNG ARENA – Single-File-Browserspiel (HTML + CSS + JS in einer Datei)
   ---------------------------------------------------------------------
   MULTIPLAYER – SO BAUT MAN DIE VERBINDUNG IN DER PRAXIS AUF
   • Technik: WebRTC-Datenkanäle (Peer-to-Peer) über die Bibliothek PeerJS.
     Für den Verbindungsaufbau (Signaling) nutzt PeerJS den kostenlosen
     öffentlichen PeerJS-Cloud-Server (0.peerjs.com) und dessen STUN/TURN-
     Server. Danach fließen alle Spieldaten direkt zwischen den Browsern
     (Stern-Topologie: jeder Gast ist mit dem Host verbunden).
     PeerJS wird erst beim Öffnen des Multiplayer-Menüs per CDN geladen
     (unpkg, Fallback jsDelivr). Rollen, Sammlung und Training laufen
     komplett offline.
   • Ablauf:
     1. Spieler A klickt „Multiplayer" → „Spiel erstellen". Das Spiel
        erzeugt einen 6-stelligen Einladungscode (z. B. K7QF2M) und meldet
        sich beim Signaling-Server unter der Peer-ID "aurarng-v1-K7QF2M" an.
     2. A schickt den Code (oder den Link …/aura-rng-arena.html?join=K7QF2M)
        per Chat an Freunde.
     3. Die anderen öffnen dieselbe HTML-Datei (lokal per Doppelklick oder
        auf einem beliebigen Webspace), klicken „Beitreten" und geben den
        Code ein. Ihr Browser verbindet sich über PeerJS direkt mit A.
     4. Ab 2 Spielern kann der Host starten (max. 10). Der Host simuliert
        den Kampf autoritativ mit 60 Hz; Gäste senden nur Eingaben (~30 Hz)
        und bekommen 20 Zustands-Snapshots pro Sekunde, die flüssig
        interpoliert werden. Die eigene Bewegung wird lokal vorhergesagt.
   • Verbindungsart „Lokal (Tabs)": BroadcastChannel zwischen mehreren Tabs
     desselben Browsers – zum Testen ohne Internet, gleicher Ablauf.
   • Eigene Signaling-/TURN-Server lassen sich in NET_CONFIG eintragen.
   ===================================================================== */
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const d2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const fmt = n => Math.round(n).toLocaleString('de-DE');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('de-DE');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const _rgbC = {};
function hexRgb(h) {
  if (_rgbC[h]) return _rgbC[h];
  let s = h.replace('#', ''); if (s.length === 3) s = s.split('').map(c => c + c).join('');
  const n = parseInt(s, 16); return (_rgbC[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }

function h(tag, attrs = {}, inner = '') {
  const e = document.createElement(tag);
  for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'style') e.style.cssText = attrs[k]; else if (k.startsWith('on')) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (inner) e.innerHTML = inner; return e;
}

/* ---------- Seltenheitsstufen (9) mit Drop-Wahrscheinlichkeit ---------- */
// Summe = 100 %. Von 1 zu 1,8 (Gewöhnlich) bis 1 zu 100.000 (Transzendent).
const TIERS = [
  { n: 'Gewöhnlich',   c: '#b6c2d4', p: 55,     dust: 1,     roll: 3.0, ease: 3.2 },
  { n: 'Ungewöhnlich', c: '#4ade80', p: 25,     dust: 3,     roll: 3.4, ease: 3.5 },

  { n: 'Legendär',     c: '#fbbf24', p: 1.9,    dust: 80,    roll: 5.4, ease: 4.6 },
  { n: 'Mythisch',     c: '#f43f5e', p: 0.5,    dust: 300,   roll: 6.3, ease: 5.0 },
  { n: 'Göttlich',     c: '#67e8f9', p: 0.09,   dust: 1500,  roll: 7.3, ease: 5.4 },
  { n: 'Kosmisch',     c: '#e879f9', p: 0.009,  dust: 8000,  roll: 8.6, ease: 5.8 },
  { n: 'Transzendent', c: '#ffffff', p: 0.001,  dust: 40000, roll: 10.5, ease: 6.3 },

const ROLES = {
  'Angreifer':  { hp: 100, spd: 212, reg: 20, d: 'Hoher Schaden, wenig Schutz' },
  'Kontrolle':  { hp: 108, spd: 202, reg: 20, d: 'Verlangsamt, betäubt und lenkt Gegner' },
  'Tank':       { hp: 140, spd: 186, reg: 18, d: 'Sehr zäh, heilt und schützt sich selbst' },
  'Mobilität':  { hp: 90,  spd: 236, reg: 22, d: 'Schnell, weicht aus und flieht' },

/* ---------- Vektor-Glyphen (Koordinaten -1..1) ---------- */
const DARK = '#0a0e1f';
const GLYPH = {};
const G_ = (n, f) => (GLYPH[n] = f);
function path(x, p, close = true) { x.beginPath(); x.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) x.lineTo(p[i], p[i + 1]); if (close) x.closePath(); }

function rr(x, X, Y, W, H, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
const dots = (x, pts, r) => pts.forEach(p => { circ(x, p[0], p[1], p[2] || r); x.fill(); });

G_('flame', (x, a, b) => { x.fillStyle = a; x.beginPath(); x.moveTo(0, -.95); x.bezierCurveTo(.55, -.4, .78, .05, .62, .45); x.bezierCurveTo(.48, .86, -.48, .86, -.62, .45); x.bezierCurveTo(-.76, .08, -.42, -.18, -.16, -.42); x.bezierCurveTo(-.1, -.62, -.05, -.8, 0, -.95); x.fill(); x.fillStyle = b; x.beginPath(); x.moveTo(.02, -.2); x.bezierCurveTo(.3, .08, .4, .34, .3, .55); x.bezierCurveTo(.2, .76, -.2, .76, -.3, .55); x.bezierCurveTo(-.4, .32, -.16, .1, .02, -.2); x.fill(); });
G_('drop', (x, a, b) => { x.fillStyle = a; x.beginPath(); x.moveTo(0, -.92); x.bezierCurveTo(.3, -.5, .66, -.1, .66, .3); x.arc(0, .3, .66, 0, Math.PI); x.bezierCurveTo(-.66, -.1, -.3, -.5, 0, -.92); x.fill(); x.fillStyle = b; x.beginPath(); x.ellipse(-.25, .28, .12, .22, .3, 0, TAU); x.fill(); });
G_('rock', (x, a, b) => { x.fillStyle = a; path(x, [-.72, .5, -.82, -.08, -.38, -.66, .28, -.76, .8, -.22, .72, .44, .12, .78]); x.fill(); x.strokeStyle = b; x.lineWidth = .07; path(x, [-.38, -.66, -.12, -.05, .8, -.22], false); x.stroke(); path(x, [-.12, -.05, .12, .78], false); x.stroke(); path(x, [-.12, -.05, -.82, -.08], false); x.stroke(); });
G_('wind', (x, a, b) => { x.lineWidth = .15; x.strokeStyle = a; x.beginPath(); x.moveTo(-.85, -.3); x.bezierCurveTo(-.2, -.3, .45, -.25, .5, -.55); x.bezierCurveTo(.55, -.85, .2, -.9, .18, -.68); x.stroke(); x.beginPath(); x.moveTo(-.85, .05); x.lineTo(.55, .05); x.bezierCurveTo(.95, .05, .95, .48, .6, .48); x.bezierCurveTo(.38, .48, .34, .3, .46, .24); x.stroke(); x.strokeStyle = b; x.beginPath(); x.moveTo(-.65, .42); x.bezierCurveTo(-.25, .42, 0, .5, .05, .78); x.stroke(); });
G_('leaf', (x, a, b) => { x.fillStyle = a; x.beginPath(); x.moveTo(-.75, .75); x.bezierCurveTo(-.85, -.2, -.1, -.88, .85, -.85); x.bezierCurveTo(.82, .12, .2, .82, -.75, .75); x.fill(); x.strokeStyle = b; x.lineWidth = .08; x.beginPath(); x.moveTo(-.75, .75); x.quadraticCurveTo(0, .05, .62, -.62); x.stroke(); });
G_('mask', (x, a, b) => { x.fillStyle = a; x.beginPath(); x.moveTo(0, -.9); x.bezierCurveTo(.75, -.9, .85, -.1, .6, .4); x.bezierCurveTo(.45, .75, .2, .9, 0, .9); x.bezierCurveTo(-.2, .9, -.45, .75, -.6, .4); x.bezierCurveTo(-.85, -.1, -.75, -.9, 0, -.9); x.fill(); x.fillStyle = b; x.beginPath(); x.ellipse(-.3, -.05, .2, .08, .35, 0, TAU); x.fill(); x.beginPath(); x.ellipse(.3, -.05, .2, .08, -.35, 0, TAU); x.fill(); });
G_('snow', (x, a, b) => { x.strokeStyle = a; x.lineWidth = .12; for (let i = 0; i < 6; i++) { x.save(); x.rotate(i * Math.PI / 3); x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -.88); x.moveTo(0, -.5); x.lineTo(-.22, -.7); x.moveTo(0, -.5); x.lineTo(.22, -.7); x.stroke(); x.restore(); } x.fillStyle = b; circ(x, 0, 0, .14); x.fill(); });
G_('bolt', (x, a, b) => { x.fillStyle = a; path(x, [.22, -.95, -.5, .12, -.04, .12, -.24, .95, .55, -.2, .06, -.2, .34, -.95]); x.fill(); x.strokeStyle = b; x.lineWidth = .06; x.stroke(); });
G_('flower', (x, a, b) => { x.fillStyle = a; for (let i = 0; i < 5; i++) { x.save(); x.rotate(i * TAU / 5); x.beginPath(); x.ellipse(0, -.48, .26, .42, 0, 0, TAU); x.fill(); x.restore(); } x.fillStyle = b; circ(x, 0, 0, .24); x.fill(); });

/* ---------- Abgeleitete Daten, Farbpalette ---------- */
const PAL = [], PALI = {};
function pal(c) { if (PALI[c] === undefined) { PALI[c] = PAL.length; PAL.push(c); } return PALI[c]; }
['#ffffff', '#ff4d6d', '#4ade80', '#fbbf24', '#3ee6ff', '#7c8cff', '#94a3b8', '#000000', '#ff9f43', '#a3e635', '#93c5fd', '#c084fc'].forEach(pal);
TIERS.forEach(t => pal(t.c));
const TIER_AURAS = TIERS.map(() => []);
AURAS.forEach((a, i) => {
  a.i = i; a.ci1 = pal(a.c1); a.ci2 = pal(a.c2);
  // dunkle Zweitfarben aufhellen, damit Effekte sichtbar bleiben
  a.c2v = luminance(a.c2) < 0.25 ? mix(a.c2, a.c1, 0.6) : a.c2; a.ci2v = pal(a.c2v);
  const R = ROLES[a.role];
  a.melee = a.moves[0].k === 'melee';
  a.hp = Math.round(R.hp + a.t * 3 + (a.melee ? 20 : 0)); a.spd = Math.round(R.spd * (a.melee ? 1.14 : 1)); a.reg = R.reg; a.dmgMul = 1 + a.t * 0.03;
  a.chance = TIERS[a.t].p / 100 / 1; // wird unten pro Stufe geteilt
  TIER_AURAS[a.t].push(i);
  a.moves.forEach((m, k) => { m.slot = k; });
});
AURAS.forEach(a => { a.oneIn = Math.round(100 / (TIERS[a.t].p / TIER_AURAS[a.t].length)); });
const AURA_BY_ID = Object.fromEntries(AURAS.map(a => [a.id, a]));

/* =====================================================================
   SPEICHERSTAND
   • Lokal: localStorage (sofort, auch in der heruntergeladenen Datei).
   • Als claude.ai-Artefakt zusätzlich dauerhaft in der privaten Datenbank
     der Person (data/users/<id>/save) – überlebt geleerten Browser-Speicher,
     private Fenster und Gerätewechsel. Der neuere Stand (savedAt) gewinnt.
   • Export/Import als Code (Hilfe → Speicherstand) als manuelle Sicherung.
   ===================================================================== */
const SAVE_KEY = 'auraRngArena.v1';
function defaultSettings() {
  const coarse = typeof matchMedia === 'function' && matchMedia('(pointer:coarse)').matches;
  return { music: .4, sfx: .8, quality: coarse ? 'mid' : 'high', particles: 1, shake: 2, autoStop: 4 };
}
function normSettings(o) { // unbekannte oder kaputte Werte durch Standardwerte ersetzen
  const d = defaultSettings(); o = o && typeof o === 'object' && !Array.isArray(o) ? o : {};
  const num = (v, a, b, def) => typeof v === 'number' && Number.isFinite(v) ? clamp(v, a, b) : def;
  return { music: num(o.music, 0, 1, d.music), sfx: num(o.sfx, 0, 1, d.sfx), quality: ['low', 'mid', 'high'].includes(o.quality) ? o.quality : d.quality,
    particles: num(o.particles, .25, 1.5, d.particles), shake: Math.round(num(o.shake, 0, 3, d.shake)), autoStop: Math.round(num(o.autoStop, 0, 8, d.autoStop)) };
}
function defaultSave() {
  return { name: 'Spieler' + randi(100, 999), dust: 60, rolls: 0, owned: {}, equipped: null,
    potions: { luck1: 1, klee: 2 }, boosts: [], queue: [], bonusCharges: 0,
    sound: true, quick: false, stats: { wins: 0, matches: 0, kills: 0, best: -1, brewed: 0 }, hist: [], newIds: {}, settings: defaultSettings() };
}
function normalizeSave(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return null;
  const s = Object.assign(defaultSave(), d); s.stats = Object.assign(defaultSave().stats, d.stats || {});
  for (const k of ['owned', 'potions', 'newIds']) if (!s[k] || typeof s[k] !== 'object' || Array.isArray(s[k])) s[k] = {};
  for (const k of ['boosts', 'queue', 'hist']) if (!Array.isArray(s[k])) s[k] = [];
  if (s.equipped && !AURA_BY_ID[s.equipped]) s.equipped = null;
  s.settings = normSettings(d.settings);
  s.savedAt = +s.savedAt || 0;
  return s;
}
function loadSave() {
  try { const s = normalizeSave(JSON.parse(localStorage.getItem(SAVE_KEY))); if (s) return s; } catch (e) { }
  return defaultSave();
}
const S = loadSave();
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { }
  CLOUD.queue();
}
// Kompletten Spielstand ersetzen (Cloud-Laden, Import) – S bleibt dasselbe Objekt
function replaceSave(d) {
  const n = normalizeSave(d); if (!n) return false;
  for (const k of Object.keys(S)) delete S[k];
  Object.assign(S, n);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { }
  return true;
}
const CLOUD = {
  ref: null, state: 'local', busy: false, dirty: false, timer: 0, last: 0,
  // Startet im Hintergrund; ohne Artefakt-Umgebung bleibt alles lokal
  async init() {
    try {
      const use = window.claude && window.claude.use; if (typeof use !== 'function') return;
      this.state = 'connecting';
      const [db, user] = await Promise.all([use('db'), use('user')]);
      const id = db && user ? await user.id() : null;
      if (!id) { this.state = 'local'; return; }
      this.ref = db.doc('data/users/' + id + '/save');
      const snap = await this.ref.get(), d = snap.exists ? snap.data() : null;
      let remote = null; try { remote = d && typeof d.s === 'string' ? normalizeSave(JSON.parse(d.s)) : null; } catch (e) { }
      this.state = 'cloud';
      if (remote && remote.savedAt > (S.savedAt || 0)) this.applyRemote(remote);
      else if (!remote || (S.savedAt || 0) > remote.savedAt) this.flush();
    } catch (e) { this.state = this.ref ? 'cloud' : 'local'; }
  },
  // neueren Cloud-Stand übernehmen, sobald nichts läuft (kein Roll, kein Match)
  applyRemote(remote, tries = 0) {
    if (SCREEN !== 'lobby' || ROLLST.busy || REVEAL.open || MATCH.mode) { if (tries < 40) setTimeout(() => this.applyRemote(remote, tries + 1), 1500); return; }
    if (remote.savedAt <= (S.savedAt || 0)) return;
    replaceSave(remote); closeAllModals(); renderLobby(); updateLuckUI();
    const ni = $('#nameInput'); if (ni) ni.value = S.name;
    toast('Spielstand geladen', 'good');
  },
  queue() { if (!this.ref) return; this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), Math.max(2500, 10000 - (Date.now() - this.last))); },
  async flush() {
    if (!this.ref) return; if (this.busy) { this.dirty = true; return; }
    this.busy = true; this.dirty = false; clearTimeout(this.timer); this.last = Date.now();
    try { await this.ref.set({ v: 1, t: S.savedAt || Date.now(), s: JSON.stringify(S) }); this.state = 'cloud'; }
    catch (e) {
      if (e && e.code === 'unavailable' && !this._retry) { this._retry = true; setTimeout(() => { this._retry = false; this.queue(); }, 1500 + Math.random() * 1500); }
      else if (e && (e.code === 'revoked' || e.code === 'not_granted')) { this.ref = null; this.state = 'local'; }
    }
    this.busy = false;
    if (this.dirty) this.queue();
  },
};
// Export/Import als Code (Base64 von UTF-8-JSON)
function exportSaveCode() { const j = JSON.stringify(S); return 'AURA1:' + btoa(unescape(encodeURIComponent(j))); }
function importSaveCode(code) {
  try { const t = String(code || '').trim().replace(/^AURA1:/, ''); const d = JSON.parse(decodeURIComponent(escape(atob(t)))); if (!replaceSave(d)) return false; save(); return true; } catch (e) { return false; }
}
const ownedCount = () => Object.keys(S.owned).filter(k => AURA_BY_ID[k]).length;

  const from = +el.dataset.v; el.dataset.v = v;
  if (from === v) { el.textContent = fmt(v); return; }
  const pill = el.closest('.top-pill'); pill.classList.remove('up', 'down'); void pill.offsetWidth; pill.classList.add(v > from ? 'up' : 'down');
  cancelAnimationFrame(el._raf);

  const t0 = performance.now(), dur = clamp(Math.log10(Math.abs(v - from) + 1) * 280, 320, 1200);
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (v - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };

const TIP = {
  el: null, cur: null,
  init() {
    this.el = h('div', { class: 'tip', role: 'tooltip' }); document.body.appendChild(this.el);
    const find = e => e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const t = find(e); if (t) { if (t !== this.cur) this.show(t); } else if (this.cur && !this.cur.isConnected) this.hide(); });
    document.addEventListener('pointerout', e => { if (e.pointerType === 'touch') return; const t = find(e); if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) this.hide(); });
    document.addEventListener('pointerdown', e => {
      const t = find(e);
      if (e.pointerType === 'touch' && t && t.dataset.tipTap) { if (this.cur === t) this.hide(); else this.show(t); return; }
      if (!t || e.pointerType === 'touch') this.hide();

    document.addEventListener('focusin', e => { const t = find(e); if (t && t.matches(':focus-visible')) this.show(t); });

    e.classList.add('on'); this.place();
  },
  place() { // über dem Element, sonst darunter; beim Scrollen mitführen, außerhalb des Bildes ausblenden
    const t = this.cur, e = this.el; if (!t || !t.isConnected) { this.hide(); return; }
    const r = t.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) { this.hide(); return; }

// ---------- Hintergrundmusik: ruhige, live erzeugte Ambient-Musik (Lobby) bzw. etwas treibender (Arena) ----------
const MUSIC = {
  timer: null, next: 0, step: 0,
  start() { if (!this.timer) this.timer = setInterval(() => this.tick(), 100); },
  tick() {
    const c = AU.ctx; if (!c || c.state !== 'running' || !S.sound || S.settings.music <= .001 || document.hidden) { this.next = 0; return; }
    const arena = SCREEN === 'arena', sd = arena ? 60 / 100 / 2 : 60 / 72 / 2;
    if (this.next < c.currentTime) this.next = c.currentTime + .08;
    while (this.next < c.currentTime + .35) { this.play(this.next, arena, sd); this.next += sd; this.step++; }
  },
  play(t, arena, sd) {
    const PROG = arena ? [[110, [220, 261.6, 329.6, 392]], [87.3, [174.6, 220, 261.6, 329.6]], [98, [196, 246.9, 293.7, 392]], [82.4, [164.8, 196, 246.9, 329.6]]]
      : [[110, [220, 261.6, 329.6, 392, 493.9]], [87.3, [174.6, 220, 261.6, 329.6, 392]], [130.8, [261.6, 329.6, 392, 493.9]], [98, [196, 246.9, 293.7, 329.6, 440]]];
    const s = this.step % 32, [bass, ch] = PROG[Math.floor(this.step / 8) % 4], o = { out: AU.mus, delay: Math.max(0, t - AU.ctx.currentTime) };
    if (s % 8 === 0) for (const f of ch) for (const det of [-7, 7]) AU.tone(f, sd * 8.6, { ...o, type: arena ? 'sawtooth' : 'triangle', vol: arena ? .009 : .016, att: sd * 2.5, hold: .55, det, lp: arena ? 1100 : 1700 });
    if (arena ? s % 2 === 0 : s % 4 === 0) AU.tone(bass, arena ? sd * 1.6 : sd * 3.8, { ...o, type: 'sine', vol: arena ? .07 : .05, att: .02 });
    if (arena && s % 4 === 0) AU.tone(60, .22, { ...o, type: 'sine', slide: .5, vol: .09 });
    const arp = [0, 2, 1, 3, 2, 4, 1, 3];
    if (!arena || s % 2 === 1) { const f = ch[arp[s % 8] % ch.length] * 2; if (Math.random() < (arena ? .55 : .8)) AU.tone(f, arena ? .35 : .9, { ...o, type: 'sine', vol: arena ? .012 : .014, verb: 1, att: .01 }); }
  },
};

function openCollection() {

  const body = h('div');
  body.innerHTML = `<div class="coll-tools"><div class="row wrap" id="cChips"></div></div>
    <div class="coll-tools"><select class="sel" id="cSort"><option value="tierDesc">Seltenste zuerst</option><option value="tierAsc">Häufigste zuerst</option><option value="name">Name A–Z</option><option value="count">Meiste Exemplare</option><option value="role">Nach Rolle</option></select>
    <label class="row muted" style="font-size:13px;gap:6px;cursor:pointer"><input type="checkbox" class="switch" id="cOwned"> Nur erhaltene</label>
    <input class="search" id="cQ" placeholder="Aura oder Move suchen …"><div class="coll-sum" id="cSum"></div></div><div class="coll-grid" id="cGrid"></div>`;
  openModal('Aura-Sammlung', body);
  const chips = body.querySelector('#cChips');
  const mkChip = (t, label, col) => { const c = h('button', { class: 'chip' + (st.tier === t ? ' on' : ''), style: `--cc:${col};--ccg:${rgba(col, .4)}` }, label); c.onclick = () => { st.tier = st.tier === t ? -1 : t; drawChips(); draw(); }; chips.appendChild(c); };
  const drawChips = () => { chips.innerHTML = ''; mkChip(-1, 'Alle', '#7c8cff'); TIERS.forEach((T, i) => { const own = TIER_AURAS[i].filter(ai => S.owned[AURAS[ai].id]).length; mkChip(i, `${T.n} ${own}/${TIER_AURAS[i].length}`, T.c); }); };
  const draw = () => {
    let list = AURAS.slice();
    if (st.tier >= 0) list = list.filter(a => a.t === st.tier);
    if (st.owned) list = list.filter(a => S.owned[a.id]);
    if (st.q) { const q = st.q.toLowerCase(); list = list.filter(a => a.n.toLowerCase().includes(q) || a.moves.some(m => m.n.toLowerCase().includes(q)) || a.role.toLowerCase().includes(q)); }
    const cmp = { tierDesc: (a, b) => b.t - a.t || a.n.localeCompare(b.n), tierAsc: (a, b) => a.t - b.t || a.n.localeCompare(b.n), name: (a, b) => a.n.localeCompare(b.n), count: (a, b) => (S.owned[b.id] || 0) - (S.owned[a.id] || 0) || b.t - a.t, role: (a, b) => a.role.localeCompare(b.role) || b.t - a.t }[st.sort];

/* ---------- Braukessel: Tränke aus Duplikaten brauen ----------

const RECIPES = [

  { id: 'r_luck1', out: 'luck1', n: 1, rk: 1, ing: [{ pot: 'klee', n: 1 }, { dup: 0, n: 4 }, { dust: 20 }] },
  { id: 'r_himmel', out: 'himmel', n: 1, rk: 2, ing: [{ pot: 'klee', n: 3 }, { dup: 2, n: 2 }, { dust: 60 }] },
  { id: 'r_luck3', out: 'luck3', n: 1, rk: 2, ing: [{ pot: 'luck1', n: 2 }, { dup: 1, n: 3 }, { dust: 80 }] },
  { id: 'r_prisma', out: 'prisma', n: 1, rk: 2, ing: [{ pot: 'fokus', n: 1 }, { dup: 2, n: 3 }, { dust: 120 }] },
  { id: 'r_komet', out: 'komet', n: 1, rk: 3, ing: [{ pot: 'luck3', n: 1 }, { pot: 'elixier', n: 1 }, { dup: 3, n: 2 }, { dust: 350 }] },
  { id: 'r_seele', out: 'seele', n: 1, rk: 3, ing: [{ pot: 'himmel', n: 1 }, { dup: 4, n: 2 }, { dust: 500 }] },
  { id: 'r_mythos', out: 'mythos', n: 1, rk: 4, ing: [{ pot: 'komet', n: 2 }, { dup: 5, n: 1 }, { dust: 1200 }] },
  { id: 'r_nektar', out: 'nektar', n: 1, rk: 5, ing: [{ pot: 'mythos', n: 1 }, { pot: 'goettlich', n: 1 }, { dup: 5, n: 2 }, { dust: 4000 }] },
  { id: 'r_urknall', out: 'urknall', n: 1, rk: 6, ing: [{ pot: 'seele', n: 1 }, { pot: 'nektar', n: 1 }, { dup: 6, n: 1 }, { dust: 12000 }] },
];
const RECIPE_FOR = Object.fromEntries(RECIPES.map(r => [r.out, r]));
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
function dupStacks(t) { return TIER_AURAS[t].map(i => AURAS[i]).map(a => ({ a, n: Math.max(0, (S.owned[a.id] || 0) - 1) })).filter(o => o.n > 0); }
function dupCount(t) { return dupStacks(t).reduce((s, o) => s + o.n, 0); }
// Größte Stapel zuerst – so bleibt die Sammlung möglichst vielfältig
function dupPick(t, n) {
  const st = dupStacks(t), use = new Map();
  for (let k = 0; k < n; k++) { let b = null; for (const o of st) if (o.n > 0 && (!b || o.n > b.n)) b = o; if (!b) return null; b.n--; use.set(b.a, (use.get(b.a) || 0) + 1); }
  return [...use].map(([a, c]) => ({ a, n: c }));
}
const ingHave = g => g.dust !== undefined ? S.dust : g.pot ? (S.potions[g.pot] || 0) : dupCount(g.dup);
const ingNeed = g => g.dust !== undefined ? g.dust : g.n;
const craftMax = r => Math.min(...r.ing.map(g => Math.floor(ingHave(g) / ingNeed(g))));

function craft(r, times = 1) {
  let done = 0;
  for (; done < times && craftMax(r) > 0; done++) {
    for (const g of r.ing) {
      if (g.dust !== undefined) S.dust -= g.dust;
      else if (g.pot) S.potions[g.pot] -= g.n;
      else for (const u of dupPick(g.dup, g.n)) S.owned[u.a.id] -= u.n;
    }
    S.potions[r.out] = (S.potions[r.out] || 0) + r.n;
  }
  if (!done) { AU.play('error'); toast('Dafür fehlen noch Zutaten.', 'bad'); return 0; }
  S.stats.brewed = (S.stats.brewed || 0) + done; save(); AU.play('brew', 1, r.rk);
  toast(`${POT[r.out].n} gebraut${done * r.n > 1 ? ` (×${done * r.n})` : ''}!`, 'good');
  return done;
}
function potFx(p) {
  if (p.add) return [`Glück +${fmt(p.add * 100)} %`, `Dauer ${fmtTime(p.dur)} Min.`];
  if (p.once) return [`Nächster Roll: Glück ×${p.once}`];
  return [`${p.bonus} Bonus-Rolls`, 'je Glück ×2'];
}
// Kleiner animierter Braukessel im Kopf des Menüs
function kesselAnim(cv) {

    if (w && hh) {

      const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, hh);

      x.fillStyle = '#151a2e'; x.fillRect(cx - R * .62, by + R * .62, R * .14, R * .32); x.fillRect(cx + R * .48, by + R * .62, R * .14, R * .32);
      x.beginPath(); x.moveTo(cx - R, by); x.bezierCurveTo(cx - R * 1.05, by + R * .95, cx + R * 1.05, by + R * .95, cx + R, by); x.closePath();
      const bg = x.createLinearGradient(cx - R, 0, cx + R, 0); bg.addColorStop(0, '#0d1122'); bg.addColorStop(.35, '#2a3152'); bg.addColorStop(1, '#0b0e1c');
      x.fillStyle = bg; x.fill(); x.strokeStyle = '#46507a'; x.lineWidth = 1.5; x.stroke();
      x.beginPath(); x.ellipse(cx, by, R * .9, R * .2, 0, 0, TAU); x.fillStyle = base; x.globalAlpha = 1 - st.k; x.fill(); x.fillStyle = st.col; x.globalAlpha = st.k; x.fill(); x.globalAlpha = 1;
      x.fillStyle = 'rgba(255,255,255,.18)'; x.beginPath(); x.ellipse(cx - R * .25, by - R * .05, R * .3, R * .06, 0, 0, TAU); x.fill();
      x.beginPath(); x.ellipse(cx, by, R * 1.04, R * .26, 0, 0, TAU); x.lineWidth = R * .1; x.strokeStyle = '#3a4369'; x.stroke(); x.lineWidth = 1; x.strokeStyle = '#7883b5'; x.stroke();
      if (Math.random() < dt * (5 + st.k * 20)) st.bub.push({ x: cx + rand(-.7, .7) * R, y: by + rand(-.08, .08) * R, r: 0, m: rand(2, 5 + st.k * 3), col: st.k > Math.random() ? st.col : base });
      for (const b of st.bub) b.r += dt * 9;
      st.bub = st.bub.filter(b => b.r < b.m);
      for (const b of st.bub) { x.strokeStyle = rgba(b.col, .9 * (1 - b.r / b.m)); x.lineWidth = 1.4; circ(x, b.x, b.y - b.r * .6, b.r); x.stroke(); }
      if (Math.random() < dt * (3 + st.k * 30)) st.sp.push({ x: cx + rand(-.6, .6) * R, y: by - R * .1, vy: -rand(14, 40 + st.k * 50), vx: rand(-8, 8), life: rand(.8, 1.6), col: st.k > Math.random() ? st.col : '#c6ccff' });
      x.globalCompositeOperation = 'lighter';
      for (const p of st.sp) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; glow(x, p.col, p.x, p.y, 5, clamp(p.life, 0, 1)); }
      st.sp = st.sp.filter(p => p.life > 0 && p.y > -10);

        const r = st.rise; r.t += dt; const k = clamp(r.t / 1.4, 0, 1), y = by - R * .2 - easeOut(k) * R * .9, s = R * .7 * (1 + k * .2);

    brew(p) {

      const w = cv.clientWidth, hh = cv.clientHeight, cx = w / 2, by = hh * .48;
      for (let i = 0; i < 26; i++) { const an = -Math.PI / 2 + rand(-1, 1); st.sp.push({ x: cx, y: by - 6, vx: Math.cos(an) * rand(20, 90), vy: Math.sin(an) * rand(40, 120), life: rand(.6, 1.3), col: Math.random() < .7 ? p.col : '#ffffff' }); }

/* =====================================================================
   ROLLEN: Band-Animation (wie das Kisten-Öffnen in CS2) + Enthüllung
   ===================================================================== */
const STRIP = { c: null, x: null, items: [], off: 0, IW: 112, anim: null, idle: true, lastIdx: -1, glow: 0, winIdx: -1, names: new Map() };
const UIFONT = '"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function stripName(x, n, maxW) { // Namen vollständig oder sauber mit Auslassungspunkten
  const k = n + '|' + maxW + '|' + x.font; let v = STRIP.names.get(k); if (v) return v;
  v = n; if (x.measureText(v).width > maxW) { while (v.length > 1 && x.measureText(v + '…').width > maxW) v = v.slice(0, -1); v = v.trimEnd() + '…'; }
  if (STRIP.names.size > 600) STRIP.names.clear(); STRIP.names.set(k, v); return v;
}
const ROLLST = { busy: false, res: null };
function initStrip() { STRIP.c = $('#stripC'); STRIP.x = STRIP.c.getContext('2d'); STRIP.items = Array.from({ length: 60 }, () => rollAura(3)); }
function drawStrip(dt) {

  if (c.width !== Math.round(w * d) || c.height !== Math.round(hh * d)) { c.width = Math.round(w * d); c.height = Math.round(hh * d); }
  const x = STRIP.x, IW = STRIP.IW = clamp(Math.round(hh * 0.78), 86, 118);

  if (STRIP.anim) {
    const A = STRIP.anim; A.t += dt; const p = clamp(A.t / A.dur, 0, 1);
    STRIP.off = A.from + (A.to - A.from) * (1 - Math.pow(1 - p, A.k));
    const idx = Math.floor((STRIP.off + w / 2) / IW);
    if (idx !== STRIP.lastIdx) { STRIP.lastIdx = idx; const v = A.k * Math.pow(1 - p, A.k - 1) * (A.to - A.from) / A.dur; AU.play('tick', 1, clamp(1 - v / 5000, 0, 1)); }
    if (p >= 1) { STRIP.anim = null; onStripStop(); }
  } else if (STRIP.idle) {
    STRIP.off += dt * (UI.calm ? 0 : 24);
    if (STRIP.off > IW * 30) { STRIP.off -= IW * 15; STRIP.items = STRIP.items.slice(15).concat(Array.from({ length: 15 }, () => rollAura(3))); }
  }
  if (STRIP.glow > 0 && !ROLLST.busy) STRIP.glow = Math.max(0, STRIP.glow - dt * 2);
  const cw = IW - 10, ch = hh - 30, top = 15;
  const first = Math.max(0, Math.floor(STRIP.off / IW) - 1), last = Math.min(STRIP.items.length - 1, Math.ceil((STRIP.off + w) / IW) + 1);
  for (let i = first; i <= last; i++) {
    const ai = STRIP.items[i]; if (ai === undefined) continue;
    const a = AURAS[ai], T = TIERS[a.t], cx = i * IW - STRIP.off + 5;
    const win = i === STRIP.winIdx && STRIP.glow > 0;
    x.save();
    if (win) { x.shadowColor = T.c; x.shadowBlur = 30 + Math.sin(performance.now() / 120) * 10; }
    const g = x.createLinearGradient(0, top, 0, top + ch); g.addColorStop(0, '#151b38'); g.addColorStop(1, mix('#151b38', a.t >= 7 ? a.c1 : T.c, .28));
    x.fillStyle = g; rr(x, cx, top, cw, ch, 12); x.fill(); x.shadowBlur = 0;
    x.strokeStyle = rgba(T.c, win ? .95 : .4); x.lineWidth = win ? 2.5 : 1.2; x.stroke();
    x.save(); rr(x, cx, top, cw, ch, 12); x.clip();
    if (a.t >= 7) { for (let k = 0; k < 8; k++) { x.fillStyle = `hsl(${(k * 45 + performance.now() / 8) % 360},90%,62%)`; x.fillRect(cx + k * cw / 8, top + ch - 5, cw / 8 + 1, 5); } }
    else { x.fillStyle = T.c; x.fillRect(cx, top + ch - 5, cw, 5); }
    x.restore();
    const s = Math.min(cw - 16, ch - 36); x.drawImage(auraIconCanvas(ai, 128), cx + (cw - s) / 2, top + 6, s, s);
    x.font = `600 12px ${UIFONT}`; x.textAlign = 'center'; x.fillStyle = win ? '#fff' : '#d3d9f3';
    x.fillText(stripName(x, a.n, cw - 12), cx + cw / 2, top + ch - 14);

}

  const cols = [T.c, a.c1, a.c2v, '#ffffff'];
  for (let i = 0; i < n; i++) { const an = rand(TAU), sp = rand(80, 260 + t * 120); RFX.parts.push({ x: cx, y: cy, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: rand(.9, 1.8 + t * .2), max: 2.4 + t * .2, col: t >= 7 ? `hsl(${rand(360)},95%,65%)` : pick(cols), s: rand(1.5, 3.5 + t * .35), g: t >= 5 ? 40 : 70, star: t >= 4 && Math.random() < .3 }); }
  const rings = t >= 6 ? 4 : t >= 3 ? 2 : 1;
  for (let k = 0; k < rings; k++) RFX.rings.push({ x: cx, y: cy, r: 10, spd: 700 + k * 350 + t * 60, d: k * .14, w: 4 + t, col: t >= 7 ? null : (k % 2 ? a.c1 : T.c), life: 1.4 });
  if (t >= 7) { RFX.stars = Array.from({ length: Math.round(260 * Math.min(1, FX.part)) }, () => ({ a: rand(TAU), r: rand(40, Math.max(w, hh)), s: rand(.5, 2.2), tw: rand(TAU) })); }
}
function drawRFX(dt) {
  const c = RFX.c; if (!c) return;
  const active = RFX.parts.length || RFX.rings.length || RFX.charge || (REVEAL.open && RFX.tier >= 5);
  if (!active) { if (RFX.dirty) { RFX.x.setTransform(1, 0, 0, 1, 0, 0); RFX.x.clearRect(0, 0, c.width, c.height); RFX.dirty = false; } return; }
  RFX.dirty = true;
  const d = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, hh = innerHeight;
  if (c.width !== Math.round(w * d) || c.height !== Math.round(hh * d)) { c.width = Math.round(w * d); c.height = Math.round(hh * d); }
  const x = RFX.x; x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, hh);
  const cx = w / 2, cy = hh * .36;
  x.save(); x.globalCompositeOperation = 'lighter';
  if (RFX.charge) {
    const ch = RFX.charge; ch.t += dt; const k = clamp(ch.t / ch.dur, 0, 1);
    for (let i = 0; i < (6 + k * 14) * FX.part; i++) { const an = rand(TAU), r = Math.max(w, hh) * .6; RFX.parts.push({ x: cx + Math.cos(an) * r, y: cy + Math.sin(an) * r, vx: -Math.cos(an) * r * 1.6, vy: -Math.sin(an) * r * 1.6, life: .55, max: .55, col: ch.col, s: rand(1.5, 3), g: 0, inward: 1 }); }
    glow(x, ch.col, cx, cy, 40 + k * 200, .5 + k * .5); glow(x, '#ffffff', cx, cy, 10 + k * 60, k);
  }
  if (REVEAL.open && RFX.tier >= 7) {
    const tt = performance.now() / 1000;
    for (const s of RFX.stars) { const an = s.a + tt * .05 * (s.r < 300 ? 2 : 1); x.fillStyle = `rgba(255,255,255,${.35 + .35 * Math.sin(tt * 3 + s.tw)})`; x.fillRect(cx + Math.cos(an) * s.r, cy + Math.sin(an) * s.r * .7, s.s, s.s); }
    if (RFX.tier >= 8) for (let i = 0; i < 3; i++) { x.strokeStyle = `hsla(${(tt * 80 + i * 120) % 360},95%,65%,.35)`; x.lineWidth = 3; circ(x, cx, cy, 170 + i * 40 + Math.sin(tt * 2 + i) * 12); x.stroke(); }
  }
  if (REVEAL.open && RFX.tier >= 5 && Math.random() < (.5 + RFX.tier * .05) * FX.part) { const an = rand(TAU), r = rand(120, 260); RFX.parts.push({ x: cx + Math.cos(an) * r, y: cy + Math.sin(an) * r, vx: 0, vy: -rand(20, 60), life: 1.2, max: 1.2, col: RFX.tier >= 7 ? `hsl(${rand(360)},95%,70%)` : TIERS[RFX.tier].c, s: rand(1.5, 3), g: 0, star: true }); }
  for (const p of RFX.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (!p.inward) { p.vx *= 1 - 1.4 * dt; p.vy = p.vy * (1 - 1.4 * dt) + p.g * dt; } }
  RFX.parts = RFX.parts.filter(p => p.life > 0); if (RFX.parts.length > 1600) RFX.parts.splice(0, RFX.parts.length - 1600);
  for (const p of RFX.parts) {
    const k = clamp(p.life / p.max * 1.6, 0, 1);
    if (p.col[0] === '#') glow(x, p.col, p.x, p.y, p.s * 5, k * .7);
    x.fillStyle = p.col; x.globalAlpha = k;
    if (p.star) { x.save(); x.translate(p.x, p.y); starP(x, 4, p.s * 2.2, p.s * .5); x.fill(); x.restore(); } else { circ(x, p.x, p.y, p.s); x.fill(); }
    x.globalAlpha = 1;
  }
  for (const r of RFX.rings) {
    r.d -= dt; if (r.d > 0) continue; r.life -= dt; r.r += r.spd * dt; r.spd *= 1 - 1.2 * dt;
    const k = clamp(r.life / 1.4, 0, 1);
    if (r.col) { x.strokeStyle = rgba(r.col, k * .9); x.lineWidth = r.w * k + 1; circ(x, cx, cy, r.r); x.stroke(); }
    else rainbowRing(x, cx, cy, r.r, r.w * k + 1, performance.now() / 400, 36, k);
  }
  RFX.rings = RFX.rings.filter(r => r.life > 0);
  x.restore();
}

/* ---------- Lebendiger Sternenhimmel in der Lobby ----------
   Driftende Sterne, aufsteigende Lichtpartikel und ein langsam pulsierender Verlauf im Farbton der
   ausgerüsteten Aura, dazu ein Lichtschein hinter dem Roll-Button. Bei „Weniger Bewegung“ steht alles still. */
const BG = { c: null, x: null, stars: [], motes: [], t: 0, tint: [154, 166, 255], tintTo: [154, 166, 255], focus: null, fT: 0 };
function initBg() {
  BG.c = $('#bgc'); BG.x = BG.c.getContext('2d');
  BG.stars = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), z: rand(.2, 1), tw: rand(TAU) }));
  BG.motes = Array.from({ length: 42 }, () => ({ x: Math.random(), y: Math.random(), z: rand(.3, 1), ph: rand(TAU), sp: rand(.006, .02) }));
}
function bgFocus() { const b = $('#rollBtn'); if (!b || !b.offsetWidth) return null; const r = b.getBoundingClientRect(), c = BG.c.getBoundingClientRect(); return [r.left + r.width / 2 - c.left, r.top + r.height / 2 - c.top, r.width]; }
function drawBg(dt) {
  BG.acc = (BG.acc || 0) + dt; if (BG.acc < 1 / 21 && BG.drawn) return; dt = Math.min(.1, BG.acc); BG.acc = 0; BG.drawn = true; // 20 fps genügen für die langsame Drift und sparen die meisten Neuberechnungen der Glas-Unschärfe
  const c = BG.c, d = Math.min(1.5, window.devicePixelRatio || 1), w = c.clientWidth, hh = c.clientHeight; if (!w) return;
  if (c.width !== Math.round(w * d) || c.height !== Math.round(hh * d)) { c.width = Math.round(w * d); c.height = Math.round(hh * d); }
  if (!UI.calm) BG.t += dt;
  const x = BG.x, t = BG.t; x.setTransform(d, 0, 0, d, 0, 0);
  const k = Math.min(1, dt * 1.2); for (let i = 0; i < 3; i++) BG.tint[i] += (BG.tintTo[i] - BG.tint[i]) * k;
  const [tr, tg, tb] = BG.tint.map(Math.round), tint = a => `rgba(${tr},${tg},${tb},${a})`;
  if ((BG.fT -= dt) <= 0) { BG.fT = .4; BG.focus = bgFocus(); }
  x.fillStyle = '#070a14'; x.fillRect(0, 0, w, hh);
  x.globalCompositeOperation = 'lighter';
  const M = Math.max(w, hh), pulse = UI.calm ? .5 : .5 + .5 * Math.sin(t * TAU / 3.2);
  glow(x, '#3b2a8a', w * (.22 + Math.sin(t * .05) * .05), hh * .28, M * .55, .32);
  if (FX.glow) { glow(x, '#0e5a8a', w * (.8 + Math.cos(t * .04) * .05), hh * .78, M * .5, .28); glow(x, '#7a1f6a', w * .55, hh * (.08 + Math.sin(t * .03) * .05), M * .34, .16); }
  let g = x.createRadialGradient(w * .5, hh * 1.08, 0, w * .5, hh * 1.08, M * .78);
  g.addColorStop(0, tint(.15 + .05 * pulse)); g.addColorStop(1, tint(0)); x.fillStyle = g; x.fillRect(0, 0, w, hh);
  if (BG.focus) {
    const [fx, fy, fr] = BG.focus, R = Math.max(fr * 2.3, 260);
    g = x.createRadialGradient(fx, fy, 0, fx, fy, R); g.addColorStop(0, tint(.2 + .08 * pulse)); g.addColorStop(.45, tint(.07 + .03 * pulse)); g.addColorStop(1, tint(0));
    x.fillStyle = g; x.fillRect(fx - R, fy - R, R * 2, R * 2);
  }
  const ns = Math.round(BG.stars.length * Math.min(1, .35 + .65 * FX.part)), nm = Math.round(BG.motes.length * Math.min(1, FX.part));
  for (let i = 0; i < ns; i++) { const s = BG.stars[i], y = (s.y * hh + t * 6 * s.z) % hh, a = .25 + .45 * (Math.sin(t * 1.3 + s.tw) * .5 + .5) * s.z; x.fillStyle = `rgba(200,215,255,${a})`; x.fillRect(s.x * w, y, s.z * 1.8, s.z * 1.8); }
  for (let i = 0; i < nm; i++) {
    const m = BG.motes[i], y = (((m.y - t * m.sp) % 1) + 1) % 1, px = (m.x + Math.sin(t * .3 + m.ph) * .015) * w, py = y * hh;
    const a = (.18 + .22 * (Math.sin(t * 1.1 + m.ph) * .5 + .5)) * m.z * Math.min(1, y * 4, (1 - y) * 4), r = 1.2 + m.z * 2.2;
    x.fillStyle = tint(a * .45); circ(x, px, py, r * 3); x.fill(); x.fillStyle = `rgba(255,255,255,${a})`; circ(x, px, py, r * .6); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   HAUPTSCHLEIFE & START
   ===================================================================== */
let lastFrame = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  const raw = (now - lastFrame) / 1000, dt = Math.min(0.05, raw); lastFrame = now;
  try {
    tickBoosts(dt);
    if (SCREEN === 'lobby') { drawBg(dt); drawStrip(dt); lobbyPerf(raw); uiT -= dt; if (uiT <= 0) { uiT = 0.25; updateLuckUI(); } }
    else if (SCREEN === 'arena') arenaFrame(dt);
    for (const p of PREVIEWS) p.frame(dt);
    drawRFX(dt);
    if (CS.on) CS.frame(Math.min(0.1, raw)); // Cutscene in Echtzeit, damit sie auch bei wenig FPS gleich lang bleibt
    saveT -= dt; if (saveT <= 0) { saveT = 5; if (S.boosts.length) save(); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function init() {
  fillIcons();
  RD.c = $('#gc'); RD.x = RD.c.getContext('2d'); RFX.c = $('#fxc'); RFX.x = RFX.c.getContext('2d');
  setupArenaInput(); initStrip(); initBg(); initLobbyUI(); applySettings(); MUSIC.start();
  const ni = $('#nameInput'); ni.value = S.name;
  ni.addEventListener('input', () => { const sn = $('#sName'); if (sn) sn.value = ni.value; });
  ni.addEventListener('change', () => { commitName(ni.value); ni.value = S.name; });
  syncSoundUI(); $('#soundBtn').onclick = () => setSound(!S.sound);
  $('#setBtn').onclick = () => openSettings();
  FS.init();
  const qt = $('#quickT'); qt.checked = !!S.quick; qt.onchange = () => { S.quick = qt.checked; save(); };
  $('#autoT').onchange = e => { if (e.target.checked && !ROLLST.busy && !REVEAL.open) doRoll(); };
  $('#rollBtn').onclick = doRoll;
  $('#collBtn').onclick = openCollection; $('#shopBtn').onclick = openShop; $('#craftBtn').onclick = () => openCraft(); $('#oddsBtn').onclick = openOdds; $('#helpBtn').onclick = openHelp;
  $('#trBtn').onclick = openTraining; $('#mpBtn').onclick = () => openMP();
  $('#leaveBtn').onclick = () => {
    if (MATCH.mode === 'client') { if (MATCH.ended || confirm('Match verlassen? Du verlässt damit auch den Raum.')) { netLeave(); leaveArena(); } }
    else if (MATCH.mode === 'host') { if (MATCH.ended || confirm('Match beenden? Alle Spieler kehren in den Raum zurück.')) { leaveArena(); openMP(); } }
    else if (MATCH.ended || confirm('Training abbrechen?')) leaveArena();
  };
  const relayout = () => { if (SCREEN === 'arena') checkArenaSize(); };
  addEventListener('resize', relayout); addEventListener('orientationchange', () => setTimeout(relayout, 60));
  if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
  addEventListener('pointerdown', () => AU.init(), { once: false, passive: true });
  addEventListener('keydown', e => {
    if (CS.on && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); if (!e.repeat) CS.skip(); return; }
    if (REVEAL.open && (e.code === 'Enter' || e.code === 'Space') && REVEAL.el) { e.preventDefault(); if (!e.repeat) closeReveal(); return; }
    const tg = e.target;
    if (SCREEN === 'lobby' && !MODALS.length && e.code === 'Space' && (tg === document.body || (tg.closest && tg.closest('#lobby') && !tg.matches('input, textarea, select') && !UI.kbNav))) { e.preventDefault(); doRoll(); }
  });
  addEventListener('beforeunload', () => { save(); CLOUD.flush(); if (NET.role === 'client') NET.tr && NET.tr.send({ t: 'leave' }); if (NET.role === 'host') NET.tr && NET.tr.broadcast({ t: 'reject', reason: 'Der Host hat das Spiel geschlossen.' }); });
  renderLobby(); lobbyEnter();
  CLOUD.init();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); CLOUD.flush(); if (CS.on) CS.end(.2); } });
  const jc = new URLSearchParams(location.search).get('join');
  if (jc) setTimeout(() => { if (S.equipped) openMP(jc.toUpperCase()); else toast('Rolle zuerst eine Aura, dann kannst du dem Spiel ' + jc.toUpperCase() + ' beitreten.'); }, 400);
  requestAnimationFrame(frame);
}
init();
</script>
