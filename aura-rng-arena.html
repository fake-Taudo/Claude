<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aura RNG Arena</title>
<meta name="description" content="Aura-Rolling-Kampfspiel: Rolle seltene Auren, sammle sie und kämpfe mit ihren einzigartigen Movesets im Training oder im Echtzeit-Multiplayer.">
<meta name="theme-color" content="#070a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Aura RNG">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.45' stop-color='%237c8cff'/%3E%3Cstop offset='1' stop-color='%237c8cff' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   AURA RNG ARENA – Stil: flaches Vektordesign mit Glow-Effekten
   ===================================================================== */
/* Schriften liegen selbst gehostet neben der Seite (assets/fonts, SIL Open Font License) – keine Verbindung
   zu Servern Dritter. Fehlen die Dateien (z. B. bei einer einzeln heruntergeladenen HTML), greifen Systemschriften. */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/fonts/inter-latin-wght.woff2") format("woff2")}
@font-face{font-family:"Exo 2";font-style:normal;font-weight:600 800;font-display:swap;src:url("assets/fonts/exo2-latin-wght.woff2") format("woff2")}
:root{
  --bg:#070a14; --bg2:#0b1022; --panel:rgba(16,22,44,.74); --panel2:rgba(22,30,60,.66);
  --line:rgba(140,160,235,.16); --line2:rgba(140,160,235,.28);
  --text:#eef1ff; --muted:#9ba4c9; --dim:#646d92;
  --accent:#7c8cff; --accent2:#3ee6ff; --gold:#fbbf24; --danger:#ff4d6d; --ok:#4ade80;
  --r:16px; --r2:12px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Exo 2","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:rgba(124,140,255,.4)}
#app{position:fixed;inset:0;overflow:hidden}
#app.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
#app.shake2{animation:shake2 .9s cubic-bezier(.36,.07,.19,.97) both}
/* Wackeln skaliert mit der Screenshake-Einstellung (--shk) */
@keyframes shake{10%,90%{transform:translate(calc(var(--shk,1) * -2px),calc(var(--shk,1) * 1px))}20%,80%{transform:translate(calc(var(--shk,1) * 4px),calc(var(--shk,1) * -2px))}30%,50%,70%{transform:translate(calc(var(--shk,1) * -6px),calc(var(--shk,1) * 3px))}40%,60%{transform:translate(calc(var(--shk,1) * 6px),calc(var(--shk,1) * -3px))}}
@keyframes shake2{10%,90%{transform:translate(calc(var(--shk,1) * -4px),calc(var(--shk,1) * 3px)) rotate(calc(var(--shk,1) * -.3deg))}20%,80%{transform:translate(calc(var(--shk,1) * 8px),calc(var(--shk,1) * -5px)) rotate(calc(var(--shk,1) * .4deg))}30%,50%,70%{transform:translate(calc(var(--shk,1) * -12px),calc(var(--shk,1) * 6px)) rotate(calc(var(--shk,1) * -.5deg))}40%,60%{transform:translate(calc(var(--shk,1) * 12px),calc(var(--shk,1) * -6px)) rotate(calc(var(--shk,1) * .5deg))}}
#bgc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
@supports (height:100dvh){html,body{height:100dvh}}
.screen{position:absolute;inset:0;display:none;z-index:1}
.screen.active{display:block}
.hidden{display:none!important}

/* ---------- Gestaltungs-Tokens (Abstände, Rundungen, Glas, Akzent der ausgerüsteten Aura) ---------- */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --ac:#7c8cff;--acl:#9aa6ff;--ac-rgb:154,166,255;
  --glass:linear-gradient(180deg,rgba(24,31,62,.64),rgba(11,15,34,.6));
  --glass-line:rgba(170,185,255,.13);--glass-line2:rgba(170,185,255,.24);
  --chip:linear-gradient(180deg,rgba(30,38,76,.72),rgba(14,19,40,.72));
  --pp:20px;--gap:24px;
  --prev-h:clamp(190px,25vh,280px);--mm-h:46px;--mode-h:94px;--strip-h:clamp(140px,17vh,172px);--rb:clamp(190px,25vh,250px);
  --ease:cubic-bezier(.2,.8,.2,1);
}

/* ---------- Kopfzeile ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:68px;padding:12px var(--gap);border-bottom:1px solid var(--glass-line);background:linear-gradient(180deg,rgba(8,11,24,.9),rgba(8,11,24,.55));backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);position:relative;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--ac-rgb),.6),transparent);transition:background .6s}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-orb{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 12%,var(--acl) 34%,rgba(var(--ac-rgb),0) 72%);box-shadow:0 0 24px rgba(var(--ac-rgb),.7),0 0 4px #fff inset;animation:orb 4s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.08);opacity:.85}}
.brand h1{font-family:var(--display);font-size:22px;letter-spacing:.22em;font-weight:800;line-height:1;background:linear-gradient(90deg,#fff,#c5ccff 50%,#8ef6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h1 span{color:var(--accent2);-webkit-text-fill-color:var(--accent2)}
.brand small{display:block;font-size:12px;letter-spacing:.52em;color:var(--muted);text-transform:uppercase;margin-top:5px;font-weight:600}
.top-stats{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;justify-content:flex-end}
.top-pill{height:40px;display:inline-flex;align-items:center;gap:9px;padding:0 14px 0 8px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);font-size:14px;color:var(--muted);white-space:nowrap;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.top-pill:hover{border-color:rgba(var(--ac-rgb),.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(var(--ac-rgb),.25);transform:translateY(-1px)}
.top-pill .pi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:#cdd4ff;flex:none}
.top-pill .pi svg{width:15px;height:15px}
.top-pill b{font-family:var(--display);font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.top-pill .tpl{font-size:12.5px;letter-spacing:.04em}
.dust-pill .pi{color:#7ef3ff;background:rgba(62,230,255,.13);box-shadow:0 0 12px rgba(62,230,255,.35)}
.dust-pill.up{animation:dustUp 1.2s var(--ease)}
.dust-pill.up b{animation:dustTxt 1.2s var(--ease)}
.dust-pill.down{animation:dustDown .9s var(--ease)}
@keyframes dustUp{15%{border-color:#7ef3ff;box-shadow:0 0 24px rgba(62,230,255,.65),inset 0 0 14px rgba(62,230,255,.25);transform:scale(1.06)}}
@keyframes dustTxt{15%{color:#c8faff;text-shadow:0 0 14px #3ee6ff}}
@keyframes dustDown{15%{border-color:#fb7185;box-shadow:0 0 18px rgba(251,113,133,.45)}}
.coll-pill .cp{display:flex;flex-direction:column;gap:4px;min-width:96px}
.coll-pill .cp-top{display:flex;align-items:baseline;gap:6px;line-height:1}
.cp-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
.cp-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 8px rgba(62,230,255,.6);transition:width .9s var(--ease)}
.name-field{padding:0 5px 0 8px;cursor:text}
.name-field input{width:130px;height:30px;background:rgba(0,0,0,.3);border:1px solid var(--glass-line);border-radius:999px;padding:0 12px;outline:none;font-size:14px;font-weight:600;color:var(--text);transition:border-color .2s,box-shadow .2s}
.name-field input:focus{border-color:rgba(var(--ac-rgb),.8);box-shadow:0 0 0 3px rgba(var(--ac-rgb),.2)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--glass-line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.icon-btn:hover{border-color:rgba(var(--ac-rgb),.7);box-shadow:0 0 16px rgba(var(--ac-rgb),.4);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
/* Vollbild-Schalter (Lobby: Symbol + Text, Arena: Symbol neben „Verlassen“) */
.fs-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fs-btn svg{width:17px;height:17px;flex:none}
.fs-lobby{height:40px;padding:0 16px;border-radius:999px;background:linear-gradient(135deg,rgba(124,140,255,.26),rgba(62,230,255,.14));border:1px solid rgba(124,140,255,.55);font-size:14px;font-weight:700;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.fs-lobby:hover,.fs-lobby:focus-visible{border-color:var(--accent);box-shadow:0 0 18px rgba(124,140,255,.45);transform:translateY(-1px)}
.fs-lobby[aria-pressed="true"]{background:rgba(124,140,255,.3)}
.fs-arena{padding:0;width:34px}
.fs-btn.hidden{display:none}
@media (pointer:coarse){.arena-top .btn.small{min-height:36px}.fs-arena{width:42px}}
@media (max-width:560px){.fs-lobby span{display:none}.fs-lobby{width:40px;padding:0}}

/* ---------- Lobby-Raster und Glas-Panels ---------- */
.lobby-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.lobby-grid{flex:1;display:grid;grid-template-columns:clamp(300px,24vw,380px) minmax(0,1fr) clamp(300px,24vw,380px);gap:var(--gap);padding:var(--gap);min-height:0;position:relative;z-index:1}
.col{display:flex;flex-direction:column;gap:var(--s4);min-height:0;overflow:auto;padding:4px;margin:-4px;scrollbar-width:thin;scrollbar-color:#2a3360 transparent}
.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{background:#2a3360;border-radius:6px}
.panel{position:relative;padding:var(--pp);background:linear-gradient(180deg,rgba(22,28,58,.86),rgba(10,14,32,.84));border:1px solid var(--glass-line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -24px 48px rgba(0,0,0,.16),0 16px 40px rgba(0,0,0,.3)}
.panel::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(155deg,rgba(var(--ac-rgb),.55),rgba(var(--ac-rgb),0) 36%,rgba(255,255,255,0) 72%,rgba(var(--ac-rgb),.2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:background .6s}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:var(--s4);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#bcc4e6;font-weight:700;line-height:1}
.ph-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(var(--ac-rgb),.14);color:var(--acl);box-shadow:inset 0 0 0 1px rgba(var(--ac-rgb),.3);transition:color .6s,background .6s}
.ph-ic svg{width:16px;height:16px}
.ph-aside{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.equip-actions .ls{display:none}
.ph-aside b{color:var(--text);font-family:var(--display);font-weight:700}
.sub-h{margin:var(--s4) 0 var(--s3);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
.sub-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--glass-line2),transparent)}

/* Echtes Milchglas nur bei Maus-Bedienung (Desktop-GPU); Touch-Geräte und „Weniger Bewegung“ nutzen das dichtere Glas ohne Live-Unschärfe */
@media (pointer:fine){html[data-q="high"]:not(.calm):not(.lite) .panel{background:var(--glass);backdrop-filter:blur(12px) saturate(130%);-webkit-backdrop-filter:blur(12px) saturate(130%)}}
@media (pointer:coarse){.topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,rgba(8,11,24,.96),rgba(8,11,24,.86))}}

/* ---------- Ausgerüstete Aura ---------- */
.equip-panel{flex:1 0 auto;display:flex;flex-direction:column}
.equip-card{display:flex;flex-direction:column;gap:var(--s3);flex:1}
.equip-prev{position:relative;flex:1 1 auto;min-height:var(--prev-h);max-height:440px;border-radius:var(--r-md);overflow:hidden;isolation:isolate;background:radial-gradient(120% 80% at 50% 108%,rgba(var(--ac-rgb),.34),rgba(var(--ac-rgb),0) 62%),radial-gradient(circle at 50% 46%,rgba(var(--ac-rgb),.16),rgba(0,0,0,0) 60%),linear-gradient(180deg,rgba(8,10,22,.55),rgba(6,8,18,.85));border:1px solid rgba(var(--ac-rgb),.3);box-shadow:inset 0 0 44px rgba(var(--ac-rgb),.12),inset 0 1px 0 rgba(255,255,255,.07)}
.equip-prev::before{content:"";position:absolute;left:50%;top:50%;width:min(64%,var(--prev-h));aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(var(--ac-rgb),.4),rgba(var(--ac-rgb),0) 66%);animation:epPulse 3.2s ease-in-out infinite;z-index:-1;will-change:transform,opacity}
.equip-prev::after{content:"";position:absolute;left:50%;bottom:9%;width:56%;height:12%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(var(--ac-rgb),.5),rgba(var(--ac-rgb),0));z-index:-1}
.ep-ring{position:absolute;left:50%;top:50%;width:min(78%,calc(var(--prev-h) * 1.05));aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1px dashed rgba(var(--ac-rgb),.3);animation:spin 40s linear infinite;z-index:-1;will-change:transform}
@keyframes epPulse{50%{transform:translate(-50%,-50%) scale(1.16);opacity:.65}}
.equip-prev canvas{position:absolute;inset:0;width:100%;height:100%}
.ep-odds{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:999px;background:rgba(6,8,18,.6);border:1px solid var(--glass-line2);font-size:12px;font-weight:600;color:#c9d0ee;backdrop-filter:blur(6px)}
.ep-count{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:999px;background:rgba(6,8,18,.6);border:1px solid var(--glass-line2);font-size:12px;font-weight:700;color:#fff;backdrop-filter:blur(6px)}
.equip-head{display:flex;flex-direction:column;gap:10px}
.equip-name{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.02;overflow-wrap:anywhere}
.equip-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tier-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;background:rgba(0,0,0,.28);white-space:nowrap;box-shadow:0 0 12px -2px currentColor}
.role-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#c9d0ee;padding:4px 10px;border-radius:999px;border:1px solid var(--glass-line2);background:rgba(255,255,255,.04);letter-spacing:.02em}
.role-badge svg{width:13px;height:13px;opacity:.85}
.mini-moves{display:flex;flex-direction:column;gap:6px}
.mini-move{display:flex;align-items:center;gap:10px;min-height:var(--mm-h);padding:5px 10px 5px 5px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--glass-line);font-size:14px;font-weight:600;color:#e3e7ff;cursor:help;outline:none;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.mini-move:hover,.mini-move:focus-visible,.mini-move.tip-on{background:rgba(var(--ac-rgb),.1);border-color:rgba(var(--ac-rgb),.5);transform:translateX(3px)}
.mm-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.32);border:1px solid rgba(var(--ac-rgb),.28);flex:none}
.mm-ic canvas{width:26px;height:26px}
.mm-n{flex:1;min-width:0;line-height:1.2}
.mm-k{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.key{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#c9d0ee;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:2px 6px;flex:none;background:rgba(0,0,0,.3);min-width:24px;text-align:center}
.equip-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:auto;padding-top:var(--s1)}
.equip-actions .btn{min-height:40px}
.empty-equip{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 12px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}
.empty-equip .ee-orb{width:86px;height:86px;border-radius:50%;margin-bottom:8px;background:radial-gradient(circle,rgba(255,255,255,.9) 0 6%,rgba(124,140,255,.55) 22%,rgba(124,140,255,0) 68%);animation:epPulse2 2.6s ease-in-out infinite}
.empty-equip>b{font-family:var(--display);font-size:20px;color:var(--text)}
@keyframes epPulse2{50%{transform:scale(1.15);opacity:.7}}

/* ---------- Statistik ---------- */
.st-grid{display:grid;grid-template-columns:1fr 1fr 1.8fr;gap:8px}
.st-tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 12px 11px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--glass-line);overflow:hidden;min-width:0}
.st-tile::after{content:"";position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,var(--stc),transparent 70%);opacity:.14}
.st-top{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.st-ic{position:absolute;right:9px;top:9px;display:grid;color:var(--stc);opacity:.9}
.st-ic svg{width:15px;height:15px}
.st-tile b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.st-tile b.tier{font-size:16.5px;line-height:26px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px currentColor}

/* ---------- Roll-Bereich ---------- */
.roll-area{display:flex;flex-direction:column;align-items:center;gap:var(--s5);min-height:0;padding:4px 0 8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#2a3360 transparent}
.roll-area::-webkit-scrollbar{width:6px}.roll-area::-webkit-scrollbar-thumb{background:#2a3360;border-radius:6px}
.roll-area>:first-child{margin-top:auto}.roll-area>:last-child{margin-bottom:auto}
.roll-head{text-align:center}
.roll-title{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);font-weight:800;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;background:linear-gradient(90deg,#fff,#c9d0ff 50%,#8ef6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.roll-sub{font-size:14px;color:var(--muted);margin-top:6px;text-wrap:balance}
.strip-wrap{position:relative;width:100%;max-width:980px;height:var(--strip-h);flex:none;isolation:isolate}
.strip-wrap::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:20px;background:linear-gradient(180deg,rgba(10,14,30,.8),rgba(14,20,42,.88));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 40px rgba(0,0,0,.35);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
.strip-wrap canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
.strip-glow{position:absolute;inset:-28px -4%;z-index:-2;background:radial-gradient(48% 56% at 50% 50%,var(--glowc,rgba(124,140,255,.5)),transparent 72%);opacity:0;transition:opacity .5s;pointer-events:none}
.strip-wrap.glow .strip-glow{opacity:1}
.strip-marker{position:absolute;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);pointer-events:none;z-index:2}
.sm-line{position:absolute;left:50%;top:13px;bottom:13px;width:3px;transform:translateX(-50%);border-radius:3px;overflow:hidden;background:linear-gradient(180deg,#fff7c9,#fde047 30%,#f59e0b 70%,#fff7c9);box-shadow:0 0 10px #fde047,0 0 24px rgba(253,224,71,.6)}
.sm-line::after{content:"";position:absolute;left:0;right:0;height:34px;top:-34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));animation:smSweep 2.4s ease-in-out infinite}
.sm-t,.sm-b{position:absolute;left:50%;width:22px;height:13px;transform:translateX(-50%);background:linear-gradient(180deg,#fff7c9,#fbbf24);filter:drop-shadow(0 0 6px rgba(253,224,71,.85))}
.sm-t{top:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.sm-b{bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.strip-wrap.rolling .sm-line::after{animation-duration:.7s}
.strip-marker::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:16px;transform:translateX(-50%);border-radius:8px;background:radial-gradient(closest-side,rgba(253,224,71,.45),rgba(253,224,71,0));animation:smGlow 2.4s ease-in-out infinite}
.strip-wrap.rolling .strip-marker::before{animation-duration:.7s}
@keyframes smGlow{0%,100%{opacity:.35}50%{opacity:1}}

@keyframes smSweep{0%{top:-34px}65%,100%{top:100%}}
.roll-stage{--rbc:124,140,255;position:relative;width:var(--rb);height:var(--rb);display:grid;place-items:center;flex:none;margin:8px 0}
.roll-stage.bonus{--rbc:251,191,36}
.rs-halo{position:absolute;inset:-46%;border-radius:50%;background:radial-gradient(circle,rgba(var(--rbc),.34),rgba(var(--rbc),.09) 45%,transparent 68%);animation:breathe 3.2s ease-in-out infinite;pointer-events:none;will-change:transform,opacity}
.rs-orbit{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
.rs-orbit.o1{inset:-24px;border:1px dashed rgba(var(--rbc),.3);animation:spin 46s linear infinite}
.rs-orbit.o2{inset:-42px;border:1px solid rgba(var(--rbc),.1)}
.rs-orbit.o2::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(var(--rbc),1),0 0 4px #fff}
.rs-orbit.o2{animation:spin 12s linear infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.75}}
.roll-btn{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 50% 28%,#b4c0ff 0,#6575ff 30%,#353bb3 64%,#1a1c58 100%);border:2px solid rgba(255,255,255,.22);box-shadow:0 0 0 8px rgba(var(--rbc),.08),0 0 50px rgba(var(--rbc),.55),0 18px 50px rgba(0,0,0,.5),inset 0 -14px 34px rgba(0,0,0,.42),inset 0 8px 22px rgba(255,255,255,.3);transition:transform .25s var(--ease),box-shadow .3s,filter .3s;-webkit-tap-highlight-color:transparent}
.roll-btn::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 10px rgba(var(--rbc),.09),0 0 70px rgba(var(--rbc),.75);opacity:.3;animation:rbBreathe 3.2s ease-in-out infinite;pointer-events:none;will-change:opacity}
.roll-stage.bonus .roll-btn{background:radial-gradient(circle at 50% 28%,#fff3b8 0,#f8b931 34%,#b4650a 70%,#5a2c03 100%)}
.rb-clip{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.rb-clip::before{content:"";position:absolute;top:6%;left:20%;right:20%;height:34%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0))}
.rb-ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);animation:ripple .65s ease-out forwards}
@keyframes ripple{to{transform:scale(18);opacity:0}}
.rb-ring{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 0deg,rgba(var(--rbc),0) 0deg,rgba(var(--rbc),.95) 60deg,rgba(255,255,255,.95) 92deg,rgba(var(--rbc),0) 140deg,rgba(var(--rbc),0) 185deg,rgba(240,171,252,.9) 245deg,rgba(255,255,255,.9) 272deg,rgba(var(--rbc),0) 320deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));filter:drop-shadow(0 0 6px rgba(var(--rbc),.9));animation:spin 5s linear infinite;pointer-events:none;will-change:transform}
.rb-inner{position:relative;text-align:center;line-height:1;transition:opacity .2s,transform .25s var(--ease)}
.rb-label{display:block;font-family:var(--display);font-size:calc(var(--rb) * .16);font-weight:800;letter-spacing:.16em;padding-left:.16em;text-shadow:0 0 18px rgba(255,255,255,.7),0 2px 0 rgba(0,0,0,.25)}
.roll-btn small{display:block;margin-top:9px;font-size:clamp(11px,calc(var(--rb) * .06),13px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.88;white-space:nowrap}
.roll-btn:hover:not(:disabled){transform:scale(1.045);box-shadow:0 0 0 11px rgba(var(--rbc),.12),0 0 85px rgba(var(--rbc),.8),0 20px 50px rgba(0,0,0,.5),inset 0 -14px 34px rgba(0,0,0,.42),inset 0 8px 22px rgba(255,255,255,.36)}
.roll-btn:hover:not(:disabled) .rb-ring{animation-duration:2.2s}
.roll-btn:active:not(:disabled){transform:scale(.93);filter:brightness(1.18);transition-duration:.08s}
.roll-btn:focus-visible{outline:3px solid rgba(var(--rbc),.75);outline-offset:20px}
@keyframes rbBreathe{50%{opacity:1}}
.roll-btn.pulse:not(:disabled)::after{animation-duration:1.6s}
.roll-btn:disabled{cursor:wait;filter:saturate(.5) brightness(.78);transform:scale(.97)}
.roll-btn:disabled::after{animation:none;opacity:0}
.roll-btn:disabled .rb-inner{opacity:0;transform:scale(.85)}
.roll-btn:disabled .rb-ring{animation-duration:.9s;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.95) 110deg,rgba(255,255,255,0) 118deg)}
.rb-busy{position:absolute;display:flex;gap:8px;opacity:0;transition:opacity .2s}
.roll-btn:disabled .rb-busy{opacity:1}
.rb-busy i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:dots 1s ease-in-out infinite}
.rb-busy i:nth-child(2){animation-delay:.15s}.rb-busy i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
/* Glück, Bonus-Roll und aktive Boosts als Chips */
.status-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.s-chip{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 8px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:border-color .3s,box-shadow .3s}
.sc-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.sc-ic svg{width:18px;height:18px}
.sc-t{display:flex;flex-direction:column;gap:2px;line-height:1.1;white-space:nowrap}
.s-chip small{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.s-chip b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.02em;color:#fff}
.s-chip.luck .sc-ic{background:rgba(74,222,128,.15);color:#86efac;box-shadow:0 0 14px rgba(74,222,128,.3)}
.s-chip.luck b{color:#b7ffcf;text-shadow:0 0 10px rgba(74,222,128,.45)}
.s-chip.luck.big{border-color:rgba(251,191,36,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 24px rgba(251,191,36,.25)}
.s-chip.luck.big .sc-ic{background:rgba(251,191,36,.18);color:#fde68a;box-shadow:0 0 14px rgba(251,191,36,.45)}
.s-chip.luck.big b{color:#ffe9a8;text-shadow:0 0 12px rgba(251,191,36,.6)}
.s-chip.bonus .sc-ic{background:rgba(251,191,36,.13);color:#fcd34d}
.s-chip{position:relative}
.s-chip.bonus.ready{border-color:rgba(251,191,36,.75)}
.s-chip.bonus.ready::after{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 26px rgba(251,191,36,.5);animation:chipGlow 1.6s ease-in-out infinite;pointer-events:none}
.s-chip.bonus.ready b{color:#ffe28a}
@keyframes chipGlow{0%,100%{opacity:.25}50%{opacity:1}}
.boost-list{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:780px}
.boost-list:empty{display:none}
.boost{position:relative;display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 14px 9px 8px;border-radius:14px;background:var(--chip);border:1px solid var(--glass-line2);box-shadow:inset 3px 0 0 var(--bc,#4ade80),inset 0 1px 0 rgba(255,255,255,.07);overflow:hidden;animation:fadeUp .4s var(--ease) both}
.bi canvas{width:28px;height:28px;display:block}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bt b{font-family:var(--display);font-size:16px;font-weight:800;color:var(--bc,#fff)}
.bt span{font-size:12.5px;color:#c9d0ee}
.boost .t{display:inline-flex;align-items:center;gap:5px;margin-left:6px;font-family:var(--display);font-weight:700;font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
.boost .t svg{width:14px;height:14px;color:var(--muted)}
.boost .bar{position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.boost .bar i{display:block;height:100%;background:var(--bc,#4ade80);box-shadow:0 0 8px var(--bc,#4ade80);border-radius:inherit;transition:width .3s linear}
.boost.low .t{color:#fca5a5;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.potion-sec{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:780px}
.sec-label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec-label span{letter-spacing:.04em;text-transform:none;font-weight:500;opacity:.8}
.potion-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.potion-row .hint{font-size:13.5px;color:var(--muted);text-align:center}
.potion-chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 6px;border-radius:999px;background:rgba(10,14,30,.6);border:1px solid var(--glass-line2);font-size:13.5px;font-weight:600;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.potion-chip:hover{transform:translateY(-2px);border-color:var(--pc,#7c8cff);box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 14px var(--pc,#7c8cff)}
.potion-chip:active{transform:scale(.96);transition-duration:.08s}
.potion-chip canvas{width:28px;height:28px}
.potion-chip .cnt{font-family:var(--display);font-weight:800;color:var(--pc,#fff)}
.potion-chip .pn-s{display:none}.potion-row.compact .pn-f{display:none}.potion-row.compact .pn-s{display:inline}
.potion-row.dense .pn-s,.potion-row.dense .pn-f{display:none!important}.potion-row.dense .potion-chip{padding:0 10px 0 4px;gap:4px}
.potion-row.compact{gap:6px}.potion-row.compact .potion-chip{height:36px;padding:0 10px 0 4px;gap:6px;font-size:12.5px}.potion-row.compact .potion-chip canvas{width:24px;height:24px}
.toggles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tgl{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px 0 10px;border-radius:999px;background:rgba(10,14,30,.5);border:1px solid var(--glass-line);font-size:14px;font-weight:600;color:#c3cae6;cursor:pointer;user-select:none;transition:border-color .2s,background .2s,color .2s}
.tgl:hover{border-color:var(--glass-line2);background:rgba(30,38,76,.55);color:#fff}
.tgl:has(.switch:checked){border-color:rgba(var(--ac-rgb),.55);color:#fff}
.switch{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:#232a4a;position:relative;cursor:pointer;transition:background .2s,box-shadow .2s;border:1px solid var(--line2);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#9aa3c7;transition:left .2s var(--ease),background .2s}
.switch:checked{background:rgba(var(--ac-rgb),.55);box-shadow:0 0 12px rgba(var(--ac-rgb),.35)}
.switch:checked::after{left:20px;background:#fff;box-shadow:0 0 8px rgba(var(--ac-rgb),1)}
.switch:focus-visible{outline:2px solid rgba(var(--ac-rgb),.8);outline-offset:3px}

/* ---------- Kampf: große Hauptaktionen und Menü ---------- */
.modes{display:flex;flex-direction:column;gap:10px}
.mode-btn{position:relative;display:flex;align-items:center;gap:16px;min-height:var(--mode-h);padding:14px 16px;border-radius:16px;text-align:left;border:1px solid var(--glass-line2);overflow:hidden;isolation:isolate;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 8px 22px rgba(0,0,0,.28);transition:transform .25s var(--ease),box-shadow .3s,border-color .3s,filter .2s}
.mode-btn::before{content:"";position:absolute;left:-30px;top:50%;width:150px;height:150px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,var(--mcg),transparent 70%);opacity:.7;z-index:-1;transition:opacity .3s,transform .4s var(--ease)}
.mode-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s var(--ease);z-index:-1}
.mode-btn:hover{transform:translateY(-3px);border-color:var(--mc);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 30px rgba(0,0,0,.35),0 0 32px var(--mcg)}
.mode-btn:hover::after{transform:translateX(100%)}
.mode-btn:hover::before{opacity:1;transform:translateY(-50%) scale(1.15)}
.mode-btn:active{transform:translateY(0) scale(.98);filter:brightness(1.15);transition-duration:.08s}
.mode-btn:focus-visible{outline:2px solid var(--mc);outline-offset:3px}
.mode-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.mode-btn .mi{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,var(--mc),rgba(0,0,0,.25));box-shadow:0 0 24px var(--mcg),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 16px rgba(0,0,0,.25)}
.mode-btn .mi svg{width:29px;height:29px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.mode-btn .mt{flex:1;min-width:0}
.mode-btn b{display:block;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.03em}
.mode-btn small{display:block;font-size:13.5px;color:#bdc5e4;margin-top:4px;line-height:1.35}
.mode-btn .chev{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.08);transition:transform .25s var(--ease),background .25s,color .25s}
.mode-btn .chev svg{width:16px;height:16px}
.mode-btn:hover .chev{transform:translateX(4px);background:var(--mc);color:#0b0f20}
.mode-btn.mp{--mc:#f472b6;--mcg:rgba(244,114,182,.42);background:linear-gradient(120deg,rgba(244,114,182,.24),rgba(124,140,255,.08) 72%)}
.mode-btn.tr{--mc:#22d3ee;--mcg:rgba(34,211,238,.38);background:linear-gradient(120deg,rgba(34,211,238,.2),rgba(74,222,128,.06) 72%)}
.side-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-links .btn{justify-content:flex-start;gap:10px;min-height:46px;padding:0 12px 0 8px;font-size:14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--glass-line)}
.side-links .btn:hover{background:rgba(var(--ac-rgb),.1);border-color:rgba(var(--ac-rgb),.5);box-shadow:none;transform:translateY(-1px)}
.side-links .btn>span[data-icon]{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);color:#cdd4ff}
.side-links .btn svg{width:16px;height:16px}
.side-links .btn.wide{grid-column:span 2}
.side-links .brew-btn{padding-right:44px}.side-links .btn .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---------- Letzte Rolls ---------- */
.hist-panel{flex:1 0 auto}
.history{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px}
.hist-item{position:relative;aspect-ratio:1;border-radius:12px;padding:3px;background:rgba(0,0,0,.32);border:1.5px solid var(--tc);box-shadow:inset 0 0 12px rgba(0,0,0,.45);transition:transform .2s var(--ease),box-shadow .2s}
.hist-item img{width:100%;height:100%;display:block;border-radius:9px}
.hist-item:hover,.hist-item:focus-visible{transform:translateY(-2px) scale(1.07);box-shadow:0 0 16px var(--tc);outline:none;z-index:1}
.hist-item.t4,.hist-item.t5{box-shadow:0 0 12px -2px var(--tc),inset 0 0 12px rgba(0,0,0,.45)}
.hist-item.t6,.hist-item.t7,.hist-item.t8{border-color:transparent;box-shadow:0 0 18px -2px var(--tc);overflow:hidden;isolation:isolate}
.hist-item.t6::before,.hist-item.t7::before,.hist-item.t8::before{content:"";position:absolute;inset:-40%;background:conic-gradient(var(--tc),#fff 10%,var(--tc) 22%,rgba(255,255,255,0) 48%,var(--tc) 74%,var(--tc));animation:spin 3s linear infinite;z-index:-2;will-change:transform;pointer-events:none}
.hist-item.t6::after,.hist-item.t7::after,.hist-item.t8::after{content:"";position:absolute;inset:2px;border-radius:9px;background:#0b0f22;z-index:-1;pointer-events:none}
.hist-item.new{animation:histIn .7s var(--ease) both}
@keyframes histIn{0%{transform:scale(.3) translateY(-10px);opacity:0}60%{transform:scale(1.14);opacity:1}100%{transform:none}}
.hist-empty{grid-column:1/-1;color:var(--muted);font-size:14px;padding:6px 0 2px}

/* ---------- Tooltip ---------- */
.tip{position:fixed;left:0;top:0;z-index:95;max-width:270px;padding:10px 13px;border-radius:12px;background:rgba(12,16,34,.97);border:1px solid var(--glass-line2);box-shadow:0 14px 34px rgba(0,0,0,.55);font-size:13.5px;line-height:1.45;color:#c9d0ee;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;color:#fff;font-size:14.5px;margin-bottom:3px;font-family:var(--display);letter-spacing:.02em}
.tip i{display:block;font-style:normal;margin-top:6px;font-size:12.5px;color:var(--muted)}

/* ---------- Einblenden beim Laden der Lobby ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}}
#lobby.enter .topbar{animation:fadeDown .6s var(--ease) both}
#lobby.enter .panel,#lobby.enter .roll-area>*{animation:fadeUp .7s var(--ease) both}
#lobby.enter .roll-area>:nth-child(1){animation-delay:.05s}
#lobby.enter .roll-area>:nth-child(2){animation-delay:.12s}
#lobby.enter .roll-area>:nth-child(3){animation-delay:.2s}
#lobby.enter .roll-area>:nth-child(n+4){animation-delay:.28s}
#lobby.enter .col-left .panel:nth-child(1),#lobby.enter .col-right .panel:nth-child(1){animation-delay:.14s}
#lobby.enter .col-left .panel:nth-child(2),#lobby.enter .col-right .panel:nth-child(2){animation-delay:.24s}

/* ---------- Einstellungen: Zahnrad in der Kopfzeile ---------- */
.set-btn>span{display:grid}
.set-btn svg{transition:transform .6s var(--ease)}
.set-btn:hover svg,.set-btn:focus-visible svg{transform:rotate(90deg)}
.tgl-tier{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--tc,#fbbf24);border:1px solid var(--tc,#fbbf24);background:rgba(0,0,0,.25);vertical-align:1px}
/* ---------- Einstellungen: Seitenpanel ---------- */
.modal-back.drawer-back{justify-content:flex-end;align-items:stretch;padding:0;background:rgba(3,5,12,.55)}
.drawer{position:relative;width:min(460px,100%);height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(20,26,54,.95),rgba(9,12,28,.97));border-left:1px solid var(--glass-line2);box-shadow:-30px 0 80px rgba(0,0,0,.55),inset 1px 0 0 rgba(var(--ac-rgb),.35);animation:drawerIn .38s var(--ease)}
.drawer::before{content:"";position:absolute;left:-1px;top:8%;bottom:8%;width:2px;background:linear-gradient(180deg,transparent,rgba(var(--ac-rgb),.9),transparent);box-shadow:0 0 14px rgba(var(--ac-rgb),.8);pointer-events:none}
@media (pointer:fine){html[data-q="high"]:not(.calm):not(.lite) .drawer{background:linear-gradient(180deg,rgba(20,26,54,.8),rgba(9,12,28,.86));backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}}
@keyframes drawerIn{from{transform:translateX(100%)}}
.drawer-back.closing .drawer{animation:drawerOut .17s ease-in forwards}
@keyframes drawerOut{to{transform:translateX(100%)}}
.drawer-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--glass-line);flex:none}
.drawer-h h2{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.04em}
.drawer-h .x{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--glass-line2);font-size:22px;color:var(--muted);transition:color .2s,border-color .2s,transform .2s var(--ease)}
.drawer-h .x:hover{color:#fff;border-color:rgba(var(--ac-rgb),.8);transform:rotate(90deg)}
.drawer-b{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 24px;scrollbar-width:thin;scrollbar-color:#2a3360 transparent}
.set-sec{padding:18px 0;border-bottom:1px solid var(--glass-line);display:flex;flex-direction:column;gap:14px}
.set-sec h3{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#c3cae6;font-weight:800}
.set-sec h3 svg{width:28px;height:28px;padding:6px;border-radius:9px;background:rgba(var(--ac-rgb),.14);color:var(--acl);box-shadow:inset 0 0 0 1px rgba(var(--ac-rgb),.3)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--glass-line);cursor:pointer}
.set-row:hover{border-color:var(--glass-line2)}
.sr-t{display:flex;flex-direction:column;gap:3px}
.set-row b,.set-field b,.ss-top b{font-size:15px;font-weight:700;color:#eef1ff}
.set-row small,.set-field small,.set-slider small{font-size:12.5px;color:var(--muted);line-height:1.45}
.set-row .switch{width:48px;height:28px}.set-row .switch::after{width:22px;height:22px}.set-row .switch:checked::after{left:22px}
.set-slider{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--glass-line)}
.ss-top{display:flex;align-items:baseline;justify-content:space-between}
.ss-top output{font-family:var(--display);font-weight:800;font-size:17px;color:var(--acl);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.set-slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;--pct:50%}
.set-slider input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--acl) 0,var(--acl) var(--pct),rgba(255,255,255,.1) var(--pct));box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.set-slider input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.1)}
.set-slider input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--acl)}
.set-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#dfe4ff);border:3px solid var(--acl);box-shadow:0 0 14px rgba(var(--ac-rgb),.7),0 2px 6px rgba(0,0,0,.4);transition:transform .15s}
.set-slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--acl);box-shadow:0 0 14px rgba(var(--ac-rgb),.7)}
.set-slider input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.set-slider input[type=range]:focus-visible{outline:2px solid rgba(var(--ac-rgb),.8);outline-offset:2px;border-radius:8px}
.set-field{display:flex;flex-direction:column;gap:8px}
.set-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--glass-line)}
.set-seg button{flex:1;min-height:42px;border-radius:10px;font-size:14px;font-weight:700;color:#aab3d9;transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.set-seg button:hover{color:#fff;background:rgba(255,255,255,.05)}
.set-seg button:active{transform:scale(.96)}
.set-seg button.on{color:#fff;background:linear-gradient(135deg,rgba(var(--ac-rgb),.55),rgba(var(--ac-rgb),.25));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 16px rgba(var(--ac-rgb),.35)}
.tier-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tier-pick button{min-height:44px;padding:4px 6px;border-radius:12px;font-size:12.5px;font-weight:800;letter-spacing:.03em;color:var(--tc);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);transition:border-color .2s,box-shadow .2s,transform .15s,background .2s;overflow-wrap:anywhere}
.tier-pick button:hover{border-color:var(--tc)}
.tier-pick button:active{transform:scale(.96)}
.tier-pick button.on{border-color:var(--tc);background:rgba(255,255,255,.07);box-shadow:0 0 0 1px var(--tc),0 0 18px -2px var(--tc)}
.stop-now{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px dashed var(--glass-line2);font-size:14px;color:#c9d0ee}
.stop-now b{font-family:var(--display);font-size:16px}
.name-row{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--glass-line2);transition:border-color .2s,box-shadow .2s}
.name-row:focus-within{border-color:rgba(var(--ac-rgb),.8);box-shadow:0 0 0 3px rgba(var(--ac-rgb),.2)}
.name-row input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:16px;font-weight:600;color:var(--text)}
.name-cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.danger-zone{display:flex;flex-direction:column;gap:12px;margin-top:6px;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(244,63,94,.12),rgba(244,63,94,.04));border:1px solid rgba(244,63,94,.45)}
.dz-t{display:flex;flex-direction:column;gap:3px}
.dz-t b{color:#fecdd3;font-size:15px}
.btn.danger-solid{background:linear-gradient(135deg,#e11d48,#f43f5e);border-color:transparent;color:#fff;font-weight:800;box-shadow:0 6px 22px rgba(244,63,94,.35)}
.btn.danger-solid:hover{box-shadow:0 6px 28px rgba(244,63,94,.6);border-color:transparent}
.btn.danger-solid:disabled{background:rgba(244,63,94,.25);box-shadow:none;color:rgba(255,255,255,.6)}
.btn.danger-solid svg{width:17px;height:17px}
.set-foot{display:flex;flex-direction:column;gap:10px;padding-top:20px}
.set-foot .btn{min-height:46px}
.set-foot small{font-size:12.5px;color:var(--muted);line-height:1.45;text-align:center}
.reset-dlg{display:flex;flex-direction:column;gap:14px}
.rd-warn{display:flex;gap:12px;padding:14px;border-radius:14px;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.45);color:#fecdd3;font-size:14px;line-height:1.5}
.rd-warn svg{width:30px;height:30px;flex:none;color:#fb7185}
.rd-warn b{display:block;color:#fff;margin-bottom:3px}
.rd-lbl{font-size:14px;color:#c9d0ee}
.rd-lbl b{color:#fb7185;letter-spacing:.08em}
.rd-in{height:48px;padding:0 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(244,63,94,.45);color:#fff;font-size:17px;font-weight:800;letter-spacing:.12em;outline:none;text-transform:uppercase}
.rd-in:focus{box-shadow:0 0 0 3px rgba(244,63,94,.25)}
.rd-in.ok{border-color:#f43f5e;box-shadow:0 0 0 3px rgba(244,63,94,.35)}
.rd-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.rd-btns .btn{min-height:44px}
@media (max-width:560px){.drawer{width:100%;border-left:0}.drawer::before{display:none}.drawer-b{padding:4px 16px 24px}.drawer-h{padding:14px 16px}}
/* Qualitätsstufe Niedrig: aufwendige Lobby-Glows und Dauer-Animationen aus */
html[data-q="low"] .rb-ring{filter:none}
html[data-q="low"] .rs-orbit.o2,html[data-q="low"] .ep-ring{display:none}
html[data-q="low"] .rs-halo,html[data-q="low"] .equip-prev::before,html[data-q="low"] .hist-item::before,html[data-q="low"] .strip-marker::before{animation:none}
html[data-q="low"] .mode-btn::after,html[data-q="low"] .sm-line::after{display:none}

/* ---------- Allgemeine Pills und Werte-Kacheln (Menüs, Shop, Braukessel, Aura-Details) ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font-size:13.5px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text);font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.pill .dust{color:#7ef3ff;text-shadow:0 0 8px #3ee6ff}
.stat{padding:10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--glass-line);text-align:center}
.stat b{display:block;font-family:var(--display);font-size:19px;font-weight:800}
.stat span{display:block;margin-top:2px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Allgemeine Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:12px;background:var(--chip);border:1px solid var(--glass-line2);font-weight:650;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(124,140,255,.3)}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn:focus-visible{outline:2px solid rgba(var(--ac-rgb),.8);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-color:var(--line);transform:none}
.btn.primary{background:linear-gradient(135deg,#5a6cff,#3ec9ff);border-color:transparent;color:#fff;box-shadow:0 6px 24px rgba(80,120,255,.35)}
.btn.primary:hover{box-shadow:0 6px 30px rgba(80,160,255,.55)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#fde047);color:#2a1a00;border-color:transparent;box-shadow:0 6px 24px rgba(250,190,40,.3)}
.btn.danger{border-color:rgba(255,77,109,.5);color:#ffb3c1}
.btn.small{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn.small svg{width:15px;height:15px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
/* Modal-Übergänge */
.modal-back.closing{animation:fadeout .17s ease forwards}
.modal-back.closing .modal{animation:popout .17s ease forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes popout{to{transform:scale(.96) translateY(6px);opacity:0}}

/* ---------- Weniger Bewegung (Schalter in der Lobby bzw. Systemeinstellung) ---------- */
.calm *,.calm *::before,.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
.calm .toast{animation:none!important}

/* ---------- Kompakte Höhen am Desktop (z. B. 1366×768) ---------- */
@media (min-width:1101px) and (max-height:940px){
  :root{--pp:15px;--gap:18px;--prev-h:clamp(118px,17vh,180px);--mm-h:36px;--mode-h:74px;--strip-h:clamp(112px,15vh,146px);--rb:clamp(146px,22vh,206px)}
  .topbar{min-height:60px;padding-top:9px;padding-bottom:9px}
  .mm-k{display:none}
  .mm-ic{width:30px;height:30px}.mm-ic canvas{width:22px;height:22px}
  .panel-h{margin-bottom:var(--s3)}
  .sub-h{margin:var(--s3) 0 10px}
  .roll-area{gap:var(--s4)}
  .roll-sub{display:none}
  .equip-name{font-size:26px}
  .mode-btn .mi{width:50px;height:50px}
  .side-links .btn{min-height:42px}
  .st-tile{padding:9px 11px;gap:6px}.st-tile b{font-size:23px}.st-tile b.tier{font-size:15px;line-height:23px}
  .equip-card{gap:10px}.equip-head{gap:8px}.mini-moves{gap:5px}
  .equip-name{font-size:24px}
  .tier-badge{font-size:11.5px;padding:3px 9px}.role-badge{font-size:12px;padding:3px 8px}
  .mode-btn{gap:12px;padding:10px 12px}.mode-btn b{font-size:18px}.mode-btn small{font-size:12.5px}
  .side-links .btn{min-height:38px}.side-links .btn>span[data-icon]{width:26px;height:26px}
  .history{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .hist-item:nth-child(n+11){display:none}
  .s-chip{height:44px}.boost{min-height:46px}
  .potion-sec{gap:6px}.potion-chip{height:36px}.potion-chip canvas{width:24px;height:24px}
  .potion-chip .pn-f{display:none}.potion-chip .pn-s{display:inline}
  .tgl{height:38px;padding:0 13px 0 8px;font-size:13.5px;gap:8px}
}
@media (min-width:1101px) and (max-width:1366px){.mode-btn .chev{display:none}}
@media (min-width:1101px) and (max-width:1280px){.equip-actions .lf{display:none}.equip-actions .ls{display:inline}.role-badge svg{display:none}.st-tile{padding:9px 10px}.st-ic{right:7px;top:7px}}
@media (min-width:1101px) and (max-height:760px){:root{--prev-h:clamp(104px,15vh,150px);--mm-h:34px;--rb:clamp(120px,18vh,160px);--strip-h:clamp(100px,14vh,124px)}.equip-name{font-size:22px}.roll-area{gap:12px;padding-bottom:2px}.roll-stage{margin:0}.roll-title{font-size:20px}}
@media (max-width:1280px) and (min-width:1101px){.lobby-grid{grid-template-columns:300px minmax(0,1fr) 300px}}

/* ---------- Modals ---------- */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .22s ease}
.modal{position:relative;width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(18,24,48,.97),rgba(11,15,32,.97));border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(124,140,255,.12);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.narrow{width:min(560px,100%)}
.modal.mid{width:min(780px,100%)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px;letter-spacing:.06em;font-weight:800}
.modal-h .x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:18px;color:var(--muted)}
.modal-h .x:hover{color:#fff;border-color:var(--accent)}
.modal-b{padding:18px 22px 22px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3360 transparent}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{transform:scale(.95) translateY(10px);opacity:0}}
.boost .t em{font-style:normal}

/* Sammlung */
.coll-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line2);color:var(--muted);transition:.15s;background:rgba(0,0,0,.2)}
.chip.on{color:var(--cc,#fff);border-color:var(--cc,#7c8cff);box-shadow:0 0 12px var(--ccg,rgba(124,140,255,.35));background:rgba(255,255,255,.04)}
.sel{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;outline:none}
.sel option{background:#121833}
.search{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;outline:none;width:160px}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.acard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;overflow:hidden}
.acard::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tc);box-shadow:0 0 10px var(--tc)}
.acard:hover{transform:translateY(-3px);border-color:var(--tc);box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 20px var(--tcg)}
.acard img{width:72px;height:72px}
.acard .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.acard .tr{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
.acard .cnt{position:absolute;top:7px;right:8px;font-size:11px;font-weight:800;color:var(--muted)}
.acard .eq{position:absolute;top:7px;left:8px;font-size:9px;font-weight:900;letter-spacing:.1em;padding:2px 6px;border-radius:6px;background:var(--accent);color:#fff}
.acard.locked img{filter:grayscale(1) brightness(.35)}
.acard.locked .nm{color:var(--dim)}
.acard .lock{position:absolute;top:44px;font-size:11px;color:var(--muted);letter-spacing:.1em}
.coll-sum{margin-left:auto;font-size:13px;color:var(--muted)}
.coll-sum b{color:#fff}

/* Detailansicht */
.detail{display:grid;grid-template-columns:320px 1fr;gap:22px}
.det-prev{position:relative;height:320px;border-radius:16px;background:radial-gradient(circle at 50% 50%,var(--dg,rgba(124,140,255,.15)),rgba(0,0,0,0) 70%),rgba(0,0,0,.3);border:1px solid var(--line2);overflow:hidden}
.det-prev canvas{position:absolute;inset:0;width:100%;height:100%}
.det-name{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1.1}
.det-sub{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px;align-items:center}
.det-desc{color:#c3cae6;font-size:14px;line-height:1.55;font-style:italic}
.det-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.moves{display:flex;flex-direction:column;gap:10px}
.move{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);align-items:start}
.move canvas{width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line2)}
.move h4{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.move p{font-size:13px;color:#b8c0de;line-height:1.45;margin-top:4px}
.move .cost{text-align:right;font-size:12px;color:var(--muted);line-height:1.6;white-space:nowrap}
.move .cost b{color:#ffe28a}
.move .cost i{font-style:normal;color:#9fe8ff}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(124,140,255,.12);border:1px solid rgba(124,140,255,.25);color:#c6ccff}
.tag.dt{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.3);color:#ffc2cc}
.tag.fm{background:rgba(62,230,255,.1);border-color:rgba(62,230,255,.28);color:#bff6ff}
.tag.fx{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.28);color:#c4ffd8}
.det-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);position:relative}
.pcard:hover{border-color:var(--pc)}
.pcard .ph{display:flex;align-items:center;gap:10px}
.pcard canvas{width:44px;height:44px}
.pcard h4{font-size:15px}
.pcard p{font-size:12.5px;color:var(--muted);line-height:1.4;flex:1}
.pcard .own{font-size:12px;color:var(--muted)}
.pcard .own b{color:var(--pc)}
.info-box{padding:12px 14px;border-radius:12px;background:rgba(124,140,255,.08);border:1px solid rgba(124,140,255,.22);font-size:13px;color:#c6ccff;line-height:1.5;margin-bottom:14px}
/* Braukessel */
.side-links .brew-btn{position:relative;background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(124,140,255,.12));border-color:rgba(52,211,153,.42)}
.side-links .brew-btn.ready{border-color:#34d399;box-shadow:0 0 18px rgba(52,211,153,.32)}
.brew-btn .badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#34d399;color:#04140c;font-size:12px;font-weight:900;display:grid;place-items:center}
.brew-btn .badge[hidden]{display:none}
.brew-top{display:flex;gap:16px;align-items:stretch;margin-bottom:14px}
.brew-top .kessel{width:160px;min-height:130px;flex:none;border-radius:14px;background:radial-gradient(circle at 50% 75%,rgba(249,115,22,.12),rgba(0,0,0,.28) 70%);border:1px solid var(--line)}
.brew-inv{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.brew-inv .info-box{margin:0}
.brew-stock{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dup-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dup-lbl{font-size:12px;color:var(--muted);margin-right:2px}
.dup-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.dup-chip i{width:9px;height:9px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc)}
.dup-chip b{color:#fff;font-weight:800}
.dup-chip.zero{opacity:.42}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.rcard.can{border-color:var(--pcb);box-shadow:0 0 22px var(--pcg)}
.rcard.hl{animation:rchl 1.3s ease}
@keyframes rchl{25%,55%{box-shadow:0 0 0 2px var(--pc),0 0 30px var(--pc)}}
.rcard.brewed{animation:rcbrew .8s ease}
@keyframes rcbrew{20%{transform:scale(1.025);box-shadow:0 0 44px var(--pc)}}
.rc-h{display:flex;align-items:center;gap:11px}
.rc-ic canvas{width:46px;height:46px;display:block}
.rc-h h4{font-size:15px;line-height:1.2}
.rc-h h4 small{font-size:12px;color:var(--muted)}
.rc-sub{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.rc-sub b{color:var(--pc)}
.rc-sub .only{color:#6ee7b7}
.rc-rank{padding:1px 8px;border-radius:999px;border:1px solid var(--pc);color:var(--pc);font-size:10.5px;font-weight:800;letter-spacing:.1em}
.rc-fx{display:flex;gap:6px;flex-wrap:wrap}
.rc-fx span{padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;font-weight:700;color:#e8ecff}
.rc-ing{display:flex;flex-direction:column;gap:5px}
.ing{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid transparent;font-size:12.5px}
.ing .ic{width:26px;height:26px;flex:none;display:grid;place-items:center}
.ing .ic img,.ing .ic canvas{width:24px;height:24px;border-radius:6px;display:block}
.ing .ic.dd{border-radius:50%;background:radial-gradient(circle,var(--tc),transparent 70%);opacity:.7}
.ing .ic.dust{color:#9fe8ff;font-size:16px}
.ing .nm{flex:1;min-width:0;color:#d6dbf5}
.ing .nm small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.ing .q{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ing .q b{font-size:13.5px}
.ing.ok .q b{color:#4ade80}
.ing.miss{border-color:rgba(244,63,94,.32);background:rgba(244,63,94,.06)}
.ing.miss .q b{color:#fb7185}
.ing.go{cursor:pointer}
.ing.go:hover{border-color:var(--line2)}
.rc-use{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:1em}
.rc-btns{display:flex;gap:8px;margin-top:auto}
.rc-btns .btn{flex:1;justify-content:center}
@media (max-width:620px){.brew-top{flex-direction:column}.brew-top .kessel{width:100%;min-height:0;height:110px}.recipe-grid{grid-template-columns:1fr}}

/* Chancen */
.odds{width:100%;border-collapse:collapse;font-size:13px}
.odds th,.odds td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.odds th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.odds td.n{font-family:var(--mono);text-align:right}
.odds th.n{text-align:right}

/* Training / Multiplayer */
.form-grid{display:grid;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:10px;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted);background:rgba(0,0,0,.2)}
.seg button.on{color:#fff;border-color:var(--accent);background:rgba(124,140,255,.2);box-shadow:0 0 14px rgba(124,140,255,.3)}
.range{width:100%;accent-color:var(--accent)}
.code-big{font-family:var(--mono);font-size:40px;font-weight:800;letter-spacing:.3em;text-align:center;padding:16px;border-radius:14px;background:rgba(0,0,0,.35);border:1px dashed rgba(244,114,182,.5);color:#ffd1ea;text-shadow:0 0 18px rgba(244,114,182,.6)}
.code-input{font-family:var(--mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-align:center;width:100%;padding:12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line2);outline:none}
.code-input:focus{border-color:#f472b6;box-shadow:0 0 16px rgba(244,114,182,.35)}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.pl img{width:30px;height:30px}
.pl .pn{font-weight:700;font-size:14px}
.pl .pa{font-size:12px}
.pl .host{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.status-line{font-size:13px;color:var(--muted);min-height:20px;text-align:center}
.status-line.err{color:#ff9db0}
.status-line.ok{color:#a7f3c0}
.slots{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--dim);line-height:1.5}

/* ---------- Enthüllung ---------- */
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.reveal{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--rv,rgba(124,140,255,.25)),rgba(4,6,14,0) 58%),rgba(4,6,14,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadein .3s ease}
.rays{position:absolute;left:50%;top:36%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,var(--rc) 0deg 7deg,transparent 7deg 20deg);animation:spin 40s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);pointer-events:none}
.reveal-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 30px 24px;min-width:320px;max-width:92vw;animation:revealIn .7s cubic-bezier(.2,1.2,.3,1)}
@keyframes revealIn{0%{transform:scale(.3);opacity:0;filter:brightness(3)}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);filter:none}}
.reveal-prev{width:240px;height:240px;position:relative}
.reveal-prev canvas{width:100%;height:100%}
.reveal-tier{font-size:14px;font-weight:900;letter-spacing:.42em;text-transform:uppercase}
.reveal-name{font-size:46px;font-weight:900;letter-spacing:.04em;line-height:1.05}
.reveal-odds{font-family:var(--mono);color:#c9d0f0;font-size:14px}
.reveal-new{font-size:12px;font-weight:900;letter-spacing:.24em;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,#f472b6,#7c8cff);color:#fff;box-shadow:0 0 18px rgba(244,114,182,.6)}
.reveal-dup{font-size:13px;color:#9fe8ff}
.reveal-desc{max-width:520px;color:#c3cae6;font-size:14px;font-style:italic;line-height:1.5}
.reveal-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.reveal-card{max-height:calc(100% - 12px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.reveal-card::-webkit-scrollbar{display:none}
@media (max-height:700px){.reveal-prev{width:170px;height:170px}.reveal-name{font-size:36px}.reveal-card{gap:7px;padding:16px 22px 14px}}
@media (max-height:520px){.reveal-prev{width:104px;height:104px}.reveal-name{font-size:28px}.reveal-tier{font-size:12px}.reveal-desc{display:none}.reveal-card{gap:5px;padding:8px 18px}.reveal-actions{margin-top:4px}.reveal-actions .btn{padding:8px 14px}}
.rainbow-text{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff95,#4dd8ff,#a66bff,#ff6bd6,#ff6b6b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
.cosmic-text{background:linear-gradient(90deg,#f0abfc,#818cf8,#22d3ee,#f0abfc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 4s linear infinite}
.flash{position:fixed;inset:0;z-index:58;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:var(--fla,1)}100%{opacity:0}}
.charge-overlay{position:fixed;inset:0;z-index:54;background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,.92) 70%);animation:fadein .4s}
/* Cutscene ab Göttlich */
#csc{position:fixed;inset:0;width:100%;height:100%;z-index:70;display:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.cs-skip{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:71;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(10,14,30,.5);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .3s}
.cs-skip.on{visibility:visible;opacity:.82;transition:opacity .4s .5s}
.cs-skip:hover{opacity:1;border-color:#fff}
.cs-skip small{font-weight:500;color:rgba(255,255,255,.6);font-size:11px}
@media (pointer:coarse){.cs-skip{padding:12px 18px;font-size:14px}}
.reveal.after-cs{background:radial-gradient(circle at 50% 36%,var(--rv,rgba(124,140,255,.25)),rgba(4,6,14,0) 62%),rgba(4,6,14,.8);animation:none}
.reveal.lock .reveal-actions{pointer-events:none}

/* ---------- Arena ---------- */
#arena{background:#05070f}
#gc{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.arena-top{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:3}
.arena-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;z-index:3;pointer-events:none}
.arena-banner h2{font-size:54px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 30px currentColor}
.arena-banner p{font-size:15px;color:#c6ccff;margin-top:6px}
.results{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(3,5,12,.72);backdrop-filter:blur(6px);padding:18px}
.results .modal{width:min(640px,100%)}
.rank{width:100%;border-collapse:collapse;font-size:14px}
.rank td,.rank th{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
.rank th{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.rank td.n,.rank th.n{text-align:right;font-variant-numeric:tabular-nums}
.rank tr.me td{background:rgba(124,140,255,.12)}
.reward{margin-top:14px;padding:12px;border-radius:12px;background:rgba(62,230,255,.08);border:1px solid rgba(62,230,255,.25);text-align:center;font-size:15px}
.reward b{color:#9fe8ff;text-shadow:0 0 8px #3ee6ff}

/* Touch-Steuerung: Joystick links, großer zielbarer Angriffsbutton + 3 Spezial-Buttons rechts */
.touch{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tjoy-zone{position:absolute;left:0;bottom:0;width:48%;height:62%;pointer-events:auto;touch-action:none}
.joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:clamp(112px,30vmin,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(124,140,255,.12),rgba(124,140,255,.03) 70%);border:2px solid rgba(124,140,255,.3);box-shadow:inset 0 0 26px rgba(124,140,255,.14),0 0 22px rgba(124,140,255,.12);opacity:.7;transition:opacity .15s;pointer-events:none}
.joy.on{opacity:1;border-color:rgba(124,140,255,.55)}
.joy i{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#aab4ff,#5262f0 70%);box-shadow:0 0 18px rgba(124,140,255,.65)}
.tpad{--m:clamp(98px,27vmin,134px);--s:clamp(54px,15.5vmin,74px);--D:calc(var(--m)/2 + var(--s)/2 + 12px);--ac:#7c8cff;--acg:rgba(124,140,255,.45);position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:calc(var(--m)/2 + var(--D) + var(--s)/2);height:calc(var(--m)/2 + var(--D) + var(--s)/2);pointer-events:none}
.tmain,.tsp{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;padding:0;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .08s,border-color .15s,box-shadow .15s}
.tmain{right:0;bottom:0;width:var(--m);height:var(--m);background:radial-gradient(circle at 50% 36%,rgba(44,54,108,.86),rgba(11,15,34,.92) 72%);border:3px solid var(--ac);box-shadow:0 0 0 7px rgba(124,140,255,.07),0 0 28px var(--acg),inset 0 -10px 22px rgba(0,0,0,.45)}
.tsp{width:var(--s);height:var(--s);background:radial-gradient(circle at 50% 36%,rgba(36,44,90,.86),rgba(11,15,34,.92) 72%);border:2px solid rgba(124,140,255,.32);box-shadow:inset 0 -6px 14px rgba(0,0,0,.4)}
.tsp.s1{right:calc(var(--m)/2 + var(--D) - var(--s)/2);bottom:calc(var(--m)/2 - var(--s)/2)}
.tsp.s2{right:calc(var(--m)/2 + var(--D)*.7071 - var(--s)/2);bottom:calc(var(--m)/2 + var(--D)*.7071 - var(--s)/2)}
.tsp.s3{right:calc(var(--m)/2 - var(--s)/2);bottom:calc(var(--m)/2 + var(--D) - var(--s)/2)}
.tmain canvas,.tsp canvas{position:absolute;left:20%;top:20%;width:60%;height:60%;pointer-events:none;transition:opacity .12s}
.tmain::after,.tsp::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,7,15,.78) var(--p,0deg),transparent 0);pointer-events:none}
.tcd{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(15px,4.6vmin,20px)/1 system-ui,sans-serif;z-index:3;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8);pointer-events:none}
.tsp em{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);font:900 9px/1 system-ui,sans-serif;font-style:normal;letter-spacing:.08em;padding:2px 5px;border-radius:6px;background:rgba(11,15,34,.9);border:1px solid rgba(124,140,255,.35);color:#c6ccff;z-index:4;pointer-events:none}
.tsp.ready{border-color:var(--ac);box-shadow:0 0 16px var(--acg),inset 0 -6px 14px rgba(0,0,0,.4)}
.tsp.noen{border-color:rgba(255,77,109,.6)}.tsp.noen canvas{opacity:.4}
.tmain.noen{border-color:rgba(255,77,109,.7)}
.tsp.locked canvas,.tmain.locked canvas{opacity:.22;filter:grayscale(1)}
.tsp.down{transform:scale(.9)}
.tsp.pop{animation:tpop .35s ease-out}
.tsp.deny{animation:tdeny .26s}
@keyframes tpop{40%{transform:scale(1.12);box-shadow:0 0 26px var(--ac)}}
@keyframes tdeny{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tknob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--ac) 75%);box-shadow:0 0 20px var(--ac);opacity:0;transition:opacity .1s;pointer-events:none;z-index:5}
.tmain.down{transform:scale(.97)}
.tmain.down .tknob{opacity:.95}
.tmain.down canvas{opacity:.18}
.tmain.down::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--ac);opacity:.55;animation:spin 6s linear infinite;pointer-events:none}
.tmain.cancel{border-color:#94a3b8}.tmain.cancel .tknob{background:#94a3b8;box-shadow:none}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:12px;background:rgba(16,22,44,.95);border:1px solid var(--line2);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 3.2s ease forwards}
.toast.good{border-color:rgba(74,222,128,.5)}
.toast.bad{border-color:rgba(255,77,109,.55)}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* ---------- Responsiv ---------- */
@media (max-width:1100px){
  html,body{overflow:auto}
  #app{position:relative;min-height:100%}
  #lobby.active{position:relative;display:block}
  .lobby-wrap{position:relative}
  :root{--gap:16px;--pp:18px;--rb:clamp(170px,min(34vw,40vh),236px);--strip-h:clamp(124px,18vw,160px);--prev-h:clamp(170px,26vw,230px)}
  .lobby-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"center center" "left right";padding:16px;align-items:start}
  .roll-area{grid-area:center;overflow:visible;padding:8px 0 4px}
  .col-left{grid-area:left}.col-right{grid-area:right}
  .col{overflow:visible;margin:0;padding:0}
  .detail{grid-template-columns:1fr}
  .det-prev{height:240px}
  .topbar{flex-wrap:wrap;padding:12px 16px}
  .top-stats{flex:1 1 100%;justify-content:center}
  #bgc{position:fixed}
}
@media (max-width:720px){
  :root{--gap:14px;--pp:16px;--rb:min(56vw,216px);--strip-h:128px;--prev-h:200px;--mode-h:84px}
  .topbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px 12px}
  .top-stats{display:contents}
  .brand{grid-column:1/4;grid-row:1}
  #setBtn{grid-column:4;grid-row:1;justify-self:end}
  #soundBtn{grid-column:5;grid-row:1;justify-self:end}
  #fsBtn{grid-column:6;grid-row:1;justify-self:end}
  .dust-pill{grid-column:1/3;grid-row:2}.rolls-pill{grid-column:3/5;grid-row:2}.coll-pill{grid-column:5/7;grid-row:2}
  .name-field{grid-column:1/-1;grid-row:3;justify-content:flex-start}
  .top-pill{justify-content:center;min-width:0;padding:0 10px 0 7px}
  .name-field input{flex:1;width:auto;min-width:0}
  .coll-pill .cp{min-width:0;flex:1}
  .lobby-grid{display:flex;flex-direction:column;align-items:stretch;padding:14px 12px 22px}
  .side-links{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.side-links .btn{min-width:0;white-space:normal;text-align:left;line-height:1.25}
  .col{display:contents}
  .roll-area{order:0}.kampf-panel{order:1}.equip-panel{order:2}.hist-panel{order:3}.stats-panel{order:4}
  .roll-title{font-size:20px}
  .status-row,.toggles{width:100%}
  .s-chip{flex:1 1 150px}
  .boost{flex:1 1 220px}
