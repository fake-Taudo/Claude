<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aura RNG Arena</title>
<meta name="description" content="Aura-Rolling-Kampfspiel: Rolle seltene Auren, sammle sie und kämpfe mit ihren einzigartigen Movesets im Training oder im Echtzeit-Multiplayer.">
<meta name="theme-color" content="#070a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.45' stop-color='%237c8cff'/%3E%3Cstop offset='1' stop-color='%237c8cff' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   AURA RNG ARENA – Stil: flaches Vektordesign mit Glow-Effekten
   ===================================================================== */
:root{
  --bg:#070a14; --bg2:#0b1022; --panel:rgba(16,22,44,.74); --panel2:rgba(22,30,60,.66);
  --line:rgba(140,160,235,.16); --line2:rgba(140,160,235,.28);
  --text:#e8ecff; --muted:#8c96bb; --dim:#5d668a;
  --accent:#7c8cff; --accent2:#3ee6ff; --gold:#fbbf24; --danger:#ff4d6d; --ok:#4ade80;
  --r:16px; --r2:12px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:rgba(124,140,255,.4)}
#app{position:fixed;inset:0;overflow:hidden}
#app.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
#app.shake2{animation:shake2 .9s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
@keyframes shake2{10%,90%{transform:translate(-4px,3px) rotate(-.3deg)}20%,80%{transform:translate(8px,-5px) rotate(.4deg)}30%,50%,70%{transform:translate(-12px,6px) rotate(-.5deg)}40%,60%{transform:translate(12px,-6px) rotate(.5deg)}}
#bgc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
@supports (height:100dvh){html,body{height:100dvh}}
.screen{position:absolute;inset:0;display:none;z-index:1}
.screen.active{display:block}
.hidden{display:none!important}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(9,13,28,.9),rgba(9,13,28,.55));backdrop-filter:blur(10px);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:12px}
.logo-orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 12%,#9aa6ff 30%,rgba(124,140,255,.0) 72%);box-shadow:0 0 22px rgba(124,140,255,.7),0 0 4px #fff inset;animation:orb 4s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 34px rgba(62,230,255,.8),0 0 4px #fff inset;transform:scale(1.06)}}
.brand h1{font-size:20px;letter-spacing:.28em;font-weight:800;line-height:1;background:linear-gradient(90deg,#fff,#b9c2ff 50%,#7ef3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px rgba(124,140,255,.35)}
.brand h1 span{color:var(--accent2);-webkit-text-fill-color:var(--accent2)}
.brand small{display:block;font-size:10px;letter-spacing:.5em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.top-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text);font-variant-numeric:tabular-nums}
.pill .dust{color:#9fe8ff;text-shadow:0 0 8px #3ee6ff}
.name-field{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:4px 6px 4px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.name-field input{width:128px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:5px 10px;outline:none;font-size:13px}
.name-field input:focus{border-color:var(--accent)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);transition:.2s}
.icon-btn:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(124,140,255,.4)}
.icon-btn svg{width:18px;height:18px}

/* ---------- Lobby Layout ---------- */
.lobby-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.lobby-grid{flex:1;display:grid;grid-template-columns:minmax(260px,320px) 1fr minmax(260px,320px);gap:18px;padding:18px 22px 22px;min-height:0;position:relative;z-index:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3360 transparent}
.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{background:#2a3360;border-radius:6px}

/* Ausgerüstete Aura */
.equip-card{padding:0 16px 16px}
.equip-prev{position:relative;height:190px;margin:12px 0 10px;border-radius:var(--r2);background:radial-gradient(circle at 50% 55%,rgba(124,140,255,.12),rgba(0,0,0,0) 65%),rgba(0,0,0,.22);border:1px solid var(--line);overflow:hidden}
.equip-prev canvas{position:absolute;inset:0;width:100%;height:100%}
.equip-name{font-size:21px;font-weight:800;letter-spacing:.02em}
.equip-meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tier-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;background:rgba(0,0,0,.25);white-space:nowrap}
.role-badge{font-size:11px;color:var(--muted);padding:3px 9px;border-radius:999px;border:1px solid var(--line);letter-spacing:.06em}
.mini-moves{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.mini-move{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:12px;min-width:0}
.mini-move canvas{width:22px;height:22px;flex:none}
.mini-move span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 4px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-weight:650;font-size:14px;transition:transform .15s,box-shadow .2s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);box-shadow:0 0 18px rgba(124,140,255,.28)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-color:var(--line)}
.btn.primary{background:linear-gradient(135deg,#5a6cff,#3ec9ff);border-color:transparent;color:#fff;box-shadow:0 6px 24px rgba(80,120,255,.35)}
.btn.primary:hover{box-shadow:0 6px 30px rgba(80,160,255,.55)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#fde047);color:#2a1a00;border-color:transparent;box-shadow:0 6px 24px rgba(250,190,40,.3)}
.btn.danger{border-color:rgba(255,77,109,.5);color:#ffb3c1}
.btn.small{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.empty-equip{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}

/* Roll-Bereich */
.roll-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0;padding:6px 0}
.roll-title{font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);font-weight:700}
.strip-wrap{position:relative;width:100%;max-width:920px;height:156px;border-radius:18px;background:linear-gradient(180deg,rgba(10,14,30,.9),rgba(14,20,42,.9));border:1px solid var(--line2);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 20px 60px rgba(0,0,0,.45)}
.strip-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.strip-wrap.glow{box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 0 60px var(--glowc,rgba(124,140,255,.5))}
.roll-btn{position:relative;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;letter-spacing:.2em;color:#fff;background:radial-gradient(circle at 50% 38%,#8aa0ff 0,#5262f0 38%,#2a2f8a 78%);border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 10px rgba(124,140,255,.07),0 0 60px rgba(100,120,255,.55),inset 0 -12px 30px rgba(0,0,0,.35),inset 0 6px 20px rgba(255,255,255,.25);transition:transform .15s,box-shadow .3s,filter .3s;text-shadow:0 0 18px rgba(255,255,255,.6)}
.roll-btn::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(140,160,255,.35);animation:spin 18s linear infinite}
.roll-btn::after{content:"";position:absolute;inset:-28px;border-radius:50%;background:conic-gradient(from 0deg,rgba(62,230,255,0),rgba(62,230,255,.25),rgba(124,140,255,0) 40%,rgba(240,171,252,.25) 70%,rgba(62,230,255,0));filter:blur(14px);z-index:-1;animation:spin 7s linear infinite}
.roll-btn:hover{transform:scale(1.04);box-shadow:0 0 0 12px rgba(124,140,255,.1),0 0 80px rgba(110,140,255,.75),inset 0 -12px 30px rgba(0,0,0,.35),inset 0 6px 20px rgba(255,255,255,.3)}
.roll-btn:active{transform:scale(.97)}
.roll-btn:disabled{filter:grayscale(.6) brightness(.75);cursor:wait;transform:none}
.roll-btn small{display:block;font-size:11px;letter-spacing:.24em;font-weight:700;opacity:.8;margin-top:4px}
.roll-btn .rb-inner{text-align:center}
.roll-btn.bonus{background:radial-gradient(circle at 50% 38%,#ffe48a 0,#f5a524 40%,#8a4b06 80%);box-shadow:0 0 0 10px rgba(251,191,36,.1),0 0 70px rgba(251,191,36,.6),inset 0 -12px 30px rgba(0,0,0,.35),inset 0 6px 20px rgba(255,255,255,.3)}
.roll-btn.pulse{animation:rbpulse 1.6s ease-in-out infinite}
@keyframes rbpulse{50%{box-shadow:0 0 0 18px rgba(124,140,255,.14),0 0 100px rgba(110,140,255,.85),inset 0 -12px 30px rgba(0,0,0,.35)}}
@keyframes spin{to{transform:rotate(360deg)}}
.luck-box{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;align-items:center}
.luck-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.luck-val{font-size:15px;font-weight:800;padding:7px 16px;border-radius:999px;background:linear-gradient(135deg,rgba(74,222,128,.16),rgba(62,230,255,.12));border:1px solid rgba(74,222,128,.4);color:#b7ffcf;text-shadow:0 0 10px rgba(74,222,128,.5)}
.luck-val.big{border-color:rgba(251,191,36,.6);color:#ffe9a8;background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(244,63,94,.12));text-shadow:0 0 12px rgba(251,191,36,.6)}
.bonus-ctr{font-size:12px;color:var(--muted)}
.bonus-ctr b{color:var(--gold)}
.boost-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.boost{position:relative;display:flex;align-items:center;gap:8px;padding:6px 12px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;overflow:hidden;min-width:150px}
.boost .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--bc,#4ade80);box-shadow:0 0 8px var(--bc,#4ade80)}
.boost b{color:var(--bc,#fff)}
.boost .t{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.potion-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.potion-chip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:12px;transition:.2s}
.potion-chip:hover{border-color:var(--pc,#7c8cff);box-shadow:0 0 12px var(--pc,#7c8cff)}
.potion-chip canvas{width:22px;height:22px}
.potion-chip .cnt{font-weight:800;color:var(--pc,#fff)}
.toggles{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.switch{appearance:none;width:30px;height:17px;border-radius:999px;background:#232a4a;position:relative;cursor:pointer;transition:.2s;border:1px solid var(--line2)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#8c96bb;transition:.2s}
.switch:checked{background:rgba(124,140,255,.5)}
.switch:checked::after{left:15px;background:#fff;box-shadow:0 0 8px #7c8cff}

/* Modi */
.modes{padding:16px;display:flex;flex-direction:column;gap:12px}
.mode-btn{position:relative;display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:14px;text-align:left;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(124,140,255,.16),rgba(62,230,255,.06));overflow:hidden;transition:transform .15s,box-shadow .25s,border-color .25s}
.mode-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
.mode-btn:hover::after{transform:translateX(100%)}
.mode-btn:hover{border-color:var(--mc,#7c8cff);box-shadow:0 0 28px var(--mcg,rgba(124,140,255,.4))}
.mode-btn:active{transform:scale(.98)}
.mode-btn:disabled{opacity:.5;cursor:not-allowed}
.mode-btn .mi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line2);flex:none}
.mode-btn .mi svg{width:24px;height:24px}
.mode-btn b{display:block;font-size:16px;letter-spacing:.02em}
.mode-btn small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.mode-btn.mp{--mc:#f472b6;--mcg:rgba(244,114,182,.45);background:linear-gradient(135deg,rgba(244,114,182,.2),rgba(124,140,255,.08))}
.mode-btn.tr{--mc:#3ee6ff;--mcg:rgba(62,230,255,.4);background:linear-gradient(135deg,rgba(62,230,255,.16),rgba(74,222,128,.06))}
.side-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-links .btn{justify-content:flex-start;font-size:13px;padding:10px 12px}
.side-links .btn.wide{grid-column:span 2}
.history{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 16px}
.history img{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);cursor:pointer;transition:.15s}
.history img:hover{transform:scale(1.1)}
.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 16px}
.stat{padding:9px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- Modals ---------- */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.66);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .2s ease}
.modal{position:relative;width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(18,24,48,.97),rgba(11,15,32,.97));border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(124,140,255,.12);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.narrow{width:min(560px,100%)}
.modal.mid{width:min(780px,100%)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px;letter-spacing:.06em;font-weight:800}
.modal-h .x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:18px;color:var(--muted)}
.modal-h .x:hover{color:#fff;border-color:var(--accent)}
.modal-b{padding:18px 22px 22px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3360 transparent}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}

/* Sammlung */
.coll-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line2);color:var(--muted);transition:.15s;background:rgba(0,0,0,.2)}
.chip.on{color:var(--cc,#fff);border-color:var(--cc,#7c8cff);box-shadow:0 0 12px var(--ccg,rgba(124,140,255,.35));background:rgba(255,255,255,.04)}
.sel{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;outline:none}
.sel option{background:#121833}
.search{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;outline:none;width:160px}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.acard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;overflow:hidden}
.acard::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tc);box-shadow:0 0 10px var(--tc)}
.acard:hover{transform:translateY(-3px);border-color:var(--tc);box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 20px var(--tcg)}
.acard img{width:72px;height:72px}
.acard .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.acard .tr{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
.acard .cnt{position:absolute;top:7px;right:8px;font-size:11px;font-weight:800;color:var(--muted)}
.acard .eq{position:absolute;top:7px;left:8px;font-size:9px;font-weight:900;letter-spacing:.1em;padding:2px 6px;border-radius:6px;background:var(--accent);color:#fff}
.acard.locked img{filter:grayscale(1) brightness(.35)}
.acard.locked .nm{color:var(--dim)}
.acard .lock{position:absolute;top:44px;font-size:11px;color:var(--muted);letter-spacing:.1em}
.coll-sum{margin-left:auto;font-size:13px;color:var(--muted)}
.coll-sum b{color:#fff}

/* Detailansicht */
.detail{display:grid;grid-template-columns:320px 1fr;gap:22px}
.det-prev{position:relative;height:320px;border-radius:16px;background:radial-gradient(circle at 50% 50%,var(--dg,rgba(124,140,255,.15)),rgba(0,0,0,0) 70%),rgba(0,0,0,.3);border:1px solid var(--line2);overflow:hidden}
.det-prev canvas{position:absolute;inset:0;width:100%;height:100%}
.det-name{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1.1}
.det-sub{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px;align-items:center}
.det-desc{color:#c3cae6;font-size:14px;line-height:1.55;font-style:italic}
.det-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.moves{display:flex;flex-direction:column;gap:10px}
.move{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);align-items:start}
.move canvas{width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line2)}
.move h4{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.move p{font-size:13px;color:#b8c0de;line-height:1.45;margin-top:4px}

/* Shop */

.pcard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);position:relative}

.pcard .ph{display:flex;align-items:center;gap:10px}
.pcard canvas{width:44px;height:44px}
.pcard h4{font-size:15px}
.pcard p{font-size:12.5px;color:var(--muted);line-height:1.4;flex:1}

.info-box{padding:12px 14px;border-radius:12px;background:rgba(124,140,255,.08);border:1px solid rgba(124,140,255,.22);font-size:13px;color:#c6ccff;line-height:1.5;margin-bottom:14px}

/* Chancen */
.odds{width:100%;border-collapse:collapse;font-size:13px}

.odds th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.odds td.n{font-family:var(--mono);text-align:right}
.odds th.n{text-align:right}

/* Training / Multiplayer */
.form-grid{display:grid;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:10px;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted);background:rgba(0,0,0,.2)}
.seg button.on{color:#fff;border-color:var(--accent);background:rgba(124,140,255,.2);box-shadow:0 0 14px rgba(124,140,255,.3)}
.range{width:100%;accent-color:var(--accent)}
.code-big{font-family:var(--mono);font-size:40px;font-weight:800;letter-spacing:.3em;text-align:center;padding:16px;border-radius:14px;background:rgba(0,0,0,.35);border:1px dashed rgba(244,114,182,.5);color:#ffd1ea;text-shadow:0 0 18px rgba(244,114,182,.6)}
.code-input{font-family:var(--mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-align:center;width:100%;padding:12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line2);outline:none}
.code-input:focus{border-color:#f472b6;box-shadow:0 0 16px rgba(244,114,182,.35)}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.pl img{width:30px;height:30px}
.pl .pn{font-weight:700;font-size:14px}
.pl .pa{font-size:12px}
.pl .host{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.status-line{font-size:13px;color:var(--muted);min-height:20px;text-align:center}
.status-line.err{color:#ff9db0}
.status-line.ok{color:#a7f3c0}
.slots{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--dim);line-height:1.5}

/* ---------- Enthüllung ---------- */
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.reveal{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--rv,rgba(124,140,255,.25)),rgba(4,6,14,0) 58%),rgba(4,6,14,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadein .3s ease}
.rays{position:absolute;left:50%;top:36%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,var(--rc) 0deg 7deg,transparent 7deg 20deg);animation:spin 40s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);pointer-events:none}
.reveal-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 30px 24px;min-width:320px;max-width:92vw;animation:revealIn .7s cubic-bezier(.2,1.2,.3,1)}
@keyframes revealIn{0%{transform:scale(.3);opacity:0;filter:brightness(3)}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);filter:none}}
.reveal-prev{width:240px;height:240px;position:relative}
.reveal-prev canvas{width:100%;height:100%}
.reveal-tier{font-size:14px;font-weight:900;letter-spacing:.42em;text-transform:uppercase}
.reveal-name{font-size:46px;font-weight:900;letter-spacing:.04em;line-height:1.05}
.reveal-odds{font-family:var(--mono);color:#c9d0f0;font-size:14px}
.reveal-new{font-size:12px;font-weight:900;letter-spacing:.24em;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,#f472b6,#7c8cff);color:#fff;box-shadow:0 0 18px rgba(244,114,182,.6)}
.reveal-dup{font-size:13px;color:#9fe8ff}
.reveal-desc{max-width:520px;color:#c3cae6;font-size:14px;font-style:italic;line-height:1.5}
.reveal-actions{display:flex;gap:10px;margin-top:8px}
.rainbow-text{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff95,#4dd8ff,#a66bff,#ff6bd6,#ff6b6b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
.cosmic-text{background:linear-gradient(90deg,#f0abfc,#818cf8,#22d3ee,#f0abfc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 4s linear infinite}
.flash{position:fixed;inset:0;z-index:58;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.charge-overlay{position:fixed;inset:0;z-index:54;background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,.92) 70%);animation:fadein .4s}

/* ---------- Arena ---------- */
#arena{background:#05070f}
#gc{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.arena-top{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:3}
.arena-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;z-index:3;pointer-events:none}
.arena-banner h2{font-size:54px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 30px currentColor}
.arena-banner p{font-size:15px;color:#c6ccff;margin-top:6px}
.results{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(3,5,12,.72);backdrop-filter:blur(6px);padding:18px}
.results .modal{width:min(640px,100%)}
.rank{width:100%;border-collapse:collapse;font-size:14px}
.rank td,.rank th{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
.rank th{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.rank td.n,.rank th.n{text-align:right;font-variant-numeric:tabular-nums}
.rank tr.me td{background:rgba(124,140,255,.12)}
.reward{margin-top:14px;padding:12px;border-radius:12px;background:rgba(62,230,255,.08);border:1px solid rgba(62,230,255,.25);text-align:center;font-size:15px}
.reward b{color:#9fe8ff;text-shadow:0 0 8px #3ee6ff}

/* Touch-Steuerung: Joystick links, großer zielbarer Angriffsbutton + 3 Spezial-Buttons rechts */
.touch{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tjoy-zone{position:absolute;left:0;bottom:0;width:48%;height:62%;pointer-events:auto;touch-action:none}
.joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:clamp(112px,30vmin,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(124,140,255,.12),rgba(124,140,255,.03) 70%);border:2px solid rgba(124,140,255,.3);box-shadow:inset 0 0 26px rgba(124,140,255,.14),0 0 22px rgba(124,140,255,.12);opacity:.7;transition:opacity .15s;pointer-events:none}
.joy.on{opacity:1;border-color:rgba(124,140,255,.55)}
.joy i{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#aab4ff,#5262f0 70%);box-shadow:0 0 18px rgba(124,140,255,.65)}
.tpad{--m:clamp(98px,27vmin,134px);--s:clamp(54px,15.5vmin,74px);--D:calc(var(--m)/2 + var(--s)/2 + 12px);--ac:#7c8cff;--acg:rgba(124,140,255,.45);position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:calc(var(--m)/2 + var(--D) + var(--s)/2);height:calc(var(--m)/2 + var(--D) + var(--s)/2);pointer-events:none}
.tmain,.tsp{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;padding:0;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .08s,border-color .15s,box-shadow .15s}
.tmain{right:0;bottom:0;width:var(--m);height:var(--m);background:radial-gradient(circle at 50% 36%,rgba(44,54,108,.86),rgba(11,15,34,.92) 72%);border:3px solid var(--ac);box-shadow:0 0 0 7px rgba(124,140,255,.07),0 0 28px var(--acg),inset 0 -10px 22px rgba(0,0,0,.45)}
.tsp{width:var(--s);height:var(--s);background:radial-gradient(circle at 50% 36%,rgba(36,44,90,.86),rgba(11,15,34,.92) 72%);border:2px solid rgba(124,140,255,.32);box-shadow:inset 0 -6px 14px rgba(0,0,0,.4)}
.tsp.s1{right:calc(var(--m)/2 + var(--D) - var(--s)/2);bottom:calc(var(--m)/2 - var(--s)/2)}
.tsp.s2{right:calc(var(--m)/2 + var(--D)*.7071 - var(--s)/2);bottom:calc(var(--m)/2 + var(--D)*.7071 - var(--s)/2)}
.tsp.s3{right:calc(var(--m)/2 - var(--s)/2);bottom:calc(var(--m)/2 + var(--D) - var(--s)/2)}
.tmain canvas,.tsp canvas{position:absolute;left:20%;top:20%;width:60%;height:60%;pointer-events:none;transition:opacity .12s}
.tmain::after,.tsp::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,7,15,.78) var(--p,0deg),transparent 0);pointer-events:none}
.tcd{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(15px,4.6vmin,20px)/1 system-ui,sans-serif;z-index:3;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8);pointer-events:none}
.tsp em{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);font:900 9px/1 system-ui,sans-serif;font-style:normal;letter-spacing:.08em;padding:2px 5px;border-radius:6px;background:rgba(11,15,34,.9);border:1px solid rgba(124,140,255,.35);color:#c6ccff;z-index:4;pointer-events:none}
.tsp.ready{border-color:var(--ac);box-shadow:0 0 16px var(--acg),inset 0 -6px 14px rgba(0,0,0,.4)}
.tsp.noen{border-color:rgba(255,77,109,.6)}.tsp.noen canvas{opacity:.4}
.tmain.noen{border-color:rgba(255,77,109,.7)}
.tsp.locked canvas,.tmain.locked canvas{opacity:.22;filter:grayscale(1)}
.tsp.down{transform:scale(.9)}
.tsp.pop{animation:tpop .35s ease-out}
.tsp.deny{animation:tdeny .26s}
@keyframes tpop{40%{transform:scale(1.12);box-shadow:0 0 26px var(--ac)}}
@keyframes tdeny{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tknob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--ac) 75%);box-shadow:0 0 20px var(--ac);opacity:0;transition:opacity .1s;pointer-events:none;z-index:5}
.tmain.down{transform:scale(.97)}
.tmain.down .tknob{opacity:.95}
.tmain.down canvas{opacity:.18}
.tmain.down::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--ac);opacity:.55;animation:spin 6s linear infinite;pointer-events:none}
.tmain.cancel{border-color:#94a3b8}.tmain.cancel .tknob{background:#94a3b8;box-shadow:none}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:12px;background:rgba(16,22,44,.95);border:1px solid var(--line2);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 3.2s ease forwards}
.toast.good{border-color:rgba(74,222,128,.5)}
.toast.bad{border-color:rgba(255,77,109,.55)}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

}
</style>
</head>
<body>
<div id="app">
  <canvas id="bgc"></canvas>

  <!-- ===================== LOBBY ===================== -->
  <div id="lobby" class="screen active">
    <div class="lobby-wrap">
      <header class="topbar">
        <div class="brand"><span class="logo-orb"></span><div><h1>AURA<span>·</span>RNG</h1><small>Arena</small></div></div>
        <div class="top-stats">
          <div class="pill" title="Sternenstaub – Währung für Glückstränke"><span class="dust">◆</span><b id="dustVal">0</b> Staub</div>
          <div class="pill">Rolls <b id="rollsVal">0</b></div>
          <div class="pill">Sammlung <b id="collVal">0/0</b></div>
          <label class="name-field">Name <input id="nameInput" maxlength="16" autocomplete="off" spellcheck="false"></label>
          <button class="icon-btn" id="soundBtn" title="Sound an/aus"></button>
        </div>
      </header>
      <main class="lobby-grid">
        <!-- Links: ausgerüstete Aura -->
        <section class="col">
          <div class="panel">
            <div class="panel-h"><span>Ausgerüstet</span><span id="equipTierTxt"></span></div>
            <div id="equipBox" class="equip-card"></div>
          </div>
          <div class="panel">
            <div class="panel-h"><span>Statistik</span></div>
            <div class="stats-grid" style="margin-top:12px">
              <div class="stat"><b id="stWins">0</b><span>Siege</span></div>
              <div class="stat"><b id="stKills">0</b><span>K.O.s</span></div>
              <div class="stat"><b id="stBest">–</b><span>Beste</span></div>
            </div>
          </div>
        </section>

        <!-- Mitte: Rollen -->
        <section class="roll-area">
          <div class="roll-title">Aura beschwören</div>
          <div class="strip-wrap" id="stripWrap"><canvas id="stripC"></canvas></div>
          <button class="roll-btn pulse" id="rollBtn"><div class="rb-inner">ROLL<small id="rollSub">1 Aura</small></div></button>
          <div class="luck-box">
            <div class="luck-main">
              <div class="luck-val" id="luckVal">Glück ×1.00</div>
              <div class="bonus-ctr" id="bonusCtr"></div>
            </div>
            <div class="boost-list" id="boostList"></div>
            <div class="potion-row" id="potionRow"></div>
            <div class="toggles">
              <label><input type="checkbox" class="switch" id="quickT"> Schnelle Animation</label>
              <label><input type="checkbox" class="switch" id="autoT"> Auto-Roll</label>

        <!-- Rechts: Modi -->
        <section class="col">

              <button class="mode-btn mp" id="mpBtn"><span class="mi" data-icon="users"></span><span><b>Multiplayer</b><small>Free-for-All bis 10 Spieler – per Einladungscode</small></span></button>
              <button class="mode-btn tr" id="trBtn"><span class="mi" data-icon="bot"></span><span><b>Training</b><small>Kämpfe gegen Bots mit eigener Taktik</small></span></button>
              <div class="side-links">
                <button class="btn" id="collBtn"><span data-icon="grid"></span>Sammlung</button>
                <button class="btn" id="shopBtn"><span data-icon="flask"></span>Alchemie</button>
                <button class="btn wide" id="oddsBtn"><span data-icon="dice"></span>Wahrscheinlichkeiten</button>
                <button class="btn wide" id="helpBtn"><span data-icon="info"></span>Steuerung &amp; Regeln</button>

          <div class="panel">
            <div class="panel-h"><span>Letzte Rolls</span></div>

      </main>
    </div>
  </div>

  <!-- ===================== ARENA ===================== -->
  <div id="arena" class="screen">
    <canvas id="gc"></canvas>
    <div class="arena-top"><button class="btn small danger" id="leaveBtn">Verlassen</button></div>
    <div class="arena-banner" id="banner"></div>
    <div class="touch hidden" id="touchUi">
      <div class="tjoy-zone" id="joyZone"><div class="joy" id="joy"><i></i></div></div>
      <div class="tpad" id="tpad">
        <button class="tsp s1" data-b="1" aria-label="Spezialmove 1"><canvas></canvas><b class="tcd"></b><em>1</em></button>
        <button class="tsp s2" data-b="2" aria-label="Spezialmove 2"><canvas></canvas><b class="tcd"></b><em>2</em></button>
        <button class="tsp s3" data-b="3" aria-label="Spezialmove 3"><canvas></canvas><b class="tcd"></b><em>3</em></button>
        <div class="tmain" id="tmain" role="button" aria-label="Hauptattacke – ziehen zum Zielen"><canvas></canvas><b class="tcd"></b><i class="tknob"></i></div>
      </div>

    <div id="resultsBox"></div>

  <div id="modalRoot"></div>
  <div id="revealRoot"></div>
  <canvas id="fxc"></canvas>
  <div id="toasts"></div>

<script>
/* =====================================================================
   AURA RNG ARENA – Single-File-Browserspiel (HTML + CSS + JS in einer Datei)
   ---------------------------------------------------------------------
   MULTIPLAYER – SO BAUT MAN DIE VERBINDUNG IN DER PRAXIS AUF
   • Technik: WebRTC-Datenkanäle (Peer-to-Peer) über die Bibliothek PeerJS.
     Für den Verbindungsaufbau (Signaling) nutzt PeerJS den kostenlosen
     öffentlichen PeerJS-Cloud-Server (0.peerjs.com) und dessen STUN/TURN-
     Server. Danach fließen alle Spieldaten direkt zwischen den Browsern
     (Stern-Topologie: jeder Gast ist mit dem Host verbunden).
     PeerJS wird erst beim Öffnen des Multiplayer-Menüs per CDN geladen
     (unpkg, Fallback jsDelivr). Rollen, Sammlung und Training laufen
     komplett offline.
   • Ablauf:
     1. Spieler A klickt „Multiplayer" → „Spiel erstellen". Das Spiel
        erzeugt einen 6-stelligen Einladungscode (z. B. K7QF2M) und meldet
        sich beim Signaling-Server unter der Peer-ID "aurarng-v1-K7QF2M" an.
     2. A schickt den Code (oder den Link …/aura-rng-arena.html?join=K7QF2M)
        per Chat an Freunde.
     3. Die anderen öffnen dieselbe HTML-Datei (lokal per Doppelklick oder
        auf einem beliebigen Webspace), klicken „Beitreten" und geben den
        Code ein. Ihr Browser verbindet sich über PeerJS direkt mit A.
     4. Ab 2 Spielern kann der Host starten (max. 10). Der Host simuliert
        den Kampf autoritativ mit 60 Hz; Gäste senden nur Eingaben (~30 Hz)
        und bekommen 20 Zustands-Snapshots pro Sekunde, die flüssig
        interpoliert werden. Die eigene Bewegung wird lokal vorhergesagt.
   • Verbindungsart „Lokal (Tabs)": BroadcastChannel zwischen mehreren Tabs
     desselben Browsers – zum Testen ohne Internet, gleicher Ablauf.
   • Eigene Signaling-/TURN-Server lassen sich in NET_CONFIG eintragen.
   ===================================================================== */
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const TAU = Math.PI * 2;

/* ---------- Move-Tags für die Detailansicht ---------- */
const FX_NAMES = { slow: 'Verlangsamung', stun: 'Betäubung', freeze: 'Einfrieren', root: 'Festwurzeln', silence: 'Verstummen', confuse: 'Verwirrung', fear: 'Furcht', burn: 'Verbrennung', poison: 'Vergiftung', bleed: 'Blutung', plague: 'Seuche', weaken: 'Schwächung', vuln: 'Verwundbarkeit', shred: 'Rüstungsbruch', anti: 'Heilungsbann', invh: 'Heilumkehr', mark: 'Markierung', chill: 'Kühlung', charge: 'Aufladung', amber: 'Verkleben', stb: 'Stamina-Entzug', cdl: 'Cooldown-Diebstahl', echo: 'Nachhall', doom: 'Todesurteil', steal: 'Wertediebstahl' };
const CUSTOM_TAGS = { rewind: ['Zeitreise', 'Heilung'], swapDecoy: ['Teleport', 'Positionstausch'], coin: ['Zufall', 'Teleport', 'Betäubung'], jackpot: ['Zufall', 'Flächenschaden', 'Schild'], swapTwin: ['Positionstausch', 'Schild'], binary: ['Flächenschaden', 'Verlangsamung'], balance: ['HP-Ausgleich'], recover: ['Heilung'], mimic: ['Kopiert Gegner-Move'], cage: ['Käfig', 'Kontrolle'], drainNova: ['Lebensraub', 'Flächenschaden'], judgement: ['Flächenschaden', 'Betäubung', 'Zielsuchend'], portal: ['Portale', 'Teleport'], entropy: ['Debuff-Verstärker'], timestop: ['Zeitstopp', 'Einfrieren'], loop: ['Zeitreise', 'Heilung'], terraform: ['Felder', 'Verbrennung', 'Heilung'], rebirth: ['Heilung', 'Reinigung', 'Cooldown-Reset'], repeatLast: ['Wiederholung'], causality: ['Zeitreise', 'Cooldown-Diebstahl'], renew: ['Reinigung', 'Heilung', 'Schild'] };
function moveTags(m) {
  const T = [], add = (s, c) => { if (!T.find(t => t[0] === s)) T.push([s, c]); };
  const k = m.k;
  const FORM = { proj: 'Projektil', melee: 'Nahkampf', cone: 'Kegel', beam: 'Linie', nova: 'Kreis um dich', blast: 'Kreis am Zielpunkt', dash: 'Sprint', blink: 'Teleport', buff: 'Selbst', trap: 'Falle', chain: 'Kette', orbit: 'Orbit', wall: 'Wand', tether: 'Verbindung', detonate: 'Detonation', random: 'Zufall', custom: 'Spezialmechanik' };
  if (k === 'zone') add(m.shape === 'l' ? 'Linienfeld' : m.shape === 'k' ? 'Kegelfeld (kanalisiert)' : m.shape === 'o' ? 'Ringfeld' : m.at === 'attach' ? 'Aura-Feld' : 'Feld', 'fm');
  else if (k === 'summon') add({ turret: 'Turm', minion: 'Diener', twin: 'Zwilling', decoy: 'Abbild' }[m.type], 'fm');
  else if (k === 'multi') m.acts.forEach(s => moveTags(s).forEach(t => add(t[0], t[1])));
  else if (FORM[k]) add(FORM[k], 'fm');
  const ranged = ['proj', 'beam', 'blast', 'chain', 'tether'].includes(k) || (k === 'zone' && m.at === 'aim');
  if (m.dmg > 0 || k === 'chain') add(ranged ? 'Fernkampf' : (['melee', 'cone', 'nova'].includes(k) || m.at === 'attach') ? 'Nahbereich' : 'Fernkampf', 'fm');
  const area = ['nova', 'blast', 'zone', 'cone'].includes(k) || (k === 'melee' && m.arc >= 120) || m.pierce > 1 || m.ex || (k === 'beam' && !m.first) || m.num > 1;
  if (m.dmg > 0 || k === 'chain' || (k === 'zone' && m.dmg)) add(area ? 'Flächenschaden' : 'Einzeltreffer', 'dt');
  const fx = Object.assign({}, m.fx || {}, m.enter || {}, m.ex && m.ex.fx || {}, m.act && m.act.fx || {}, m.end && m.end.fx || {}, m.strikes && m.strikes.fx || {}, m.emp && m.emp.fx || {}, m.split && m.split.fx || {}, m.proj && m.proj.fx || {}, m.pulse && m.pulse.fx || {});
  if (fx.burn || fx.poison || fx.bleed || fx.plague || fx.doom || fx.echo || (k === 'zone' && m.dmg) || k === 'tether') add('Schaden über Zeit', 'dt');
  if (m.ls || m.lsb || (k === 'tether' && m.heal) || m.healPer) add('Lebensraub', 'dt');
  if (m.act && m.act.dmg) add('Flächenschaden', 'dt');
  for (const key in fx) if (FX_NAMES[key]) add(FX_NAMES[key], 'fx');
  if (m.pierce) add('Durchdringt', 'fx'); if (m.bounce) add('Abprallen', 'fx'); if (m.home) add('Zielsuchend', 'fx'); if (m.boom || m.boomMiss) add('Bumerang', 'fx');
  if (m.kb || m.push || (m.end && m.end.kb)) add('Rückstoß', 'fx'); if (m.pull || m.hook || m.pa) add('Heranziehen', 'fx'); if (m.swap) add('Positionstausch', 'fx');
  if (m.split) add('Splitter', 'fx'); if (m.ex) add('Explosion', 'fx'); if (m.grapple) add('Enterhaken', 'fx'); if (m.inv || m.stasis) add('Unverwundbar', 'fx');
  if (m.intang) add('Körperlos', 'fx'); if (m.heal || m.hot || m.selfHeal || m.sh) add('Heilung', 'fx'); if (m.shield || m.selfShield) add('Schild', 'fx');
  if (m.stealth || (m.selfFx && m.selfFx.stealth) || (m.end && m.end.stealth)) add('Tarnung', 'fx'); if (m.haste) add('Tempo', 'fx'); if (m.armor || m.grow) add('Rüstung', 'fx');
  if (m.reflect || m.refl) add('Reflexion', 'fx'); if (m.thorns) add('Dornen', 'fx'); if (m.cleanse) add('Reinigung', 'fx'); if (m.block) add('Blockt Projektile', 'fx');
  if (m.slowP) add('Bremst Projektile', 'fx'); if (m.delay) add('Verzögert', 'fx'); if (m.hp) add('Kostet HP', 'dt'); if (m.dmgUp) add('Schadensbonus', 'fx');
  if (m.cheat) add('Wiederbelebung', 'fx'); if (m.karma) add('Schaden speichern', 'fx'); if (m.form) add('Verwandlung', 'fx'); if (m.cdr) add('Cooldown-Beschleunigung', 'fx');
  if (m.emp) add('Verstärkt Hauptattacke', 'fx'); if (m.echoNext) add('Doppelzauber', 'fx'); if (m.cycle) add('Kreislauf', 'fx'); if (m.inf) add('Unendliche Stamina', 'fx'); if (m.invDmg) add('Schaden → Heilung', 'fx');
  if (m.swapHp) add('HP-Tausch', 'fx'); if (m.dice) add('Würfelglück', 'fx'); if (m.raise) add('Erweckt Skelette', 'fx'); if (m.orbGain) add('Erschafft Orbits', 'fx'); if (m.exec || m.consume || m.shatter || m.vsHigher || m.far || m.combo) add('Bedingter Bonus', 'fx');
  if (m.req) add('Nur gegen ' + FX_NAMES[m.req], 'fx'); if (m.turbo) add('Turm-Turbo', 'fx'); if (m.sburst) add('Schildexplosion', 'fx');
  if (k === 'custom' && CUSTOM_TAGS[m.fn]) CUSTOM_TAGS[m.fn].forEach(s => add(s, 'fx'));
  return T;
}

function pct(p) { p *= 100; return p >= 1 ? fmt1(p) + ' %' : p >= 0.01 ? p.toLocaleString('de-DE', { maximumFractionDigits: 3 }) + ' %' : p.toLocaleString('de-DE', { maximumSignificantDigits: 2 }) + ' %'; }

  const L = nextLuck(), eff = effTierChances(L);

    x.strokeStyle = rgba(T.c, win ? .95 : .4); x.lineWidth = win ? 2.5 : 1.2; x.stroke();

    x.font = `700 11px ${FONT}`; x.textAlign = 'center'; x.fillStyle = win ? '#fff' : '#c3cae6'; let nm = a.n; if (x.measureText(nm).width > cw - 8) nm = nm.slice(0, 10) + '…';

  const fr = x.createLinearGradient(w - 90, 0, w, 0); fr.addColorStop(0, 'rgba(10,14,30,0)'); fr.addColorStop(1, 'rgba(10,14,30,1)'); x.fillStyle = fr; x.fillRect(w - 90, 0, 90, hh);

    el.querySelector('#rvOk').onclick = () => closeReveal();
    const eb = el.querySelector('#rvEq'); if (eb) eb.onclick = () => { equipAura(a.id); eb.remove(); };
    el.querySelector('#rvInfo').onclick = () => { closeReveal(true); openDetail(a.i); };
    const auto = $('#autoT').checked;
    if (auto && t >= 4) { $('#autoT').checked = false; toast('Auto-Roll gestoppt – seltene Aura gefunden!', 'good'); }
    else if ((auto && t < 4) || (S.quick && t < 3)) REVEAL.timer = setTimeout(closeReveal, auto ? 1300 : 1100);
  };
  if (charge > 0) { const ov = h('div', { class: 'charge-overlay' }); $('#revealRoot').appendChild(ov); RFX.charge = { t: 0, dur: charge, col: T.c }; AU.play('charge', 1, charge); setTimeout(() => { ov.remove(); RFX.charge = null; go(); }, charge * 1000); }
  else go();
}
function closeReveal(noAuto) {
  if (!REVEAL.open || !REVEAL.el) return;
  clearTimeout(REVEAL.timer); REVEAL.el.remove(); REVEAL.el = null; if (REVEAL.prev) REVEAL.prev.destroy(); REVEAL.prev = null;
  REVEAL.open = false; ROLLST.busy = false; STRIP.idle = false;
  $('#rollBtn').disabled = false; $('#stripWrap').classList.remove('glow');
  renderLobby();
  if (!noAuto && $('#autoT').checked) setTimeout(doRoll, 260);
}

/* ---------- Effekt-Ebene der Enthüllung ---------- */
const RFX = { c: null, x: null, parts: [], rings: [], stars: [], charge: null, tier: 0, dirty: false };
function revealBurst(a) {
  const t = a.t, T = TIERS[t], w = innerWidth, hh = innerHeight, cx = w / 2, cy = hh * .36;
  RFX.tier = t;
  const n = [26, 44, 75, 130, 210, 300, 420, 540, 680][t];
  const cols = [T.c, a.c1, a.c2v, '#ffffff'];
  for (let i = 0; i < n; i++) { const an = rand(TAU), sp = rand(80, 260 + t * 120); RFX.parts.push({ x: cx, y: cy, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: rand(.9, 1.8 + t * .2), max: 2.4 + t * .2, col: t >= 7 ? `hsl(${rand(360)},95%,65%)` : pick(cols), s: rand(1.5, 3.5 + t * .35), g: t >= 5 ? 40 : 70, star: t >= 4 && Math.random() < .3 }); }
  const rings = t >= 6 ? 4 : t >= 3 ? 2 : 1;
  for (let k = 0; k < rings; k++) RFX.rings.push({ x: cx, y: cy, r: 10, spd: 700 + k * 350 + t * 60, d: k * .14, w: 4 + t, col: t >= 7 ? null : (k % 2 ? a.c1 : T.c), life: 1.4 });
  if (t >= 7) { RFX.stars = Array.from({ length: 260 }, () => ({ a: rand(TAU), r: rand(40, Math.max(w, hh)), s: rand(.5, 2.2), tw: rand(TAU) })); }
}
function drawRFX(dt) {
  const c = RFX.c; if (!c) return;
  const active = RFX.parts.length || RFX.rings.length || RFX.charge || (REVEAL.open && RFX.tier >= 5);
  if (!active) { if (RFX.dirty) { RFX.x.setTransform(1, 0, 0, 1, 0, 0); RFX.x.clearRect(0, 0, c.width, c.height); RFX.dirty = false; } return; }
  RFX.dirty = true;
  const d = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, hh = innerHeight;
  if (c.width !== Math.round(w * d) || c.height !== Math.round(hh * d)) { c.width = Math.round(w * d); c.height = Math.round(hh * d); }
  const x = RFX.x; x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, hh);
  const cx = w / 2, cy = hh * .36;
  x.save(); x.globalCompositeOperation = 'lighter';
  if (RFX.charge) {
    const ch = RFX.charge; ch.t += dt; const k = clamp(ch.t / ch.dur, 0, 1);
    for (let i = 0; i < 6 + k * 14; i++) { const an = rand(TAU), r = Math.max(w, hh) * .6; RFX.parts.push({ x: cx + Math.cos(an) * r, y: cy + Math.sin(an) * r, vx: -Math.cos(an) * r * 1.6, vy: -Math.sin(an) * r * 1.6, life: .55, max: .55, col: ch.col, s: rand(1.5, 3), g: 0, inward: 1 }); }
    glow(x, ch.col, cx, cy, 40 + k * 200, .5 + k * .5); glow(x, '#ffffff', cx, cy, 10 + k * 60, k);
  }
  if (REVEAL.open && RFX.tier >= 7) {
    const tt = performance.now() / 1000;
    for (const s of RFX.stars) { const an = s.a + tt * .05 * (s.r < 300 ? 2 : 1); x.fillStyle = `rgba(255,255,255,${.35 + .35 * Math.sin(tt * 3 + s.tw)})`; x.fillRect(cx + Math.cos(an) * s.r, cy + Math.sin(an) * s.r * .7, s.s, s.s); }
    if (RFX.tier >= 8) for (let i = 0; i < 3; i++) { x.strokeStyle = `hsla(${(tt * 80 + i * 120) % 360},95%,65%,.35)`; x.lineWidth = 3; circ(x, cx, cy, 170 + i * 40 + Math.sin(tt * 2 + i) * 12); x.stroke(); }
  }
  if (REVEAL.open && RFX.tier >= 5 && Math.random() < .5 + RFX.tier * .05) { const an = rand(TAU), r = rand(120, 260); RFX.parts.push({ x: cx + Math.cos(an) * r, y: cy + Math.sin(an) * r, vx: 0, vy: -rand(20, 60), life: 1.2, max: 1.2, col: RFX.tier >= 7 ? `hsl(${rand(360)},95%,70%)` : TIERS[RFX.tier].c, s: rand(1.5, 3), g: 0, star: true }); }
  for (const p of RFX.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (!p.inward) { p.vx *= 1 - 1.4 * dt; p.vy = p.vy * (1 - 1.4 * dt) + p.g * dt; } }
  RFX.parts = RFX.parts.filter(p => p.life > 0); if (RFX.parts.length > 1600) RFX.parts.splice(0, RFX.parts.length - 1600);
  for (const p of RFX.parts) {
    const k = clamp(p.life / p.max * 1.6, 0, 1);
    if (p.col[0] === '#') glow(x, p.col, p.x, p.y, p.s * 5, k * .7);
    x.fillStyle = p.col; x.globalAlpha = k;
    if (p.star) { x.save(); x.translate(p.x, p.y); starP(x, 4, p.s * 2.2, p.s * .5); x.fill(); x.restore(); } else { circ(x, p.x, p.y, p.s); x.fill(); }
    x.globalAlpha = 1;
  }
  for (const r of RFX.rings) {
    r.d -= dt; if (r.d > 0) continue; r.life -= dt; r.r += r.spd * dt; r.spd *= 1 - 1.2 * dt;
    const k = clamp(r.life / 1.4, 0, 1);
    if (r.col) { x.strokeStyle = rgba(r.col, k * .9); x.lineWidth = r.w * k + 1; circ(x, cx, cy, r.r); x.stroke(); }
    else rainbowRing(x, cx, cy, r.r, r.w * k + 1, performance.now() / 400, 36, k);
  }
  RFX.rings = RFX.rings.filter(r => r.life > 0);
  x.restore();
}

/* ---------- Ruhiger Sternenhimmel in der Lobby ---------- */
const BG = { c: null, x: null, stars: [], t: 0 };
function initBg() { BG.c = $('#bgc'); BG.x = BG.c.getContext('2d'); BG.stars = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), z: rand(.2, 1), tw: rand(TAU) })); }
function drawBg(dt) {
  const c = BG.c, d = Math.min(1.5, window.devicePixelRatio || 1), w = c.clientWidth, hh = c.clientHeight; if (!w) return;
  if (c.width !== Math.round(w * d) || c.height !== Math.round(hh * d)) { c.width = Math.round(w * d); c.height = Math.round(hh * d); }
  BG.t += dt; const x = BG.x, t = BG.t; x.setTransform(d, 0, 0, d, 0, 0);
  x.fillStyle = '#070a14'; x.fillRect(0, 0, w, hh);
  x.globalCompositeOperation = 'lighter';
  glow(x, '#3b2a8a', w * (.25 + Math.sin(t * .05) * .05), hh * .3, Math.max(w, hh) * .55, .35);
  glow(x, '#0e5a8a', w * (.78 + Math.cos(t * .04) * .05), hh * .75, Math.max(w, hh) * .5, .3);
  glow(x, '#7a1f6a', w * .55, hh * (.1 + Math.sin(t * .03) * .05), Math.max(w, hh) * .35, .18);
  for (const s of BG.stars) { const y = (s.y * hh + t * 6 * s.z) % hh, a = .25 + .45 * (Math.sin(t * 1.3 + s.tw) * .5 + .5) * s.z; x.fillStyle = `rgba(200,215,255,${a})`; x.fillRect(s.x * w, y, s.z * 1.8, s.z * 1.8); }
  x.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   HAUPTSCHLEIFE & START
   ===================================================================== */
let lastFrame = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  try {
    tickBoosts(dt);
    if (SCREEN === 'lobby') { drawBg(dt); drawStrip(dt); uiT -= dt; if (uiT <= 0) { uiT = 0.25; updateLuckUI(); } }
    else if (SCREEN === 'arena') arenaFrame(dt);
    for (const p of PREVIEWS) p.frame(dt);
    drawRFX(dt);
    saveT -= dt; if (saveT <= 0) { saveT = 5; if (S.boosts.length) save(); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function init() {
  fillIcons();
  RD.c = $('#gc'); RD.x = RD.c.getContext('2d'); RFX.c = $('#fxc'); RFX.x = RFX.c.getContext('2d');
  setupArenaInput(); initStrip(); initBg();
  const ni = $('#nameInput'); ni.value = S.name;
  ni.addEventListener('change', () => { S.name = cleanName(ni.value); ni.value = S.name; save(); if (NET.role === 'client') NET.tr && NET.tr.send({ t: 'name', name: S.name }); if (NET.role === 'host') { const p = NET.room.find(p => p.host); if (p) { p.name = S.name; sendRoom(); } } });
  const sb = $('#soundBtn'), setSnd = () => { sb.innerHTML = S.sound ? SVG.sound : SVG.mute; sb.title = S.sound ? 'Sound aus' : 'Sound an'; };
  setSnd(); sb.onclick = () => { S.sound = !S.sound; save(); setSnd(); AU.init(); AU.play('click'); };
  const qt = $('#quickT'); qt.checked = !!S.quick; qt.onchange = () => { S.quick = qt.checked; save(); };
  $('#autoT').onchange = e => { if (e.target.checked && !ROLLST.busy && !REVEAL.open) doRoll(); };
  $('#rollBtn').onclick = doRoll;
  $('#collBtn').onclick = openCollection; $('#shopBtn').onclick = openShop; $('#oddsBtn').onclick = openOdds; $('#helpBtn').onclick = openHelp;
  $('#trBtn').onclick = openTraining; $('#mpBtn').onclick = () => openMP();
  $('#leaveBtn').onclick = () => {
    if (MATCH.mode === 'client') { if (MATCH.ended || confirm('Match verlassen? Du verlässt damit auch den Raum.')) { netLeave(); leaveArena(); } }
    else if (MATCH.mode === 'host') { if (MATCH.ended || confirm('Match beenden? Alle Spieler kehren in den Raum zurück.')) { leaveArena(); openMP(); } }
    else if (MATCH.ended || confirm('Training abbrechen?')) leaveArena();
  };
  const relayout = () => { if (SCREEN === 'arena') checkArenaSize(); };
  addEventListener('resize', relayout); addEventListener('orientationchange', () => setTimeout(relayout, 60));
  if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
  addEventListener('pointerdown', () => AU.init(), { once: false, passive: true });
  addEventListener('keydown', e => {
    if (REVEAL.open && (e.code === 'Enter' || e.code === 'Space') && REVEAL.el) { e.preventDefault(); closeReveal(); return; }
    if (SCREEN === 'lobby' && !MODALS.length && e.code === 'Space' && e.target === document.body) { e.preventDefault(); doRoll(); }
  });
  addEventListener('beforeunload', () => { save(); CLOUD.flush(); if (NET.role === 'client') NET.tr && NET.tr.send({ t: 'leave' }); if (NET.role === 'host') NET.tr && NET.tr.broadcast({ t: 'reject', reason: 'Der Host hat das Spiel geschlossen.' }); });
  renderLobby();
  CLOUD.init();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); CLOUD.flush(); } });
  const jc = new URLSearchParams(location.search).get('join');
  if (jc) setTimeout(() => { if (S.equipped) openMP(jc.toUpperCase()); else toast('Rolle zuerst eine Aura, dann kannst du dem Spiel ' + jc.toUpperCase() + ' beitreten.'); }, 400);
  requestAnimationFrame(frame);
}
init();
</script>
